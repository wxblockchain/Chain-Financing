.kyc-demo{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;background:var(--violet-bg);

.kyc-demo .end{margin-left:auto;display:flex;gap:var(--sp-2)}
.track-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.track{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:var(--sp-5);min-width:0;position:relative;overflow:hidden}
.track::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--sp-1);background:var(--track)}
.track[data-k="green"]::before{background:var(--ok)}.track[data-k="amber"]::before{background:var(--warn)}
.track[data-k="red"]::before{background:var(--danger)}.track[data-k="blue"]::before{background:var(--accent)}
.track-top{display:flex;align-items:flex-start;gap:var(--sp-3)}
.track-ico{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-2);
  display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.track-body{flex:1;min-width:0}.track-title{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.track-title b{font-size:var(--fs-14)}.track-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);
  margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px dashed var(--border-dash)}
.track-meta span{display:block;font-size:var(--fs-10);color:var(--faint)}.track-meta b{display:block;margin-top:2px;font-size:var(--fs-12)}
.gatebar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--radius-sm);color:var(--warn);margin-bottom:var(--sp-4)}
.gatebar p{margin:0;flex:1;font-size:var(--fs-12)}
.access-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.access{border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--sp-4);background:var(--card)}
.access b{display:block;margin-bottom:var(--sp-1)}.access p{margin:0;color:var(--muted);font-size:var(--fs-11)}
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:var(--sp-4);align-items:start}
.sticky-rail{position:sticky;top:118px}.save-state{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-11);color:var(--ok)}

.upload-slot{min-width:0}.upload-slot>label{font-size:var(--fs-11);font-weight:620;color:var(--muted);display:block;margin-bottom:var(--sp-2)}
.problem{border-color:var(--danger-border)!important;background:var(--danger-bg)!important}.changed{border-color:var(--accent-border)!important}
.flag{font-size:var(--fs-10);font-weight:650;border-radius:var(--radius-pill);padding:2px 7px;white-space:nowrap}
.flag.changed{color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-border)}
.flag.problem{color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-border)}
.review-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:var(--sp-4)}
.review-box>.hd{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)}
.review-box>.hd b{font-size:var(--fs-14)}.review-box>.hd .right{margin-left:auto}.review-box>.bd{padding:var(--sp-5)}
.review-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.92fr);gap:var(--sp-4);align-items:start}
.viewer{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}

.doc-sheet{width:145px;height:184px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--card);
  box-shadow:var(--shadow);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);transform:scale(var(--zoom,1)) rotate(var(--rot,0deg));

.doc-sheet i{height:6px;border-radius:var(--radius-pill);background:var(--track)}.doc-sheet i:first-child{height:42px;background:var(--accent-soft)}
.review-stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.checkline{display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-2);border:1px solid var(--border);border-radius:var(--radius-xs);
  color:var(--muted);font-size:var(--fs-11);background:var(--card-2)}
.checkline span:first-child{color:var(--accent);font-weight:700}.decisionbar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4);background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:5}
.status-hero{display:grid;place-items:center;text-align:center;padding:var(--sp-8) var(--sp-5)}
.status-ring{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok);font-size:var(--fs-28)}
.status-hero h2{margin:var(--sp-4) 0 var(--sp-1);font-size:var(--fs-19)}.status-hero p{margin:0;color:var(--muted);max-width:620px}
.reason-list{margin:var(--sp-3) 0 0;padding-left:var(--sp-5);color:var(--muted);font-size:var(--fs-12)}
.reason-list li{margin:var(--sp-1) 0}.template-tag{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-10);font-family:var(--mono);
  color:var(--violet);background:var(--violet-bg);border:1px solid var(--violet-border);border-radius:var(--radius-pill);padding:2px 8px}
.issue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.issue-option{display:flex;gap:var(--sp-2);align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-11)}
.issue-option input{margin-top:2px;accent-color:var(--accent)}

   if(v==="full"){S.modal={type:"preview",file:L("Full-screen document viewer","全屏材料查看器")};render();toast("info",L("Full-screen access logged","全屏访问已留痕"));break;}if(v==="download")toast("success",L("Original download started · access logged","原件已开始下载 · 访问已留痕"));render();break;
  case "rejectOpen":S.issues=[];S.modal={type:"reject",typeKey:v};render();break;
  case "issue":var i=S.issues.indexOf(v);if(i<0)S.issues.push(v);else S.issues.splice(i,1);render();break;
  case "decision":
   if(v==="approve"&&S.page==="P-M33"&&S.st==="duplicate"){toast("danger",L("Approval blocked by the second unique-key check.","通过操作被二次唯一性查重拦截。"));break;}
   if(v==="approve"){S.modal={type:"approve"};render();break;}
   S.modal=null;toast("success",t("submitted"),t("rejected"));go(S.page==="P-M31"?"P-M30":"P-M32");break;
  case "decisionCommit":S.modal=null;toast("success",t("submitted"),t("approved"));go(S.page==="P-M31"?"P-M30":"P-M32");break;
  case "refresh":S.st=CF.defaultState(S.page);render();toast("success",L("Data reloaded","数据已重新加载"));break;
  case "filter":S.st=S.query?"noresults":"default";render();break;
  case "reset":S.query="";S.st="default";render();break;
  case "related":go(v);break;
 }
 return true;
}
function onInput(n,k){
 if(k==="region"){
  var next=n.value;if(next!==S.form.region){S.pendingRegion=next;S.modal={type:"switch"};render();}return;
 }
 S.form[k]=n.value;if(k==="idType")render();if(k==="query")S.query=n.value;
}
function previewModal(){return '<div class="mask"><div class="modal wide" role="dialog" aria-modal="true"><div class="modal-h"><b>'+t("preview")+' · '+esc(S.modal.file)+'</b><button class="modal-x" data-act="close">✕</button></div><div class="modal-b"><div class="preview"><div class="sheet"><i class="t"></i><i></i><i class="s"></i><i></i><i class="s"></i></div><span>'+t("demoOnly")+'</span></div></div><div class="modal-f"><button class="btn" data-act="close">'+t("close")+'</button></div></div></div>';}

document.addEventListener("input",function(e){var n=e.target.closest("[data-f]");if(!n||n.tagName==="SELECT")return;onInput(n,n.getAttribute("data-f"));if(n.getAttribute("data-f")==="reviewNote")render();});
document.addEventListener("change",function(e){var n=e.target.closest("select[data-f]");if(!n)return;onInput(n,n.getAttribute("data-f"));});

 prdFoot:function(){return 'PRD baseline: <b>commit 77c3020</b> · prd/v1.0-实名认证与审核/ 主文档 + 7 分册。界面演示数据均为虚构；本面板仅摘录页面直接相关规则。';},
