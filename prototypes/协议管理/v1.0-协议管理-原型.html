function buildHash(){

  if(S.page==="P-AG-03") h+="/versions/"+(S.editor?S.editor.no:"new");

    if(f.type.length) p.push("type="+f.type.join(","));
    if(f.scen.length) p.push("scen="+f.scen.join(","));
    if(f.status.length) p.push("status="+f.status.join(","));
    if(f.from) p.push("from="+f.from);
    if(f.to) p.push("to="+f.to);
    if(S.pg>1) p.push("page="+S.pg);
    if(S.size!==20) p.push("size="+S.size);

  });
  if(seg[0]==="account"){ S.page="P-M05"; S.agKey=null; return true; }
  if(seg[0]!=="agreements") return false;
  if(seg[1]&&ag(seg[1])){
    S.agKey=seg[1];
    if(seg[2]==="versions"){
      var a=cur(), d=verOf(a,"draft");
      if(d){ openEditor(a,d,true); return true; }

    S.st="default"; return true;
  }
  S.page="P-AG-01"; S.agKey=null; S.st="default";
  var f={kw:qs.kw||"", type:qs.type?qs.type.split(","):[], scen:qs.scen?qs.scen.split(","):[],
         status:qs.status?qs.status.split(","):[], from:qs.from||"", to:qs.to||""};

    if(f.kw){

      if((a.en+" "+a.zh+" "+a.key).toLowerCase().indexOf(k)<0) return false;
    }
    if(f.type.length&&f.type.indexOf(a.type)<0) return false;
    if(f.scen.length&&!f.scen.some(function(c){return a.scen.indexOf(c)>=0;})) return false;
    if(f.status.length&&f.status.indexOf(agStatus(a))<0) return false;
    var l=lastLog(a);

  var c=S.sort.col, d=S.sort.dir==="asc"?1:-1;

            mode:v.mode||"immediate", effAt:v.effAt||null, note:L(v.note.en,v.note.zh),
            noteEn:v.note.en, noteZh:v.note.zh, rec:!!v.rec, src:v.src||null,

   + (e.src?L("New version from ","以历史版本新建 ")+'<span class="mono">'+esc(e.no)+'</span>'

  var alerts="";

  return '<div class="mask" data-act="close"><div class="modal'+(wide?" wide":"")+'" role="dialog" aria-modal="true">'
   + '<div class="modal-h"><b>'+title+'</b>'
   + '<button class="modal-x" type="button" data-act="close" aria-label="'+t("close")+'">✕</button></div>'
   + '<div class="modal-b">'+body+'</div>'
   + (foot?'<div class="modal-f">'+foot+'</div>':"")+'</div></div>';
}
function kv(k,v){ return '<div style="display:flex;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border-dash)">'
   + '<span class="tiny" style="width:96px;flex:none">'+k+'</span><span style="font-size:12.5px;flex:1;'
   + 'overflow-wrap:anywhere">'+v+'</span></div>'; }
/* C-30 发布确认（含 E-06「撤销并发布」分支） */
function modalPublish(){
  var a=cur(), e=ed(), sch=verOf(a,"scheduled");
  var conflict=!!sch;
  var body=kv(t("fName"),esc(nm(a)))
   + kv(t("fVersion"),'<span class="mono">'+esc(e.no)+'</span>')
   + kv(t("fFile"),'<span class="mono" style="font-size:11.5px">'+esc(e.file.name)+'</span> · '+esc(e.file.size))
   + kv(t("fActivation"),e.mode==="immediate"?t("fImmediate")
        :t("fScheduled")+' · <span class="mono">'+esc(fmtTime(e.effAt))+'</span>')
   + kv(t("fReconsent"),e.rec?pill("amber",L("Yes","是"))+'<p class="hint" style="margin-top:5px">'
        + t("hReconsent")+'</p>':pill("dash",L("No","否")));
  if(conflict)
    body+=gap(12)+note("amber",esc(t("hScheduledConflict",{version:sch.no,time:fmtTime(sch.effAt)}))
      + '<p style="margin:5px 0 0">'+L("The cancelled version returns to draft and keeps its file. Both actions are recorded.",
        "被撤销的版本会退回草稿并保留其文件，两条动作各记一条操作记录。")+'</p>',"E-06","alert");
  return shell(t("publishTitle"),body,
    '<button class="btn" type="button" data-act="close">'+t("cancel")+'</button>'
    + '<button class="btn primary" type="button" data-act="doPublish">'
    + (conflict?t("bCancelAndPublish"):t("bConfirmPublish"))+'</button>');
}

/* ============================== 业务动作 ================================= */
/* 新建 / 继续编辑草稿：已有草稿则不生成第二个（7.3.2 / AC-AG-29） */
function newVersion(){
  var a=cur(), d=verOf(a,"draft");
  if(d){ openEditor(a,d); return; }
  var act=verOf(a,"active"), no=nextNo(a);
  var v={no:no, st:"draft", vid:"ver_new"+no, mode:"immediate", effAt:null, arcAt:null,
         file:act?{name:act.file.name.replace(/v\d+/,no),size:act.file.size,ext:act.file.ext}:null,
         hash:null, note:{en:"",zh:""}, src:null, rec:false, by:"a", at:new Date(nowMs()).toISOString()};
  a.versions.push(v);
  addLog(a,"create",no,
    act?("Created draft "+no+" from the active version "+act.no+".") :("Created draft "+no+" from scratch."),
    act?("以当前生效版本 "+act.no+" 为基础创建草稿 "+no+"。"):("空白新建草稿 "+no+"。"));
  openEditor(a,v);
}
/* F-47 版本回溯：复制历史版本文件生成版本号更大的新草稿 */
function rollback(no){
  var a=cur(), src=verNo(a,no), d=verOf(a,"draft");
  if(d){ toast("danger",t("bContinueDraft"),
      L("This agreement already has draft "+d.no+". Discard it first.","该协议已有草稿 "+d.no+"，请先处理它。")); return; }
  var nn=nextNo(a);
  var v={no:nn, st:"draft", vid:"ver_new"+nn, mode:"immediate", effAt:null, arcAt:null,
         file:{name:src.file.name.replace(/v\d+/,nn),size:src.file.size,ext:src.file.ext},
         hash:null, note:{en:"Content restored from "+no, zh:"回溯至 "+no+" 的内容"}, src:no, rec:false,
         by:"a", at:new Date(nowMs()).toISOString()};
  a.versions.push(v);
  addLog(a,"rollback",nn,"Created draft "+nn+" from the historical version "+no+".",
         "以历史版本 "+no+" 为基础创建草稿 "+nn+"。");
  openEditor(a,v);
}
function writeBack(){
  var a=cur(), e=ed(), v=verNo(a,e.no);
  var renamed = e.file && e.origFile && e.file.name!==e.origFile;
  v.file=e.file?{name:e.file.name,size:e.file.size,ext:e.file.ext}:null;
  v.mode=e.mode; v.effAt=e.effAt; v.rec=e.rec; v.src=e.src;
  v.note={en:e.note,zh:e.note};
  v.at=new Date(nowMs()).toISOString();
  return {v:v, renamed:renamed};
}
function saveDraft(){
  var a=cur(), e=ed(), r=writeBack();
  if(r.renamed) addLog(a,"replace",e.no,"Replaced file: "+e.origFile+" → "+e.file.name,
                       "替换文件："+e.origFile+" → "+e.file.name);
  addLog(a,"save",e.no,"Saved draft "+e.no+".","保存草稿 "+e.no+"。");
  e.origFile=e.file?e.file.name:null; e.dirty=false;
  render(); toast("success",t("okDraftSaved"));
}
function validatePublish(){
  var a=cur(), e=ed(); e.err={};
  if(!e.file){ e.err.file=t("eNoFile"); }
  if(!e.note.trim()){ e.err.note=t("eNoNote"); }
  else if(e.note.length>500){ e.err.note=t("eNoteTooLong"); }
  if(e.mode==="scheduled"){
    if(!e.effAt) e.err.eff=t("eTooSoon");
    else if(Date.parse(e.effAt)<nowMs()+5*60000) e.err.eff=t("eTooSoon");
  }
  var bad=Object.keys(e.err).length>0;
  if(bad){
    render();
    toast("danger",e.err.file||e.err.note||e.err.eff);
    var id=e.err.file?null:(e.err.note?"f_note":"f_eff");
    if(id){ var n=document.getElementById(id); if(n) n.focus(); }
  }
  return !bad;
}
function doPublish(){
  var a=cur(), e=ed(), sch=verOf(a,"scheduled");
  S.modal=null; S.st="submitting"; render();
  setTimeout(function(){
    var r=writeBack(), v=r.v;
    if(r.renamed) addLog(a,"replace",v.no,"Replaced file: "+e.origFile+" → "+e.file.name,
                         "替换文件："+e.origFile+" → "+e.file.name);
    /* E-06：先把原待生效版本退回草稿并保留文件，再发布新版本，两条动作各记一条记录 */
    if(sch){
      sch.st="draft"; sch.effAt=null; sch.hash=null; sch.mode="immediate";
      addLog(a,"revert",sch.no,"Scheduled version "+sch.no+" was cancelled and returned to draft when "+v.no+" was published.",
             "发布 "+v.no+" 时撤销待生效版本 "+sch.no+"，已退回草稿并保留其文件。");
    }
    v.hash=fakeHash(v.no+v.file.name);
    v.by="a"; v.at=new Date(nowMs()).toISOString();
    if(v.mode==="immediate"){
      var old=verOf(a,"active");
      v.st="active"; v.effAt=new Date(nowMs()).toISOString();
      addLog(a,"publish",v.no,"Published "+v.no+", activate immediately.","发布 "+v.no+"，立即生效。");
      /* 归档由系统在切换时执行，操作人记为「系统 / System」（7.4.4 / AC-AG-53） */
      if(old){ old.st="archived"; old.arcAt=v.effAt;
        addLog(a,"archive",old.no,"Archived "+old.no+" automatically when "+v.no+" took effect.",
               v.no+" 生效时自动归档 "+old.no+"。","sys",v.effAt); }
    } else {
      v.st="scheduled";
      addLog(a,"publish",v.no,"Published "+v.no+", scheduled for "+fmtTime(v.effAt)+".",
             "发布 "+v.no+"，定时生效于 "+fmtTime(v.effAt)+"。");
    }
    S.editor=null; S.st="default"; S.page="P-AG-02"; S.tab="versions";
    render(); syncURL(); toast("success",t("okPublished"));
  },520);
}
function fakeHash(seed){
  var h=0, out="";
  for(var i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  for(var j=0;j<64;j++){ h=(h*1103515245+12345)>>>0; out+="0123456789abcdef"[h>>>28]; }
  return out;
}
/* 模拟到点生效：系统自动切换，操作人记为「系统 / System」（AC-AG-53） */
function simulateActivation(){
  var a=cur(), sch=verOf(a,"scheduled"); if(!sch) return;
  var old=verOf(a,"active");
  sch.st="active";
  if(old){ old.st="archived"; old.arcAt=sch.effAt;
    addLog(a,"archive",old.no,"Archived "+old.no+" automatically when "+sch.no+" took effect.",
           sch.no+" 生效时自动归档 "+old.no+"。","sys",sch.effAt); }
  addLog(a,"activate",sch.no,sch.no+" took effect at the scheduled time.",
         sch.no+" 到达生效时间后自动生效。","sys",sch.effAt);
  S.st="default"; render();
  toast("success",L("Scheduled activation completed.","定时生效已完成。"),
        L("The previous active version was archived automatically.","原生效版本已自动归档。"));
}
function discardDraft(){
  var a=cur(), d=verOf(a,"draft"); if(!d) return;
  a.versions=a.versions.filter(function(v){return v!==d;});
  addLog(a,"discard",d.no,"Discarded draft "+d.no+".","丢弃草稿 "+d.no+"。");
  S.modal=null; S.editor=null; S.page="P-AG-02"; S.tab="versions"; render(); syncURL();
  toast("success",L("Draft discarded.","草稿已丢弃。"));
}
function cancelScheduled(force){
  var a=cur(), sch=verOf(a,"scheduled"), d=verOf(a,"draft");
  if(!sch) return;
  if(d&&!force){ S.modal={type:"overwrite"}; render(); return; }
  if(d){ a.versions=a.versions.filter(function(v){return v!==d;});
    addLog(a,"discard",d.no,"Draft "+d.no+" was replaced by the cancelled scheduled version "+sch.no+".",
           "草稿 "+d.no+" 被退回的待生效版本 "+sch.no+" 覆盖。"); }
  sch.st="draft"; sch.effAt=null; sch.hash=null; sch.mode="immediate";
  addLog(a,"cancel",sch.no,"Cancelled the scheduled version "+sch.no+". It returned to draft and kept its file.",
         "撤销待生效版本 "+sch.no+"，已退回草稿并保留其文件。");
  S.modal=null; render();
  toast("success",L("Scheduled version cancelled.","待生效版本已撤销。"));
}

/* ================================ 交互 =================================== */
/* 模块自己的动作；返回 true 表示已处理，shell 不再接管。
   公共动作（menu / lang / openPrd / closeDrawer / toastClose / Esc）都在 shell 里。 */
function onAct(n,a,v,e){
  if(n.classList.contains("mask")&&e.target!==n) return true;
  if(a==="msel") return true;                             /* 复选框走 change */
  /* E-10 由状态切换器写进协议数据，好让列表与详情看到同一件事；shell 继续处理 st */
  if(a==="st"&&S.page==="P-AG-02"&&cur()) cur().actFail=(v==="actfail");
  if(MINE.indexOf(a)<0) return false;
  e.preventDefault();
  if(S.menu) S.menu=null;
  switch(a){
    case "go": go(v); break;
    case "crumb": go(v,{key:n.getAttribute("data-k")||S.agKey}); break;
    case "st": setState(v); break;
    case "tab": S.tab=v; render(); syncURL(); break;
    case "open": go("P-AG-02",{key:v,tab:"overview"}); break;
    case "more": S.more=v||null; render(); break;
    case "moreNote": S.more=(S.more==="note:"+v?null:"note:"+v); render(); break;
    case "sort":
      S.sort = S.sort.col===v ? {col:v,dir:S.sort.dir==="asc"?"desc":"asc"} : {col:v,dir:"desc"};
      render(); syncURL(); break;
    case "search":
      S.applied={kw:S.f.kw,type:S.f.type.slice(),scen:S.f.scen.slice(),status:S.f.status.slice(),
                 from:S.f.from,to:S.f.to};
      S.pg=1; S.st="default"; render(); syncURL(); break;
    case "resetF":
      S.f={kw:"",type:[],scen:[],status:[],from:"",to:""};
      S.applied={kw:"",type:[],scen:[],status:[],from:"",to:""};
      S.pg=1; S.st="default"; render(); syncURL(); break;
    case "mselClear": S.f[n.getAttribute("data-k")]=[]; render(); break;
    case "pg": S.pg=Math.max(1,parseInt(v,10)); render(); syncURL(); break;

    case "newVer": newVersion(); break;
    case "editDraft": openEditor(cur(),verOf(cur(),"draft")); break;
    case "rollback": rollback(v); break;
    case "saveDraft": saveDraft(); break;
    case "askPublish": if(validatePublish()){ S.modal={type:"publish"}; render(); } break;
    case "doPublish": doPublish(); break;
    case "askDiscard": S.modal={type:"discard"}; render(); break;
    case "doDiscard": discardDraft(); break;
    case "askCancelSch": S.modal={type:"cancelSch"}; render(); break;
    case "doCancelSch": cancelScheduled(v==="force"); break;
    case "simAct": simulateActivation(); break;
    case "doLeave":
      var to=S.modal.to, opt=S.modal.opt; S.editor=null; S.modal=null; go(to,opt); break;

    case "upload":
      /* 原型不读取真实文件：点击后按“已选择一个合规文件”呈现 */
      var ag2=cur(), ed2=ed();
      ed2.file={name:ag2.key.replace(/_/g,"-")+"-"+ed2.no+"."+ag2.types[0].toLowerCase(),
                size:"1.9 MB", ext:ag2.types[0]};
      ed2.err.file=""; ed2.dirty=true; S.st="default"; render();
      toast("success",L("File selected.","已选择文件。"),
            L("Prototype: no real file is read or uploaded.","原型不会真的读取或上传文件。"));
      break;
    case "download":
      toast("info",L("Demonstration prototype","演示原型"),
            L("No file is actually downloaded.","不会真的下载文件。")); break;
    case "copy":
      try{ if(navigator.clipboard) navigator.clipboard.writeText(v); }catch(err){}
      toast("success",t("okCopied")); break;
    case "resetDemo": S.data=seedData(); S.editor=null; S.st="default"; render();
      toast("success",L("Demo data reset.","演示数据已重置。")); break;
    case "signout":
      toast("info",L("Sign-out is owned by the account module.","退出登录归账户与登录模块。"),
            L("This module does not re-implement the sign-in flow.","本模块不重复实现登录流程。")); break;

    case "ver": S.ver=v; S.drawer="ver"; render(); break;
    case "close": S.modal=null; render(); break;
  }
  return true;
}
/* 行整体可点：键盘也能进入详情 */
/* Esc 由 shell 统一处理；这里只补行整体可点时的键盘进入 */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){
    var r=e.target.closest&&e.target.closest("tr.rowlink");
    if(r&&e.target===r){ e.preventDefault(); go("P-AG-02",{key:r.getAttribute("data-v"),tab:"overview"}); }
  }
});
document.addEventListener("input",function(e){
  var n=e.target.closest("[data-f]"); if(!n) return;
  var k=n.getAttribute("data-f");
  if(k==="kw"||k==="from"||k==="to"){ S.f[k]=n.value; return; }
  var E=ed(); if(!E) return;
  if(k==="note"){ E.note=n.value; E.err.note=""; E.dirty=true; render(); }
  if(k==="eff"){ E.effAt=localInputToIso(n.value); E.err.eff=""; E.dirty=true; }
});
document.addEventListener("change",function(e){
  var n=e.target.closest("[data-f],[data-act='msel']"); if(!n) return;
  if(n.getAttribute("data-act")==="msel"){
    var key=n.getAttribute("data-k"), val=n.getAttribute("data-v"), arr=S.f[key];
    if(arr.indexOf(val)>=0) S.f[key]=arr.filter(function(x){return x!==val;});
    else S.f[key]=arr.concat([val]);
    render(); return;
  }
  var k=n.getAttribute("data-f");
  if(k==="size"){ S.size=parseInt(n.value,10); S.pg=1; render(); syncURL(); return; }
  var E=ed(); if(!E) return;
  if(k==="mode"){ E.mode=n.value; E.dirty=true; render(); }
  if(k==="rec"){ E.rec=n.checked; E.dirty=true; render(); }
});
/* 12.4：版本编辑页有未保存改动时，浏览器关闭 / 刷新触发原生离开确认 */
window.addEventListener("beforeunload",function(e){
  if(S.editor&&S.editor.dirty){ e.preventDefault(); e.returnValue=""; }
});

    if(S.page!=="P-AG-02"&&S.page!=="P-AG-03") return [];
    var parts=[[t("agTitle"),"P-AG-01",""]];
    if(S.page==="P-AG-03"){ var a=cur(); parts.push([nm(a),"P-AG-02",a.key]); }
    return parts;
  },
  crumbCur:function(){
    if(S.page==="P-AG-01") return t("agTitle");
    if(S.page==="P-AG-02") return nm(cur());
    if(S.page==="P-AG-03") return t("newVersion")+" "+(ed()?ed().no:"");
    return null;
  },

  prdFoot:function(){

     + '<code class="mono">v1.0-协议管理-PRD.md</code>（仓库 <code class="mono">prd/</code> 定稿版）为准；'
     + '编号体系 F-40～50 / P-AG-01～04 / C-30～31 / E-01～14 / AC-AG-01～79。'
     + '面板固定中文，是给前端开发看的规格说明，不属于产品界面。';
  },
  onAct:onAct
});
