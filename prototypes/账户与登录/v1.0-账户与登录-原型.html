<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Financing · 账户与登录 可交互原型 (WS-302)</title>
<style>
/* ==========================================================================
   tokens.css — Chain Financing 账户与登录原型
   基线取自竞品 harbour-credit-admin-console.html 的浅色体系（本轮返工要求）。
   全站单一浅色体系，无深色底；资产端与管理端的差异只体现在密度、圆角与品牌标识，
   不体现为明暗两套。组件层不得出现字面色值，一律引用本文件的具名 token。
   ========================================================================== */
:root{
  /* —— 字体 —— */
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;

  /* —— 面与描边（竞品口径）—— */
  --bg:#F6F7FA;
  --bg-elev:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F9FAFC;
  --card-hover:#F3F5F9;
  --border:#E6E9F0;
  --border-strong:#D5DAE4;
  --border-dash:#EDF0F5;

  /* —— 文字 —— */
  --text:#101828;
  --muted:#5A6474;
  --faint:#8B94A6;

  /* —— 主色与语义色（竞品口径）—— */
  --accent:#2557E8;
  --accent-strong:#1E46C4;
  --accent-soft:rgba(37,87,232,.08);
  --accent-border:rgba(37,87,232,.28);
  --ok:#087443;
  --ok-bg:#ECFDF3;
  --ok-border:#ABEFC6;
  --warn:#B54708;
  --warn-bg:#FFFAEB;
  --warn-border:#FEDF89;
  --danger:#D92D20;
  --danger-bg:#FEF3F2;
  --danger-border:#FECDCA;
  --gray-bg:#F2F4F7;
  --gray-fg:#475467;
  --gray-border:#E4E7EC;
  --violet:#5925DC;
  --violet-bg:#F4F3FF;
  --violet-border:#D9D6FE;
  --pos:#0B8A76;
  --pos-soft:rgba(11,138,118,.09);

  /* —— 链上数据（地址 / 哈希）—— */
  --hash-text:#3D5FD0;
  --hash-bg:rgba(37,87,232,.06);
  --hash-border:rgba(37,87,232,.2);

  /* —— 阴影 · 圆角 · 轨道 —— */
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 28px rgba(16,24,40,.12);
  --overlay:rgba(16,24,40,.42);
  --track:#EEF0F5;
  --radius:12px;
  --radius-sm:9px;
  --radius-xs:7px;
  --radius-pill:999px;

  /* —— 字号阶梯 —— */
  --fs-10:10px; --fs-11:11px; --fs-12:12px; --fs-13:13px;
  --fs-14:14px; --fs-16:16px; --fs-19:19px; --fs-24:24px; --fs-28:28px;

  /* —— 间距 —— */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px;

  /* —— 缓动 —— */
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;

  /* —— 控件尺寸（默认 = 管理端工作台密度）—— */
  --ctrl-h:36px;
  --ctrl-h-sm:28px;
  --field-gap:13px;
  --card-pad:16px;
}

/* 资产端：面向终端用户，控件更大、留白更松，但配色与管理端完全同一套 */
[data-end="asset"]{
  --ctrl-h:42px;
  --ctrl-h-sm:32px;
  --field-gap:16px;
  --card-pad:20px;
}

/* ==========================================================================
   components.css — 产品组件层（竞品视觉语言：浅底 + 白卡 + 蓝主色 + 12px 圆角）
   本文件没有任何“评审脚手架”样式：侧边导航与顶栏就是产品界面本身。
   唯一与产品界面刻意区分的是 .prd-* （给前端开发看的 PRD 面板，紫色系）。
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;font-family:var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tiny{font-size:var(--fs-11);color:var(--faint);line-height:1.5}
.nw{white-space:nowrap}

/* ============================== 应用外壳 ================================= */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.app[hidden]{display:none}
.sidebar{background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 15px;border-bottom:1px solid var(--border)}
.brand-mark{width:34px;height:34px;border-radius:var(--radius-sm);flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:#fff;box-shadow:0 2px 10px rgba(37,87,232,.3);
  font-family:var(--mono)}
.brand-name{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand-sub{font-size:var(--fs-10);color:var(--faint);letter-spacing:.08em;text-transform:uppercase;
  margin-top:1px;font-weight:620}
.nav{padding:13px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:var(--fs-10);font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:10px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;
  border-radius:var(--radius-sm);color:var(--muted);font-weight:560;font-size:13px;border:1px solid transparent;
  margin-bottom:2px;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.nav-item:hover{background:var(--card-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border)}
.nav-ico{width:17px;text-align:center;font-size:13px;flex:none;font-family:var(--mono)}
.nav-tag{margin-left:auto;font-family:var(--mono);font-size:var(--fs-10);color:var(--faint)}
.nav-item.active .nav-tag{color:var(--accent)}
.side-foot{border-top:1px solid var(--border);padding:12px 14px;font-size:11.5px}
.op-row{display:flex;align-items:center;gap:9px}
.op-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.op-name{font-weight:620;color:var(--text);word-break:break-all;line-height:1.35}
.op-role{color:var(--faint);font-size:10.5px}
.side-chip{margin-top:9px;display:flex;align-items:center;gap:7px;background:var(--card-2);
  border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 9px;font-family:var(--mono);
  font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.dot.warn{background:var(--warn)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:13px 26px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.92);position:sticky;top:0;z-index:40}
/* C-10 面包屑：顶部导航栏下方，通栏左对齐 */
.crumbbar{padding:10px 26px;border-bottom:1px solid var(--border);background:var(--bg-elev);
  font-size:var(--fs-12);color:var(--faint);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.crumbbar .sep{color:var(--border-strong)}
.crumb-link{color:var(--muted);font-size:var(--fs-12);font-weight:600}
.crumb-link:hover{color:var(--accent);text-decoration:underline}
.crumb-cur{color:var(--text);font-weight:640;font-size:13px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg-elev);
  border-radius:var(--radius-pill);padding:5px 11px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tchip.is-btn:hover{background:var(--card-hover);color:var(--text)}
.tchip.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.content{padding:22px 26px 60px;max-width:1500px;width:100%;margin:0 auto}

/* C-04 语言切换器（下拉） · C-11 右上角账号下拉 */
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg-elev);
  border-radius:var(--radius-pill);padding:0 11px;height:var(--ctrl-h-sm);font-size:11.5px;color:var(--muted);
  font-weight:600;white-space:nowrap}
.dd-btn:hover{background:var(--card-hover);color:var(--text)}
.dd-btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.dd-btn svg{flex:none}
.dd-btn .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--accent));
  color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
.dd-btn .nm{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.dd-list{position:absolute;right:0;top:calc(100% + 6px);min-width:168px;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:5px;z-index:60;
  animation:rise var(--dur-fast) var(--ease-out)}
.dd-list.wide{min-width:242px}
.dd-list button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--radius-xs);
  font-size:12.5px;color:var(--muted)}
.dd-list button:hover{background:var(--card-hover);color:var(--text)}
.dd-list button[aria-current="true"]{color:var(--accent);font-weight:620;background:var(--accent-soft)}
.dd-head{padding:9px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;
  flex-direction:column;gap:6px;align-items:flex-start}
.dd-head b{font-size:12.5px;font-weight:640;word-break:break-all}

/* ============================== 居中卡片版式 ============================= */
/* 未登录页与管理端首登重置页：没有侧边导航，但与控制台共用同一套设计系统 */
.focus{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.focus[hidden]{display:none}
.focus-top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--border);
  background:var(--bg-elev)}
.focus-body{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:48px 24px 40px}
.focus-col{width:100%;max-width:470px}
.focus-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 26px;
  border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);background:var(--bg-elev);flex-wrap:wrap}

/* ============================== 通用组件 ================================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-b{padding:var(--card-pad)}

.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:var(--fs-19);font-weight:700;letter-spacing:-.01em;margin:0}
.page-desc{color:var(--muted);font-size:12.5px;margin:3px 0 0;max-width:760px}
.page-actions{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap}

.h3{font-size:13px;font-weight:640;margin:0}
.lead{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.6}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text);height:var(--ctrl-h);
  padding:0 14px;font-size:12.5px;font-weight:620;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out)}
.btn:hover:not(:disabled){background:var(--card-hover)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-strong));border-color:transparent;
  color:#fff;box-shadow:0 2px 12px rgba(37,87,232,.28)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(135deg,var(--accent),var(--accent-strong))}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.btn.sm{height:var(--ctrl-h-sm);padding:0 11px;font-size:var(--fs-11);border-radius:var(--radius-xs)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{opacity:.5}                       /* 视觉置灰但仍可点：点击后给出原因 */
.btn-link{color:var(--accent);font-size:12.5px;font-weight:600;border-bottom:1px solid transparent;padding-bottom:1px}
.btn-link:hover{border-bottom-color:var(--accent)}
.btnbar{display:flex;gap:10px;margin-top:18px}
.btnbar.even>*{flex:1}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-pill);font-size:11.5px;
  font-weight:620;padding:2.5px 9px;white-space:nowrap;border:1px solid transparent}
.pill.green{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.pill.amber{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.pill.red{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.pill.gray{background:var(--gray-bg);color:var(--gray-fg);border-color:var(--gray-border)}
.pill.dash{background:var(--card-2);color:var(--faint);border:1px dashed var(--border-strong)}

.note{display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent-border);
  border-radius:var(--radius-sm);padding:10px 13px;font-size:11.5px;color:var(--accent-strong);line-height:1.55}
.note b{display:block;margin-bottom:2px}
.note p{margin:2px 0 0}
.note .ico{flex:none;font-weight:700}
.note.amber{background:var(--warn-bg);border-color:var(--warn-border);color:#8A5D10}
.note.green{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.note.red{background:var(--danger-bg);border-color:var(--danger-border);color:#B42318}

/* 表单 */
.field{margin-bottom:var(--field-gap)}
.field label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11.5px;
  font-weight:620;color:var(--muted);margin-bottom:5px}
.field label .opt{font-weight:500;color:var(--faint);font-size:var(--fs-10);border:1px solid var(--border);
  border-radius:var(--radius-pill);padding:1px 7px}
.inp{width:100%;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);
  height:var(--ctrl-h);padding:0 11px;font-size:12.5px;outline:none;transition:border-color var(--dur-fast) var(--ease-out)}
.inp::placeholder{color:var(--faint)}
.inp:hover:not(:disabled){border-color:var(--faint)}
.inp:focus{border-color:var(--accent)}
.inp:disabled{background:var(--card-2);opacity:.7;cursor:not-allowed}
.inp.err{border-color:var(--danger)}
.inp.mono{font-family:var(--mono);letter-spacing:.14em}
select.inp{padding:0 8px}
.inp-row{display:flex;gap:8px}
.inp-row .inp{flex:1;min-width:0}
.inp-affix{position:relative}
.inp-affix .inp{padding-right:56px}
.affix{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:calc(var(--ctrl-h) - 12px);
  padding:0 8px;border-radius:var(--radius-xs);color:var(--muted);font-size:var(--fs-11);font-weight:620}
.affix:hover{color:var(--accent);background:var(--accent-soft)}
.hint{font-size:10.5px;color:var(--faint);margin:4px 0 0;line-height:1.45}
.err-msg{font-size:11px;color:var(--danger);margin:5px 0 0;line-height:1.45;display:flex;gap:5px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:10px}
.check input{margin:2px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.check.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.rules{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rules li{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--faint)}
.rules li[data-ok="1"]{color:var(--ok)}
.rules .box{width:14px;height:14px;border-radius:var(--radius-xs);border:1px solid currentColor;display:grid;
  place-items:center;font-size:8px;flex:none}

/* 步骤 */
.steps{display:flex;align-items:center;gap:9px;margin-bottom:16px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:7px}
.steps .n{width:21px;height:21px;border-radius:50%;border:1px solid var(--border-strong);display:grid;
  place-items:center;font-size:var(--fs-10);font-family:var(--mono)}
.steps .s[data-on="1"]{color:var(--text);font-weight:620}
.steps .s[data-on="1"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .s[data-done="1"] .n{border-color:var(--ok);color:var(--ok)}
.steps .bar{flex:1;min-width:16px;height:1px;background:var(--border)}

/* Tabs（登录方式） */
.seg-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.seg-tab{flex:1;min-width:0;padding:9px 6px;font-size:12px;font-weight:620;color:var(--faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1.3}
.seg-tab:hover:not(:disabled){color:var(--muted)}
.seg-tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.seg-tab:disabled{opacity:.45;cursor:not-allowed}
.seg-tab .lk{font-size:var(--fs-10);color:var(--danger);font-weight:600}

/* 表格 */
.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
table.tbl thead th{text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--border);background:var(--card-2);white-space:nowrap}
table.tbl tbody td{padding:10px 12px;border-bottom:1px solid #F0F2F6;vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover td{background:#FAFBFD}
.c-email{font-family:var(--mono);font-size:var(--fs-11);overflow-wrap:anywhere;width:20%}
.c-time{white-space:nowrap;font-family:var(--mono);font-size:10.5px;line-height:1.45;width:100px}
.c-time .t2{color:var(--faint)}
.c-status{min-width:150px}
.col-act{width:96px;text-align:right}
td.col-act{vertical-align:top}
.col-act .actlink{display:block;width:100%;text-align:right;margin-bottom:2px}
.actlink{font-size:var(--fs-11);color:var(--accent);padding:2px 5px;border-radius:5px;font-weight:600;line-height:1.5}
.actlink:hover{background:var(--accent-soft)}
.actlink.danger{color:var(--danger)}
.actlink.danger:hover{background:var(--danger-bg)}
.actlink.off{color:var(--faint);cursor:not-allowed}
.tbl-empty{padding:52px 20px;text-align:center;color:var(--faint)}
.tbl-empty b{display:block;color:var(--muted);font-size:13px;margin-bottom:5px;font-weight:640}
.skel{height:11px;border-radius:5px;background:var(--track);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#fff,transparent);animation:sweep 1.2s var(--ease-in-out) infinite}
@keyframes sweep{100%{transform:translateX(100%)}}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

.lock-ring{width:56px;height:56px;border-radius:50%;background:var(--danger-bg);border:1px solid var(--danger-border);

/* 登录页密码 Tab 下的三条静态入口 */
.entries{display:flex;flex-wrap:wrap;gap:8px 18px;margin:-4px 0 14px}

/* 账户设置单页：tab 锚点 + 区块标题 */
.anchors{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}

.anchor:hover{color:var(--accent);border-bottom-color:var(--accent-border)}
.sec-title{font-size:var(--fs-14);font-weight:660;margin:0 0 12px;scroll-margin-top:110px}

/* 本期壳子页 */
.shell{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:40px 20px;

.shell p{margin:0;max-width:520px;font-size:12.5px;line-height:1.6}

/* 页面级状态切换器（原型控制，替代原来的演示分支开关面板） */
.statebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.statebar .seg{flex-wrap:wrap}

/* 设置行 */
.rows{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:16px;padding:16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-k{font-size:11.5px;color:var(--muted);font-weight:620;margin-bottom:5px;display:flex;align-items:center;gap:8px}

/* C-07 地址 / 哈希 */
.hash{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--hash-text);
  background:var(--hash-bg);border:1px solid var(--hash-border);border-radius:var(--radius-xs);padding:3px 8px;max-width:100%}
.hash .val{overflow-wrap:anywhere}
.hash .ico{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--accent);
  font-size:var(--fs-11);flex:none}

/* C-08 常驻补全提示条 */
.cbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--radius-sm);font-size:12px;color:#8A5D10;margin-bottom:16px}
.cbar .ic{width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;
  font-size:var(--fs-11);font-weight:700;flex:none}
.cbar p{margin:0;flex:1;line-height:1.5}
.cbar-mini{position:fixed;left:258px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;
  background:var(--warn-bg);border:1px solid var(--warn-border);color:#8A5D10;border-radius:var(--radius-pill);
  padding:7px 13px;font-size:11.5px;font-weight:620;box-shadow:var(--shadow)}

/* 统计卡（落地页） */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 18px}
.stat .lbl{font-size:var(--fs-11);font-weight:640;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.stat .val{font-family:var(--mono);font-size:15px;font-weight:640;overflow-wrap:anywhere}

/* 引导卡 */
.guide{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.guide.pri{border-color:var(--accent-border);background:linear-gradient(180deg,var(--accent-soft),transparent)}
.guide .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;
  font-size:var(--fs-11);font-family:var(--mono);color:var(--muted);flex:none}
.guide.pri .n{background:var(--accent);border-color:var(--accent);color:#fff}
.guide .bd{flex:1;min-width:0}
.guide .bd p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}

/* ============================== 弹层与抽屉 =============================== */
.mask{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:24px;z-index:200;
  animation:fade var(--dur-base) var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);animation:rise var(--dur-base) var(--ease-out);max-height:100%;display:flex;flex-direction:column}
.modal.wide{max-width:560px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h b{flex:1;font-size:13.5px;font-weight:660}
.modal-x{width:26px;height:26px;border-radius:var(--radius-xs);color:var(--faint);display:grid;place-items:center;flex:none}
.modal-x:hover{color:var(--text);background:var(--card-hover)}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);

.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--bg-elev);

  animation:slide var(--dur-base) var(--ease-out)}
@keyframes slide{from{transform:translateX(16px);opacity:.4}to{transform:translateX(0);opacity:1}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-h b{flex:1;font-size:13.5px;font-weight:660}
.drawer-b{flex:1;overflow:auto;padding:16px}
.drawer-scrim{position:fixed;inset:0;background:rgba(16,24,40,.18);z-index:205}

/* ---- PRD 面板：给前端开发看的规格，紫色系，与产品界面明确区分 ---- */
.prd .drawer-h{background:var(--violet-bg);border-bottom-color:var(--violet-border)}

.prd-src{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-bottom:14px;line-height:1.5;
  border-left:2px solid var(--violet-border);padding-left:9px}
.prd-sec{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:10px;overflow:hidden}
.prd-sec>summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:12px;font-weight:640;color:var(--text);
  display:flex;align-items:center;gap:8px;background:var(--card)}
.prd-sec>summary::-webkit-details-marker{display:none}
.prd-sec>summary:hover{background:var(--card-hover)}
.prd-sec>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.prd-sec>summary .caret{color:var(--violet);font-size:10px;transition:transform var(--dur-fast) var(--ease-out)}
.prd-sec[open]>summary .caret{transform:rotate(90deg)}
.prd-sec .bd{padding:0 13px 12px;border-top:1px solid var(--border-dash)}
.prd-item{padding:9px 0;border-bottom:1px dashed var(--border-dash);font-size:11.5px;line-height:1.6}
.prd-item:last-child{border-bottom:none}
.prd-item .k{font-family:var(--mono);font-size:10.5px;color:var(--violet);font-weight:640;margin-bottom:2px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prd-item .k .meta{color:var(--faint);font-weight:400}
.prd-item .v{color:var(--muted)}
.prd-item .v b{color:var(--text);font-weight:620}
.prd-item .v code{font-size:10.5px;background:var(--gray-bg);border:1px solid var(--gray-border);border-radius:4px;padding:0 4px;color:var(--gray-fg)}
.prd-copy{display:grid;grid-template-columns:1fr;gap:3px;padding:8px 0;border-bottom:1px dashed var(--border-dash);font-size:11.5px}
.prd-copy:last-child{border-bottom:none}
.prd-copy .sc{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.prd-copy .en{color:var(--text)}
.prd-copy .zh{color:var(--muted)}
.prd-foot{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:14px;border-top:1px solid var(--border);padding-top:10px}

/* ---- 原型控制抽屉（端切换 / 页面直达 / 演示分支）---- */
.pp-sec{font-size:var(--fs-10);font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 7px}
.pp-sec:first-child{margin-top:0}
.pp-link{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:6px 9px;border-radius:var(--radius-xs);

.pp-link:hover{background:var(--card-hover);color:var(--text)}
.pp-link[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:620}
.pp-link code{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;width:44px}
.pp-link[aria-current="true"] code{color:var(--accent)}
.pp-note{font-size:10.5px;color:var(--faint);line-height:1.6;background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:9px 11px;margin-bottom:4px}

/* ============================== C-01 滑块 ================================ */
.cap-canvas{position:relative;width:328px;margin:0 auto;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--card-2)}
.cap-canvas canvas{display:block;width:328px;height:180px}
.cap-piece{position:absolute;top:0;left:0;will-change:transform}
.cap-track{margin:14px auto 0;width:328px;height:42px;border-radius:var(--radius-pill);background:var(--card-2);
  border:1px solid var(--border-strong);position:relative;display:flex;align-items:center;user-select:none;touch-action:none}
.cap-track.ok{border-color:var(--ok-border);background:var(--ok-bg)}
.cap-track.bad{border-color:var(--danger-border);background:var(--danger-bg)}
.cap-track.cool{opacity:.6}
.cap-track .tip{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-11);color:var(--faint);
  pointer-events:none}
.cap-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--accent-soft)}
.cap-knob{position:absolute;left:0;top:0;height:40px;width:48px;border-radius:var(--radius-pill);background:var(--bg-elev);
  border:1px solid var(--border-strong);display:grid;place-items:center;cursor:grab;color:var(--accent);
  font-family:var(--mono);font-size:13px;box-shadow:var(--shadow)}
.cap-knob:active{cursor:grabbing}
.cap-knob.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
.cap-knob[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.cap-msg{margin-top:10px;min-height:17px;font-size:var(--fs-11);line-height:1.5;text-align:center;color:var(--faint)}
.cap-msg.bad{color:var(--danger)}

  max-height:150px;overflow:auto}

  animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================== C-05 Toast =============================== */
/* C-12 Toast：顶部居中，全站唯一轻提示载体 */
.toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;
  gap:8px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toasts .toast{pointer-events:auto}
.toast{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--bg-elev);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:12px;
  line-height:1.5;animation:drop var(--dur-base) var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.toast.danger{border-color:var(--danger-border);background:var(--danger-bg)}
.toast.success{border-color:var(--ok-border);background:var(--ok-bg)}
.toast .tx{flex:1}
.toast .tx b{display:block;font-weight:640;margin-bottom:2px;color:var(--text)}
.toast .tx span{color:var(--muted);font-size:var(--fs-11)}
.toast .cl{color:var(--faint);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
.toast .cl:hover{color:var(--text)}

/* 建号确认 */
.created{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px}
.created .ring{width:68px;height:68px;border-radius:50%;border:1px solid var(--ok-border);background:var(--ok-bg);
  display:grid;place-items:center;color:var(--ok);font-size:28px;animation:pop var(--dur-slow) var(--ease-out)}

.created .idbox{margin-top:18px;display:inline-flex;flex-direction:column;gap:3px;align-items:center;
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 18px;background:var(--card-2)}
.created .idbox span{font-size:var(--fs-10);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.created .idbox b{font-family:var(--mono);font-size:15px;font-weight:640}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
@media (max-width:1100px){
  .app{grid-template-columns:200px 1fr}
  .cbar-mini{left:220px}
  }

/* ------------------------------ Toast (C-12) ------------------------------ */
/* PRD 8.7.1：顶部居中 · 成功与信息 3 秒 / 失败 5 秒 · 最多 3 条 · 可手动关闭 */
var tid=0;
function toast(kind,title,body){
  var same=S.toasts.filter(function(x){return x.title===title;})[0];
  if(same) return;                                   /* 去重 */
  var id=++tid;
  if(S.toasts.length>=3) S.toasts.shift();
  S.toasts.push({id:id,kind:kind,title:title,body:body||""});
  render();
  setTimeout(function(){ S.toasts=S.toasts.filter(function(x){return x.id!==id;}); render(); }, kind==="danger"?5000:3000);
}

function pageLogin(){

  if(S.st==="locked1"||S.st==="locked2"){

    return focusShell(
      '<div class="card"><div class="card-b"><div class="locked">'
      + '<div class="lock-ring">'+ICO.lock+'</div>'
      + '<h2 class="page-title" style="font-size:19px;margin-top:14px">'+t("lockTitle")+'</h2>'
      + '<div class="lock-time mono">'+(tier1?"09:12":"28:47")+'</div>'
      + '<p class="lead" style="text-align:center;max-width:360px">'
      + t("lockDuring",{m:tier1?"9":"28",s:tier1?"12":"47"})+'</p>'
      + '<p class="tiny" style="margin-top:10px">'+t("lockWait")+'</p>'
      + gap(10)
      + note(tier1?"amber":"red", tier1?t("lockTier1",{m:10}):t("lockTier2",{m:30}))
      + '</div></div></div>');
  }

  var tab=S.loginTab, body="";
  body += '<div class="seg-tabs" role="tablist">'
    + segTab("code","tabCode",tab) + segTab("pwd","tabPwd",tab) + segTab("wallet","tabWallet",tab) + '</div>';
  if(S.st==="disabled") body += note("red",t("eDisabled")) + gap();

  if(tab==="code"){
    body += field("loginEmail","labelEmail",{type:"email",ph:"you@company.com",ac:"email"})
         +  codeField("login",{sent:S.st==="sent",
              error:S.st==="quota"?t("rlEmailQuota",{t:L("42 minutes","42 分钟")}):""});
  } else if(tab==="pwd"){
    body += field("loginEmail","labelEmail",{type:"email",ph:"you@company.com",ac:"email"})
         +  field("loginPwd","labelPwd",{pwd:true,ac:"current-password"})
         +  (S.st==="attempts"?'<p class="err-msg" role="alert" style="margin:-8px 0 12px"><span>!</span><span>'+t("lockPwdLeft",{n:2})+'</span></p>':"")
         /* 7.2.2-5：三条静态入口，与是否失败无关，不泄漏账户是否存在 */
         +  '<div class="entries">'
         +  '<button class="btn-link" type="button" data-act="go" data-v="P-A03">'+t("forgotPwd")+'</button>'
         +  '<button class="btn-link" type="button" data-act="go" data-v="P-A03">'+t("noPwdEntry")+'</button>'
         +  '<button class="btn-link" type="button" data-act="tab" data-v="code">'+t("useCodeEntry")+'</button></div>';
  } else {
    /* 链接外部钱包：先手填地址，再连钱包签名；所有状态提示走 Toast */
    body += field("loginAddr","labelWallet",{ph:"0x…",mono:true,

                     "手填地址只用于指定登录哪个账户；真正的身份证明是钱包签名。")})
         +  note("",t("walletSignNote")) + gap()
         +  '<button class="btn primary block" type="button" data-act="wallet" data-p="purposeSignIn">'+t("linkWallet")+'</button>';
  }

  /* C-02 协议勾选行：全站唯一一处 */

       +  (S.err.agree?'<p class="err-msg" role="alert" style="margin:-4px 0 8px"><span>!</span><span>'+esc(S.err.agree)+'</span></p>':'');
  if(tab!=="wallet")
    body += '<button class="btn primary block'+(S.agree?"":" quiet")+'" type="button" data-act="login" style="margin-top:14px">'+t("submitSignIn")+'</button>';
  return focusShell(focusCard(t("signInTitle"),"",body));
}

      + '<button class="btn primary block" type="button" data-act="mStep" data-v="1">'+t("contin")+'</button>'+sw;

   + '<div class="drawer-b"><p class="tiny">本页无独立 PRD 摘录。</p></div></aside>';
  function sec(label,items,n,open){
    if(!n) return "";
    return '<details class="prd-sec"'+(open?" open":"")+'><summary><span class="caret">▸</span>'+label
     + '<span class="cnt">'+n+'</span></summary><div class="bd">'+items+'</div></details>';
  }
  function rows(arr,meta){
    return (arr||[]).map(function(x){
      return '<div class="prd-item"><div class="k">'+esc(x[0])+(meta?'<span class="meta">'+esc(x[1])+'</span>':'')
       + '</div><div class="v">'+md(meta?x[2]:x[1])+'</div></div>';}).join("");
  }
  var c=(d.copy||[]).map(function(x){
    return '<div class="prd-copy"><span class="sc">'+esc(x[0])+'</span><span class="en">EN&nbsp;&nbsp;'+esc(x[1])+'</span>'
     + '<span class="zh">中文&nbsp;&nbsp;'+esc(x[2])+'</span></div>';}).join("");

   + '<div class="drawer-h"><b>PRD · '+esc(d.title)+'</b>'
   + '<button class="modal-x" type="button" data-act="closeDrawer" aria-label="'+t("close")+'">✕</button></div>'
   + '<div class="drawer-b"><div class="prd-src">'+esc(d.src)+'</div>'
   + sec("① 字段与校验规则",rows(d.fields,true),(d.fields||[]).length,true)
   + sec("② 关键业务规则",rows(d.rules),(d.rules||[]).length,true)
   + sec("③ 状态与异常分支",rows(d.states),(d.states||[]).length,false)
   + sec("④ 中英双语文案",c,(d.copy||[]).length,false)
   + '<div class="prd-foot">本面板只摘录<b>本页用得到的</b>条目，不是全量 PRD，按用户要求**不展示验收标准**。'
   + '完整口径以 prd/v1.0-账户与登录-PRD.md（定稿版）为准；编号体系 F-01～36 / N-01～21 / D-01～31。'
   + '面板固定中文，是给前端开发看的规格说明，不属于产品界面。</div></div></aside>';
}

       "页面目录。未登录页天然没有侧边导航，从这里进入；每个页面的状态用页面上的状态切换器切换。")+'</div>'

function renderCrumb(){
  var r=route(), cur=r.crumb?r.crumb[S.lang==="en"?0:1]:pageName(S.page);
  var parts=[];
  if(S.page==="P-A17"&&S.st==="sub") parts.push([t("navUserCenter"),"P-A17"]);
  var html=parts.map(function(p){

function render(){
  var fk=document.activeElement&&document.activeElement.getAttribute
         ? document.activeElement.getAttribute("data-f"):null;
  var sel=document.activeElement&&document.activeElement.selectionStart;
  var r=route(); S.end=r.end;
  document.documentElement.setAttribute("data-end",r.end);
  var isFocus=r.layout==="focus";
  q("#focus").hidden=!isFocus; q("#app").hidden=isFocus;
  if(isFocus){
    q("#focus").innerHTML=renderFocus();
    q("#nav").innerHTML=""; q("#topRight").innerHTML=""; q("#content").innerHTML=""; q("#crumb").innerHTML="";
  } else {
    q("#focus").innerHTML="";
    q("#brandSub").textContent = S.end==="admin"?t("adminConsole"):t("endAsset");
    q("#nav").innerHTML=renderNav();
    q("#crumb").innerHTML=renderCrumb();
    q("#topRight").innerHTML=pagesBtn()+langSwitcher()+accountMenu();
    q("#content").innerHTML=renderContent();
  }
  q("#layers").innerHTML=renderToasts()+renderModal()+renderDrawer();
  if(S.modal&&S.modal.type==="captcha") drawCaptcha();
  if(fk){ var n=q('[data-f="'+fk+'"]');
    if(n){ n.focus(); try{ if(sel!=null&&n.setSelectionRange) n.setSelectionRange(sel,sel); }catch(e){} } }
}
/* C-12 Toast：顶部居中 */
function renderToasts(){
  if(!S.toasts.length) return "";
  return '<div class="toasts" role="region" aria-live="polite">'+S.toasts.map(function(x){
    return '<div class="toast '+x.kind+'"><span class="ico">'
     + (x.kind==="danger"?ICO.warn:x.kind==="success"?ICO.ok:ICO.info)+'</span>'
     + '<div class="tx"><b>'+esc(x.title)+'</b>'+(x.body?'<span>'+esc(x.body)+'</span>':'')+'</div>'
     + '<button class="cl" type="button" data-act="toastClose" data-i="'+x.id+'" aria-label="'+t("close")+'">✕</button></div>';
  }).join("")+'</div>';
}
/* 滑块背景图：运行时生成，不引用任何外部图片 */
function drawCaptcha(){
  var bg=q("#capBg"), pc=q("#capPiece"); if(!bg||!pc) return;
  var W=328,H=180,PS=46,tx=133,ty=58,i,x,y,w,h,seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  var off=document.createElement("canvas"); off.width=W; off.height=H;
  var o=off.getContext("2d"), hue=212, g=o.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"hsl("+hue+",58%,74%)"); g.addColorStop(1,"hsl("+((hue+52)%360)+",52%,58%)");
  o.fillStyle=g; o.fillRect(0,0,W,H);
  for(i=0;i<9;i++){
    o.globalAlpha=0.12+rnd()*0.2; o.fillStyle="hsl("+((hue+i*26)%360)+",62%,"+(52+rnd()*32)+"%)";
    x=rnd()*W; y=rnd()*H; w=24+rnd()*140; h=10+rnd()*90;
    o.beginPath(); o.roundRect?o.roundRect(x,y,w,h,10):o.rect(x,y,w,h); o.fill();
  }
  o.globalAlpha=1;
  function path(c,px,py){
    var rr=6,k=PS*0.22;
    c.beginPath(); c.moveTo(px+rr,py); c.lineTo(px+PS*0.42,py);
    c.arc(px+PS*0.5,py,k,Math.PI,0,true);
    c.lineTo(px+PS-rr,py); c.quadraticCurveTo(px+PS,py,px+PS,py+rr);
    c.lineTo(px+PS,py+PS*0.38); c.arc(px+PS,py+PS*0.5,k,-Math.PI/2,Math.PI/2,false);
    c.lineTo(px+PS,py+PS-rr); c.quadraticCurveTo(px+PS,py+PS,px+PS-rr,py+PS);
    c.lineTo(px+rr,py+PS); c.quadraticCurveTo(px,py+PS,px,py+PS-rr);
    c.lineTo(px,py+rr); c.quadraticCurveTo(px,py,px+rr,py); c.closePath();
  }
  var b=bg.getContext("2d"); b.clearRect(0,0,W,H); b.drawImage(off,0,0);
  b.save(); path(b,tx,ty); b.fillStyle="rgba(16,24,40,.55)"; b.fill();
  b.strokeStyle="rgba(255,255,255,.75)"; b.lineWidth=1.5; b.stroke(); b.restore();
  var p=pc.getContext("2d"); p.clearRect(0,0,W,H);
  p.save(); path(p,0,ty); p.clip(); p.drawImage(off,-tx,0); p.restore();
  p.save(); path(p,0,ty); p.strokeStyle="rgba(255,255,255,.9)"; p.lineWidth=1.5; p.stroke(); p.restore();
}

/* ================================ 交互 =================================== */
document.addEventListener("click",function(e){
  var n=e.target.closest("[data-act]");
  if(!n){ if(S.menu){ S.menu=null; render(); } return; }
  var a=n.getAttribute("data-act"), v=n.getAttribute("data-v");
  if(n.classList.contains("mask")&&e.target!==n) return;
  if(n.tagName==="A"&&n.getAttribute("href")&&n.getAttribute("href")!=="#") return;
  e.preventDefault();
  if(a!=="menu"&&S.menu) S.menu=null;
  switch(a){
    case "menu": S.menu=(S.menu===v?null:v); render(); break;
    case "lang": S.lang=v; render(); break;
    case "go": go(v,n.getAttribute("data-st")||""); break;
    case "st": setState(v); break;
    case "tab": S.loginTab=v; S.err={}; render(); break;
    case "show": S.form["_show_"+n.getAttribute("data-k")]=!S.form["_show_"+n.getAttribute("data-k")]; render(); break;
    case "anchor":
      var el=document.getElementById(v);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      break;
    case "openPrd": S.drawer=S.drawer==="prd"?null:"prd"; render(); break;
    case "openPages": S.drawer=S.drawer==="pages"?null:"pages"; render(); break;
    case "closeDrawer": S.drawer=null; render(); break;
    case "close": S.modal=null; render(); break;
    case "toastClose": S.toasts=S.toasts.filter(function(x){return x.id!=n.getAttribute("data-i");}); render(); break;

    case "captcha": S.modal={type:"captcha",view:"idle"}; render(); break;
    case "capView": S.modal.view=v; render(); break;
    case "capPass": S.modal=null; markSent(); break;

    case "wallet": S.modal={type:"wallet",view:"pick",purpose:n.getAttribute("data-p")}; render(); break;
    case "wView": S.modal.view=v; render(); break;
    case "wToast": toast(v==="tLinked"||v==="tNetworkOk"?"success":v==="tSignPrompt"?"info":"danger",t(v)); break;
    case "wSign": walletSigned(); break;
    case "walletLink": S.modal={type:"wallet",view:"pick",purpose:"purposeLink"}; render(); break;

    case "login": doLogin(); break;
    case "later": go("P-A17"); toast("info",L("Landed by verification status.","已按认证状态落地。")); break;
    case "kyc": S.modal={type:"gate",need:(S.st==="noemail"?"email":(S.st==="complete"?"":"wallet"))}; render(); break;
    case "gateView": S.modal.need=v; render(); break;

    case "emailDlg": S.modal={type:"email",step:0,factor:null,add:(S.page==="P-A10"&&S.st==="wallet")}; render(); break;
    case "pwdDlg": S.modal={type:"pwd",step:0,factor:null,set:(S.page!=="P-M05"&&S.st!=="complete")}; render(); break;
    case "mStep": S.modal.step=+v; S.err={}; render(); break;
    case "mFactor": S.modal.factor=v||null; S.err={}; render(); break;
    case "done": submitDone(v); break;
    case "copy": toast("success",t("addrCopied")); break;
  }
});
document.addEventListener("click",function(e){
  var a=e.target.closest("a[data-doc]"); if(!a) return;
  e.preventDefault(); S.modal={type:"doc",doc:a.getAttribute("data-doc")}; render();
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(S.menu){ S.menu=null; render(); return; }
  if(S.drawer){ S.drawer=null; render(); return; }
  if(S.modal&&S.modal.type!=="reconsent"){ S.modal=null; render(); }
});
document.addEventListener("input",function(e){
  var n=e.target.closest("[data-f]"); if(!n) return;
  var k=n.getAttribute("data-f");
  if(n.type==="checkbox"){
    if(k==="agree"){ S.agree=n.checked; S.err.agree=""; S.err._shake=false; } else S.form[k]=n.checked;
    render(); return;
  }
  S.form[k]=n.value;
  if(/^(pwNew|dNew|mrNew|mfNew)$/.test(k)) render();     /* 密码规则清单实时反馈 */
});
document.addEventListener("change",function(e){
  var s=e.target.closest('select[data-f]'); if(!s) return;
  var k=s.getAttribute("data-f");
  if(k==="tz"){ S.tz=s.value; render(); toast("success",t("okPrefsSaved")); }
  if(k==="lang"){ S.lang=s.value; render(); toast("success",t("okPrefsSaved")); }
});

/* ------------------------------ 具体动作 --------------------------------- */
function markSent(){
  if(S.page==="P-A01"||S.page==="P-A03"||S.page==="P-M03") S.st="sent";
  render(); toast("success",t("codeSent"));
}
function walletSigned(){
  S.modal=null;
  if(S.page==="P-A01"){ toast("success",t("tLinked")); go("P-A10"); S.st="wallet"; render(); return; }
  toast("success",t("tLinked")); render();
}
function doLogin(){
  S.err={};
  if(!S.agree){ S.err.agree=t("eTerms"); S.err._shake=true; render(); return; }
  var email=(S.form.loginEmail||"").trim();
  if(!isEmail(email)){ S.err.loginEmail=t("eEmailFmt"); render(); return; }
  if(S.loginTab==="code"){
    if(!/^\d{6}$/.test(S.form.logincode||"")){ S.err.loginCode=t("eCodeReq"); render(); return; }
    go("P-A10"); return;                       /* 首次登录即建号 → 直接进引导页 */
  }
  S.err.loginPwd=t("ePwdLogin"); render();     /* 三种失败情形返回完全一致的提示 */
}
function submitDone(key){
  var admin=S.end==="admin";
  if(key==="okEmailAdded"){ S.modal=null; render(); toast("success",t(key)); return; }  /* 首次绑定不失效会话 */
  go(admin?"P-M01":"P-A01");
  toast("success",t(key),t("sAllDevices"));
}

DICT.en.capHelpNote="A security check appears before any code is sent.";
DICT.zh.capHelpNote="点击发送验证码后会先弹出滑块人机校验。";
render();
