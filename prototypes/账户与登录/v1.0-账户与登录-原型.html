<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Financing · 账户与登录 可交互原型 (WS-302)</title>
<style>
/* ==========================================================================
   tokens.css — Chain Financing 账户与登录原型
   基线取自竞品 harbour-credit-admin-console.html 的浅色体系（本轮返工要求）。
   全站单一浅色体系，无深色底；资产端与管理端的差异只体现在密度、圆角与品牌标识，
   不体现为明暗两套。组件层不得出现字面色值，一律引用本文件的具名 token。
   ========================================================================== */
:root{
  /* —— 字体 —— */
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;

  /* —— 面与描边（竞品口径）—— */
  --bg:#F6F7FA;
  --bg-elev:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F9FAFC;
  --card-hover:#F3F5F9;
  --border:#E6E9F0;
  --border-strong:#D5DAE4;
  --border-dash:#EDF0F5;

  /* —— 文字 —— */
  --text:#101828;
  --muted:#5A6474;
  --faint:#8B94A6;

  /* —— 主色与语义色（竞品口径）—— */
  --accent:#2557E8;
  --accent-strong:#1E46C4;
  --accent-soft:rgba(37,87,232,.08);
  --accent-border:rgba(37,87,232,.28);
  --ok:#087443;
  --ok-bg:#ECFDF3;
  --ok-border:#ABEFC6;
  --warn:#B54708;
  --warn-bg:#FFFAEB;
  --warn-border:#FEDF89;
  --danger:#D92D20;
  --danger-bg:#FEF3F2;
  --danger-border:#FECDCA;
  --gray-bg:#F2F4F7;
  --gray-fg:#475467;
  --gray-border:#E4E7EC;
  --violet:#5925DC;
  --violet-bg:#F4F3FF;
  --violet-border:#D9D6FE;
  --pos:#0B8A76;
  --pos-soft:rgba(11,138,118,.09);

  /* —— 链上数据（地址 / 哈希）—— */
  --hash-text:#3D5FD0;
  --hash-bg:rgba(37,87,232,.06);
  --hash-border:rgba(37,87,232,.2);

  /* —— 阴影 · 圆角 · 轨道 —— */
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 28px rgba(16,24,40,.12);
  --overlay:rgba(16,24,40,.42);
  --track:#EEF0F5;
  --radius:12px;
  --radius-sm:9px;
  --radius-xs:7px;
  --radius-pill:999px;

  /* —— 字号阶梯 —— */
  --fs-10:10px; --fs-11:11px; --fs-12:12px; --fs-13:13px;
  --fs-14:14px; --fs-16:16px; --fs-19:19px; --fs-24:24px; --fs-28:28px;

  /* —— 间距 —— */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px;

  /* —— 缓动 —— */
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;

  /* —— 控件尺寸（默认 = 管理端工作台密度）—— */
  --ctrl-h:36px;
  --ctrl-h-sm:28px;
  --field-gap:13px;
  --card-pad:16px;
}

/* 资产端：面向终端用户，控件更大、留白更松，但配色与管理端完全同一套 */
[data-end="asset"]{
  --ctrl-h:42px;
  --ctrl-h-sm:32px;
  --field-gap:16px;
  --card-pad:20px;
}

/* ==========================================================================
   components.css — 产品组件层（竞品视觉语言：浅底 + 白卡 + 蓝主色 + 12px 圆角）
   本文件没有任何“评审脚手架”样式：侧边导航与顶栏就是产品界面本身。
   唯一与产品界面刻意区分的是 .prd-* （给前端开发看的 PRD 面板，紫色系）。
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;font-family:var(--sans)}
a{color:var(--accent);text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:var(--fs-12)}
.tiny{font-size:var(--fs-11);color:var(--faint);line-height:1.5}
.nw{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================== 应用外壳 ================================= */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.app[hidden]{display:none}
.sidebar{background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 15px;border-bottom:1px solid var(--border)}
.brand-mark{width:34px;height:34px;border-radius:var(--radius-sm);flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:#fff;box-shadow:0 2px 10px rgba(37,87,232,.3);
  font-family:var(--mono)}
.brand-name{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand-sub{font-size:var(--fs-10);color:var(--faint);letter-spacing:.08em;text-transform:uppercase;
  margin-top:1px;font-weight:620}
.nav{padding:13px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:var(--fs-10);font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:10px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;
  border-radius:var(--radius-sm);color:var(--muted);font-weight:560;font-size:13px;border:1px solid transparent;
  margin-bottom:2px;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.nav-item:hover{background:var(--card-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border)}
.nav-ico{width:17px;text-align:center;font-size:13px;flex:none;font-family:var(--mono)}
.nav-tag{margin-left:auto;font-family:var(--mono);font-size:var(--fs-10);color:var(--faint)}
.nav-item.active .nav-tag{color:var(--accent)}
.side-foot{border-top:1px solid var(--border);padding:12px 14px;font-size:11.5px}
.op-row{display:flex;align-items:center;gap:9px}
.op-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.op-name{font-weight:620;color:var(--text);word-break:break-all;line-height:1.35}
.op-role{color:var(--faint);font-size:10.5px}
.side-chip{margin-top:9px;display:flex;align-items:center;gap:7px;background:var(--card-2);
  border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 9px;font-family:var(--mono);
  font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.dot.warn{background:var(--warn)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:13px 26px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.92);position:sticky;top:0;z-index:40}
.crumb{font-size:var(--fs-12);color:var(--faint);min-width:0}
.crumb b{color:var(--text);font-weight:640;font-size:13.5px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg-elev);
  border-radius:var(--radius-pill);padding:5px 11px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tchip.is-btn:hover{background:var(--card-hover);color:var(--text)}
.tchip.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.content{padding:22px 26px 60px;max-width:1500px;width:100%;margin:0 auto}

/* 语言切换器 C-04 */
.lang{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-pill);overflow:hidden;
  font-size:var(--fs-11);background:var(--bg-elev)}
.lang button{padding:5px 10px;color:var(--faint)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:620}

/* ============================== 居中卡片版式 ============================= */
/* 未登录页与管理端首登重置页：没有侧边导航，但与控制台共用同一套设计系统 */
.focus{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.focus[hidden]{display:none}
.focus-top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--border);
  background:var(--bg-elev)}
.focus-body{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:48px 24px 40px}
.focus-col{width:100%;max-width:470px}
.focus-col.is-wide{max-width:560px}
.focus-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 26px;
  border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);background:var(--bg-elev);flex-wrap:wrap}

/* ============================== 通用组件 ================================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:640;margin:0}
.card-sub{color:var(--faint);font-size:var(--fs-11);font-weight:400}
.card-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:var(--card-pad)}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}

.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:var(--fs-19);font-weight:700;letter-spacing:-.01em;margin:0}
.page-desc{color:var(--muted);font-size:12.5px;margin:3px 0 0;max-width:760px}
.page-actions{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap}

.h2{font-size:var(--fs-16);font-weight:660;margin:0}
.h3{font-size:13px;font-weight:640;margin:0}
.lead{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.6}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text);height:var(--ctrl-h);
  padding:0 14px;font-size:12.5px;font-weight:620;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out)}
.btn:hover:not(:disabled){background:var(--card-hover)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-strong));border-color:transparent;
  color:#fff;box-shadow:0 2px 12px rgba(37,87,232,.28)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(135deg,var(--accent),var(--accent-strong))}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}
.btn.sm{height:var(--ctrl-h-sm);padding:0 11px;font-size:var(--fs-11);border-radius:var(--radius-xs)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{opacity:.5}                       /* 视觉置灰但仍可点：点击后给出原因 */
.btn-link{color:var(--accent);font-size:12.5px;font-weight:600;border-bottom:1px solid transparent;padding-bottom:1px}
.btn-link:hover{border-bottom-color:var(--accent)}
.btnbar{display:flex;gap:10px;margin-top:18px}
.btnbar.even>*{flex:1}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-pill);font-size:11.5px;
  font-weight:620;padding:2.5px 9px;white-space:nowrap;border:1px solid transparent}
.pill.blue{background:#EEF2FF;color:#3538CD;border-color:#C7D2FE}
.pill.green{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.pill.amber{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.pill.red{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.pill.gray{background:var(--gray-bg);color:var(--gray-fg);border-color:var(--gray-border)}
.pill.violet{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-border)}
.pill.dash{background:var(--card-2);color:var(--faint);border:1px dashed var(--border-strong)}

.note{display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent-border);
  border-radius:var(--radius-sm);padding:10px 13px;font-size:11.5px;color:var(--accent-strong);line-height:1.55}
.note b{display:block;margin-bottom:2px}
.note p{margin:2px 0 0}
.note .ico{flex:none;font-weight:700}
.note.amber{background:var(--warn-bg);border-color:var(--warn-border);color:#8A5D10}
.note.green{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.note.red{background:var(--danger-bg);border-color:var(--danger-border);color:#B42318}

/* 表单 */
.field{margin-bottom:var(--field-gap)}
.field label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11.5px;
  font-weight:620;color:var(--muted);margin-bottom:5px}
.field label .opt{font-weight:500;color:var(--faint);font-size:var(--fs-10);border:1px solid var(--border);
  border-radius:var(--radius-pill);padding:1px 7px}
.inp{width:100%;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);
  height:var(--ctrl-h);padding:0 11px;font-size:12.5px;outline:none;transition:border-color var(--dur-fast) var(--ease-out)}
.inp::placeholder{color:var(--faint)}
.inp:hover:not(:disabled){border-color:var(--faint)}
.inp:focus{border-color:var(--accent)}
.inp:disabled{background:var(--card-2);opacity:.7;cursor:not-allowed}
.inp.err{border-color:var(--danger)}
.inp.mono{font-family:var(--mono);letter-spacing:.14em}
select.inp{padding:0 8px}
.inp-row{display:flex;gap:8px}
.inp-row .inp{flex:1;min-width:0}
.inp-affix{position:relative}
.inp-affix .inp{padding-right:56px}
.affix{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:calc(var(--ctrl-h) - 12px);
  padding:0 8px;border-radius:var(--radius-xs);color:var(--muted);font-size:var(--fs-11);font-weight:620}
.affix:hover{color:var(--accent);background:var(--accent-soft)}
.hint{font-size:10.5px;color:var(--faint);margin:4px 0 0;line-height:1.45}
.err-msg{font-size:11px;color:var(--danger);margin:5px 0 0;line-height:1.45;display:flex;gap:5px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:10px}
.check input{margin:2px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.check.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.rules{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rules li{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--faint)}
.rules li[data-ok="1"]{color:var(--ok)}
.rules .box{width:14px;height:14px;border-radius:var(--radius-xs);border:1px solid currentColor;display:grid;
  place-items:center;font-size:8px;flex:none}

/* 步骤 */
.steps{display:flex;align-items:center;gap:9px;margin-bottom:16px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:7px}
.steps .n{width:21px;height:21px;border-radius:50%;border:1px solid var(--border-strong);display:grid;
  place-items:center;font-size:var(--fs-10);font-family:var(--mono)}
.steps .s[data-on="1"]{color:var(--text);font-weight:620}
.steps .s[data-on="1"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .s[data-done="1"] .n{border-color:var(--ok);color:var(--ok)}
.steps .bar{flex:1;min-width:16px;height:1px;background:var(--border)}

/* Tabs（登录方式） */
.seg-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.seg-tab{flex:1;min-width:0;padding:9px 6px;font-size:12px;font-weight:620;color:var(--faint);
  border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1.3}
.seg-tab:hover:not(:disabled){color:var(--muted)}
.seg-tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.seg-tab:disabled{opacity:.45;cursor:not-allowed}
.seg-tab .lk{font-size:var(--fs-10);color:var(--danger);font-weight:600}

/* 表格 */
.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
table.tbl thead th{text-align:left;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--border);background:var(--card-2);white-space:nowrap}
table.tbl tbody td{padding:10px 12px;border-bottom:1px solid #F0F2F6;vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover td{background:#FAFBFD}
.c-email{font-family:var(--mono);font-size:var(--fs-11);overflow-wrap:anywhere;width:20%}
.c-time{white-space:nowrap;font-family:var(--mono);font-size:10.5px;line-height:1.45;width:100px}
.c-time .t2{color:var(--faint)}
.c-status{min-width:150px}
.col-act{width:96px;text-align:right}
td.col-act{vertical-align:top}
.col-act .actlink{display:block;width:100%;text-align:right;margin-bottom:2px}
.actlink{font-size:var(--fs-11);color:var(--accent);padding:2px 5px;border-radius:5px;font-weight:600;line-height:1.5}
.actlink:hover{background:var(--accent-soft)}
.actlink.danger{color:var(--danger)}
.actlink.danger:hover{background:var(--danger-bg)}
.actlink.off{color:var(--faint);cursor:not-allowed}
.tbl-empty{padding:52px 20px;text-align:center;color:var(--faint)}
.tbl-empty b{display:block;color:var(--muted);font-size:13px;margin-bottom:5px;font-weight:640}
.skel{height:11px;border-radius:5px;background:var(--track);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#fff,transparent);animation:sweep 1.2s var(--ease-in-out) infinite}
@keyframes sweep{100%{transform:translateX(100%)}}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .inp{width:230px;height:var(--ctrl-h-sm)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;background:var(--bg-elev)}
.seg button{padding:0 10px;height:var(--ctrl-h-sm);font-size:var(--fs-11);color:var(--muted);
  border-right:1px solid var(--border);font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* 设置行 */
.rows{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:16px;padding:16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-k{font-size:11.5px;color:var(--muted);font-weight:620;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.row-v{font-size:13px;overflow-wrap:anywhere}
.row-act{flex:none}

/* C-07 地址 / 哈希 */
.hash{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--hash-text);
  background:var(--hash-bg);border:1px solid var(--hash-border);border-radius:var(--radius-xs);padding:3px 8px;max-width:100%}
.hash .val{overflow-wrap:anywhere}
.hash .ico{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--accent);
  font-size:var(--fs-11);flex:none}
.hash .ico:hover{background:var(--accent-soft)}

/* C-08 常驻补全提示条 */
.cbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--radius-sm);font-size:12px;color:#8A5D10;margin-bottom:16px}
.cbar .ic{width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;
  font-size:var(--fs-11);font-weight:700;flex:none}
.cbar p{margin:0;flex:1;line-height:1.5}
.cbar-mini{position:fixed;left:258px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;
  background:var(--warn-bg);border:1px solid var(--warn-border);color:#8A5D10;border-radius:var(--radius-pill);
  padding:7px 13px;font-size:11.5px;font-weight:620;box-shadow:var(--shadow)}

/* 统计卡（落地页） */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 18px}
.stat .lbl{font-size:var(--fs-11);font-weight:640;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:6px}
.stat .val{font-family:var(--mono);font-size:15px;font-weight:640;overflow-wrap:anywhere}

/* 引导卡 */
.guide{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.guide.pri{border-color:var(--accent-border);background:linear-gradient(180deg,var(--accent-soft),transparent)}
.guide .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;
  font-size:var(--fs-11);font-family:var(--mono);color:var(--muted);flex:none}
.guide.pri .n{background:var(--accent);border-color:var(--accent);color:#fff}
.guide .bd{flex:1;min-width:0}
.guide .bd p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}

/* ============================== 弹层与抽屉 =============================== */
.mask{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:24px;z-index:200;
  animation:fade var(--dur-base) var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);animation:rise var(--dur-base) var(--ease-out);max-height:100%;display:flex;flex-direction:column}
.modal.wide{max-width:560px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h b{flex:1;font-size:13.5px;font-weight:660}
.modal-x{width:26px;height:26px;border-radius:var(--radius-xs);color:var(--faint);display:grid;place-items:center;flex:none}
.modal-x:hover{color:var(--text);background:var(--card-hover)}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);
  background:var(--card-2);border-radius:0 0 var(--radius) var(--radius)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--bg-elev);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:210;display:flex;flex-direction:column;
  animation:slide var(--dur-base) var(--ease-out)}
@keyframes slide{from{transform:translateX(16px);opacity:.4}to{transform:translateX(0);opacity:1}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-h b{flex:1;font-size:13.5px;font-weight:660}
.drawer-b{flex:1;overflow:auto;padding:16px}
.drawer-scrim{position:fixed;inset:0;background:rgba(16,24,40,.18);z-index:205}

/* ---- PRD 面板：给前端开发看的规格，紫色系，与产品界面明确区分 ---- */
.prd .drawer-h{background:var(--violet-bg);border-bottom-color:var(--violet-border)}
.prd .drawer-h b{color:var(--violet)}
.prd .drawer-b{background:var(--card-2)}
.prd-src{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-bottom:14px;line-height:1.5;
  border-left:2px solid var(--violet-border);padding-left:9px}
.prd-sec{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);margin-bottom:10px;overflow:hidden}
.prd-sec>summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:12px;font-weight:640;color:var(--text);
  display:flex;align-items:center;gap:8px;background:var(--card)}
.prd-sec>summary::-webkit-details-marker{display:none}
.prd-sec>summary:hover{background:var(--card-hover)}
.prd-sec>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.prd-sec>summary .caret{color:var(--violet);font-size:10px;transition:transform var(--dur-fast) var(--ease-out)}
.prd-sec[open]>summary .caret{transform:rotate(90deg)}
.prd-sec .bd{padding:0 13px 12px;border-top:1px solid var(--border-dash)}
.prd-item{padding:9px 0;border-bottom:1px dashed var(--border-dash);font-size:11.5px;line-height:1.6}
.prd-item:last-child{border-bottom:none}
.prd-item .k{font-family:var(--mono);font-size:10.5px;color:var(--violet);font-weight:640;margin-bottom:2px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prd-item .k .meta{color:var(--faint);font-weight:400}
.prd-item .v{color:var(--muted)}
.prd-item .v b{color:var(--text);font-weight:620}
.prd-item .v code,.prd-ac code.mono{font-size:10.5px;background:var(--gray-bg);border:1px solid var(--gray-border);
  border-radius:4px;padding:0 4px;color:var(--gray-fg)}
.prd-ac span b{color:var(--text);font-weight:620}
.prd-copy{display:grid;grid-template-columns:1fr;gap:3px;padding:8px 0;border-bottom:1px dashed var(--border-dash);font-size:11.5px}
.prd-copy:last-child{border-bottom:none}
.prd-copy .sc{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.prd-copy .en{color:var(--text)}
.prd-copy .zh{color:var(--muted)}
.prd-ac{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--border-dash);font-size:11.5px;line-height:1.55}
.prd-ac:last-child{border-bottom:none}
.prd-ac code{font-family:var(--mono);font-size:10.5px;color:var(--violet);background:var(--violet-bg);
  border:1px solid var(--violet-border);border-radius:5px;padding:1px 5px;flex:none;height:fit-content}
.prd-foot{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:14px;border-top:1px solid var(--border);padding-top:10px}

/* ---- 原型控制抽屉（端切换 / 页面直达 / 演示分支）---- */
.pp-sec{font-size:var(--fs-10);font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 7px}
.pp-sec:first-child{margin-top:0}
.pp-grid{display:flex;flex-wrap:wrap;gap:6px}
.pp-item{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);padding:5px 0;line-height:1.45}
.pp-item input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.pp-link{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:6px 9px;border-radius:var(--radius-xs);
  font-size:12px;color:var(--muted)}
.pp-link:hover{background:var(--card-hover);color:var(--text)}
.pp-link[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:620}
.pp-link code{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;width:44px}
.pp-link[aria-current="true"] code{color:var(--accent)}
.pp-note{font-size:10.5px;color:var(--faint);line-height:1.6;background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:9px 11px;margin-bottom:4px}

/* ============================== C-01 滑块 ================================ */
.cap-canvas{position:relative;width:328px;margin:0 auto;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--card-2)}
.cap-canvas canvas{display:block;width:328px;height:180px}
.cap-piece{position:absolute;top:0;left:0;will-change:transform}
.cap-track{margin:14px auto 0;width:328px;height:42px;border-radius:var(--radius-pill);background:var(--card-2);
  border:1px solid var(--border-strong);position:relative;display:flex;align-items:center;user-select:none;touch-action:none}
.cap-track.ok{border-color:var(--ok-border);background:var(--ok-bg)}
.cap-track.bad{border-color:var(--danger-border);background:var(--danger-bg)}
.cap-track.cool{opacity:.6}
.cap-track .tip{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-11);color:var(--faint);
  pointer-events:none}
.cap-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--accent-soft)}
.cap-knob{position:absolute;left:0;top:0;height:40px;width:48px;border-radius:var(--radius-pill);background:var(--bg-elev);

  font-family:var(--mono);font-size:13px;box-shadow:var(--shadow)}
.cap-knob:active{cursor:grabbing}
.cap-knob.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
.cap-knob[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.cap-msg{margin-top:10px;min-height:17px;font-size:var(--fs-11);line-height:1.5;text-align:center;color:var(--faint)}
.cap-msg.bad{color:var(--danger)}
.cap-msg.ok{color:var(--ok)}

/* ============================== C-06 钱包 ================================ */
.wallets{display:flex;flex-direction:column;gap:8px}
.wallet{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-elev);text-align:left;width:100%;
  transition:border-color var(--dur-fast) var(--ease-out)}
.wallet:hover{border-color:var(--accent);background:var(--accent-soft)}
.wallet .av{width:30px;height:30px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);

.wallet b{display:block;font-size:12.5px;font-weight:620}
.wallet span{display:block;font-size:var(--fs-10);color:var(--faint)}
.sigmsg{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);
  max-height:150px;overflow:auto}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--accent);
  animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================== C-05 Toast =============================== */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;
  gap:8px;width:min(520px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--bg-elev);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:12px;
  line-height:1.5;animation:drop var(--dur-base) var(--ease-out)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.toast.danger{border-color:var(--danger-border);background:var(--danger-bg)}
.toast.success{border-color:var(--ok-border);background:var(--ok-bg)}
.toast .tx{flex:1}
.toast .tx b{display:block;font-weight:640;margin-bottom:2px;color:var(--text)}
.toast .tx span{color:var(--muted);font-size:var(--fs-11)}
.toast .cl{color:var(--faint);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
.toast .cl:hover{color:var(--text)}

/* 建号确认 */
.created{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px}
.created .ring{width:68px;height:68px;border-radius:50%;border:1px solid var(--ok-border);background:var(--ok-bg);
  display:grid;place-items:center;color:var(--ok);font-size:28px;animation:pop var(--dur-slow) var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.created h1{font-size:var(--fs-24);font-weight:700;margin:18px 0 0;letter-spacing:-.01em}
.created .idbox{margin-top:18px;display:inline-flex;flex-direction:column;gap:3px;align-items:center;
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 18px;background:var(--card-2)}
.created .idbox span{font-size:var(--fs-10);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.created .idbox b{font-family:var(--mono);font-size:15px;font-weight:640}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
@media (max-width:1100px){
  .app{grid-template-columns:200px 1fr}
  .cbar-mini{left:220px}
  .split{grid-template-columns:1fr}
}

    c.beginPath(); c.roundRect?c.roundRect(x,y,w,hh,10):c.rect(x,y,w,hh); c.fill();
  }
  for(i=0;i<5;i++){
    c.globalAlpha=0.2+rnd()*0.2;
    c.strokeStyle="hsl("+((hue+i*47)%360)+",68%,35%)"; c.lineWidth=1+rnd()*2;
    c.beginPath(); c.moveTo(rnd()*W,rnd()*H); c.lineTo(rnd()*W,rnd()*H); c.lineTo(rnd()*W,rnd()*H); c.stroke();
  }
  c.globalAlpha=1;
}
/* reset=true 归零滑块（新挑战 / 失败换图）；否则保留位移，避免后台重渲染打断拖拽 */
function drawCaptcha(reset){
  var bg=q("#capBg"), pc=q("#capPiece"); if(!bg||!pc||!S.cap) return;
  var rnd=mulberry32(S.cap.seed);
  var off=document.createElement("canvas"); off.width=CAP_W; off.height=CAP_H;
  paintScene(off.getContext("2d"),CAP_W,CAP_H,rnd);
  var tx=Math.floor(96+rnd()*(CAP_W-96-CAP_PS-14));
  var ty=Math.floor(18+rnd()*(CAP_H-18-CAP_PS-18));
  S.cap.answer=tx; S.cap.ty=ty;
  bg.width=CAP_W; bg.height=CAP_H; pc.width=CAP_W; pc.height=CAP_H;
  var b=bg.getContext("2d"); b.clearRect(0,0,CAP_W,CAP_H); b.drawImage(off,0,0);
  b.save(); piecePath(b,tx,ty,CAP_PS); b.fillStyle="rgba(16,24,40,.55)"; b.fill();
  b.strokeStyle="rgba(255,255,255,.75)"; b.lineWidth=1.5; b.stroke(); b.restore();
  var p=pc.getContext("2d"); p.clearRect(0,0,CAP_W,CAP_H);
  p.save(); piecePath(p,0,ty,CAP_PS); p.clip(); p.drawImage(off,-tx,0); p.restore();
  p.save(); piecePath(p,0,ty,CAP_PS); p.strokeStyle="rgba(255,255,255,.9)"; p.lineWidth=1.5; p.stroke(); p.restore();
  setCapDrag(reset?0:(S.cap.d||0));
}
function setCapDrag(d){
  S.cap.d=d;
  var pc=q("#capPiece"), kb=q("#capKnob"), fl=q("#capFill");
  if(pc) pc.style.transform="translateX("+d+"px)";
  if(kb) kb.style.transform="translateX("+d+"px)";
  if(fl) fl.style.width=(d+48)+"px";
}
function openCaptcha(purposeKey,onPass){
  S.cap={seed:(S.seed=(S.seed*7919+13)%100000), d:0, answer:0, ty:0, state:"idle",
         msg:"", msgKind:"tip", purpose:purposeKey, onPass:onPass};
  S.modal={type:"captcha"}; render(); drawCaptcha(true);
}
function capVerify(){
  if(S.cap.state!=="idle") return;
  S.cap.state="checking"; renderCapMsg();
  later(420,function(){
    var pass=Math.abs(S.cap.d-S.cap.answer)<=6 && !S.flags.capFail;
    if(pass){
      S.capFails=0; S.cap.state="ok"; S.cap.msg=t("capVerified"); S.cap.msgKind="ok";
      var tr=q("#capTrack"); if(tr) tr.classList.add("ok");
      renderCapMsg();
      later(400,function(){ var cb=S.cap.onPass; S.modal=null; S.cap=null; render(); if(cb) cb(); });
    } else {
      S.capFails++; S.cap.state="idle";
      S.cap.msg = S.capFails>=5 ? "" : (S.capFails>=3 ? t("capTrouble") : t("capFail"));
      S.cap.msgKind = S.capFails>=3 ? "tip" : "bad";
      var tk=q("#capTrack"), kn=q("#capKnob");
      if(tk){ tk.classList.add("bad"); later(400,function(){ tk.classList.remove("bad"); }); }
      if(kn){ kn.classList.add("shake"); later(340,function(){ kn.classList.remove("shake"); }); }
      if(S.capFails>=5) S.capCoolUntil=now()+60000;
      later(360,function(){
        if(!S.cap) return;
        S.cap.seed=(S.seed=(S.seed*7919+13)%100000);
        drawCaptcha(true); renderCapMsg(); render();
      });
    }
  });
}
function renderCapMsg(){
  var m=q("#capMsg"); if(!m||!S.cap) return;
  /* 冷却期内固定展示倒计时文案，避免刚进入冷却的那一秒消息区空白 */
  if(S.capCoolUntil>now()){
    m.textContent=t("capCool",{n:Math.max(0,Math.ceil((S.capCoolUntil-now())/1000))});
    m.className="cap-msg bad"; return;
  }
  m.textContent = S.cap.state==="checking" ? "…" : S.cap.msg;
  m.className = "cap-msg "+S.cap.msgKind;
}

/* ------------------------------- 计时器 ---------------------------------- */
setInterval(function(){
  var dirty=false,k;
  for(k in S.cool){ if(S.cool[k]>0){ S.cool[k]--; dirty=true; } }
  qa("[data-tick]").forEach(function(n){
    var sp=n.getAttribute("data-tick").split(":");
    if(sp[0]==="cool"){
      var left=S.cool[sp[1]]||0;
      n.textContent = left>0 ? t("resendIn",{n:left}) : (n.getAttribute("data-sent")==="1"?t("resendCode"):t("sendCode"));
      if(left<=0) n.removeAttribute("disabled"); else n.setAttribute("disabled","");
    } else if(sp[0]==="lock"){
      var l=Math.max(0,Math.ceil((S.lockUntil-now())/1000));
      n.textContent=t("lockAgain",{m:mm(l),s:ss(l)});
      if(l<=0){ S.fail=0; render(); }
    } else if(sp[0]==="alock"){
      var la=Math.max(0,Math.ceil((S.admin.lockUntil-now())/1000));
      n.textContent=t("lockAgain",{m:mm(la),s:ss(la)});
      if(la<=0){ S.admin.fail=0; render(); }
    } else if(sp[0]==="capcool"){
      var c=Math.max(0,Math.ceil((S.capCoolUntil-now())/1000));
      n.textContent=t("capCool",{n:c});
      if(c<=0) render();
    } else if(sp[0]==="mlock"){
      var row=S.admin.list[+sp[1]];
      if(row&&row.lockLeft>0){ row.lockLeft--; n.textContent=t("stLockedD",{t:mm(row.lockLeft)+"m "+ss(row.lockLeft)+"s"}); }
    }
  });
  if(dirty && !qa('[data-tick^="cool"]').length) render();
},1000);

  return '<tr><th>'+t("admColEmail")+'</th><th>'+t("admColName")+'</th><th>'+t("admColStatus")+'</th><th>'+t("admColCreated")+'</th><th>'+t("admColLast")+'</th><th class="col-act">'+t("admColAct")+'</th></tr>';
}
function admRow(r,idx,avail){
  var isMe=r.email===DEMO_ME, statusHtml;
  if(r.st==="active") statusHtml=stCell("green",t("stActive"),"");
  else if(r.st==="pending") statusHtml=stCell("amber",t("stPendingS"),t("stPendingD",{t:fmtTime(r.expires)}));
  else if(r.st==="pendingExpired") statusHtml=stCell("red",t("stPendingS"),t("stPendingExpired"));
  else if(r.st==="locked") statusHtml=stCell("red",t("stLockedS"),'<span data-tick="mlock:'+idx+'">'+t("stLockedD",{t:mm(r.lockLeft||0)+"m "+ss(r.lockLeft||0)+"s"})+'</span>');
  else statusHtml=stCell("gray",t("stDisabled"),"");

  var counts=(r.st==="active"||r.st==="pending"||r.st==="locked");
  var lastGuard=counts && avail<=1;
  /* 两条约束同时命中时优先展示「最后一个可用管理员」（PRD 7.9.2 / AC-169） */
  var block = lastGuard ? t("admLastTip") : (isMe ? t("eSelfAction") : "");
  var acts=[];
  /* 操作列用短动词，完整操作名（如「重新生成初始密码」）挂在 title 上，避免列宽被文案撑爆 */
  if(r.st==="disabled") acts.push(actBtn(t("admActRestore"),"admRestore",idx,"",false));
  else {
    acts.push(actBtn(t("admActDisable"),"admDisable",idx,block,true));
    acts.push(actBtn(t("admActDelete"),"admDisable",idx,block,true));
  }
  if(r.st==="locked") acts.push(actBtn(t("admActUnlock"),"admUnlock",idx,"",false));
  if(r.st==="pending"||r.st==="pendingExpired")
    acts.push(actBtn(t("admActRegenShort"),"admRegen",idx,isMe?t("eSelfAction"):"",false,t("admActRegen")));

  return '<tr><td class="c-email">'+esc(r.email)+(isMe?' <span class="pill gray">'+(S.lang==="en"?"You":"我")+'</span>':'')+'</td>'
   + '<td class="nw">'+esc(r.name)+'</td><td class="c-status">'+statusHtml+'</td>'
   + '<td class="c-time">'+fmtCell(r.created)+'</td><td class="c-time">'+fmtCell(r.last)+'</td>'
   + '<td class="col-act">'+acts.join("")+'</td></tr>';
}
function stCell(cls,label,detail){
  return '<span class="pill '+cls+'">'+label+'</span>'+(detail?'<div class="tiny" style="margin-top:3px">'+detail+'</div>':'');
}
/* 被拦住的操作置灰但仍可点：点击后给出可读原因，而不是静默无反应 */
function actBtn(label,act,idx,block,danger,title){
  if(block) return '<button class="actlink off" type="button" data-act="admBlocked" data-m="'+esc(block)+'" title="'+esc(block)+'">'+label+'</button>';
  return '<button class="actlink'+(danger?" danger":"")+'" type="button" data-act="'+act+'" data-i="'+idx+'"'
    + (title?' title="'+esc(title)+'"':'')+'>'+label+'</button>';
}

  } else {
    q("#focus").innerHTML="";
    q("#brandSub").textContent = S.end==="admin" ? t("adminConsole") : t("endAsset");
    q("#nav").innerHTML = renderNav();
    q("#sideFoot").innerHTML = renderSideFoot();
    q("#crumb").innerHTML = '<span>'+(S.end==="admin"?t("adminConsole"):t("endAsset"))
      + ' / </span><b>'+esc(pageName(S.page))+'</b> <span class="mono faint" style="font-size:10px">'+S.page+'</span>';
    q("#topRight").innerHTML = renderTopRight();
    q("#content").innerHTML = renderContent();
  }
  q("#layers").innerHTML = renderToasts() + renderModal() + renderDrawer();

  if(focusKey){
    var n=q('[data-f="'+focusKey+'"]');
    if(n){ n.focus(); try{ if(selStart!=null&&n.setSelectionRange) n.setSelectionRange(selStart,selStart); }catch(e){} }
  }
  if(S.modal&&S.modal.type==="captcha"){ drawCaptcha(false); renderCapMsg(); }
}
function renderToasts(){
  if(!S.toasts.length) return "";
  return '<div class="toasts" role="region" aria-live="polite">'+S.toasts.map(function(x){
    return '<div class="toast '+x.kind+'"><span class="ico">'+(x.kind==="danger"?"!":"✓")+'</span>'
      + '<div class="tx"><b>'+esc(x.title)+'</b>'+(x.body?'<span>'+esc(x.body)+'</span>':'')
      + (x.link?'<div style="margin-top:3px"><a href="#" data-act="go" data-v="P-A03">'+esc(x.link)+'</a></div>':'')+'</div>'
      + '<button class="cl" type="button" data-act="toastClose" data-i="'+x.id+'" aria-label="'+t("close")+'">✕</button></div>';
  }).join("")+'</div>';
}

/* ================================ 交互 =================================== */
function loginAccount(via,email,wallet,created){
  S.acct={email:email||null, wallet:wallet||null, hasPwd:(email===DEMO_EMAIL_PWD), createdVia:via,
          status:(email&&wallet)?"active":"incomplete"};
  S.justCreated=!!created; S.fail=0; S.lockUntil=0;
  postLogin();
}
function postLogin(){
  if(S.flags.disabled){ S.err.loginTop=t("eDisabled"); S.acct=null; S.page="P-A01"; render(); return; }
  if(S.flags.reconsent){ S.modal={type:"reconsent",scrolled:false}; render(); return; }
  S.page = S.justCreated ? "CREATED" : "LAND";
  S.modal=null; render();
}
function countFail(kind){
  S.fail++;
  if(S.fail>=5){ S.lockUntil=now()+30*60*1000; S.err.loginPwd=t("lockJust",{m:30}); S.login.tab="code"; }
  else if(S.fail>=3) S.err[kind==="sig"?"loginEmail":"loginPwd"]=kind==="sig"?t("lockSigLeft",{n:5-S.fail}):t("lockPwdLeft",{n:5-S.fail});
  else S.err[kind==="sig"?"loginEmail":"loginPwd"]=kind==="sig"?t("eSigFailed"):t("ePwdLogin");
  render();
}
function walletOpen(purpose,after){
  if(S.flags.sdkFail){ S.wallet={stage:"error",err:t("eWalletSvc"),purpose:purpose,after:after}; S.modal={type:"wallet"}; render(); return; }
  if(S.flags.noWallet){ S.wallet={stage:"error",err:t("eNoWallet"),purpose:purpose,after:after}; S.modal={type:"wallet"}; render(); return; }
  S.wallet={stage:"pick",purpose:purpose,after:after}; S.modal={type:"wallet"}; render();
}
function walletConnect(){
  S.wallet.stage="connecting"; render();
  later(700,function(){
    if(S.flags.wrongNet){ S.wallet.stage="error"; S.wallet.err=t("eNetwork"); render(); return; }
    S.wallet.addr = S.flags.walletNew ? DEMO_ADDR_NEW : DEMO_ADDR_BOUND;
    S.wallet.stage="sign"; render();
  });
}
function walletSign(){
  S.wallet.stage="signing"; render();
  later(800,function(){
    if(S.flags.sigReject){ S.wallet.stage="error"; S.wallet.err=t("eSigRejected"); render(); return; }
    S.wallet.stage="verifying"; render();
    later(700,function(){
      if(S.flags.sigFail){
        S.wallet.stage="error"; S.wallet.err=t("eSigFailed");
        S.wallet.errSub = S.fail>=2 ? t("lockSigLeft",{n:Math.max(0,4-S.fail)}) : "";
        S.fail++;
        if(S.fail>=5){ S.lockUntil=now()+30*60*1000; S.modal=null; S.wallet=null; S.login.tab="code";
          S.page="P-A01"; S.err.loginPwd=t("lockJust",{m:30}); render(); return; }
        render(); return;
      }
      var cb=S.wallet.after, addr=S.wallet.addr;
      S.modal=null; S.wallet=null; render();
      if(cb) cb(addr);
    });
  });
}
function finishFlow(kind){
  var a=S.acct;
  if(kind==="email"){
    var had=!!a.email, ne=(S.form.newEmail||S.form.gateEmail||"new@demo-mail.test");
    a.email=ne;
    if(had){ endSession("sEmailChanged",ne,true); toast("success",t("okEmailUpdated"),t("sAllDevices")); }
    else afterFirstBind(t("okEmailAdded"));
  } else if(kind==="pwd"){
    var hadP=a.hasPwd, em=a.email; a.hasPwd=true;
    endSession("sPwdChanged",em,true);
    toast("success",hadP?t("okPwdUpdated"):t("okPwdSet"),t("sAllDevices"));
  } else {
    var hadW=!!a.wallet, em2=a.email; a.wallet=DEMO_ADDR_NEW;
    if(hadW){ endSession("sWalletChanged",em2,true); toast("success",t("okWalletUpdated"),t("sAllDevices")); }
    else afterFirstBind(t("okWalletLinked"));
  }
}
/* PRD 12.1.1 例外：首次绑定（从无到有）不触发会话失效 */
function afterFirstBind(msg){
  S.acct.status=(S.acct.email&&S.acct.wallet)?"active":"incomplete";
  S.flow=null; S.form={}; S.err={}; S.page="P-A11"; render();
  toast("success",msg,S.acct.status==="active"?t("allSet"):"");
}
function validPwdPair(a,b){
  var p=S.form[a]||"", p2=S.form[b]||"";
  S.err={};
  if(/\s/.test(p)){ S.err[a]=t("ePwdSpace"); render(); return false; }
  var okL=pwdOkLen(p), okC=pwdOkCplx(p);
  if(!okL&&!okC){ S.err[a]=t("ePwdBoth"); render(); return false; }
  if(!okL){ S.err[a]=t("ePwdLen"); render(); return false; }
  if(!okC){ S.err[a]=t("ePwdCplx"); render(); return false; }
  if(p!==p2){ S.err[b]=t("ePwdMatch"); render(); return false; }
  if(p===DEMO_PASSWORD){ S.err[a]=t("ePwdSameCurrent"); render(); return false; }  /* 服务端比对结果（演示） */
  return true;
}
function doLogin(){
  S.err={};
  /* IP 层风控命中后，登录提交同样先过滑块（PRD 12.2.2），文案不解释触发原因 */
  if(S.flags.ipRisk && !S.ipRiskPassed){
    openCaptcha("purposeSignIn",function(){ S.ipRiskPassed=true; doLogin(); });
    return;
  }
  S.ipRiskPassed=false;
  if(!S.login.agree){
    S.err.agree=t("eTerms"); S.err._shake=true; render();
    later(400,function(){ S.err._shake=false; render(); }); return;
  }
  var email=(S.form.loginEmail||"").trim();
  if(S.login.tab==="code"){
    if(!isEmail(email)){ S.err.loginEmail=t("eEmailFmt"); render(); return; }
    var code=S.form.logincode||"";
    if(!/^\d{6}$/.test(code)){ S.err.loginCode=t("eCodeReq"); render(); return; }
    if(code==="000000"){
      S.codeTries++;
      if(S.codeTries>=5){ S.codeTries=0; S.form["_sent_login"]=false; S.form.logincode="";
        S.err.loginCode=t("eCodeTooMany"); render(); return; }
      S.err.loginCode=t("eCodeBad"); render(); return;
    }
    S.codeTries=0;
    var known=S.flags.knownEmail||email===DEMO_EMAIL_PWD||email===DEMO_EMAIL_NOPWD;
    if(known) loginAccount("email_code",email,(email===DEMO_EMAIL_PWD?DEMO_ADDR_BOUND:null),false);
    else loginAccount("email_code",email,null,true);       /* 首次登录即建号 */
    return;
  }
  if(S.login.tab==="pwd"){
    if(!isEmail(email)){ S.err.loginEmail=t("eEmailFmt"); render(); return; }
    if(!S.form.loginPwd){ S.err.loginPwd=t("ePwdReq"); render(); return; }
    if(email===DEMO_EMAIL_PWD && S.form.loginPwd===DEMO_PASSWORD){
      loginAccount("email_code",email,DEMO_ADDR_BOUND,false); return;
    }
    countFail("pwd"); return;    /* 三种失败情形返回完全一致的提示 */
  }
}
function handleWalletEntry(purpose){
  if(S.page==="P-A05"){
    walletOpen("purposeRecovery",function(addr){
      if(addr===DEMO_ADDR_NEW){ S.err.rcWallet=true; render(); return; }   /* 恢复入口不建号 */
      S.err={}; S.page="P-A06"; render();
    });
    return;
  }
  if(S.page==="P-A01"){
    if(!S.login.agree){ S.err.agree=t("eTerms"); S.err._shake=true; render();
      later(400,function(){ S.err._shake=false; render(); }); return; }
    walletOpen("purposeSignIn",function(addr){
      if(addr===DEMO_ADDR_NEW) loginAccount("wallet",null,addr,true);      /* 未绑定地址 → 建号 */
      else loginAccount("wallet",DEMO_EMAIL_PWD,addr,false);
    });
    return;
  }
  if(S.modal&&S.modal.type==="gate"){
    walletOpen("purposeLink",function(addr){
      S.acct.wallet=addr; S.acct.status=(S.acct.email&&S.acct.wallet)?"active":"incomplete"; render();
    });
    return;
  }
  if(S.flow){
    var f=S.flow;
    if(f.step===0){ walletOpen("purposeReauth",function(){ f.step=1; S.err={}; render(); toast("success",t("reauthOk")); }); return; }
    if(f.id==="P-A14"&&f.step===1){ walletOpen("purposeUnlink",function(){ f.step=2; render(); }); return; }
    if(f.id==="P-A14"){ walletOpen("purposeLink",function(){ finishFlow("wallet"); }); return; }
  }
  walletOpen(purpose||"purposeSignIn",function(){ render(); });
}
function startFlow(id){
  if(!S.acct) S.acct={email:DEMO_EMAIL_PWD,wallet:null,hasPwd:true,createdVia:"email_code",status:"incomplete"};
  S.flow={id:id,step:0,factor:null}; S.form={}; S.err={}; S.page=id; render();
}
function doAdminLogin(){
  S.err={};
  if(!isEmail(S.form.admEmail)){ S.err.admEmail=t("eEmailFmt"); render(); return; }
  if(!S.form.admPwd){ S.err.admPwd=t("ePwdReq"); render(); return; }
  if(S.form.admPwd!==DEMO_PASSWORD){
    S.admin.fail++;
    if(S.admin.fail>=5){ S.admin.lockUntil=now()+30*60*1000; S.err.admPwd=t("lockJust",{m:30}); }
    else if(S.admin.fail>=3) S.err.admPwd=t("lockPwdLeft",{n:5-S.admin.fail});
    else S.err.admPwd=t("ePwdLoginAdmin");
    render(); return;
  }
  S.admin.session=true; S.form={}; S.err={};
  S.page = S.admin.mustReset ? "P-M02" : "P-M06";
  render();
}
function admCreateSubmit(){
  if(!isEmail(S.form.acEmail)){ S.err.acEmail=t("eEmailFmt"); render(); return; }
  if(!S.form.acName){ S.err.acName=t("eEmailReq"); render(); return; }
  S.admin.listState="submitting"; render();
  later(900,function(){
    if(S.flags.serverReject){ S.admin.listState="submitfail"; render(); return; }
    var exp=new Date(Date.now()+7*86400000).toISOString();
    S.admin.list.push({email:S.form.acEmail,name:S.form.acName,st:"pending",
                       created:new Date().toISOString(),last:null,expires:exp});
    S.admin.listState="default";
    S.modal={type:"admCreated",pwd:"Dq7m2xR4vT",expires:exp};   /* 演示用初始密码 */
    render();
  });
}
function admConfirm(idx,kind){
  var r=S.admin.list[idx]; if(!r) return;
  if(kind==="disable")
    S.modal={type:"admConfirm",idx:idx,title:t("admConfirmDisable"),body:t("admConfirmDisableBody",{email:r.email}),
             confirmAct:"admDoDisable",danger:true};
  else
    S.modal={type:"admConfirm",idx:idx,title:t("admUnlockTitle"),body:t("admUnlockBody",{email:r.email}),confirmAct:"admDoUnlock"};
  render();
}
function admDo(idx,kind){
  var r=S.admin.list[idx]; if(!r) return;
  if(kind==="disable"){
    S.modal.busy=true; render();
    later(700,function(){
      /* 服务端是唯一防线：即便前端未置灰，服务端也会拒绝（PRD 7.9.1 / AC-162） */
      var after=S.admin.list.filter(function(x,j){ return j!==idx&&(x.st==="active"||x.st==="pending"||x.st==="locked"); }).length;
      if(S.flags.serverReject||after===0){ S.modal.busy=false; S.modal.error=t("eLastAdmin"); render(); return; }
      r.st="disabled"; S.modal=null; render(); toast("success",t("stDisabled")+" · "+r.email);
    });
    return;
  }
  if(kind==="unlock"){
    S.modal.busy=true; render();
    later(600,function(){ r.st="active"; r.lockLeft=0; S.modal=null; render(); toast("success",t("unlocked")); });
    return;
  }
  if(kind==="restore"){ r.st="active"; render(); toast("success",t("stActive")+" · "+r.email); return; }
  if(kind==="regen"){
    var exp=new Date(Date.now()+7*86400000).toISOString();
    r.st="pending"; r.expires=exp; S.modal={type:"admCreated",pwd:"Kf9t3nQ8wZ",expires:exp}; render();
  }
}
function switchEnd(end){
  S.end=end; S.drawer=null; S.modal=null; S.err={}; S.form={};
  if(end==="admin") S.page = S.admin.session ? "P-M06" : "P-M01";
  else S.page = S.acct ? "LAND" : "P-A01";
  render();
}

/* -------------------------- 事件：点击（委托） --------------------------- */
document.addEventListener("click",function(e){
  var node=e.target.closest("[data-act]"); if(!node) return;
  var act=node.getAttribute("data-act"), v=node.getAttribute("data-v"), i=node.getAttribute("data-i");
  if(node.classList.contains("mask")&&e.target!==node) return;   /* 点遮罩才关闭 */
  if(node.tagName==="A"&&node.getAttribute("href")&&node.getAttribute("href")!=="#") return;
  e.preventDefault();

  switch(act){
    case "lang": S.lang=v; render(); break;
    case "openPrd": S.drawer = S.drawer==="prd"?null:"prd"; render(); break;
    case "openProto": S.drawer = S.drawer==="proto"?null:"proto"; render(); break;
    case "closeDrawer": S.drawer=null; render(); break;
    case "switchEnd": switchEnd(v); break;
    case "resetProto": var lg=S.lang; initState(); S.lang=lg; render(); break;

    case "go":
      S.err={}; S.modal=null; S.wallet=null; S.cap=null; S.drawer=null;
      if(v==="P-A07"){ S.lockUntil=now()+30*60*1000; S.fail=5; S.page="P-A01"; S.login.tab="code"; render(); break; }
      if(["P-A10","LAND","P-A11","P-A15"].indexOf(v)>=0 && !S.acct)
        S.acct={email:DEMO_EMAIL_PWD,wallet:null,hasPwd:true,createdVia:"email_code",status:"incomplete"};
      if(["P-A12","P-A13","P-A14"].indexOf(v)>=0){ startFlow(v); break; }
      if(["P-M06","P-M05"].indexOf(v)>=0) S.admin.session=true;
      if(v==="P-M02") S.admin.mustReset=true;
      S.page=v; S.flow=null; render(); break;

    case "tab": S.login.tab=v; S.err={}; render(); break;
    case "toCodeTab": S.login.tab="code"; S.err={}; render(); break;
    case "toggleShow": S.form["_show_"+node.getAttribute("data-k")]=!S.form["_show_"+node.getAttribute("data-k")]; render(); break;
    case "toastClose": S.toasts=S.toasts.filter(function(x){return x.id!=i;}); render(); break;
    case "foldbar": S.barFolded=!S.barFolded; render(); break;
    case "signout": endSession("sOtherDevice",S.acct?S.acct.email:""); break;

    case "sendcode":
      var k=node.getAttribute("data-k"); S.form["_sent_"+k]=true;
      pressSendCode(k,node.getAttribute("data-p")); break;

    case "capClose": S.modal=null; S.cap=null; render(); break;
    case "capReload": S.flags.capLoadFail=false; render(); drawCaptcha(true); break;
    case "capRefresh":
      if(S.capCoolUntil>now()) break;
      S.cap.seed=(S.seed=(S.seed*7919+13)%100000); S.cap.msg=""; drawCaptcha(true); renderCapMsg(); break;

    case "loginSubmit": doLogin(); break;
    case "walletConnect": handleWalletEntry(node.getAttribute("data-p")); break;
    case "walletPick": walletConnect(); break;
    case "walletSign": walletSign(); break;
    case "walletRetry": S.wallet.stage="pick"; S.wallet.err=""; render(); break;
    case "walletClose": S.modal=null; S.wallet=null; render(); break;

    case "reconsentAgree":
      if(!S.modal.scrolled) break;
      S.modal=null; S.page=S.justCreated?"CREATED":"LAND"; render(); break;
    case "reconsentOut": S.acct=null; S.modal=null; S.page="P-A01"; render(); break;

    case "fpNext":
      if(!isEmail(S.form.fpEmail)){ S.err.fpEmail=t("eEmailFmt"); render(); break; }
      if(!/^\d{6}$/.test(S.form.fpcode||"")){ S.err.fpCode=t("eCodeReq"); render(); break; }
      if(S.form.fpcode==="000000"){ S.err.fpCode=t("eCodeBad"); render(); break; }
      S.err={}; S.page="P-A04"; render(); break;
    case "fpSubmit":
      if(!validPwdPair("fpPwd","fpPwd2")) break;
      S.page="P-A01"; S.form={}; S.err={}; S.fail=0; S.lockUntil=0; render();
      toast("success",t("okPwdReset"),t("sAllDevices")); break;

    case "rcSubmit":
      if(!isEmail(S.form.rcEmail)){ S.err.rcEmail=t("eEmailFmt"); render(); break; }
      if(!/^\d{6}$/.test(S.form.rccode||"")){ S.err.rcCode=t("eCodeReq"); render(); break; }
      S.page="P-A01"; S.form={}; S.err={}; S.fail=0; S.lockUntil=0; render();
      toast("success",t("okRecovered"),t("sAllDevices")); break;

    case "guideLinkWallet": walletOpen("purposeLink",function(addr){ S.acct.wallet=addr; afterFirstBind(t("okWalletLinked")); }); break;
    case "guideAddEmail": startFlow("P-A12"); break;
    case "guideSetPwd": startFlow("P-A13"); break;

    case "startFlow": startFlow(v); break;
    case "pickFactor": S.flow.factor=v||null; S.err={}; render(); break;
    case "reauthSubmit":
      if(S.flow.factor==="pwd"){
        if((S.form.reauthPwd||"")!==DEMO_PASSWORD){ S.err.reauthPwd=t("ePwdLogin"); countFail("pwd"); break; }
      } else if(S.flow.factor==="code"){
        if(!/^\d{6}$/.test(S.form.reauthcode||"")){ S.err.reauthCode=t("eCodeReq"); render(); break; }
      }
      S.flow.step=1; S.err={}; render(); toast("success",t("reauthOk")); break;
    case "flowNext": S.flow.step=2; S.err={}; render(); break;
    case "flowAltFactor": S.flow.factor="pwdcode"; S.flow.step=2; render(); break;
    case "flowSubmit":
      if(S.flow.id==="P-A12"){
        if(!isEmail(S.form.newEmail)){ S.err.newEmail=t("eEmailFmt"); render(); break; }
        if(!/^\d{6}$/.test(S.form.newEmailcode||"")){ S.err.newEmailCode=t("eCodeReq"); render(); break; }
        finishFlow("email");
      } else if(S.flow.id==="P-A13"){
        if(!validPwdPair("np","np2")) break;
        finishFlow("pwd");
      }
      break;

    case "startKyc":
      var a2=S.acct||{}; S.modal={type:"gate",total:((!a2.email?1:0)+(!a2.wallet?1:0))||1}; render(); break;
    case "gateClose": S.modal=null; render(); break;
    case "gateContinue": S.modal=null; render(); toast("success",t("allSet"),"WS-303"); break;
    case "gateEmailSubmit":
      if(!isEmail(S.form.gateEmail)){ S.err.gateEmail=t("eEmailFmt"); render(); break; }
      if(!/^\d{6}$/.test(S.form.gatecode||"")){ S.err.gateCode=t("eCodeReq"); render(); break; }
      S.acct.email=S.form.gateEmail; S.acct.status=(S.acct.email&&S.acct.wallet)?"active":"incomplete";
      S.err={}; render(); break;

    case "copyaddr":
      try{ navigator.clipboard&&navigator.clipboard.writeText(v); }catch(err){}
      toast("success",t("addrCopied")); break;
    case "docClose": S.modal=null; render(); break;

    case "adminLogin": doAdminLogin(); break;
    case "adminSignout": endAdminSession("sOtherDevice"); break;
    case "adminResetSubmit":
      if(!S.form.ack){ S.err.ack=t("eAdminNotice"); render(); break; }
      if(!validPwdPair("mrNew","mrNew2")) break;
      if((S.form.mrNew||"")===(S.form.mrOld||"")){ S.err.mrNew=t("ePwdSameInitial"); render(); break; }
      S.admin.mustReset=false; S.admin.session=false; S.page="P-M01"; S.form={}; S.err={}; render();
      toast("success",t("okPwdReset"),t("sAllDevices")); break;
    case "mfNext":
      if(!isEmail(S.form.mfEmail)){ S.err.mfEmail=t("eEmailFmt"); render(); break; }
      if(!/^\d{6}$/.test(S.form.mfcode||"")){ S.err.mfCode=t("eCodeReq"); render(); break; }
      S.page="P-M04"; S.err={}; render(); break;
    case "mfSubmit":
      if(!validPwdPair("mfPwd","mfPwd2")) break;
      S.page="P-M01"; S.form={}; S.err={}; S.admin.fail=0; S.admin.lockUntil=0; render();
      toast("success",t("okPwdReset"),t("sAllDevices")); break;
    case "apSubmit":
      if(!validPwdPair("apNew","apNew2")) break;
      if((S.form.apNew||"")===(S.form.apOld||"")){ S.err.apNew=t("ePwdSameCurrent"); render(); break; }
      endAdminSession("sPwdChanged"); toast("success",t("okPwdUpdated"),t("sAllDevices")); break;
    case "admState": S.admin.listState=v; if(v==="submitting"||v==="submitfail") S.modal={type:"admCreate"}; render(); break;
    case "admFilter": S.admin.filter=v; render(); break;
    case "admRetry": S.admin.listState="loading"; render(); later(900,function(){ S.admin.listState="default"; render(); }); break;
    case "admCreateOpen": S.admin.listState="default"; S.modal={type:"admCreate"}; S.form.acEmail=""; S.form.acName=""; render(); break;
    case "admClose": S.modal=null; S.admin.listState="default"; render(); break;
    case "admCreateSubmit": admCreateSubmit(); break;
    case "admCreatedDone": S.modal=null; render(); break;
    case "admDisable": admConfirm(+i,"disable"); break;
    case "admRestore": admDo(+i,"restore"); break;
    case "admUnlock": admConfirm(+i,"unlock"); break;
    case "admRegen": admDo(+i,"regen"); break;
    case "admDoDisable": admDo(+i,"disable"); break;
    case "admDoUnlock": admDo(+i,"unlock"); break;
    case "admBlocked": toast("danger",node.getAttribute("data-m")); break;

    case "quotaKind": S.flags.quotaKind=node.getAttribute("data-qk"); render(); break;
    case "demoFail": countFail("pwd"); break;
    case "demoLock": S.fail=5; S.lockUntil=now()+30*60*1000; S.login.tab="code"; S.page="P-A01"; S.drawer=null; render(); break;
    case "demoUnlock": S.fail=0; S.lockUntil=0; render(); toast("success",t("unlocked")); break;
    case "demoKick": S.drawer=null; endSession(v,S.acct?S.acct.email:""); break;
    case "demoMustReset": S.admin.mustReset=true; S.admin.session=false; S.page="P-M01"; S.drawer=null; render(); break;
    case "demoAdmExtend": S.admin.session=true; S.page="P-M06"; S.drawer=null; S.modal={type:"admExtend"}; render(); break;
  }
});

/* 协议链接：弹层打开，不打断表单 */
document.addEventListener("click",function(e){
  var a=e.target.closest("a[data-doc]"); if(!a) return;
  e.preventDefault(); S.modal={type:"doc",doc:a.getAttribute("data-doc")}; render();
});
/* C-03 正文滚动到底才可同意 */
document.addEventListener("scroll",function(e){
  var box=e.target;
  if(box&&box.id==="tosBox"&&S.modal&&S.modal.type==="reconsent"&&!S.modal.scrolled){
    if(box.scrollTop+box.clientHeight>=box.scrollHeight-6){ S.modal.scrolled=true; render(); }
  }
},true);

/* ------------------------------ 输入事件 --------------------------------- */
document.addEventListener("input",function(e){
  var n=e.target.closest("[data-f]"); if(!n) return;
  var k=n.getAttribute("data-f");
  if(n.type==="checkbox"){
    if(k==="agree"){ S.login.agree=n.checked; S.err.agree=""; S.err._shake=false; render(); return; }
    S.form[k]=n.checked; render(); return;
  }
  if(k==="tz"){ S.tz=n.value; render(); return; }
  if(k==="admQ"){ S.admin.q=n.value; render(); return; }
  S.form[k]=n.value;
  if(/^(fpPwd|np|mrNew|mfPwd|apNew)$/.test(k)) render();
});
document.addEventListener("change",function(e){
  var n=e.target.closest("[data-flag]");
  if(n){
    var fk=n.getAttribute("data-flag");
    S.flags[fk]=n.checked;
    if(fk==="lastAdmin") S.admin.list = n.checked ? lastAdminSeed() : adminSeed();
    render(); return;
  }
  var s=e.target.closest('select[data-f]');
  if(s&&s.getAttribute("data-f")==="tz"){ S.tz=s.value; render(); }
});

/* 滑块拖拽与键盘 */
var dragging=false, dragStart=0, dragBase=0;
document.addEventListener("pointerdown",function(e){
  var kn=e.target.closest("#capKnob"); if(!kn||!S.cap) return;
  if(S.capCoolUntil>now()) return;
  dragging=true; dragStart=e.clientX; dragBase=S.cap.d;
  kn.setPointerCapture&&kn.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",function(e){
  if(!dragging||!S.cap) return;
  setCapDrag(Math.max(0,Math.min(CAP_W-48,dragBase+(e.clientX-dragStart))));
});
document.addEventListener("pointerup",function(){ if(!dragging) return; dragging=false; if(S.cap) capVerify(); });
document.addEventListener("keydown",function(e){
  if(!S.cap||!document.activeElement||document.activeElement.id!=="capKnob") return;
  if(S.capCoolUntil>now()) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault();
    var step=e.shiftKey?10:2;
    setCapDrag(Math.max(0,Math.min(CAP_W-48,S.cap.d+(e.key==="ArrowRight"?step:-step))));
  } else if(e.key==="Enter"){ e.preventDefault(); capVerify(); }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(S.drawer){ S.drawer=null; render(); return; }
  if(S.modal&&S.modal.type!=="reconsent"){ S.modal=null; S.cap=null; S.wallet=null; render(); }
});

/* -------------------------------- 初始化 --------------------------------- */
DICT.en.capHelpNote="A security check appears before any code is sent.";
DICT.zh.capHelpNote="点击发送验证码后会先弹出滑块人机校验。";
render();
})();
