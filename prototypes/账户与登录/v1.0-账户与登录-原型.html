/* ---- 账户与登录专有：滑块校验 / 钱包 / 建号引导 / 建号完成 / 锁定态 / 补全提示条 ---- */
.locked{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 8px 6px}
.lock-ring{width:56px;height:56px;border-radius:50%;background:var(--danger-bg);border:1px solid var(--danger-border);
  color:var(--danger);display:grid;place-items:center}
.lock-time{font-size:34px;font-weight:660;letter-spacing:-.02em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.entries{display:flex;flex-wrap:wrap;gap:8px 18px;margin:-4px 0 14px}
.cbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--radius-sm);font-size:12px;color:#8A5D10;margin-bottom:16px}
.cbar .ic{width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;
  font-size:var(--fs-11);font-weight:700;flex:none}
.cbar p{margin:0;flex:1;line-height:1.5}
.cbar-mini{position:fixed;left:258px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;
  background:var(--warn-bg);border:1px solid var(--warn-border);color:#8A5D10;border-radius:var(--radius-pill);
  padding:7px 13px;font-size:11.5px;font-weight:620;box-shadow:var(--shadow)}
.guide{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.guide.pri{border-color:var(--accent-border);background:linear-gradient(180deg,var(--accent-soft),transparent)}
.guide .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;
  font-size:var(--fs-11);font-family:var(--mono);color:var(--muted);flex:none}
.guide.pri .n{background:var(--accent);border-color:var(--accent);color:#fff}
.guide .bd{flex:1;min-width:0}
.guide .bd p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.cap-canvas{position:relative;width:328px;margin:0 auto;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--card-2)}
.cap-canvas canvas{display:block;width:328px;height:180px}
.cap-piece{position:absolute;top:0;left:0;will-change:transform}
.cap-track{margin:14px auto 0;width:328px;height:42px;border-radius:var(--radius-pill);background:var(--card-2);
  border:1px solid var(--border-strong);position:relative;display:flex;align-items:center;user-select:none;touch-action:none}
.cap-track.ok{border-color:var(--ok-border);background:var(--ok-bg)}
.cap-track.bad{border-color:var(--danger-border);background:var(--danger-bg)}
.cap-track.cool{opacity:.6}
.cap-track .tip{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-11);color:var(--faint);
  pointer-events:none}
.cap-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--accent-soft)}
.cap-knob{position:absolute;left:0;top:0;height:40px;width:48px;border-radius:var(--radius-pill);background:var(--bg-elev);
  border:1px solid var(--border-strong);display:grid;place-items:center;cursor:grab;color:var(--accent);
  font-family:var(--mono);font-size:13px;box-shadow:var(--shadow)}
.cap-knob:active{cursor:grabbing}
.cap-knob.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
.cap-knob[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.cap-msg{margin-top:10px;min-height:17px;font-size:var(--fs-11);line-height:1.5;text-align:center;color:var(--faint)}
.cap-msg.bad{color:var(--danger)}
.cap-msg.ok{color:var(--ok)}
.wallets{display:flex;flex-direction:column;gap:8px}
.wallet{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-elev);text-align:left;width:100%;
  transition:border-color var(--dur-fast) var(--ease-out)}
.wallet:hover{border-color:var(--accent);background:var(--accent-soft)}
.wallet .av{width:30px;height:30px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);
  display:grid;place-items:center;font-family:var(--mono);font-size:var(--fs-11);color:var(--muted);flex:none}
.wallet b{display:block;font-size:12.5px;font-weight:620}
.wallet span{display:block;font-size:var(--fs-10);color:var(--faint)}
.sigmsg{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);
  max-height:150px;overflow:auto}
.created{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px}
.created .ring{width:68px;height:68px;border-radius:50%;border:1px solid var(--ok-border);background:var(--ok-bg);
  display:grid;place-items:center;color:var(--ok);font-size:28px;animation:pop var(--dur-slow) var(--ease-out)}
.created h1{font-size:var(--fs-24);font-weight:700;margin:18px 0 0;letter-spacing:-.01em}
.created .idbox{margin-top:18px;display:inline-flex;flex-direction:column;gap:3px;align-items:center;
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 18px;background:var(--card-2)}
.created .idbox span{font-size:var(--fs-10);color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.created .idbox b{font-family:var(--mono);font-size:15px;font-weight:640}
@media (max-width:1100px){
  .cbar-mini{left:220px}
}

/* 滑块背景图：运行时生成，不引用任何外部图片 */
function drawCaptcha(){
  var bg=q("#capBg"), pc=q("#capPiece"); if(!bg||!pc) return;
  var W=328,H=180,PS=46,tx=133,ty=58,i,x,y,w,h,seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  var off=document.createElement("canvas"); off.width=W; off.height=H;
  var o=off.getContext("2d"), hue=212, g=o.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"hsl("+hue+",58%,74%)"); g.addColorStop(1,"hsl("+((hue+52)%360)+",52%,58%)");
  o.fillStyle=g; o.fillRect(0,0,W,H);
  for(i=0;i<9;i++){
    o.globalAlpha=0.12+rnd()*0.2; o.fillStyle="hsl("+((hue+i*26)%360)+",62%,"+(52+rnd()*32)+"%)";
    x=rnd()*W; y=rnd()*H; w=24+rnd()*140; h=10+rnd()*90;
    o.beginPath(); o.roundRect?o.roundRect(x,y,w,h,10):o.rect(x,y,w,h); o.fill();
  }
  o.globalAlpha=1;
  function path(c,px,py){
    var rr=6,k=PS*0.22;
    c.beginPath(); c.moveTo(px+rr,py); c.lineTo(px+PS*0.42,py);
    c.arc(px+PS*0.5,py,k,Math.PI,0,true);
    c.lineTo(px+PS-rr,py); c.quadraticCurveTo(px+PS,py,px+PS,py+rr);
    c.lineTo(px+PS,py+PS*0.38); c.arc(px+PS,py+PS*0.5,k,-Math.PI/2,Math.PI/2,false);
    c.lineTo(px+PS,py+PS-rr); c.quadraticCurveTo(px+PS,py+PS,px+PS-rr,py+PS);
    c.lineTo(px+rr,py+PS); c.quadraticCurveTo(px,py+PS,px,py+PS-rr);
    c.lineTo(px,py+rr); c.quadraticCurveTo(px,py,px+rr,py); c.closePath();
  }
  var b=bg.getContext("2d"); b.clearRect(0,0,W,H); b.drawImage(off,0,0);
  b.save(); path(b,tx,ty); b.fillStyle="rgba(16,24,40,.55)"; b.fill();
  b.strokeStyle="rgba(255,255,255,.75)"; b.lineWidth=1.5; b.stroke(); b.restore();
  var p=pc.getContext("2d"); p.clearRect(0,0,W,H);
  p.save(); path(p,0,ty); p.clip(); p.drawImage(off,-tx,0); p.restore();
  p.save(); path(p,0,ty); p.strokeStyle="rgba(255,255,255,.9)"; p.lineWidth=1.5; p.stroke(); p.restore();
}

/* ================================ 交互 =================================== */
/* 模块自己的动作；返回 true 表示已处理，shell 不再接管。
   公共动作（menu / lang / openPrd / closeDrawer / toastClose / Esc）都在 shell 里。 */
function onAct(n,a,v,e){
  if(n.classList.contains("mask")&&e.target!==n) return true;
  if(n.tagName==="A"&&n.getAttribute("href")&&n.getAttribute("href")!=="#") return true;
  if(MINE.indexOf(a)<0) return false;
  e.preventDefault();
  if(S.menu) S.menu=null;
  switch(a){
    case "go": go(v,n.getAttribute("data-st")||""); break;
    case "st": setState(v); break;
    case "tab": S.loginTab=v; S.err={}; render(); break;
    case "show": S.form["_show_"+n.getAttribute("data-k")]=!S.form["_show_"+n.getAttribute("data-k")]; render(); break;
    case "anchor":
      var el=document.getElementById(v);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      break;
    case "openPages": S.drawer=S.drawer==="pages"?null:"pages"; render(); break;
    case "close": S.modal=null; render(); break;

    case "captcha": S.modal={type:"captcha",view:"idle"}; render(); break;
    case "capView": S.modal.view=v; render(); break;
    case "capPass": S.modal=null; markSent(); break;

    case "wallet": S.modal={type:"wallet",view:"pick",purpose:n.getAttribute("data-p")}; render(); break;
    case "wView": S.modal.view=v; render(); break;
    case "wToast": toast(v==="tLinked"||v==="tNetworkOk"?"success":v==="tSignPrompt"?"info":"danger",t(v)); break;
    case "wSign": walletSigned(); break;
    case "walletLink": S.modal={type:"wallet",view:"pick",purpose:"purposeLink"}; render(); break;

    case "login": doLogin(); break;
    case "later": go("P-A17"); toast("info",L("Landed by verification status.","已按认证状态落地。")); break;
    case "kyc": S.modal={type:"gate",need:(S.st==="noemail"?"email":(S.st==="complete"?"":"wallet"))}; render(); break;
    case "gateView": S.modal.need=v; render(); break;

    case "emailDlg": S.modal={type:"email",step:0,factor:null,add:(S.page==="P-A10"&&S.st==="wallet")}; render(); break;
    case "pwdDlg": S.modal={type:"pwd",step:0,factor:null,set:(S.page!=="P-M05"&&S.st!=="complete")}; render(); break;
    case "mStep": S.modal.step=+v; S.err={}; render(); break;
    case "mFactor": S.modal.factor=v||null; S.err={}; render(); break;
    case "done": submitDone(v); break;
    case "copy": toast("success",t("addrCopied")); break;
  }
  return true;
}
document.addEventListener("click",function(e){
  var a=e.target.closest("a[data-doc]"); if(!a) return;
  e.preventDefault(); S.modal={type:"doc",doc:a.getAttribute("data-doc")}; render();
});
document.addEventListener("input",function(e){
  var n=e.target.closest("[data-f]"); if(!n) return;
  var k=n.getAttribute("data-f");
  if(n.type==="checkbox"){
    if(k==="agree"){ S.agree=n.checked; S.err.agree=""; S.err._shake=false; } else S.form[k]=n.checked;
    render(); return;
  }
  S.form[k]=n.value;
  if(/^(pwNew|dNew|mrNew|mfNew)$/.test(k)) render();     /* 密码规则清单实时反馈 */
});
document.addEventListener("change",function(e){
  var s=e.target.closest('select[data-f]'); if(!s) return;
  var k=s.getAttribute("data-f");
  if(k==="tz"){ S.tz=s.value; render(); toast("success",t("okPrefsSaved")); }
  if(k==="lang"){ S.lang=s.value; render(); toast("success",t("okPrefsSaved")); }
});

/* ------------------------------ 具体动作 --------------------------------- */
function markSent(){
  if(S.page==="P-A01"||S.page==="P-A03"||S.page==="P-M03") S.st="sent";
  render(); toast("success",t("codeSent"));
}
function walletSigned(){
  S.modal=null;
  if(S.page==="P-A01"){ toast("success",t("tLinked")); go("P-A10"); S.st="wallet"; render(); return; }
  toast("success",t("tLinked")); render();
}
function doLogin(){
  S.err={};
  if(!S.agree){ S.err.agree=t("eTerms"); S.err._shake=true; render(); return; }
  var email=(S.form.loginEmail||"").trim();
  if(!isEmail(email)){ S.err.loginEmail=t("eEmailFmt"); render(); return; }
  if(S.loginTab==="code"){
    if(!/^\d{6}$/.test(S.form.logincode||"")){ S.err.loginCode=t("eCodeReq"); render(); return; }
    go("P-A10"); return;                       /* 首次登录即建号 → 直接进引导页 */
  }
  S.err.loginPwd=t("ePwdLogin"); render();     /* 三种失败情形返回完全一致的提示 */
}
function submitDone(key){
  var admin=S.end==="admin";
  if(key==="okEmailAdded"){ S.modal=null; render(); toast("success",t(key)); return; }  /* 首次绑定不失效会话 */
  go(admin?"P-M01":"P-A01");
  toast("success",t(key),t("sAllDevices"));
}
