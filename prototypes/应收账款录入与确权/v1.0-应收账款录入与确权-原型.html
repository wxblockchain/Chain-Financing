.ar-table thead .col-act{background:var(--card-2)}

.ar-money{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ar-contracts{display:flex;gap:var(--sp-1);align-items:center;flex-wrap:wrap}
.ar-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:4px 8px;border:1px solid var(--accent-border);border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent-strong);font-family:var(--mono);font-size:var(--fs-11)}
.ar-chip button{width:18px;height:18px;border-radius:50%;color:var(--accent);display:grid;place-items:center}
.ar-chip button:hover{background:var(--bg-elev)}
.ar-chipbox{border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-elev);padding:8px;min-height:var(--ctrl-h);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-chipbox:focus-within{border-color:var(--accent)}
.ar-chipbox input{border:0;outline:0;min-width:190px;flex:1;background:transparent;height:28px}
.ar-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr);gap:var(--sp-4);align-items:start}
.ar-stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.ar-inline{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.ar-reason{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--danger);padding-left:var(--sp-3);color:var(--text)}
.ar-actions{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-actions .off{font-size:var(--fs-11);color:var(--faint)}
.ar-command .card-b{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-command .btn{flex:1;min-width:110px}
.ar-state-note{margin-bottom:var(--sp-4)}
.ar-buyer{width:100%;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;background:var(--card)}
.ar-buyer:hover{background:var(--card-hover)}
.ar-buyer .bd{flex:1}.ar-buyer b{display:block}.ar-buyer span{display:block;color:var(--muted);font-size:var(--fs-11);margin-top:2px}
.ar-files{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-3)}
.ar-no-preview{font-size:var(--fs-10);color:var(--faint);white-space:nowrap}
.ar-modal-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.ar-status-help{font-size:var(--fs-11);color:var(--muted);line-height:1.55}
@media (max-width:1180px){.ar-layout{grid-template-columns:1fr}}
</style>

function submitForm(){var e=formErrors(S.form);if(Object.keys(e).length){S.showErrors=true;S.st="validation";render();return;}var hits=S.form.st==="rejected"?[]:S.form.contracts.filter(function(x){return BLOCKED.indexOf(norm(x))>=0;});if(hits.length){S.modal={type:"duplicate",values:hits};render();return;}S.st="submitting";render();setTimeout(function(){var f=clone(S.form);f.id=f.id||"a-new";f.no=f.no||"AR20260908000099";f.st="pending";f.side="seller";f.count=(f.count||0)+1;f.updated="2026-09-08 09:30 (UTC+8)";var old=S.data.findIndex(function(x){return x.id===f.id;});if(old>=0)S.data[old]=f;else S.data.unshift(f);S.rid=f.id;S.modal=null;toast("success",t("submittedOk"));go("P-A22");},420);}

  if(a==="retry"){S.st="default";render();return true;}

  if(a==="search"){S.st=visible(S.page==="P-A23"?"buyer":"seller",S.page==="P-M40").length?"default":"nomatch";render();return true;}
  if(a==="sort"){if(S.f.currency==="all")return true;S.sortAmount=S.sortAmount===1?-1:1;render();return true;}

  if(a==="view"){S.rid=v;go(S.page==="P-M40"?"P-M41":S.page==="P-A23"?"P-A24":"P-A22");return true;}
  if(a==="pickBuyer"){S.modal={type:"buyer"};S.buyerSearch="";render();return true;}
  if(a==="chooseBuyer"){var b=BUYERS.filter(function(x){return x.id===v;})[0];S.form.buyer=b.name;S.form.buyerId=b.id;S.modal=null;render();return true;}
  if(a==="closeModal"){S.modal=null;render();return true;}
  if(a==="addContract"){addContract();return true;}if(a==="removeContract"){S.form.contracts.splice(Number(v),1);render();return true;}
  if(a==="demoDup"){if(!S.form.contracts.some(function(x){return norm(x)==="HT2026001";}))S.form.contracts.push("HT-2026/001");render();return true;}
  if(a==="upload"){if(S.form.files.length>=20){toast("danger",t("fileLimit"));return true;}S.form.files.push(file("demo-material-"+(S.form.files.length+1)+".pdf","PDF","1.2 MB"));render();return true;}
  if(a==="removeFile"){S.form.files.splice(Number(v),1);render();return true;}
  if(a==="previewFile"){toast("info",t("filePreview"));return true;}if(a==="downloadFile"){toast("success",t("fileDownload"));return true;}
  if(a==="saveDraft"){var f=clone(S.form);f.id=f.id||"a-new-draft";f.no=f.no||"AR20260908000100";f.st="draft";f.side="seller";f.updated="2026-09-08 09:30 (UTC+8)";var ix=S.data.findIndex(function(x){return x.id===f.id;});if(ix>=0)S.data[ix]=f;else S.data.unshift(f);toast("success",t("saved"));go("P-A20");return true;}
  if(a==="submitForm"){submitForm();return true;}
  if(a==="askDelete"){var r=byId(v);S.rid=v;S.modal={type:"delete",no:r.no};render();return true;}
  if(a==="confirmDelete"){var fromDetail=S.page==="P-A22";S.data=S.data.filter(function(x){return x.id!==S.rid;});S.modal=null;toast("success",t("deleted"));if(fromDetail)go("P-A20");else render();return true;}
  if(a==="askConfirm"){S.modal={type:"confirm"};render();return true;}if(a==="askReject"){S.modal={type:"reject"};S.rejectReason="";S.rejectError=false;S.needFocus=true;render();return true;}
  if(a==="confirmApprove"){var r=byId(S.rid);r.st="confirmed";r.updated="2026-09-08 09:31 (UTC+8)";S.modal=null;toast("success",t("approved"));render();return true;}
  if(a==="confirmReject"){if(!S.rejectReason.trim()){S.rejectError=true;S.needFocus=true;render();return true;}var rr=byId(S.rid);rr.st="rejected";rr.reason=S.rejectReason;rr.updated="2026-09-08 09:31 (UTC+8)";S.modal=null;toast("success",t("rejected"));render();return true;}
  return false;
}
