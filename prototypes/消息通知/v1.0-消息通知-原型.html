/* ---- 列表页脚：加载更多 / 加载更多失败条（资产端） ---- */
.lm{display:flex;justify-content:center;padding:14px var(--card-pad);border-top:1px solid var(--border)}
.lm-err{display:flex;align-items:center;gap:12px;justify-content:center;padding:11px var(--card-pad);
  border-top:1px solid var(--border);background:var(--danger-bg);color:#B42318;font-size:11.5px;flex-wrap:wrap}
/* ---- 消息详情（P-A19 / P-M21）---- */
.dmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0 0;font-size:11.5px;color:var(--faint)}
.dmeta .sep{color:var(--border-strong)}
.dbody{font-size:13px;line-height:1.75;color:var(--text);white-space:pre-line;overflow-wrap:anywhere;margin:0}
.dfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;
  border-top:1px solid var(--border-dash)}
/* ---- 进度区块（详情页，C-22 进度型的详情形态）---- */
.prog{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);
  padding:13px 15px;margin-bottom:16px}
.prog .rw{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.prog .rw+.rw{margin-top:7px}
.prog .nd{font-weight:640;color:var(--text)}
/* ---- 演示控制条内的分段控件间距（.demobar 本身来自 base.css）---- */
.dm-grp{display:flex;align-items:center;gap:7px}

  if (m.biz && !reg) { S.pre = "missing"; return; }           /* 7.6.3：映射缺失 */
  if (m.exp) { S.pre = "expired"; return; }                   /* 已过期：不渲染按钮 */
  if (!m.biz && m.page) { S.pre = "ok"; return; }             /* 形态 2：静态页面不预检 */
  if (!reg.pre) { S.pre = "ok"; return; }
  S.pre = "pending";
  timer = setTimeout(function(){
    timer = null;
    /* 预检接口本身失败：放行跳转（AC-N36） */
    S.pre = (!m.pre || m.pre === "fail") ? "ok" : m.pre;
    S.preFailed = m.pre === "fail";
    render();
  }, 620);
}

function itemOf(m, compact){

           timeText:(compact && over) ? CF.fmtDate(m.at) : rel,
           timeTitle:fmtTime(m.at), unread:!m.read, expired:!!m.exp,

function pageList(){

/* ============================== P-A19 / P-M21 详情 ======================== */
function invalidNote(m){
  if (m.exp) return note("", t("invExpired"));
  if (S.pre === "resource_deleted") return note("", t("invDeleted"));
  if (S.pre === "state_changed")
    return note("", m.preStatus ? t("invChangedSt", { status:nm(m.preStatus) }) : t("invChanged"));
  if (S.pre === "no_permission") return note("", t("invNoPerm"));
  return "";
}
function ctaBlock(m){
  var reg = m.biz ? BIZ[m.biz] : null;
  var label = t(reg ? reg.cta : "ctaDefault");
  /* 没有跳转的消息一律只留「返回列表」，不加任何说明文案——用户 2026-09-08 裁定，
     覆盖 PRD 7.6.3「映射缺失展示说明文案」这一条；7.6.4 的无跳转形态本来就不给文案。
     映射缺失仍然按 AC-N33 上报一次「未知业务类型」事件，只是界面上不出现。 */
  if (S.pre === "none") return "";
  if (S.pre === "missing") return "";
  /* 已过期：不渲染跳转按钮（7.7 第 1 类） */
  if (S.pre === "expired") return "";
  if (S.pre === "pending")
    return '<button class="btn primary" type="button" disabled><span class="spinner"></span>'
      + t("checking") + "</button>";
  if (S.pre === "resource_deleted" || S.pre === "state_changed" || S.pre === "no_permission")
    return '<button class="btn primary" type="button" disabled title="' + esc(t("ctaOff")) + '">'
      + esc(label) + "</button>";
  /* 可跳转：静态页面目标与业务资源目标都由前端解析路由，消息实体内不存 URL */
  var target = reg ? reg.page : m.page;
  var href = target ? crossHref(target) : null;
  if (href) return '<a class="btn primary" href="' + esc(href) + '">' + esc(label) + "</a>";
  if (target) return '<button class="btn primary" type="button" data-act="go" data-v="' + target + '">'
    + esc(label) + "</button>";
  /* 目标页不在本仓库（WS-303 审核台）：如实说明，不造一个假页面 */
  return '<button class="btn primary" type="button" data-act="jumpDemo">' + esc(label) + "</button>";
}
/* 目标页在别的原型文件里时给出相对地址，与侧栏跨文件跳转同一套规则 */
function crossHref(id){
  var mod = CF.MODULES[CF.OWNER[id]];
  if (!mod || CF.OWNER[id] === "notify") return null;
  return "../" + mod.dir + "/" + mod.file + (CF.ENTRY[id] || "#/" + id.toLowerCase());
}
function pageDetail(){
  var m = byId(S.msgId);
  if (S.st === "notfound" || !m || m.end !== S.end)
    return pageHead(t("nTitle"), "", prdBtn())
      + '<div class="card"><div class="card-b shell">' + ICO.info + "<p>" + t("notFound") + "</p>"

      + "</div></div>";
  if (S.st === "loading" || S.detail === "loading")
    return pageHead(t("nTitle"), "", prdBtn())
      + '<div class="card"><div class="card-b">' + skelRows(3) + "</div></div>";
  if (S.st === "error" || S.detail === "error")
    return pageHead(t("nTitle"), "", prdBtn())
      + '<div class="card"><div class="card-b">'
      + note("red", L("The notification could not be loaded, so it was not marked as read.",
                      "本条消息未能加载，因此没有被标记为已读。"), t("detailFail"), "alert")
      + '<div class="dfoot">'
      + '<button class="btn primary" type="button" data-act="retryDetail">' + L("Retry", "重试") + "</button>"
      + '<button class="btn" type="button" data-act="back">' + t("backList") + "</button></div></div></div>";

  /* 标题即页面标题（长标题换行不截断）；分类、时间、业务编号在卡片内的元信息行 */
  var head = pageHead(esc(title(m)), "", prdBtn());
  var body = '<div class="card"><div class="card-b">'
    + '<span class="tag">' + esc(catLabel(m.cat)) + "</span>"
    + (m.exp ? ' <span class="pill dash">' + t("expired") + "</span>" : "")
    + '<div class="dmeta"><span>' + esc(t("detailTime", { t:fmtTime(m.at) })) + "</span>"
    + (m.prog && m.prog.no
        ? '<span class="sep">·</span><span class="hash"><span class="val">'
          + esc(t("bizNo", { biz_no:m.prog.no })) + "</span>"
          + '<button class="ico" type="button" data-act="copy" data-v="' + esc(m.prog.no)
          + '" aria-label="' + esc(t("copy")) + '" title="' + esc(t("copy")) + '">' + ICO.copy + "</button></span>"
        : "")
    + "</div>" + gap(16)
    /* 进度区块：仅进度类消息（7.8.3） */
    + (m.prog
        ? '<div class="prog"><div class="rw"><span class="nd">' + esc(nm(m.prog.name)) + "</span>"
          + '<span class="sep">·</span><span>' + esc(t("nodePrefix", { node:nm(m.prog.node) })) + "</span>"
          + '<span class="pill ' + (CF.NODE_PILL[m.prog.st] || "gray") + '">' + esc(nodeLabel(m.prog.st))
          + "</span></div>"
          + (m.prog.i && m.prog.n
              ? '<div class="rw"><span>' + esc(t("stepOf", { i:m.prog.i, n:m.prog.n })) + "</span></div>"
              : "")
          + "</div>"
        : "")
    + invalidNote(m)
    + (invalidNote(m) ? gap(14) : "")
    /* 文案模板缺失时降级为「标题 + 时间」：正文留空，**不加解释文案**——
       「这条消息的模板在当前客户端缺失」是给前端看的，不该出现在用户界面上，
       规格说明留在 PRD 面板与 README 里。 */
    + '<p class="dbody">' + esc(m.degraded ? "" : nm(m.b)) + "</p>"
    + '<div class="dfoot">' + ctaBlock(m)
    + '<button class="btn" type="button" data-act="back">' + t("backList") + "</button></div>"
    + "</div></div>";
  return head + body;
}

/* ============================== 全部已读（F-N11） ========================= */
function modalMarkAll(){

        ? note("", esc(t("markAllFilter", { category:fCat, status:fSt })))
        : note("", L("No filter is active, so every unread notification in your list is included.",

    + "</div></div>";

function doMarkAll(){
  S.busy = true; render();
  timer = setTimeout(function(){
    timer = null; S.busy = false;
    if (S.fail) {                                   /* AC-N29：失败时列表与角标不做任何变更 */
      S.modal = null; render();
      toast("danger", t("markAllFail"));
      return;
    }
    var hit = matched().filter(function(m){ return !m.read; });
    hit.forEach(function(m){ m.read = true; });
    S.keep = [];
    S.modal = null; render();
    toast("success", t("markAllOk", { n:hit.length }));
  }, 620);
}

/* ============================== 事件 ==================================== */
function onAct(n, a, v, e){
  /* 铃铛：每次展开都重新拉一次（7.2），因此在这里接管开合 */
  if (a === "menu" && v === "bell") {
    var opening = S.menu !== "bell";
    S.menu = opening ? "bell" : null;
    if (opening) loadPanel();
    render(); return true;
  }
  if (a === "open") { openDetail(v); return true; }
  if (a === "back" || a === "crumb") { goList(true); return true; }
  if (a === "end") { goEnd(v); return true; }
  if (a === "mark") {                                /* 行内标为已读：就地标记，不进详情 */
    var m = byId(v); if (m && !m.read) { m.read = true; keepVisible(m.id); render(); }
    return true;
  }
  if (a === "fst") { S.f.st = v; S.pg = 1; S.loaded = 20; S.more = null; S.keep = [];
                     render(); syncURL(); return true; }
  if (a === "clearF") { S.f = { cat:"all", st:"all" }; S.pg = 1; S.loaded = 20; S.more = null; S.keep = [];
                        if (S.st === "nomatch") S.st = "default"; render(); syncURL(); return true; }
  if (a === "pg") { S.pg = parseInt(v, 10); render(); syncURL(); window.scrollTo(0, 0); return true; }
  if (a === "more") {
    S.more = "loading"; render();
    timer = setTimeout(function(){
      timer = null;
      if (S.fail) { S.more = "error"; render(); return; }   /* 已加载内容不清空 */
      S.more = null; S.loaded += 20; render(); syncURL();
    }, 520);
    return true;
  }
  if (a === "askAll") { S.modal = { type:"markAll" }; render(); return true; }
  if (a === "doAll") { doMarkAll(); return true; }
  if (a === "retryDetail") { var md = byId(S.msgId); if (md) { beginDetail(md, false); render(); } return true; }
  if (a === "jumpDemo") { toast("info", t(BIZ["review.idv_case.assigned"].cta), t("jumpDemo")); return true; }
  if (a === "copy") {
    if (navigator.clipboard) { try { navigator.clipboard.writeText(v); } catch (err) {} }
    toast("success", t("copyOk")); return true;
  }
  /* ------------------------- 演示控制条 ------------------------- */
  if (a === "dmReset") { S.data = seed(); S.f = { cat:"all", st:"all" }; S.pg = 1; S.loaded = 20; S.keep = [];
                         S.bulk = 0; S.fail = false; S.more = null; goList(false); return true; }
  if (a === "dmNew") {
    S.data.unshift({ id:"m-new-" + S.data.length, end:S.end,
      cat:S.end === "admin" ? "review_todo" : "security",
      page:S.end === "admin" ? "P-M05" : "P-A11", at:new Date().toISOString(), read:false,
      t:{ en:S.end === "admin" ? "New verification case to review" : "Your password was changed",
          zh:S.end === "admin" ? "新的认证审核待办" : "登录密码已修改" },
      b:{ en:S.end === "admin" ? "A new case is waiting for first review."
                               : "Your password was just changed. All devices were signed out.",
          zh:S.end === "admin" ? "有一条新的审核单待初审。" : "你的密码刚刚被修改，所有设备均已退出登录。" } });
    render(); toast("info", t("dmNewToast")); return true;
  }
  if (a === "dmDedupe") {                            /* 9.1.3：命中去重键 → 合并、更新时间、恢复未读 */
    var old = visible().filter(function(x){ return x.read && !x.exp; })[0];
    if (old) { old.read = false; old.at = new Date().toISOString(); }
    render(); toast("info", t("dmDedupeToast"), t("dmDedupeBody")); return true;
  }
  if (a === "dmBulk") { S.bulk = S.bulk > 0 ? 0 : 125; render(); return true; }
  if (a === "dmFail") { S.fail = !S.fail; render(); return true; }
  return false;                                      /* 其余交回 shell */
}

/* 铃铛面板：展开即重新拉取，展示骨架屏；失败态给重试（7.2） */
function loadPanel(){
  S.panel = "loading";
  setTimeout(function(){
    S.panel = S.fail ? "error" : "ready";
    render();
  }, 520);
}

document.addEventListener("change", function(e){
  var n = e.target.closest("[data-f]"); if (!n) return;
  var k = n.getAttribute("data-f");
  if (k === "cat") { S.f.cat = n.value; S.pg = 1; S.loaded = 20; S.more = null; S.keep = [];
                     if (S.st === "nomatch") S.st = "default"; render(); syncURL(); }
  if (k === "size") { S.size = parseInt(n.value, 10); S.pg = 1; render(); syncURL(); }
});

           ["nomatch","No filter match","筛选无结果"],["error","Load failed","首屏加载失败"]],
  "P-A19":[["default","Default","默认"],["loading","Loading","加载中"],["error","Load failed","加载失败可重试"],
           ["notfound","Not available (404)","消息不存在 / 越权 · 404 语义"]],
  "P-M21":[["default","Default","默认"],["loading","Loading","加载中"],["error","Load failed","加载失败可重试"],
           ["notfound","Not available (404)","他人个人消息 · 404 语义"]]
};

/* ============================== 装配 ==================================== */
CF.define({
  id:"notify",
  end:"asset",
  home:"P-A18",
  owns:["P-A18","P-A19","P-M20","P-M21"],
  dict:DICT,
  prd:PRD,
  states:STATES,
  onBoot:function(st){ S = st; },
  state:function(){
    return { f:{ cat:"all", st:"all" }, pg:1, size:20, loaded:20, more:null, keep:[],
             msgId:null, detail:"ready", pre:"idle", preFailed:false, panel:"ready",
             busy:false, fail:false, bulk:0, scrollY:0, restoreY:0, data:seed() };
  },
  content:renderContent,
  modals:{ markAll:modalMarkAll },
  /* 铃铛 C-20 与快捷面板 C-21 的数据源：最近 10 条，不区分已读未读（N-N02） */
  notify:function(){
    return { unread:unreadCount(), phase:S.panel,
             items:visible().slice(0, 10).map(function(m){ return itemOf(m, true); }) };
  },
  notifyOpen:function(id){ openDetail(id); },
  notifyRetry:function(){ loadPanel(); render(); },
  account:function(){
    var admin = isAdmin();
    return { avatar:admin ? "AD" : "CF",
             ident:admin ? "ops.admin@chain-financing.example" : "user@chain-financing.example",
             ok:true, okText:L("Active", "正常"),
             settings:admin ? "P-M05" : "P-A11",
             signOutPage:admin ? "P-M01" : "P-A01" };
  },
  crumbParts:function(){
    return (S.page === "P-A19" || S.page === "P-M21") ? [[t("nTitle"), listPage(), ""]] : [];
  },
  crumbCur:function(){
    if (S.page === "P-A19" || S.page === "P-M21") {
      var m = byId(S.msgId);
      return (S.st === "notfound" || !m) ? t("minTitle") : title(m);
    }
    return null;
  },
  hash:{ build:buildHash, read:readURL },
  prdFoot:function(){
    return '本面板只摘录<b>本页用得到的</b>条目，不是全量 PRD。完整口径以 '
      + '<code class="mono">prd/v1.0-消息通知/</code> 5 个文件（2026-09-08 08:02 版）为准；'
      + '编号体系 F-N01～F-N22 / P-A18～19 / P-M20～21 / C-20～23 / N-N01～06 / AC-N01～88。'
      + '面板固定中文，是给前端开发看的规格说明，不属于产品界面。';
  },
  onGo:function(){ if (timer) { clearTimeout(timer); timer = null; } S.more = null; },
  onSetState:function(k){
    /* 切到某个强制状态时先停掉正在跑的模拟请求，免得它把状态改回去 */
    if (timer) { clearTimeout(timer); timer = null; }
    S.more = null;
    if (k === "default" && (S.page === "P-A19" || S.page === "P-M21")) {
      var m = byId(S.msgId); if (m) beginDetail(m, false);
    }
  },
  afterRender:function(){
    /* AC-N22：从详情返回时恢复进入前的滚动位置，不回到顶部 */
    if (S.restoreY) { var y = S.restoreY; S.restoreY = 0; window.scrollTo(0, y); }
  },
  onAct:onAct
});
CF.boot();
})();
</script>
</body>
</html>
