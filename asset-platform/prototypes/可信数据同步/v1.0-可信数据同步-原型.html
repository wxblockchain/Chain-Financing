/* 演示凭证：链侧的存证结构、哈希算法、链 ID 与回执取值尚未定稿（Q-DS-13），
   这里按资产编号生成稳定的演示值，链 ID 固定为 DEMO-LOCAL——它不在区块浏览器
   映射表内，所以详情页的跳转入口按「未配置」置灰。 */
function demoProof(no,at){
 var k=Number(no.slice(-6)).toString(16);
 while(k.length<8)k="0"+k;
 var rep8=function(x){var o="";for(var i=0;i<8;i++)o+=x;return o;};
 return {hash:"0x"+rep8(k),tx:"0x"+rep8("d"+k.slice(1)),block:21000000+Number(no.slice(-6)),chain:"DEMO-LOCAL",at:at};
}

function nRec(n){return t(n===1?"recordsN1":"recordsN",{n:n});}
function nCount(n){return t(n===1?"countN1":"countN",{n:n});}
function money(amt,cur){return Number(amt).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+cur;}
function byNo(no){return S.data.filter(function(x){return x.no===no;})[0];}
function invByNo(no){return S.inv.filter(function(x){return x.srcId===no;})[0];}
function batchByNo(no){return S.batches.filter(function(x){return x.no===no;})[0];}
function errText(e){
 if(!e)return "";
 if(e.code==="E-DS-02")return t("eDS02",{f:t(e.field==="invoice"?"fInvoice":"fContracts")});
 if(e.code==="E-DS-05")return t("eDS05");
 if(e.code==="E-DS-07")return t("eDS07");
 if(e.code==="E-DS-08")return t("eDS08");
 if(e.code==="E-DS-10")return t("eDS10");
 return t("eDS06");
}

 var shown=v.length>20?v.slice(0,10)+"…"+v.slice(-8):v;

  +'<button class="ico" type="button" data-act="copyHash" data-v="'+esc(v)+'" aria-label="'+esc(label||t("copy"))+'">'+CF.ICO.copy+'</button></span>';
}

function chainPill(a){

function curSums(rows){
 var m={},ks=[];
 rows.forEach(function(r){if(!m[r.cur]){m[r.cur]={n:0,s:0};ks.push(r.cur);}m[r.cur].n++;m[r.cur].s+=Number(r.amt);});
 if(!ks.length)return "";
 ks.sort();
 return '<div class="ds-sums">'+ks.map(function(k){
  return '<div class="stat"><div class="lbl">'+k+'</div><div class="val">'+money(m[k].s,k)+'</div>'
   +'<div class="sub">'+nRec(m[k].n)+'</div></div>';}).join('')+'</div>';
}

function adminRows(){
 var a=S.data.slice();
 if(S.f.sync!=="all")a=a.filter(function(r){return (r.sync||"none")===S.f.sync;});
 if(S.f.chain!=="all")a=a.filter(function(r){return (r.chain||"none")===S.f.chain;});
 if(S.f.cur!=="all")a=a.filter(function(r){return r.cur===S.f.cur;});
 if(S.f.party!=="all")a=a.filter(function(r){return r.partyId===S.f.party;});
 if(S.f.from)a=a.filter(function(r){return r.confirmedAt.slice(0,10)>=S.f.from;});
 if(S.f.to)a=a.filter(function(r){return r.confirmedAt.slice(0,10)<=S.f.to;});
 var q=S.f.kw.trim().toLowerCase();
 if(q)a=a.filter(function(r){
  return [r.no,r.party,(r.proof?r.proof.tx:"")].concat(r.contracts).join(" ").toLowerCase().indexOf(q)>=0;});
 if(S.sortAmount)a.sort(function(x,y){return S.sortAmount*(x.amt-y.amt);});
 else a.sort(function(x,y){return x.confirmedAt<y.confirmedAt?1:-1;});
 return a;
}

  +'<button class="pgbtn" type="button" data-act="'+act+'" data-v="'+(cur+1)+'"'+(cur>=pages?" disabled":"")+'>›</button></div></div>';
}

     +(r.chain==="failed"?'<span class="ds-reason">'+esc(errText(r.chainErr))+'</span>':'')+'</td>'

/* ------------------------------ 校验与推送 ------------------------------ */
/* 推送前校验 V-DS-01～V-DS-06。V-DS-05 钱包必填与 V-DS-06 上链前置都是 2026-09-10
   收紧的硬拦项——本期已经没有「校验但不阻断」的项。 */
function checkAsset(a){
 if(a.stale)return {ok:false,why:t("vStale")};
 if(a.chain!=="chained")return {ok:false,why:t("vNotChained")};
 if(!proofOk(a.proof))return {ok:false,why:t("vProof")};
 if(!a.contracts.length)return {ok:false,why:t("vMissing",{f:t("fContracts")})};
 if(!a.partyOk)return {ok:false,why:t("vParty")};
 if(!walletOk(a.wallet))return {ok:false,why:t("vWallet")};
 if(a.sync==="pushed")return {ok:false,why:t("pushedHint")};
 return {ok:true};
}
function nextBatchNo(){
 var n=S.batches.filter(function(b){return b.type==="push";}).length+1;
 return "PB-20260910-"+("00"+n).slice(-3);
}
function decide(a,i){
 if(invByNo(a.no))return {result:"dup"};
 if(S.scenario==="timeout")return {result:"fail",code:"E-DS-06"};
 if(S.scenario==="down")return {result:"fail",code:"E-DS-05"};
 if(S.scenario==="partial"&&i%3===2)return {result:"fail",code:"E-DS-02",field:"invoice"};
 return {result:"new"};
}
function runPush(nos,kind){
 var at=new Date().toISOString(),batch=nextBatchNo(),items=[];
 nos.forEach(function(no,i){
  var a=byNo(no);if(!a)return;
  var d=decide(a,i);
  items.push({no:a.no,party:a.party,cur:a.cur,amt:a.amt,result:d.result,code:d.code,field:d.field});
  a.lastPushAt=at;a.lastPushBy="demo.admin@demo.test";a.lastBatch=batch;
  if(kind==="repush")a.retries=(a.retries||0)+1;
  if(d.result==="fail"){
   a.sync="failed";a.err={code:d.code,field:d.field};
   /* 回执未知：运营端其实已入库，只是回执丢了（R-DS-02）。再次推送会命中幂等，
      而不是产生第二条记录——这是本期红线在原型里唯一说得清的演示路径。 */
   if(d.code==="E-DS-06"&&!invByNo(a.no))S.inv.unshift(invRecord(a,batch,at));
  }
  else{
   a.sync="pushed";a.err=null;
   if(d.result==="new")S.inv.unshift(invRecord(a,batch,at));
   else{var rec=invByNo(a.no);if(rec)rec.tl.push({k:"dup",at:at,batch:batch});}
  }
 });
 S.batches.unshift({no:batch,type:"push",by:"demo.admin@demo.test",at:at,kind:kind,items:items});
 S.result={batch:batch,items:items,kind:kind};
 return batch;
}
function submit(nos,kind){
 S.pushing=true;render();
 setTimeout(function(){
  runPush(nos,kind);
  S.pushing=false;S.modal=null;S.sel={};S.drawer="result";
  toast("success",t(kind==="repush"?"repushedOk":"pushedOk"));
  render();
 },700);
}

/* ------------------------------ 弹层与抽屉 ------------------------------ */
function modalBox(title,body,foot,wide){
 return '<div class="mask" data-act="closeModal"><div class="modal'+(wide?" wide":"")+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'
  +'<div class="modal-h"><b>'+esc(title)+'</b><button class="modal-x" type="button" data-act="closeModal" aria-label="'+t("close")+'">×</button></div>'
  +'<div class="modal-b">'+body+'</div><div class="modal-f">'+foot+'</div></div></div>';
}
function pushModal(){
 var m=S.modal,ids=m.ids,ok=[],bad=[];
 ids.forEach(function(no){var a=byNo(no);if(!a)return;var c=checkAsset(a);(c.ok?ok:bad).push({a:a,why:c.why});});
 var m2={},ks=[];
 ok.forEach(function(x){if(!m2[x.a.cur]){m2[x.a.cur]={n:0,s:0};ks.push(x.a.cur);}m2[x.a.cur].n++;m2[x.a.cur].s+=Number(x.a.amt);});
 ks.sort();
 var sums=ks.map(function(k){return '<div class="ds-kv"><span>'+k+' · '+nRec(m2[k].n)+'</span>'
   +'<span class="v">'+money(m2[k].s,k)+'</span></div>';}).join('');
 var body='<div class="ds-kv"><span>'+t(m.type==="repush"?"rpCount":"cfCount")+'</span><span class="v">'+ok.length+'</span></div>'
  +(sums?'<div class="sec-head" style="margin-top:14px"><h2>'+t("cfCurrency")+'</h2></div>'+sums:'')
  +(m.type==="repush"?note("",t("rpNote")):'')
  +(bad.length?note("red",'<b>'+t("cfExcluded",{n:bad.length})+'</b><div class="ds-modal-list" style="margin-top:8px">'
     +bad.map(function(x){return '<div class="ds-res-row"><div class="bd"><b>'+esc(x.a.no)+'</b><span>'+esc(x.why)+'</span></div></div>';}).join('')
     +'</div>'):'');
 var foot='<button class="btn" type="button" data-act="closeModal"'+(S.pushing?" disabled":"")+'>'+t("cancel")+'</button>'
  +'<button class="btn primary" type="button" data-act="doPush"'+(S.pushing||!ok.length?" disabled":"")+'>'
  +(S.pushing?'<span class="spinner"></span>'+t("submittingTx"):t("cfSubmit"))+'</button>';
 return modalBox(t(m.type==="repush"?"rpTitle":"cfTitle"),body,foot,bad.length>0);
}
function resultDrawer(){
 var r=S.result;if(!r)return '';
 var ok=r.items.filter(function(x){return x.result!=="fail";}).length;
 var fail=r.items.filter(function(x){return x.result==="fail";});
 var rows=r.items.map(function(x){
  var sub=x.result==="dup"?t("rDupNote"):x.result==="fail"?x.code+" · "+errText(x):money(x.amt,x.cur);

   +'<div class="act">'+resultPill(x.result)+'</div>'+(act?'<div class="act">'+act+'</div>':'')+'</div>';

  +'<div class="drawer-h"><b>'+t("rsTitle")+'</b><button class="modal-x" type="button" data-act="closeDrawer" aria-label="'+t("close")+'">×</button></div>'
  +'<div class="drawer-b">'
  +'<div class="ds-kv"><span>'+t("rsBatch")+'</span><span class="v">'+esc(r.batch)+'</span></div>'
  +'<div class="ds-kv"><span>'+t("rsOk",{n:ok})+'</span><span class="v">'+(fail.length?t("rsFail",{n:fail.length}):"")+'</span></div>'

  +(fail.length&&canPush()?'<button class="btn" type="button" data-act="repushResult">'+t("rsRepush")+'</button>':'')
  +'<button class="btn primary" type="button" data-act="openBatch" data-v="'+esc(r.batch)+'">'+t("rsViewBatch")+'</button></div>'
  +'</div></aside>';
}

/* ------------------------------ URL 方案 -------------------------------- */
function q(){return S.st&&S.st!=="default"?"?st="+S.st:"";}
function buildHash(){
 if(S.page==="P-M-DS-02")return "#/admin/data-sync/batches"+q();
 if(S.page==="P-M-DS-03")return "#/admin/data-sync/batches/"+encodeURIComponent(S.batchNo)+q();
 if(S.page==="P-O-DS-01")return "#/ops/asset-inventory"+q();
 if(S.page==="P-O-DS-02")return "#/ops/asset-inventory/"+encodeURIComponent(S.invId)+q();
 return "#/admin/data-sync/assets"+q();
}
function readHash(){
 var h=(location.hash||"").replace(/^#\/?/,"");if(!h)return false;
 var parts=h.split("?"),seg=parts[0].split("/"),qs={};
 (parts[1]||"").split("&").forEach(function(kv){if(!kv)return;var i=kv.indexOf("=");qs[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
 var page=null;
 if(seg[0]==="admin"&&seg[1]==="data-sync"&&seg[2]==="assets")page="P-M-DS-01";
 else if(seg[0]==="admin"&&seg[1]==="data-sync"&&seg[2]==="batches"){
  if(seg[3]){page="P-M-DS-03";S.batchNo=decodeURIComponent(seg[3]);}else page="P-M-DS-02";
 } else if(seg[0]==="ops"&&seg[1]==="asset-inventory"){
  if(seg[2]){page="P-O-DS-02";S.invId=decodeURIComponent(seg[2]);}else page="P-O-DS-01";
 } else if(CF.PAGES[parts[0].toUpperCase()])page=parts[0].toUpperCase();
 if(!page)return false;
 S.page=page;
 S.st=qs.st&&(CF.STATES[page]||[]).some(function(x){return x[0]===qs.st;})?qs.st:CF.defaultState(page);
 return true;
}

function resetDemo(){
 S.data=seedAssets();if(S.bulk)S.data=S.data.concat(bulkAssets());
 S.inv=seedInv();S.batches=seedBatches();S.sel={};S.result=null;
 S.page1=1;S.pageB=1;S.pageO=1;
}
function clearFilters(){
 if(S.page==="P-M-DS-01"){S.f={chain:"chained",sync:"none",cur:"all",party:"all",from:"",to:"",kw:""};S.sortAmount=0;S.page1=1;}
 else if(S.page==="P-M-DS-02"){S.bf={type:"all",from:"",to:"",kw:""};S.pageB=1;}
 else {S.of={cur:"all",party:"all",type:"all",cfrom:"",cto:"",rfrom:"",rto:"",kw:""};S.pageO=1;}
 S.st="default";
}
function onAct(n,a,v){
 if(a==="switchEnd"){go(S.end==="ops"?"P-M-DS-01":"P-O-DS-01");return true;}
 if(a==="reset"){resetDemo();toast("success",t("resetOk"));render();return true;}
 if(a==="bulk"){S.bulk=!S.bulk;resetDemo();render();return true;}
 if(a==="retry"){S.st="default";render();return true;}
 if(a==="clear"){clearFilters();render();return true;}
 if(a==="search"){
  var empty=S.page==="P-M-DS-01"?!adminRows().length:S.page==="P-M-DS-02"?!batchRows().length:!invRows().length;
  S.st=empty?"nomatch":"default";S.page1=1;S.pageB=1;S.pageO=1;render();return true;}
 if(a==="sort"){if(S.f.cur==="all")return true;S.sortAmount=S.sortAmount===1?-1:1;render();return true;}
 if(a==="page1"){S.page1=Math.max(1,Number(v));render();return true;}
 if(a==="pageB"){S.pageB=Math.max(1,Number(v));render();return true;}
 if(a==="pageO"){S.pageO=Math.max(1,Number(v));render();return true;}
 if(a==="pick"){if(S.sel[v])delete S.sel[v];else S.sel[v]=true;render();return true;}
 if(a==="clearSel"){S.sel={};render();return true;}
 if(a==="selectAll"){adminRows().forEach(function(r){
  if(r.sync!=="pushed"&&r.chain==="chained")S.sel[r.no]=true;});render();return true;}
 if(a==="denied"){toast("danger",t("permDenied"));return true;}
 if(a==="askPush"){S.modal={type:"push",ids:selIds()};render();return true;}
 if(a==="askRepush"){S.drawer=null;S.modal={type:"repush",ids:[v]};render();return true;}
 if(a==="repushBatch"){var b=batchByNo(v);if(!b)return true;
  S.modal={type:"repush",ids:b.items.filter(function(x){return x.result==="fail";}).map(function(x){return x.no;})};render();return true;}
 if(a==="repushResult"){S.drawer=null;
  S.modal={type:"repush",ids:S.result.items.filter(function(x){return x.result==="fail";}).map(function(x){return x.no;})};render();return true;}
 if(a==="doPush"){var m=S.modal,ok=m.ids.filter(function(no){var x=byNo(no);return x&&checkAsset(x).ok;});
  if(!ok.length)return true;submit(ok,m.type==="repush"?"repush":"push");return true;}
 if(a==="closeModal"){if(S.pushing)return true;S.modal=null;render();return true;}
 if(a==="openBatch"){S.batchNo=v;S.drawer=null;go("P-M-DS-03");return true;}
 if(a==="openInv"){S.invId=v;go("P-O-DS-02");return true;}
 if(a==="copyHash"||a==="copyWallet"){if(navigator.clipboard)navigator.clipboard.writeText(v)["catch"](function(){});toast("success",t("copiedTx"));return true;}
 if(a==="signout"){S.menu=null;toast("info",t("signOutDemo"));render();return true;}
 return false;
}
function setField(k,v){
 if(k.indexOf("f.")===0)S.f[k.slice(2)]=v;
 else if(k.indexOf("bf.")===0)S.bf[k.slice(3)]=v;
 else if(k.indexOf("of.")===0)S.of[k.slice(3)]=v;
 else if(k==="perm")S.perm=v;
 else if(k==="scenario")S.scenario=v;
}
document.addEventListener("input",function(e){
 var n=e.target.closest("[data-f]");if(!n)return;setField(n.getAttribute("data-f"),n.value);
});
document.addEventListener("change",function(e){
 var n=e.target.closest("[data-f]");if(!n)return;setField(n.getAttribute("data-f"),n.value);render();
});
/* 页面快捷键 Alt+1～5：输入控件内不截获。 */
var SHORTCUT=["P-M-DS-01","P-M-DS-02","P-M-DS-03","P-O-DS-01","P-O-DS-02"];
document.addEventListener("keydown",function(e){
 if(!e.altKey||e.ctrlKey||e.metaKey)return;
 var tag=(e.target.tagName||"").toLowerCase();
 if(tag==="input"||tag==="textarea"||tag==="select")return;
 var i=["1","2","3","4","5"].indexOf(e.key);if(i<0)return;
 e.preventDefault();
 var target=SHORTCUT[i];
 if(target==="P-M-DS-03"&&S.batches.length)S.batchNo=S.batches[0].no;
 if(target==="P-O-DS-02"){if(!S.inv.length)return;S.invId=S.inv[0].srcId;}
 go(target);
});
