/* 本模块只定义应收账款页面的局部组合；token、壳层与公共组件均来自 ../_shared/。 */
.ar-sums{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.ar-sum{padding:var(--sp-4);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.ar-sum .k{font-size:var(--fs-11);font-weight:640;color:var(--muted);margin-bottom:var(--sp-1)}
.ar-sum .v{font-family:var(--mono);font-size:var(--fs-16);font-weight:640}
.ar-sum .n{font-size:var(--fs-11);color:var(--faint);margin-top:var(--sp-1)}
.ar-table{min-width:1190px;table-layout:fixed}
.ar-table th:nth-child(1){width:145px}.ar-table th:nth-child(2){width:175px}.ar-table th:nth-child(3){width:130px}
.ar-table th:nth-child(4){width:130px}.ar-table th:nth-child(5){width:100px}.ar-table th:nth-child(6){width:105px}
.ar-table th:nth-child(7){width:175px}.ar-table th:nth-child(8){width:135px}.ar-table th:nth-child(9){width:95px}
.ar-table td{overflow-wrap:anywhere}.ar-table .cell-sub,.ar-table .cell-note{display:block}.ar-table .c-time{width:auto;white-space:normal}
.ar-table .col-act{position:sticky;right:0;background:var(--card);box-shadow:var(--shadow);z-index:2}
.ar-table thead .col-act{background:var(--card-2)}
.ar-table tbody tr:hover .col-act{background:var(--card-hover)}
.ar-money{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ar-contracts{display:flex;gap:var(--sp-1);align-items:center;flex-wrap:wrap}
.ar-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:4px 8px;border:1px solid var(--accent-border);border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent-strong);font-family:var(--mono);font-size:var(--fs-11)}
.ar-chip button{width:18px;height:18px;border-radius:50%;color:var(--accent);display:grid;place-items:center}
.ar-chip button:hover{background:var(--bg-elev)}
.ar-chipbox{border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-elev);padding:8px;min-height:var(--ctrl-h);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-chipbox:focus-within{border-color:var(--accent)}
.ar-chipbox input{border:0;outline:0;min-width:190px;flex:1;background:transparent;height:28px}
.ar-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr);gap:var(--sp-4);align-items:start}
.ar-stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.ar-inline{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.ar-reason{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--danger);padding-left:var(--sp-3);color:var(--text)}
.ar-actions{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-actions .off{font-size:var(--fs-11);color:var(--faint)}
.ar-command .card-b{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-command .btn{flex:1;min-width:110px}
.ar-state-note{margin-bottom:var(--sp-4)}
.ar-buyer{width:100%;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;background:var(--card)}
.ar-buyer:hover{background:var(--card-hover)}
.ar-buyer .bd{flex:1}.ar-buyer b{display:block}.ar-buyer span{display:block;color:var(--muted);font-size:var(--fs-11);margin-top:2px}
.ar-files{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-3)}
.ar-no-preview{font-size:var(--fs-10);color:var(--faint);white-space:nowrap}
.ar-modal-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.ar-status-help{font-size:var(--fs-11);color:var(--muted);line-height:1.55}
.ar-command{position:sticky;top:var(--sp-4);z-index:3}
.drawer.prd{width:min(680px,100vw)}
/* WS-313 可信数据同步：资产管理端在本页对已确权资产发起上链存证。 */
.ar-check{width:15px;height:15px;accent-color:var(--accent);margin:0}
.ar-check:disabled{cursor:not-allowed;opacity:.5}
.ar-selbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:11px var(--card-pad);
  border-bottom:1px solid var(--border);background:var(--card-2);border-radius:var(--radius) var(--radius) 0 0}
.ar-selbar .n{font-family:var(--mono);font-weight:660;color:var(--accent)}
.ar-selbar .right{margin-left:auto;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ar-chain-reason{display:block;color:var(--danger);font-size:var(--fs-11);line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
.ar-res{display:flex;flex-direction:column;gap:var(--sp-2)}
.ar-res-row{display:flex;gap:var(--sp-3);align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-elev);padding:11px 13px}
.ar-res-row .bd{flex:1;min-width:0}
.ar-res-row .bd b{display:block;font-family:var(--mono);font-size:12px;font-weight:640}
.ar-res-row .bd span{display:block;font-size:var(--fs-11);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.ar-kv{display:flex;justify-content:space-between;gap:var(--sp-4);padding:7px 0;border-bottom:1px dashed var(--border-dash);font-size:12.5px}
.ar-kv:last-child{border-bottom:none}
.ar-kv .v{font-family:var(--mono);white-space:nowrap}
.ar-demo-sel{height:var(--ctrl-h-sm);border:1px solid var(--border-strong);border-radius:var(--radius-xs);
  background:var(--card);padding:0 var(--sp-2);font-size:var(--fs-11);max-width:210px}
.ar-admin-table{min-width:1230px}
.ar-admin-table th:nth-child(1){width:42px}.ar-admin-table th:nth-child(2){width:148px}.ar-admin-table th:nth-child(3){width:170px}
.ar-admin-table th:nth-child(4){width:120px}.ar-admin-table th:nth-child(5){width:138px}.ar-admin-table th:nth-child(6){width:92px}
.ar-admin-table th:nth-child(7){width:134px}.ar-admin-table th:nth-child(8){width:116px}.ar-admin-table th:nth-child(9){width:172px}
.ar-admin-table th:nth-child(10){width:92px}
.ar-admin-table .col-act .actlink{overflow-wrap:normal;word-break:keep-all}
.ar-admin-table .pill{white-space:normal;text-align:left}
.ar-admin-table td{vertical-align:top}
.drawer.ar-result{width:min(560px,100vw)}
.ar-proof .dl{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media (max-width:1180px){.ar-layout{grid-template-columns:1fr}.ar-sums{grid-template-columns:repeat(2,minmax(0,1fr))}.ar-command{position:static}}

function dsProof(no,at){
 var k=Number(no.slice(-6)).toString(16); while(k.length<8)k="0"+k;
 var r8=function(x){var o="";for(var i=0;i<8;i++)o+=x;return o;};
 return {hash:"0x"+r8(k),tx:"0x"+r8("d"+k.slice(1)),block:21000000+Number(no.slice(-6)),chain:"DEMO-LOCAL",at:at};
}

 list.forEach(function(r){
  r.chainRetries=r.chainRetries||0;

 });

}

function dsNextBatch(){S.dsBatchSeq=(S.dsBatchSeq||0)+1;return "CB-20260910-"+("00"+S.dsBatchSeq).slice(-3);}
function dsDecide(r,i){
 if(r.proof&&dsProofOk(r.proof))return {result:"dup",proof:r.proof};
 if(S.dsScenario==="timeout")return {result:"fail",code:"E-DS-08"};
 if(S.dsScenario==="down")return {result:"fail",code:"E-DS-07"};
 if(S.dsScenario==="partial"&&i%3===2)return {result:"fail",code:"E-DS-10"};
 return {result:"new"};
}
function dsRun(ids){
 var at=new Date().toISOString(),batch=dsNextBatch(),items=[];
 ids.forEach(function(id,i){
  var r=byId(id);if(!r)return;
  var d=dsDecide(r,i);
  if(r.chain==="failed"||d.result!=="new")r.chainRetries=(r.chainRetries||0)+(r.chain==="failed"?1:0);
  if(d.result==="fail"){
   r.chain="failed";r.chainErr={code:d.code};
   /* 回执未知：链上其实已写入，重试时先查已有存证会命中幂等（R-DS-08） */
   if(d.code==="E-DS-08"&&!r.proof)r.proof=dsProof(r.no,at);
   items.push({no:r.no,result:"fail",code:d.code});
  }else{
   if(d.result==="new")r.proof=dsProof(r.no,at);
   r.chain="chained";r.chainErr=null;r.chainBatch=batch;
   items.push({no:r.no,result:d.result,proof:r.proof});
  }
 });
 S.dsResult={batch:batch,items:items};
}

 },700);
}
