<!doctype html>
<html lang="en" data-end="asset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications · Harbour Credit</title>
<link rel="stylesheet" href="../../_shared/tokens.css">
<link rel="stylesheet" href="../../_shared/base.css">
<style>
.nc-layout{max-width:1120px;margin:auto}
.nc-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-6);flex-wrap:wrap}
.nc-filters{display:flex;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;padding:var(--card-pad);border-bottom:1px solid var(--border)}
.nc-filters .field{min-width:180px;flex:1;max-width:320px}
.nc-filters .field label{display:block;margin-bottom:var(--sp-2)}
.nc-count{margin-left:auto;color:var(--muted);font-size:var(--fs-12);align-self:center}
.nc-row{display:flex;gap:var(--sp-5);padding:var(--sp-5) var(--card-pad);border-bottom:1px solid var(--row-line);position:relative}
.nc-row[data-unread="true"]{background:var(--accent-soft)}
.nc-row-main{min-width:0;flex:1}
.nc-title{font-size:var(--fs-16);font-weight:600;color:var(--text);display:inline-block;margin:var(--sp-2) 0;text-decoration:none;line-height:1.5;min-height:44px;padding:8px 0}
.nc-title:hover{color:var(--accent);text-decoration:underline}
.nc-summary{margin:0;color:var(--muted);font-size:var(--fs-14);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-row-aside{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-3);justify-content:space-between;flex:0 0 215px}
.nc-time{font-size:var(--fs-12);color:var(--muted)}
.nc-row-aside .btn{font-size:var(--fs-12)}
.nc-list{height:var(--list-h)}
.nc-detail{max-width:900px;margin:0 auto}
.nc-back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:var(--sp-4)}
.nc-detail .card-b{padding:var(--sp-8)}
.nc-detail h1{font-size:var(--fs-24);margin:var(--sp-4) 0;line-height:1.4;overflow-wrap:anywhere}
.nc-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;margin:var(--sp-8) 0}
.nc-progress{background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-5);margin-top:var(--sp-6)}
.nc-progress h2{font-size:var(--fs-16);margin:0 0 var(--sp-3)}
.nc-actions{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;margin-top:var(--sp-6);padding-top:var(--sp-5);border-top:1px solid var(--border)}
.nc-feedback{padding:var(--sp-3) var(--sp-5)}
@media(max-width:900px){.nc-list{height:auto}.nc-row{flex-direction:column;gap:var(--sp-3)}.nc-row-aside{flex:auto;flex-direction:row;align-items:center;flex-wrap:wrap}.nc-detail .card-b{padding:var(--sp-5)}.nc-filters .field{min-width:0;max-width:none}.nc-count{width:100%;margin:0}.nc-head .btn{width:100%}}
</style>
</head>
<body>

<!-- 面客端顶栏骨架：沿用公共运行时要求的挂载点，不重建导航。 -->
<div class="portal" id="portal" hidden>
  <header class="portal-head">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Lending</span>
      </span>
    </a>
    <nav class="portal-nav" id="nav" aria-label="Main navigation"></nav>
    <div class="portal-tools" id="tools"></div>
  </header>
  <div class="portal-sub" id="subwrap"><div class="portal-sub-in" id="crumb"></div></div>
  <main class="portal-main"><div class="portal-wrap" id="content"></div></main>
  <footer class="site-foot" id="foot"></footer>
</div>

<!-- 管理端骨架：本模块不登记管理端页面，这里只保留公共运行时要求的挂载点。 -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Operations</span>
      </span>
    </div>
    <nav class="nav" id="anav" aria-label="Main navigation"></nav>
    <div class="side-foot" id="asidefoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumbbar-in" id="acrumb"></div>
      <div class="topbar-right" id="atools"></div>
    </div>
    <div class="content" id="acontent"></div>
  </div>
</div>

<div id="layers"></div>
<div class="toasts" id="toasts"></div>
<button class="demo-btn" id="demoBtn" type="button"></button>
<aside class="demo-panel" id="demoPanel" hidden aria-label="Demo tools"></aside>

<script src="../../_shared/registry.portal.js"></script>
<script src="../../_shared/shell.js"></script>
<script>CF.deferBoot = true; CF.notificationLanding = true;</script>
<script src="../../_shared/sample-pages.js"></script>
<script src="演示数据.js"></script>
<script src="消息中心.js"></script>
</body>
</html>
