<!doctype html>
<html lang="en" data-end="asset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Harbour Credit</title>
<link rel="stylesheet" href="../../_shared/tokens.css">
<link rel="stylesheet" href="../../_shared/base.css">
<style>

/* 登录域组合；公共组件、token 与三种既有 shell 均保持原样。 */
.login-heading{text-align:center;margin-bottom:var(--sp-7)}
.login-heading h1{margin:0 0 var(--sp-2);font-size:var(--fs-28);letter-spacing:-.02em}
.login-heading p{margin:0;color:var(--muted)}
.login-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5)}
.login-choice{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-4);min-width:0;
  border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-6);background:var(--card-2)}
.login-choice h2{font-size:var(--fs-19);margin:0}
.login-choice p{color:var(--muted);margin:0;font-size:var(--fs-14);flex:1}
.login-choice .btn{width:100%;padding-inline:var(--sp-2);font-size:var(--fs-12)}
.login-choice-icon{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-elev);color:var(--accent)}
.login-choice-icon svg{width:24px;height:24px}
.login-bottom{margin-top:var(--sp-6);text-align:center;color:var(--muted);font-size:var(--fs-13)}
.login-memory{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);flex-wrap:wrap;
  margin-bottom:var(--sp-3);padding:var(--sp-3);border-bottom:1px solid var(--border)}
.login-flow{max-width:560px;margin:auto}
.login-flow .page-title{margin-bottom:var(--sp-3)}
.login-flow p{color:var(--muted)}
.login-actions{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;margin-top:var(--sp-6)}
.login-stack{display:flex;flex-direction:column;gap:var(--sp-5)}
.login-center{text-align:center}
.login-status-icon{font-size:var(--fs-28);color:var(--accent);margin-bottom:var(--sp-4)}
.login-agreement-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-4) 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.login-check{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;font-size:var(--fs-14);cursor:pointer}
.login-check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.login-account{max-width:1040px;margin:auto}
.login-account-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--sp-5)}
.login-fields{margin:0}
.login-fields div{padding:var(--sp-4) 0;border-bottom:1px solid var(--border-dash)}
.login-fields dt{font-size:var(--fs-12);color:var(--muted);margin-bottom:var(--sp-2)}
.login-fields dd{margin:0;overflow-wrap:anywhere}
.login-caption{font-size:var(--fs-12);color:var(--muted)}
.login-demo-stamp{margin-top:var(--sp-5);color:var(--muted);font-size:var(--fs-12)}
.login-prototype .modal:has(.login-choices){max-width:820px}
.login-prototype .modal-f{flex-wrap:wrap}
.login-prototype .toast .btn-link{color:var(--on-accent);text-decoration:underline}
.login-prototype .toasts{top:var(--sp-6);bottom:auto}
.login-prototype .btn-link{min-height:44px}
.login-prototype .bell{width:44px;height:44px}
.login-prototype .bell .badge{right:0;top:0}
.login-prototype .dd-btn,.login-prototype .btn.sm,.login-prototype .demo-btn{min-height:44px}
.login-prototype .demo-panel{max-height:calc(100svh - 110px);overflow:auto;width:min(420px,calc(100% - 32px))}
.login-prototype .demo-panel select{margin-bottom:var(--sp-3)}
.login-prototype .demo-panel .btn{height:auto;min-height:44px;white-space:normal;text-align:left}
.login-prototype .demo-panel .seg{flex-wrap:wrap}
.login-limit{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:44px;
  padding:var(--sp-3) var(--sp-4);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--gray-bg);color:var(--muted);font-size:var(--fs-13);font-weight:600}
.login-limit:hover{background:var(--card-hover)}
.login-limit[aria-busy="true"]{cursor:wait}
.login-public{max-width:1040px;margin:auto}
.login-public-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);
  padding:var(--sp-6) 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.login-public-row h2{margin:0 0 var(--sp-2);font-size:var(--fs-19)}
.login-public-row p{margin:0;color:var(--muted)}
.login-prototype .focus-foot{padding-bottom:var(--sp-10)}
@media(max-width:760px){
  .login-choices,.login-account-grid{grid-template-columns:minmax(0,1fr)}
  .login-choice{padding:var(--sp-4);gap:var(--sp-3)}
  .login-choice p{flex:auto}
  .login-heading{margin-bottom:var(--sp-5)}
  .login-heading h1{font-size:var(--fs-24)}
  .login-prototype .modal-b{padding-inline:var(--sp-4)}
  .login-prototype .modal-h,.login-prototype .modal-f{padding-inline:var(--sp-4)}
  .login-flow .login-actions>.btn{max-width:100%;font-size:var(--fs-12);padding-inline:var(--sp-2)}
}
</style>
</head>
<body class="login-prototype">

<!-- 面客端：官网顶栏骨架。官网层与工作区共用同一根顶栏，只有内容区节奏不同。 -->
<div class="portal" id="portal" hidden>
  <header class="portal-head">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Lending</span>
      </span>
    </a>
    <nav class="portal-nav" id="nav" aria-label="Main navigation"></nav>
    <div class="portal-tools" id="tools"></div>
  </header>
  <div class="portal-sub" id="subwrap"><div class="portal-sub-in" id="crumb"></div></div>
  <main class="portal-main"><div class="portal-wrap" id="content"></div></main>
  <footer class="site-foot" id="foot"></footer>
</div>

<!-- 管理端：侧栏控制台骨架。结构与既有系统一致，只跟随 token 取值变化。 -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Operations</span>
      </span>
    </div>
    <nav class="nav" id="anav" aria-label="Main navigation"></nav>
    <div class="side-foot" id="asidefoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumbbar-in" id="acrumb"></div>
      <div class="topbar-right" id="atools"></div>
    </div>
    <div class="content" id="acontent"></div>
  </div>
</div>


<!-- focus：仅品牌与语言工具，不带业务导航。 -->
<div class="focus" id="focus" hidden>
  <header class="focus-head"><a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">HC</span><span class="brand-name">Harbour Credit</span></a><div class="focus-tools" id="focusTools"></div></header>
  <main class="focus-main"><div class="focus-card" id="focusContent"></div></main>
  <footer class="focus-foot">Harbour Credit</footer>
</div>

<div id="layers"></div>
<div class="toasts" id="toasts"></div>
<button class="demo-btn" id="demoBtn" type="button"></button>
<aside class="demo-panel" id="demoPanel" hidden aria-label="Demo tools"></aside>


<script src="../../_shared/registry.portal.js"></script>
<script src="../../_shared/shell.js"></script>
<script src="登录与账户体系.js"></script>
</body>
</html>
