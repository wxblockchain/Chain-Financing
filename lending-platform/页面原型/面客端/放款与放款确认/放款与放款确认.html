<!doctype html>
<html lang="en" data-end="asset">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disbursement · Harbour Credit</title>
<link rel="stylesheet" href="../../_shared/tokens.css">
<link rel="stylesheet" href="../../_shared/base.css">
<link rel="stylesheet" href="../借贷广场/借贷广场.css">
<link rel="stylesheet" href="放款与放款确认.css">
</head>
<body>

<!-- 面客端顶栏骨架：沿用公共运行时要求的挂载点，不重建导航。 -->
<div class="portal" id="portal" hidden>
  <header class="portal-head">
    <a class="brand" href="#/marketplace">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Lending</span>
      </span>
    </a>
    <nav class="portal-nav" id="nav" aria-label="Main navigation"></nav>
    <div class="portal-tools" id="tools"></div>
  </header>
  <div class="portal-sub" id="subwrap"><div class="portal-sub-in" id="crumb"></div></div>
  <main class="portal-main"><div class="portal-wrap" id="content"></div></main>
  <footer class="site-foot" id="foot"></footer>
</div>

<!-- 管理端骨架：本模块不登记管理端页面，这里只保留公共运行时要求的挂载点。 -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">HC</span>
      <span>
        <span class="brand-name">Harbour Credit</span>
        <span class="brand-sub">Operations</span>
      </span>
    </div>
    <nav class="nav" id="anav" aria-label="Main navigation"></nav>
    <div class="side-foot" id="asidefoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumbbar-in" id="acrumb"></div>
      <div class="topbar-right" id="atools"></div>
    </div>
    <div class="content" id="acontent"></div>
  </div>
</div>

<div id="layers"></div>
<div class="toasts" id="toasts"></div>
<button class="demo-btn" id="demoBtn" type="button"></button>
<aside class="demo-panel" id="demoPanel" hidden aria-label="Demo tools"></aside>

<script src="../../_shared/registry.portal.js"></script>
<script src="../../_shared/shell.js"></script>
<script>CF.deferBoot=true;</script>
<script src="../借贷广场/演示数据.js"></script>
<script src="../借贷广场/授信报价.js"></script>
<script src="../借贷广场/借贷广场.js"></script>
<script src="放款与放款确认.js"></script>
</body>
</html>
