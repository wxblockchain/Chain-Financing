<!doctype html>
<html lang="en" data-end="admin" data-admin-module="pledge" data-module="pledge-review"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pledge reviews · Harbour Credit</title>
<link rel="stylesheet" href="../../_shared/tokens.css">
<link rel="stylesheet" href="../../_shared/base.css">
<link rel="stylesheet" href="../账户与登录/账户与登录.css">
<style>
.pr-stack{display:grid;gap:var(--sp-5);align-content:start}
.pr-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.pr-meta{display:block;color:var(--muted);font-size:var(--fs-12);margin-top:var(--sp-1);overflow-wrap:anywhere}
.pr-title{display:flex;align-items:start;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.pr-title h1{font-size:var(--fs-24);margin:0 0 var(--sp-2)}
.pr-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp-5);align-items:start}
.pr-rail{position:sticky;top:calc(68px + var(--sp-5))}
.pr-origin{margin-bottom:var(--sp-4)}
.pr-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.pr-metric{padding:var(--sp-5)}
.pr-metric strong{display:block;font-size:var(--fs-28);font-family:var(--mono);margin:var(--sp-2) 0}
.pr-filter-wrap{padding:var(--sp-5);border-bottom:1px solid var(--border)}
.pr-filter-bar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(160px,220px) auto;gap:var(--sp-4);align-items:end}
.pr-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-4);padding-top:var(--sp-5);margin-top:var(--sp-5);border-top:1px solid var(--border)}
.pr-filters[hidden]{display:none}
.pr-filter-wrap .field{min-width:0;max-width:none}
.pr-applied{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}
.pr-list-tools{display:flex;justify-content:flex-end;padding:var(--sp-3) var(--sp-5)}
.pr-list-tools .field{display:flex;flex-direction:row;align-items:center;gap:var(--sp-3);max-width:none;margin:0}
.pr-list-tools label{margin:0;white-space:nowrap}.pr-list-tools .inp{width:auto}
.pr-actions{display:flex;align-items:end;justify-content:flex-end;gap:var(--sp-2)}
.pr-table{table-layout:fixed;width:100%}
.pr-table thead th{white-space:normal;color:var(--muted)}
.pr-table tbody td{overflow-wrap:anywhere;font-size:var(--fs-12)}
.pr-table .col-act{position:sticky;right:0;background:var(--card);width:70px;text-align:right}
.pr-table .tag{white-space:normal;text-align:left;line-height:1.5;font-size:var(--fs-11)}
.pr-table .pr-num{text-align:right}
.pr-queue-table th:nth-child(1){width:20%}.pr-queue-table th:nth-child(2){width:14%}.pr-queue-table th:nth-child(3){width:8%}.pr-queue-table th:nth-child(4){width:12%;text-align:right}.pr-queue-table th:nth-child(5){width:16%}.pr-queue-table th:nth-child(6){width:10%}.pr-queue-table th:nth-child(7){width:15%}
.pr-table:not(.pr-queue-table) th:first-child{width:30%}
.pr-detail-summary{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:var(--sp-6);padding:var(--sp-5);margin-bottom:var(--sp-5)}
.pr-detail-summary .pr-meta{margin:0 0 var(--sp-2)}.pr-value{font-size:var(--fs-19)}
.pr-detail-main{min-width:0}.pr-tabs{display:flex;gap:var(--sp-6);border-bottom:1px solid var(--border);margin-bottom:var(--sp-5)}
.pr-tabs button{padding:var(--sp-3) 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;cursor:pointer}
.pr-tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pr-tabs button:hover{color:var(--accent)}
.pr-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pr-rail-time{padding:var(--sp-4) 0;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border)}
.pr-rail-time strong{font-size:var(--fs-24);font-variant-numeric:tabular-nums}
.pr-disclosure{margin-top:var(--sp-4)}
.pr-demo-actions{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.pr-evidence{margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px solid var(--border)}.pr-evidence h3{font-size:var(--fs-14);margin:0 0 var(--sp-3)}
.pr-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5);margin:0}
.pr-kv dt{font-size:var(--fs-12);color:var(--muted);margin-bottom:var(--sp-1)}
.pr-kv dd{margin:0;overflow-wrap:anywhere}.pr-wide{grid-column:1/-1}
.pr-h2{font-size:var(--fs-16);margin:0 0 var(--sp-4)}
.pr-section{padding:var(--sp-5)}
.pr-activity{scroll-margin-top:90px}
.pr-timeline{list-style:none;margin:var(--sp-5) 0 0;padding:0}
.pr-event{position:relative;margin:0 0 0 5px;padding:0 0 var(--sp-6) var(--sp-5);border-left:1px solid var(--border);overflow-wrap:anywhere}
.pr-event:last-child{padding-bottom:0;border-left-color:transparent}
.pr-event:before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:var(--radius-pill);background:var(--accent)}
.pr-event[data-tone=ok]:before{background:var(--ok)}.pr-event[data-tone=danger]:before{background:var(--danger)}.pr-event[data-tone=warn]:before{background:var(--warn)}
.pr-event h3{font-size:var(--fs-14);margin:0;font-weight:600}
.pr-event-meta{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);margin-top:var(--sp-2);font-size:var(--fs-12);color:var(--muted)}
.pr-event-result{margin:var(--sp-2) 0 0;font-size:var(--fs-13)}
.pr-activity details{margin-top:var(--sp-3)}.pr-activity summary{color:var(--accent);cursor:pointer;font-size:var(--fs-12);width:fit-content}
.pr-activity summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-sm)}
.pr-event-detail{margin-top:var(--sp-3);padding:var(--sp-4);background:var(--card-2);border-radius:var(--radius-sm)}
.pr-event-detail>p{white-space:pre-wrap;margin:0 0 var(--sp-4);font-size:var(--fs-13)}
.pr-event-detail .pr-kv{gap:var(--sp-4)}.pr-event-detail dd{font-size:var(--fs-13)}
.pr-event-detail .pr-disclosure{margin:var(--sp-4) 0 0}
.pr-body .modal{max-width:680px}.pr-form{display:grid;gap:var(--sp-4)}
.pr-form textarea{min-height:90px;resize:vertical;width:100%}
.pr-form .field{max-width:none}.pr-form input[type=checkbox]{accent-color:var(--accent)}
.pr-error{color:var(--danger);font-size:var(--fs-12);white-space:pre-wrap;overflow-wrap:anywhere}
.pr-form fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;gap:var(--sp-4)}
.pr-upload:focus-within{outline:2px solid var(--accent);outline-offset:2px}.pr-confirm{white-space:pre-wrap;padding:var(--sp-4);background:var(--card-2);border-radius:var(--radius-sm);overflow-wrap:anywhere}
.pr-progress{width:100%;accent-color:var(--accent)}
.pr-body .demo-panel{max-height:calc(100vh - 110px);overflow:auto}
.pr-demo{display:grid;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.pr-preview{width:100%;height:300px;border:1px solid var(--border);object-fit:contain}
.pr-table caption{text-align:left;padding:var(--sp-4);font-weight:600}
@media (max-width:1350px){.pr-grid{grid-template-columns:minmax(0,1fr) 270px}.pr-filters{gap:var(--sp-3)}.pr-table td,.pr-table th{padding-left:var(--sp-2);padding-right:var(--sp-2)}}
</style></head>
<body class="pr-body ops-account">
<div id="portal" hidden></div>
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">HC</span><div><div class="brand-name">Harbour Credit</div><div class="brand-sub">Operations</div></div></div>
    <nav class="nav" id="anav" aria-label="Main navigation"></nav><div class="side-foot" id="asidefoot"></div>
  </aside>
  <div class="main"><div class="topbar"><div class="topbar-right" id="atools"></div></div><main class="content" id="acontent"><div class="crumbbar-in" id="acrumb"></div></main></div>
</div>
<!-- focus：共享运营登录与改密页的骨架，仅品牌与语言工具。 -->
<div class="focus" id="focus" hidden>
  <header class="focus-head"><div class="brand"><span class="brand-mark" aria-hidden="true">HC</span><span class="brand-name">Harbour Credit</span></div><div class="focus-tools" id="focusTools"></div></header>
  <main class="focus-main"><div class="focus-card" id="focusContent"></div></main>
  <footer class="focus-foot">Harbour Credit</footer>
</div>

<div id="layers"></div><div class="toasts" id="toasts" aria-live="polite"></div>
<button class="demo-btn" id="demoBtn" type="button"></button><aside class="demo-panel" id="demoPanel" hidden aria-label="Demo tools"></aside>
<script src="../../_shared/registry.admin.js"></script>
<script src="../../_shared/shell.js"></script>
<script src="../../_shared/file-row.js"></script>
<script src="../../_shared/admin-menu.js"></script>
<script src="../../_shared/admin-message-data.js"></script>
<script src="../../_shared/admin-notifications.js"></script>
<script src="../../_shared/puzzle.js"></script>
<script>CF.deferOpsBoot=true;</script>
<script src="../账户与登录/账户与登录.js"></script>
<script src="演示数据.js"></script>
<script src="代币质押审核.js"></script>

<!-- 共享运行时缺失时的兜底提示：整份原型依赖 _shared/ 下的样式与脚本，单独复制出的 HTML 无法运行。 -->
<script>
if (!window.CF) {
  var notice = document.createElement('div');
  notice.style.cssText = 'max-width:40rem;margin:14vh auto;padding:24px;border:1px solid #d5d9e0;border-radius:12px;' +
    'font:14px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1d2330;background:#fff';
  notice.innerHTML = '<strong style="display:block;font-size:16px;margin-bottom:8px">原型未能加载 · Prototype could not load</strong>' +
    '请从完整的「页面原型」目录打开本文件：共享样式与脚本在 _shared/ 下，单独复制出来的 HTML 打不开。' +
    '需要单独发送的评审件请用 _shared/export.py 导出单文件版本。' +
    '<br><br>Open this file from the complete prototype folder — the shared styles and scripts live in _shared/, ' +
    'so a copied-out HTML cannot run. Use _shared/export.py to produce a self-contained review build.';
  document.body.appendChild(notice);
}
</script>
</body></html>
