<!doctype html>
<html lang="en" data-end="admin" data-admin-module="agreements">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agreements · Harbour Credit</title>
<link rel="stylesheet" href="../../_shared/tokens.css">
<link rel="stylesheet" href="../../_shared/base.css">
<link rel="stylesheet" href="../01-账户与登录/账户与登录.css">
<style>
/* Agreements: module compositions, inherited app shell and canonical tokens. */
.ag-stack{display:grid;gap:var(--sp-6);align-content:start;min-width:0}
.ag-stack>section{min-width:0}
.ag-heading [data-act="ag-cancel"]{color:var(--danger);border-color:var(--danger-border)}
.ag-heading [data-act="ag-cancel"]:hover{background:var(--danger-bg);border-color:var(--danger)}
.ag-heading .page-actions{flex-wrap:wrap;justify-content:flex-end}
.ag-stack :is(.ag-versions,.ag-kv,time){font-variant-numeric:tabular-nums}
.ag-sub{display:block;font-size:var(--fs-11);color:var(--muted);margin-top:var(--sp-1);overflow-wrap:anywhere}
.ag-wrap{overflow-wrap:anywhere;white-space:normal}
.ag-table{table-layout:fixed;width:100%;min-width:860px}

.ag-table .col-act{border-left:1px solid var(--row-line)}
.ag-table th,.ag-table td{overflow-wrap:anywhere}
.ag-table th.col-act,.ag-table td.col-act{position:sticky;right:0;background:var(--card);width:68px}
[data-end="admin"] table.ag-table thead th{white-space:normal;overflow-wrap:normal;word-break:normal;color:var(--muted)}
.ag-table .ag-sub{font-size:var(--ui-field-label)}
.ag-table .ag-stamp{font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-table .actlink{white-space:nowrap}
.ag-table .tag{white-space:nowrap;text-align:left}
/* Shared operations filter surface, retaining the existing multi-select contract. */
.ag-heading .page-actions{align-items:center}
.ag-toolbar .ag-status{flex:0 1 auto;max-width:100%}
.ag-filter .ag-status-label{padding-left:var(--sp-3);font-size:var(--ui-field-label);font-weight:400;color:var(--muted);white-space:nowrap}
.ag-status[data-on="1"] .ag-status-label{color:inherit}
.ag-status details{min-width:0}
[data-end="admin"] .ag-toolbar .ag-status summary{height:calc(var(--ctrl-h-sm) - 2px);min-height:0;min-width:100px;font-size:var(--ui-field-label);padding:0 30px 0 var(--sp-2);border:0;box-shadow:none;background:transparent;font-weight:400;color:inherit;border-radius:var(--radius-xs)}
.ag-filter summary{list-style:none;display:flex;align-items:center;cursor:pointer}
.ag-filter summary::-webkit-details-marker{display:none}
.ag-status:has(summary:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ag-status summary:focus-visible{outline:none}
.ag-options{position:absolute;top:calc(100% + var(--sp-1));left:0;z-index:var(--z-sticky);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:var(--sp-2);border-radius:var(--radius-sm);min-width:100%;width:max-content;max-width:min(320px,calc(100vw - 32px));display:grid;gap:var(--sp-1);font-size:var(--ui-row-value)}
.ag-options label{display:flex;gap:var(--sp-2);align-items:center;min-height:var(--ctrl-h-sm);padding-inline:var(--sp-2);border-radius:var(--radius-xs)}
.ag-options label:hover{background:var(--card-hover)}
.ag-options input{accent-color:var(--accent)}
.ag-filter .ag-status:has(details[open]){border-color:var(--accent)}
@media(max-width:600px),(pointer:coarse){
  [data-end="admin"] .ag-toolbar .ag-status summary{height:var(--ctrl-h);min-height:var(--ctrl-h)}
  .ag-options label{min-height:var(--ctrl-h)}
}
.ag-applied{display:flex;gap:var(--sp-2);align-items:baseline;flex-wrap:wrap;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);color:var(--muted);font-size:var(--ui-field-label)}
.ag-applied .tag{white-space:normal;text-align:left}
.ag-hint{margin:var(--sp-2) 0 0;font-size:var(--ui-field-label);color:var(--muted)}
.ag-error{font-size:var(--fs-12);color:var(--danger);margin-top:var(--sp-1);display:block}
.ag-error:empty{display:none}
.ag-table .cell-sub{color:var(--muted)}
.ag-table .ag-zone,.ag-versions .ag-zone{display:block;font-size:var(--fs-11);white-space:nowrap}
.ag-table .actlink,.ag-versions .actlink{display:inline-flex;align-items:center;min-height:var(--ctrl-h-sm);padding-inline:var(--sp-2);border-radius:var(--radius-xs)}
.ag-table .actlink:hover,.ag-versions .actlink:hover{background:var(--accent-soft)}
/* Keep review controls outside the business canvas and its fixed action column. */
#demoBtn{left:var(--sp-4);right:auto;bottom:88px}
/* Version history: records and download only; the effective row carries a tint as well as its status text. */
.ag-versions{table-layout:fixed;width:100%;min-width:860px}
[data-end="admin"] table.ag-versions thead th{white-space:normal;color:var(--muted)}
[data-end="admin"] .ag-versions tbody td{vertical-align:top;overflow-wrap:anywhere;white-space:normal}
.ag-versions th:first-child,.ag-versions td:first-child{padding-left:var(--card-pad)}
.ag-versions td:first-child{font-weight:600}
.ag-versions .tag{white-space:nowrap}
[data-end="admin"] .ag-versions tr.ag-active td{background:var(--accent-soft)}
.ag-versions .ag-ref td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.ag-versions .ag-plan{margin:0 0 var(--sp-1)}
.ag-versions th.col-act,.ag-versions td.col-act{text-align:right;padding-right:var(--sp-4);position:sticky;right:0;background:var(--card);border-left:1px solid var(--row-line)}
.ag-versions td.col-act .actlink{margin-top:calc(-1 * var(--sp-2))}
.ag-versions .actlink{white-space:nowrap;overflow-wrap:normal}
.ag-versions .ag-error{font-size:var(--ui-field-label)}
.ag-versions .ag-zone{color:var(--muted);margin-top:var(--sp-1)}
.ag-versions .ag-filename{font-weight:500;overflow-wrap:anywhere}
.ag-history-note{padding:var(--sp-4) var(--card-pad) 0}
.ag-history-hint{padding:var(--sp-3) var(--card-pad) var(--sp-4);margin:0;border-top:1px solid var(--row-line)}
/* Activity: match Token admission's section, event flow and directly visible details. */
#ag-activity{padding:var(--sp-5) var(--card-pad)}
.ag-activity-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);padding-bottom:var(--sp-4);margin-bottom:var(--sp-2);border-bottom:1px solid var(--border)}
.ag-activity-head h2{font-size:var(--ui-section-title);font-weight:600;margin:0;line-height:1.5}
#ag-activity>.card-b{padding:0}
.ag-timeline{list-style:none;margin:var(--sp-4) 0 0;padding:0}
.ag-event{position:relative;margin:0 0 0 5px;padding:0 0 var(--sp-6) var(--sp-5);border-left:1px solid var(--border);overflow-wrap:anywhere}
.ag-event:last-child{padding-bottom:0;border-left-color:transparent}
.ag-event:before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:var(--radius-pill);background:var(--accent)}
.ag-event[data-tone=ok]:before{background:var(--ok)}
.ag-event[data-tone=danger]:before{background:var(--danger)}
.ag-event[data-tone=warn]:before{background:var(--warn)}
.ag-event[data-tone=gray]:before{background:var(--border-strong)}
.ag-event h3{font-size:var(--fs-14);margin:0;font-weight:600}
.ag-event-meta{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);margin-top:var(--sp-2);font-size:var(--fs-12);color:var(--muted)}
.ag-event-meta>*{min-width:0}
.ag-event-result{margin:var(--sp-2) 0 0;font-size:var(--fs-13)}
.ag-stack :is(summary,.actlink,.tablewrap):focus-visible,.ag-upload:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-xs)}
.ag-event-detail{margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--card-2);border-radius:var(--radius-sm);display:grid;gap:var(--sp-2)}
.ag-kv{display:grid;grid-template-columns:136px minmax(0,1fr);gap:var(--sp-3) var(--sp-5);margin:0;font-size:var(--ui-row-value)}
.ag-kv dt{color:var(--muted);font-size:var(--ui-field-label)}
.ag-kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.ag-kv .ag-zone{margin-left:var(--sp-1)}
.ag-changes{table-layout:fixed;width:100%;font-size:var(--fs-12);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xs)}
.ag-changes th,.ag-changes td{white-space:normal;overflow-wrap:anywhere;vertical-align:top}
[data-end="admin"] .ag-changes :is(th,td){padding:var(--sp-2) var(--sp-3);vertical-align:top}
.ag-changes th:first-child{width:25%}
.ag-changes tbody th{text-align:left;color:var(--muted);font-weight:500}
/* Update agreement dialog: file and optional note only. */
.modal:has(.ag-upload-form){max-width:600px}
.modal:has(.ag-upload-form) .modal-b{padding-block:var(--sp-6)}
.ag-upload-form{display:grid;gap:var(--sp-6);color:var(--text)}
.ag-upload-form .field{margin:0;max-width:none}
.ag-upload-form .field-label{display:block;margin-bottom:var(--sp-2)}
.ag-upload{border:1px dashed var(--control-border);padding:var(--sp-6) var(--sp-5);text-align:center;border-radius:var(--radius-sm);background:var(--card-2)}
.ag-upload b{display:block;font-size:var(--ui-field-value);font-weight:400;margin-bottom:var(--sp-3)}
.ag-upload .btn{background:var(--card);border-color:var(--accent-border);color:var(--accent)}
.ag-upload:hover{border-color:var(--accent)}
.ag-upload-form .field:has(#ag-file-error:not(:empty)) .ag-upload{border-color:var(--danger)}
.ag-upload.has-file{padding:0;border:0;background:transparent;text-align:left}
.ag-upload.has-file .file-row{margin-top:0;background:var(--card-2)}
.ag-upload p[role=status]{margin:var(--sp-2) 0 0;color:var(--muted)}
.ag-upload-form textarea{height:112px;resize:vertical;padding:var(--sp-3);width:100%}
.ag-upload-form [disabled]{cursor:not-allowed}
.ag-upload-form .ag-count{display:block;text-align:right}
#ag-submit-error:focus{outline:none}
.ag-confirm>.dl{margin-top:0}
.ag-confirm>.note{margin-bottom:0}
@media(max-width:600px){
  #ag-activity{padding-inline:var(--sp-4)}
  .ag-kv{grid-template-columns:minmax(0,1fr);gap:var(--sp-1)}
  .ag-kv dd+dt{margin-top:var(--sp-2)}
  .ag-heading .page-actions{justify-content:flex-start}
}
</style>
</head>
<body class="ops-account">
<div id="portal" hidden></div>
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">HC</span><div><div class="brand-name">Harbour Credit</div><div class="brand-sub">Operations</div></div></div>
    <nav class="nav" id="anav" aria-label="Main navigation"></nav><div class="side-foot" id="asidefoot"></div>
  </aside>
  <div class="main"><div class="topbar"><div class="topbar-right" id="atools"></div></div><main class="content" id="acontent"><div class="crumbbar-in" id="acrumb"></div></main></div>
</div>
<!-- focus：共享运营登录与改密页的骨架，仅品牌与语言工具。 -->
<div class="focus" id="focus" hidden>
  <header class="focus-head"><div class="brand"><span class="brand-mark" aria-hidden="true">HC</span><span class="brand-name">Harbour Credit</span></div><div class="focus-tools" id="focusTools"></div></header>
  <main class="focus-main"><div class="focus-card" id="focusContent"></div></main>
  <footer class="focus-foot">Harbour Credit</footer>
</div>
<div id="layers"></div><div class="toasts" id="toasts" aria-live="polite"></div>
<button class="demo-btn" id="demoBtn" type="button"></button><aside class="demo-panel" id="demoPanel" hidden aria-label="Demo tools"></aside>
<script src="../../_shared/registry.admin.js"></script>
<script src="../../_shared/shell.js"></script>
<script src="../../_shared/admin-menu.js"></script>
<script src="../../_shared/admin-message-data.js"></script>
<script src="../../_shared/admin-notifications.js"></script>
<script src="../../_shared/file-row.js"></script>
<script src="../../_shared/puzzle.js"></script>
<script>CF.deferOpsBoot=true;</script>
<script src="../01-账户与登录/账户与登录.js"></script>
<script src="演示数据.js"></script>
<script src="协议管理.js"></script>

<!-- 共享运行时缺失时的兜底提示：整份原型依赖 _shared/ 下的样式与脚本，单独复制出的 HTML 无法运行。 -->
<script>
if (!window.CF) {
  var notice = document.createElement('div');
  notice.style.cssText = 'max-width:40rem;margin:14vh auto;padding:24px;border:1px solid #d5d9e0;border-radius:12px;' +
    'font:14px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1d2330;background:#fff';
  notice.innerHTML = '<strong style="display:block;font-size:16px;margin-bottom:8px">原型未能加载 · Prototype could not load</strong>' +
    '请从完整的「页面原型」目录打开本文件：共享样式与脚本在 _shared/ 下，单独复制出来的 HTML 打不开。' +
    '需要单独发送的评审件请用 _shared/export.py 导出单文件版本。' +
    '<br><br>Open this file from the complete prototype folder — the shared styles and scripts live in _shared/, ' +
    'so a copied-out HTML cannot run. Use _shared/export.py to produce a self-contained review build.';
  document.body.appendChild(notice);
}
</script>
</body>
</html>
