.ops-readout{font-size:var(--fs-12);color:var(--muted);margin-top:var(--sp-3);overflow-wrap:anywhere}
.ops-wait{padding:var(--sp-6);min-height:180px}

.ops-status{margin-bottom:var(--sp-4)}

});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f==='scenario')scenario(e.target.value);if(f==='locale')setLang(e.target.value);if(f==='timezone'){S.tz=e.target.value;savePrefs()}if(f==='modalScenario'){S.st=e.target.value;S.busy=S.st==='wait'?'wait':false;S.message='';CF.render()}});
document.addEventListener('blur',e=>{if(e.target.dataset.f==='email'&&e.target.value&&!S.busy){S.errors={};validateEmail();e.target.value=S.form.email;const err=S.errors.email;document.getElementById('email-help').textContent=err?t(err):'';e.target.setAttribute('aria-invalid',String(!!err));}},true);
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&S.modal){const all=Array.from(document.querySelectorAll('[role="dialog"] button:not([disabled]),[role="dialog"] input:not([disabled]),[role="dialog"] select:not([disabled])'));if(!all.length)return;const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
['pointerdown','keydown','submit'].forEach(name=>document.addEventListener(name,()=>{S.lastAction=clock()},{passive:true}));
window.addEventListener('storage',e=>{if(e.key===KEY+'revoked'&&S.auth){let v;try{v=JSON.parse(e.newValue)}catch{}expire(v?.reason||'session',true,false)}});
timer=setInterval(()=>{
 if(S.lockUntil){const n=remaining(S.lockUntil);document.querySelector('[data-count="lock"]')?.replaceChildren(document.createTextNode(mmss(n)));if(!n){S.lockUntil=0;S.st='default';CF.render()}}
 if(S.resendAt){const n=remaining(S.resendAt);document.querySelector('[data-count="resend"]')?.replaceChildren(document.createTextNode(n?L('Resend in ','重发倒计时 ')+n+'s':''));if(!n){S.resendAt=0;CF.render()}}
 if(S.capUntil){const n=remaining(S.capUntil);document.querySelector('[data-count="captcha"]')?.replaceChildren(document.createTextNode(n+'s'));if(!n){S.capUntil=0;S.capError='';CF.render()}}
 if(S.auth){if(clock()-S.lastAction>=1800000){expire('idle');return}if(S.expiresAt<=clock()){expire('session');return}if(!S.renewShown&&remaining(S.expiresAt)<=120){S.renewShown=true;S.modal={type:'renew'};CF.render()}document.querySelector('[data-count="renew"]')?.replaceChildren(document.createTextNode(mmss(remaining(S.expiresAt))))}
},1000);
window.addEventListener('pagehide',()=>clearInterval(timer));
})();
</script>
</body></html>
