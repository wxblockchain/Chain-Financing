<style>/* 只放本模块专有的组合。token 与公共组件一律来自 _shared，此处不重定义、不覆盖。 */
.pl-brand{border:0;padding:0;gap:var(--sp-3)}
.pl-spacer{flex:1}
.pl-title{font-size:var(--fs-24);margin:0 0 var(--sp-2);font-weight:660;letter-spacing:-.02em}
.pl-sub{color:var(--muted);margin:0 0 var(--sp-6);font-size:13px;line-height:1.6}
.pl-center{text-align:center}
.pl-form{margin:0}
.pl-gap{margin-top:var(--sp-4)}
.pl-gap-lg{margin-top:var(--sp-6)}
.pl-helper{min-height:1.5em;font-size:var(--fs-12);margin:var(--sp-1) 0 0;color:var(--muted)}

/* P-F50 / C-F01 类型选择：两张卡片必须视觉权重相同（F-F82），
   因此用等宽 grid、同一套边框与内边距，不给任一张 accent 底或更大尺寸。 */
.pl-roles{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.pl-role{display:flex;flex-direction:column;text-align:left;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-5);
  box-shadow:var(--shadow);transition:border-color var(--dur-fast) var(--ease-out)}
.pl-role:hover{border-color:var(--border-strong)}
.pl-role h3{font-size:var(--fs-16);font-weight:660;margin:0 0 var(--sp-2)}
.pl-role p{margin:0 0 var(--sp-5);font-size:12.5px;line-height:1.6;color:var(--muted);flex:1}
.pl-role p b{color:var(--text);font-weight:620}
.pl-remember{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:var(--sp-5);padding:var(--sp-3) var(--sp-4);background:var(--card-2);
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--muted)}
.pl-guest{margin-top:var(--sp-5);text-align:center}

/* C-F03 常驻补全提示条：占位而不悬浮（册二 5.3），因此放在内容区之上的正常文档流里。 */
.pl-bar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-sm);
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-5);font-size:12.5px;color:var(--warn)}
.pl-bar-tx{flex:1;min-width:200px;line-height:1.55}
.pl-bar.pl-bar-min{padding:var(--sp-2) var(--sp-3)}
.pl-bar-more{border:0;background:none;color:inherit;text-decoration:underline;font-size:var(--fs-11)}
.pl-bar-queue{list-style:none;margin:var(--sp-3) 0 0;padding:0;width:100%;border-top:1px dashed var(--warn-border)}
.pl-bar-queue li{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding:var(--sp-3) 0 0;font-size:12px}
.pl-bar-queue li span{flex:1;min-width:180px}

/* 能力行：权限矩阵总表（册二 6.3）在界面上的直接落点。
   一行 = 矩阵一行；右侧取值随当前身份列变化，⊘ 可点、❌ 不出现。 */
.pl-caps{list-style:none;margin:0;padding:0}
.pl-cap{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) 0;
  border-bottom:1px dashed var(--border-dash)}
.pl-cap:last-child{border-bottom:0}
.pl-cap-main{flex:1;min-width:0}
.pl-cap-name{font-size:13px;font-weight:620;line-height:1.4}
.pl-cap-sub{font-size:var(--fs-11);color:var(--faint);margin-top:2px;line-height:1.5}
.pl-cap-act{flex:none;display:flex;align-items:center;gap:var(--sp-2)}
.pl-mx{font-family:var(--mono);font-size:var(--fs-12);color:var(--faint);flex:none;width:20px;text-align:center}

/* 只读区块：资产方主体字段由对端维护（D-F86 / D-F87），
   用虚线边框 + 说明区表达「不是禁用，是本端无权」，不画置灰输入框。 */
.pl-ro{background:var(--card-2);border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);padding:var(--sp-4);margin-bottom:var(--sp-5)}
.pl-ro>p{margin:0 0 var(--sp-4);font-size:12.5px;color:var(--muted);line-height:1.6}

/* 四段式引导弹层（册二 5.2）：段序固定，补充区只在 L1 / L2 出现。 */
.pl-seg4{border-top:1px dashed var(--border-dash);margin-top:var(--sp-4);padding-top:var(--sp-4)}
.pl-seg4 .pl-seg4-h{font-size:var(--fs-11);font-weight:650;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);margin-bottom:var(--sp-3)}

/* 契约四字段读数：把 session_state / identity_type / completeness_level / account_id
   四项同时显示，因为它们必须整体取用（D-F186）。 */
.pl-contract{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--sp-3);font-size:var(--fs-11)}
.pl-contract div{background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:var(--sp-3)}
.pl-contract b{display:block;color:var(--faint);font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;font-size:var(--fs-10);margin-bottom:var(--sp-1)}
.pl-contract code{font-family:var(--mono);color:var(--hash-text);overflow-wrap:anywhere}

.pl-idsw{display:flex;align-items:center;gap:var(--sp-2)}
.pl-idsw>span{font-size:var(--fs-10);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.pl-wallets{display:flex;flex-direction:column;gap:var(--sp-2)}
.pl-wallet{display:flex;align-items:center;gap:var(--sp-3);text-align:left;width:100%;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elev);
  padding:var(--sp-3) var(--sp-4)}
.pl-wallet:hover{background:var(--card-hover)}
.pl-wallet .av{width:30px;height:30px;border-radius:var(--radius-xs);flex:none;display:grid;
  place-items:center;font-family:var(--mono);font-size:var(--fs-11);color:#fff;
  /* 与 base.css 的 .op-avatar 同一写法：渐变底上的文字色沿用公共层的 #fff 惯例，
     公共层没有为此发过 token（base.css 自身在 7 处这样写）。 */
  background:linear-gradient(135deg,var(--violet),var(--accent))}
.pl-wallet b{display:block;font-size:12.5px;font-weight:620}
.pl-wallet span span{font-size:var(--fs-10);color:var(--faint)}
.pl-lock{text-align:center;padding:var(--sp-6) var(--sp-4)}
.pl-lock-ico{color:var(--warn);margin-bottom:var(--sp-4)}
.pl-count{font-family:var(--mono);font-size:var(--fs-28);margin:var(--sp-4) 0}
.pl-skel{height:var(--sp-4);margin:var(--sp-4) 0;background:var(--track);border-radius:var(--radius-xs)}
.pl-skel-s{width:55%}
.pl-chain{list-style:none;margin:var(--sp-4) 0 0;padding:0;font-size:var(--fs-11);
  font-family:var(--mono);color:var(--muted)}
.pl-chain li{display:flex;align-items:center;gap:var(--sp-3);padding:3px 0}
.pl-chain li[data-on="1"]{color:var(--text)}
.pl-chain li[data-fail="1"]{color:var(--danger)}
.pl-chain .m{width:26px;flex:none;color:var(--faint)}
.pl-pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:var(--fs-11);
  background:var(--card-2);padding:var(--sp-3);border-radius:var(--radius-sm);color:var(--muted)}
.pl-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}

/* C-F20 滑块人机校验。以下 .cap-* 规则与 asset-platform 账户与登录原型、
   金融服务平台账户与登录原型里的同名规则逐字相同——它们生长在模块层而不在
   _shared/base.css 里，而 asset-platform/ 对本模块只读，因此无法在此处上收。
   本模块沿用同一形态是刻意的：C-F20 的同构基线就是资产端 C-01（分册 01 的 5.1），
   换一种滑块会让两端的同一个组件长得不一样。三处的同步需要人工保证，
   建议后续把这组规则移进 _shared/base.css 收敛为一份。 */
.cap-canvas{position:relative;width:328px;margin:0 auto;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--card-2)}
.cap-canvas canvas{display:block;width:328px;height:180px}
.cap-piece{position:absolute;top:0;left:0;will-change:transform}
.cap-track{margin:14px auto 0;width:328px;height:42px;border-radius:var(--radius-pill);background:var(--card-2);
  border:1px solid var(--border-strong);position:relative;display:flex;align-items:center;user-select:none;touch-action:none}
.cap-track.ok{border-color:var(--ok-border);background:var(--ok-bg)}
.cap-track.bad{border-color:var(--danger-border);background:var(--danger-bg)}
.cap-track.cool{opacity:.6}
.cap-track .tip{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-11);color:var(--faint);
  pointer-events:none}
.cap-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--accent-soft)}
.cap-knob{position:absolute;left:0;top:0;height:40px;width:48px;border-radius:var(--radius-pill);background:var(--bg-elev);
  border:1px solid var(--border-strong);display:grid;place-items:center;cursor:grab;color:var(--accent);
  font-family:var(--mono);font-size:13px;box-shadow:var(--shadow)}
.cap-knob:active{cursor:grabbing}
.cap-knob.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
.cap-knob[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.cap-msg{margin-top:10px;min-height:17px;font-size:var(--fs-11);line-height:1.5;text-align:center;color:var(--faint)}
.cap-msg.bad{color:var(--danger)}
.cap-msg.ok{color:var(--ok)}

@media(max-width:900px){.pl-roles{grid-template-columns:1fr}}
/* focus 版式的顶栏在窄屏折行。这里加的是本模块自己的 .pl-top，
   不重定义 base.css 的 .focus-top——桌面宽度下与其余模块逐像素一致，
   只有窄屏才让工具区换到第二行，避免语言切换器把页面顶出横向滚动。 */
@media(max-width:768px){
 .pl-top{flex-wrap:wrap;row-gap:var(--sp-3);padding-left:var(--sp-4);padding-right:var(--sp-4)}
 .pl-top .pl-spacer{flex-basis:100%;height:0}
 .pl-foot{flex-wrap:wrap;row-gap:var(--sp-2);padding-left:var(--sp-4);padding-right:var(--sp-4)}
}
@media(max-width:420px){.cap-canvas,.cap-canvas canvas,.cap-track{width:100%}}
@media(prefers-reduced-motion:reduce){.cap-knob.shake{animation:none}}

/* ------------------------------ 会话模型 --------------------------------- */
/* 三态由「会话态 × 完备度」两个维度共同判定，不压成一维状态机（D-F88）。
   界面任何地方都不直接读 ident / level，一律经 contract() 取四字段（D-F70 / D-F186）。 */
function initState(){
 return {
  ident:'guest',            /* guest | asset | funder */
  level:'L0',               /* 资产方只有 L0 / L3（D-F187）；资金方 L0/L1/L2/L3 */
  vdetail:'unverified',     /* 资产方 verification_status，只用于文案分流（D-F89） */
  /* 默认是一个凭据齐全的资金方，因此切到 L0 / L1 / L2 看到的是机构资料那三种引导。
     「缺邮箱 / 缺钱包」用顶栏的凭据开关显式制造——凭据未齐在引导优先级里排第一，
     默认就缺会把 L0 / L1 / L2 三种引导全挡住（册二 5.4 的优先级 ①）。 */
  creds:{email:true,wallet:true},
  hasPassword:true, agreed:true, firstLogin:false,
  entry:'sign_in',          /* entry_label：sign_in / apply，只影响文案 */
  tab:'email_code',         /* login_method */
  memory:null,              /* fsp_last_role，仅多给一个快捷入口（D-F180） */
  memoryOff:false,          /* E-96 本地存储不可用时静默降级 */
  handle:null,              /* 回跳句柄 F-F80 */
  crossAllow:false,         /* 跨域对端是否放行（见 landing()） */
  barCollapsed:false, barQueue:false,
  reauthAt:0, failCount:0, lockTier:0, lockLeft:0,
  form:{}, err:{}, capOk:false, walletAddr:'', walletConnected:false,
  chainStep:0, chainResult:'R1'
 };
}

/* 对外契约四字段（册三 7.2）。不得新增第五个字段。 */
function contract(){
 if(S.ident==='guest') return {session_state:'guest',identity_type:null,
   completeness_level:'L0',account_id:null};
 return {session_state:'authenticated',
   identity_type:S.ident==='asset'?'asset_party':'funder',
   completeness_level:S.level,
   account_id:S.ident==='asset'?'shadow_8f21c04b':'funder_3ad9e17c'};
}
/* 矩阵列号。资金方 L0/L1/L2 在权限上合并为 T2（分册 02 的 9.1.1）。 */
function col(){
 if(S.ident==='guest') return 0;
 if(S.ident==='asset') return S.level==='L3'?2:1;
 return S.level==='L3'?4:3;
}
function mx(row){
 var v=row[2][col()];
 /* 第 12 行：审核中服务端拒写，是 R-24「提交即锁定」在矩阵上的唯一落点 */
 if(row[4]&&row[4].l1no&&S.ident==='funder'&&S.level==='L1') return 'no';
 return v;
}
/* 三态的用户口径命名（分册 02 的 9.1）。 */
function stateName(){
 if(S.ident==='guest') return ['Guest','游客'];
 if(S.ident==='asset') return S.level==='L3'?['Signed in · verified','登录（已认证）']:['Signed in · not verified','登录（未认证）'];
 return S.level==='L3'?['Signed in · onboarded','登录（已入驻）']:['Signed in · not onboarded','登录（未入驻）'];
}
function credsMissing(){
 if(S.ident!=='funder') return [];
 var m=[]; if(!S.creds.wallet) m.push('wallet'); if(!S.creds.email) m.push('email');
 return m;   /* 顺序：钱包在前（分册 01 的 7.4.3 两项都缺时的步骤顺序） */
}

/* ---------------------- 回跳 DEP-M1（册一第 3 章）------------------------- */
/* 判定顺序自上而下，任一条不通过即失败并走 3.7 兜底。不得调换顺序、不得跳过。 */
function checkTarget(raw){
 var s=String(raw||'');
 /* D-F163 只接受站内相对路径 */
 if(!/^\//.test(s)||/^\/\//.test(s)||/\\/.test(s)||/^\/\./.test(s))
   return {ok:false,rule:'D-F163',ex:'E-90'};
 /* D-F164 先规范化再判定，且只做一轮解码 */
 var dec; try{ dec=decodeURIComponent(s); }catch(e){ return {ok:false,rule:'D-F164',ex:'E-90'}; }
 if(/%/.test(dec)) return {ok:false,rule:'D-F164',ex:'E-90'};
 var norm=dec.split('?')[0].replace(/\/+/g,'/');
 if(/(^|\/)\.\.?(\/|$)/.test(norm)) return {ok:false,rule:'D-F164',ex:'E-90'};
 /* D-F169 回跳目标不得是登录流程自身的页面 */
 for(var i=0;i<SELF_PATHS.length;i++)
   if(norm===SELF_PATHS[i]||norm.indexOf(SELF_PATHS[i]+'/')===0)
     return {ok:false,rule:'D-F169',ex:'E-90'};
 /* D-F165 路径前缀按完整路径段命中允许清单，不做字符串前缀包含判定 */
 var hit=ALLOW.some(function(p){ return p==='/'?norm==='/':(norm===p||norm.indexOf(p+'/')===0); });
 if(!hit) return {ok:false,rule:'D-F165',ex:'E-90'};
 /* D-F166 不得含用户信息段或凭据参数 */
 if(norm.indexOf('@')>=0) return {ok:false,rule:'D-F166',ex:'E-92'};
 var qs=dec.split('?')[1]||'', bad=null;
 qs.split('&').forEach(function(kv){ var k=kv.split('=')[0].toLowerCase(); if(!k) return;
   Object.keys(DENY_Q).forEach(function(g){ if(DENY_Q[g].indexOf(k)>=0) bad=k; }); });
 if(bad) return {ok:false,rule:'D-F166',ex:'E-92',param:bad};
 return {ok:true,norm:norm};
}
/* 句柄生成：先校验，通过才生成；不通过就不生成（册三 8.1）。
   句柄不含目标信息、不进 URL、不进本地存储——这里放在会话内的 JS 变量里，
   等价于 D-F161 的第 ① 种承载（服务端会话暂存）。 */
function mintHandle(target,capRow,domain){
 var r=checkTarget(target);
 if(!r.ok) return {bad:r};
 return {ref:'h_'+Math.random().toString(36).slice(2,10),target:r.norm,
   cap:capRow||null,domain:domain||'self',born:Date.now(),consumed:false};
}

/* 落地优先级（册一 3.6）——三条链路共用同一张表，自上而下命中即停。 */
function landing(){
 var h=S.handle;
 if(h&&!h.bad&&!h.consumed){
  var expired=Date.now()-h.born>30*60*1000;                    /* N-F33 30 分钟 */
  var crossBlocked=h.domain!=='self'&&!S.crossAllow;           /* E-95 / AC-F618 */
  if(expired||crossBlocked){
   S.handle=null; fallback(expired?'E-91':'E-95'); return;
  }
  h.consumed=true;                                             /* D-F174 一次性 */
  /* D-F177 重新执行前必须重新做一次权限判定——登录成功不等于该能力就可用 */
  var row=h.cap?MATRIX.filter(function(r){return r[0]===h.cap;})[0]:null;
  S.handle=null;
  if(row&&mx(row)!=='ok'){
   go('P-F51');
   /* 不是报错，而是转入受限引导，并保留原句柄的触发能力标识供文案取用 */
   openGuide(guideKey(),row); return;
  }
  go('P-F51');
  S.replay=row?row[0]:true;                                    /* D-F176 重新执行被拦下的操作 */
  toast('success',L('Picking up where you left off','已为你继续刚才的操作'),
        row?L(row[1][0]+' · resumed',row[1][1]+' · 已重新执行'):'');
  return;
 }
 if(S.ident==='funder'&&S.firstLogin){ go('P-F51'); ws316('P-F30'); return; }
 if(S.ident==='asset'&&!S.agreed){ go('P-F03'); return; }
 go('P-F51');
}
/* 3.7 失效兜底：一律落该身份的默认落地页 + 一条 Toast。
   Toast 只说「已为你回到首页」，不暴露校验失败的原因——把判定细节讲给用户，
   等于讲给探测者。失败原因进留痕，不进界面。 */
function fallback(ex){
 S.handle=null; go('P-F51');
 toast('info',L('We brought you back to the home page','已为你回到首页'),
   ex==='E-91'?L('That link has expired.','该链接已失效。'):'');
 S.trace=(S.trace||[]).concat([[ex,new Date().toISOString()]]);
}
/* 当前身份应当走哪一种引导情形（册二 5.2 六行）。 */
function guideKey(){
 if(S.ident==='guest') return 'guest';
 if(S.ident==='asset') return S.vdetail==='action_required'?'assetRejected':'assetVerify';
 if(credsMissing().length) return 'funderCreds';
 return S.level==='L1'?'funderL1':S.level==='L2'?'funderL2':'funderL0';
}
function openGuide(key,row){
 if(key==='guest'){ S.modal={type:'role',ctx:row?row[1]:null}; }
 else if(key==='funderCreds'){ S.modal={type:'creds',step:0,row:row||null}; }
 else S.modal={type:'guide',key:key,row:row||null};
 CF.render();
}
/* 能力入口被点击：⊘ 唤起引导；❌ 在界面上根本不出现，因此点不到；
   ✅ / ◐ 正常执行。⊘ 的「不可点」指不执行原业务操作，不是不响应点击（D-F90）。 */
function capClick(row){
 var v=mx(row);
 if(v==='gray'){
  /* D-F185 主按钮点击时先生成回跳句柄再跳转，顺序不得颠倒 */
  S.handle=mintHandle(DEMO.triggerPath,row[0],'self');
  openGuide(guideKey(),row); return;
 }
 toast('info',L(row[1][0],row[1][1]),L('Owned by a business issue — out of scope for WS-311.',
   '该能力的页面归业务 issue，不在 WS-311 范围内。'));
}

/* C-F03 常驻补全提示条（册二 5.3 / 5.4）。
   全站同一时刻最多一条（D-F79），其余以计数与清单表达，不堆叠、不并列。
   可折叠、不可永久关闭；折叠态仍然可见；折叠状态只记在会话内。 */
function bar(){
 var qs=barQueue(); if(!qs.length) return '';
 var top=qs[0];
 if(S.barCollapsed)
  return '<div class="pl-bar pl-bar-min">'+CF.ICO.warn
   +'<span class="pl-bar-tx">'+L('{n} item(s) to complete','还有 {n} 项待完成').replace('{n}',qs.length)+'</span>'
   +'<button class="pl-bar-more" type="button" data-act="barToggle">'+L('Expand','展开')+'</button></div>';
 return '<div class="pl-bar">'+CF.ICO.warn
  +'<span class="pl-bar-tx">'+top.tx+'</span>'
  +(qs.length>1?'<button class="pl-bar-more" type="button" data-act="barQueue">'
    +L('{n} more to complete','还有 {n} 项待完成').replace('{n}',qs.length-1)+'</button>':'')
  +btn(top.btn,'barGo',top.k,'sm primary')
  +'<button class="pl-bar-more" type="button" data-act="barToggle">'+L('Collapse','折叠')+'</button>'
  +(S.barQueue&&qs.length>1?'<ul class="pl-bar-queue">'+qs.slice(1).map(function(x){
      return '<li><span>'+x.tx+'</span>'+btn(x.btn,'barGo',x.k,'sm')+'</li>'; }).join('')+'</ul>':'')
  +'</div>';
}
/* 优先级：① 凭据未齐 → ② L2 已驳回 → ③ L0 未提交 → ④ 资产方未实名 → ⑤ 降级说明 */
function barQueue(){
 var out=[],m=credsMissing();
 if(S.ident==='funder'&&m.length){
  var tx=m.length===2?L('Add your email and link a wallet to be ready to apply.','补齐邮箱与钱包后即可提交入驻申请。')
    :m[0]==='wallet'?L('Link a wallet to be ready to apply.','绑定钱包后即可提交入驻申请。')
    :L('Add an email to be ready to apply and to receive security notifications.','绑定邮箱后即可提交入驻申请，并接收安全通知。');
  out.push({k:'creds',tx:tx,btn:L('Complete now','立即补全')});
 }
 if(S.ident==='funder'&&S.level==='L2')
  out.push({k:'l2',tx:L('Your institution profile was returned for changes.','机构资料被驳回，需要修改。'),
    btn:L('Edit and resubmit','编辑重提')});
 if(S.ident==='funder'&&S.level==='L0')
  out.push({k:'l0',tx:L('Submit your institution profile to invest.','提交机构资料后即可参与出资。'),
    btn:L('Complete now','立即前往')});
 if(S.ident==='asset'&&S.level!=='L3')

    '在资产平台完成实名认证后即可使用融资功能。'),btn:L('Complete now','立即前往')});
 if(S.downgraded)
  out.push({k:'downgrade',tx:L('Your approved status was withdrawn. Some features are limited until it is restored.',
    '你的已入驻资质已被撤销，恢复前部分功能受限。'),btn:L('See why','查看说明')});
 return out;
}

/* 一行 = 矩阵一行。取值决定右侧控件：⊘ 画着但点了走引导；◐ 标注脱敏；❌ 不渲染。 */
function capRow(r){
 var v=mx(r), hard=r[4]&&r[4].hard;
 var act = v==='gray'
   ? btn(L('Start','开始'),'cap',String(r[0]),'sm',' aria-describedby="cap-why-'+r[0]+'"')
   : v==='mask' ? '<span class="pill dash">'+L('Masked','脱敏')+'</span>'
   : btn(L('Open','进入'),'cap',String(r[0]),'sm');
 return '<li class="pl-cap"><span class="pl-mx" title="'+E(v)+'">'+MX_GLYPH[v]+'</span>'
  +'<span class="pl-cap-main"><span class="pl-cap-name">'+L(r[1][0],r[1][1])+'</span>'
  +'<span class="pl-cap-sub" id="cap-why-'+r[0]+'">'
  +(v==='gray'?(hard?L('Hard gate · select to see what is missing','硬卡点 · 点击查看还缺什么')
                    :L('Restricted · select to see what is missing','受限 · 点击查看还缺什么'))
    :v==='mask'?L('Visible in ranges only; exact values are withheld server-side','仅按区间可见，精确值由服务端不返回')
    :L('Row {n} of the capability matrix','权限矩阵第 {n} 行').replace('{n}',r[0]))+'</span></span>'
  +'<span class="pl-cap-act">'+act+'</span></li>';
}
/* D-F176：回到原触发点后是「重新执行那个被拦下的操作」，不是回到页面让用户再点一次。 */
function replayBanner(){
 if(!S.replay) return '';
 var row=MATRIX.filter(function(r){return r[0]===S.replay;})[0];
 return note('green','<p>'+L('Your earlier action was resumed automatically — no middle page, no extra prompt.',
   '刚才被拦下的操作已自动重新执行——无中间页、无额外提示。')+'</p>',
   row?L(row[1][0]+' · resumed',row[1][1]+' · 已重新执行'):L('Resumed','已重新执行'));
}

/* ====================== P-F50 / C-F01 用户类型选择 ======================= */
/* F-F82：两张卡片并列、视觉权重相同。不得把任一方做成默认选中、高亮或更大——
   本平台两侧是对等的交易参与方，权重差异会被读成平台立场。
   D-F07：P-F50 与 C-F01 是同一组件的两种呈现，两张卡片的标题、说明、按钮文案
   必须逐字一致；弹层形态额外带一行上下文说明。此处两者共用 roleCards()。 */
function roleCards(){
 return '<div class="pl-roles">'
  +[['asset','ASSET'],['funder','FUNDER']].map(function(x){
    var c=ROLE_COPY[x[0]];
    return '<div class="pl-role"><h3>'+L(c.n[0],c.n[1])+'</h3><p>'+L(c.d[0],c.d[1])+'</p>'
     +btn(L(ROLE_COPY.go[0],ROLE_COPY.go[1]),'pickRole',x[0],'primary block')+'</div>'; }).join('')
  +'</div>'
  /* D-F178~D-F180 记忆只多给一个快捷入口，不影响默认选中，两张卡片仍然对等。 */
  +(S.memory&&!S.memoryOff?'<div class="pl-remember"><span>'
    +L(ROLE_COPY.mem[0],ROLE_COPY.mem[1])+' 「'
    +(S.memory==='asset'?L(ROLE_COPY.asset.n[0],ROLE_COPY.asset.n[1])
                        :L(ROLE_COPY.funder.n[0],ROLE_COPY.funder.n[1]))+'」</span>'

         'pickRole',S.memory,'sm')+'</div>':'');
}

/* ======================= P-F01 SSO 中转（资产方）========================= */
/* 统一落地处理链 L-1～L-9。两条入口（A 资产端发起 / B 本端发起）从 L-1 起共用
   同一实现，PRD 与代码中都不存在第二套（F-F09）。 */
const CHAIN=[
 ['L-1',['state / nonce check','回调参数与 state / nonce 校验'],'R3'],
 ['L-2',['exchange code · verify id_token','换码并校验 id_token'],'R3'],
 ['L-3',['read claims · account_id','解析 claims 取 account_id'],'R3'],
 ['L-4',['subject availability','对端主体可用性判定'],'R2'],
 ['L-5',['shadow account upsert','影子账号 upsert 与快照整体覆盖'],'E-11'],
 ['L-6',['destroy any other session','销毁本端已有的另一账号会话'],null],
 ['L-7',['establish session','建立会话'],null],
 ['L-8',['first-login agreement check','首登协议同意判定'],null],
 ['L-9',['completeness · call trunk return-to','完备度判定 → 调用主干回跳落地'],null]
];
function pageSso(){
 var st=S.st, fails={R2:'L-4',R3:'L-1','E11':'L-5'}[st]||null;
 var stop=fails?CHAIN.map(function(c){return c[0];}).indexOf(fails):CHAIN.length;
 var body='<div class="card"><div class="card-b">'
  +'<div class="pl-center"><div class="spinner" style="margin:0 auto 16px"></div>'
  +'<h1 class="pl-title">'+L('Signing you in','正在为你登录')+'</h1>'
  +'<p class="pl-sub">'+L('Returned from {p}. This takes a moment.','已从「{p}」返回，请稍候。')
    .replace('{p}',L(DEMO.idpName[0],DEMO.idpName[1]))+'</p></div>'
  +'<ul class="pl-chain">'+CHAIN.map(function(c,i){
     var on=i<stop, bad=fails&&i===stop;
     return '<li data-on="'+(on?1:0)+'" data-fail="'+(bad?1:0)+'"><span class="m">'+c[0]+'</span>'
      +'<span>'+L(c[1][0],c[1][1])+'</span><span style="margin-left:auto">'
      +(bad?'✕':on?'✓':'·')+'</span></li>'; }).join('')+'</ul>';
 if(st==='R2') body+=note('red','<p>'+L('Your account is not available on the asset platform right now. Expected release: 2026-09-11 10:00 (UTC+8) · support@demo-chainfinancing.test',
   '你在资产平台的账户当前不可用。预计解除：2026-09-11 10:00（UTC+8）· support@demo-chainfinancing.test')
   +'</p><p class="tiny">'+L('No session is created; any existing session on this platform is invalidated. You land back as a guest, on the page you were trying to reach.',
   '不建会话；本端已有会话立即失效。回落游客态，停在你原本要去的页面。')+'</p>',
   L('R2 · subject unavailable (E-09 / E-10)','R2 · 主体不可用（E-09 / E-10）'));
 if(st==='R3') body+=note('red','<p>'+L('Sign-in could not be completed. Please try again. Error code: SSO-1042',
   '登录未能完成，请重试。错误码：SSO-1042')+'</p><p class="tiny">'+L(
   'The message is deliberately neutral: it does not say whether the signature failed or the provider was unreachable. Details go to the server log, not to the screen.',
   '文案刻意中性：不说明是验签失败还是对端不可达。细节进服务端日志，不进界面。')+'</p>',
   L('R3 · failed (E-01～E-07)','R3 · 失败（E-01～E-07）'));
 if(st==='E11') body+=note('amber','<p>'+L('Your identity was verified, but your account could not be created here. This is the only failure that gets its own page (D-F80).',
   '你的身份已在对端验证通过，但本端账号未能建立。这是唯一有独立失败页的分支（D-F80）。')+'</p>',
   L('E-11 · shadow account creation failed','E-11 · 影子账号建立失败'));
 body+='<div class="pl-actions">'
  +(st==='R2'||st==='R3'?btn(L('Back to the page you were on','回到原来的页面'),'ssoDone',st,'primary'):'')
  +(st==='E11'?btn(L('Go to the failure page','进入失败状态页'),'go','P-F05','primary'):'')
  +(st==='ok'||st==='first'?btn(L('Continue','继续'),'ssoDone',st,'primary'):'')
  +'</div>'
  +stateBar([['ok','R1 · returning user','R1 成功 · 非首登'],['first','R1 · first login','R1 成功 · 首登'],
             ['R2','R2 · subject unavailable','R2 主体不可用'],['R3','R3 · failed','R3 失败'],
             ['E11','E-11 · shadow account','E-11 影子账号建立失败']],'st',st,'margin:20px 0 0')
  +'</div></div>'
  +note('','<p>'+L('Entry A (asset platform starts it) and entry B (this platform starts it) share this chain from L-1. There is no second implementation.',
    '入口 A（资产端发起）与入口 B（本端发起）从 L-1 起共用本链路，不存在第二套实现。')+'</p>',
    L('F-F09 · one landing chain','F-F09 · 统一落地处理链'));
 return focusWrap(body,L('P-F01 · WS-314 vol.1 §7.4','P-F01 · 资产方册一 7.4'));
}

function drawCaptcha(){
 var bg=q('#capBg'), pc=q('#capPiece'); if(!bg||!pc) return;
 var W=328,H=180,PS=46,tx=133,ty=58,i,x,y,w,h,seed=7;
 function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
 var off=document.createElement('canvas'); off.width=W; off.height=H;
 var o=off.getContext('2d'), hue=212, g=o.createLinearGradient(0,0,W,H);
 g.addColorStop(0,'hsl('+hue+',58%,74%)'); g.addColorStop(1,'hsl('+((hue+52)%360)+',52%,58%)');
 o.fillStyle=g; o.fillRect(0,0,W,H);
 for(i=0;i<9;i++){
  o.globalAlpha=0.12+rnd()*0.2; o.fillStyle='hsl('+((hue+i*26)%360)+',62%,'+(52+rnd()*32)+'%)';
  x=rnd()*W; y=rnd()*H; w=24+rnd()*140; h=10+rnd()*90;
  o.beginPath(); o.roundRect?o.roundRect(x,y,w,h,10):o.rect(x,y,w,h); o.fill();
 }
 o.globalAlpha=1;
 function path(c,px,py){
  var rr=6,k=PS*0.22;
  c.beginPath(); c.moveTo(px+rr,py); c.lineTo(px+PS*0.42,py);
  c.arc(px+PS*0.5,py,k,Math.PI,0,true);
  c.lineTo(px+PS-rr,py); c.quadraticCurveTo(px+PS,py,px+PS,py+rr);
  c.lineTo(px+PS,py+PS*0.38); c.arc(px+PS,py+PS*0.5,k,-Math.PI/2,Math.PI/2,false);
  c.lineTo(px+PS,py+PS-rr); c.quadraticCurveTo(px+PS,py+PS,px+PS-rr,py+PS);
  c.lineTo(px+rr,py+PS); c.quadraticCurveTo(px,py+PS,px,py+PS-rr);
  c.lineTo(px,py+rr); c.quadraticCurveTo(px,py,px+rr,py); c.closePath();
 }
 var b=bg.getContext('2d'); b.clearRect(0,0,W,H); b.drawImage(off,0,0);
 b.save(); path(b,tx,ty); b.fillStyle='rgba(16,24,40,.55)'; b.fill();
 b.strokeStyle='rgba(255,255,255,.75)'; b.lineWidth=1.5; b.stroke(); b.restore();
 var p=pc.getContext('2d'); p.clearRect(0,0,W,H);
 p.save(); path(p,0,ty); p.clip(); p.drawImage(off,-tx,0); p.restore();
 p.save(); path(p,0,ty); p.strokeStyle='rgba(255,255,255,.9)'; p.lineWidth=1.5; p.stroke(); p.restore();
}

   登录后替换为账号下拉（C-F26）。这是登录的唯一常驻入口（D-F78 / D-F181）。 */
const IDENTS=[['guest','Guest','游客'],['asset0','Asset · L0','资产方 · 未认证'],
 ['asset3','Asset · L3','资产方 · 已认证'],['funder0','Funder · L0','资金方 · 未提交'],
 ['funder1','Funder · L1','资金方 · 审核中'],['funder2','Funder · L2','资金方 · 已驳回'],
 ['funder3','Funder · L3','资金方 · 已入驻']];
function identKey(){
 if(S.ident==='guest') return 'guest';
 if(S.ident==='asset') return S.level==='L3'?'asset3':'asset0';
 return 'funder'+S.level.slice(1);
}
function setIdent(k){
 if(k==='guest'){ S.ident='guest'; S.level='L0'; }
 else if(k.indexOf('asset')===0){ S.ident='asset'; S.level=k==='asset3'?'L3':'L0';
   S.vdetail=k==='asset3'?'verified':S.vdetail==='action_required'?'action_required':'unverified'; }
 else { S.ident='funder'; S.level='L'+k.slice(6); }
 syncNav();
 /* 契约四字段由服务端计算并输出，前端不自行拼装三态（D-F189）——
    切换身份等价于服务端重新下发了一份契约，界面只是重新消费它。 */
 if(S.page==='P-F04'&&S.ident!=='asset') CF.go('P-F51');
 if(S.page==='P-F24'&&S.ident!=='funder') CF.go('P-F51');

 mod.account = S.ident==='guest' ? null : accountOf;

/* ============================== 交互 ==================================== */
const MINE=['go','st','cap','pickRole','guest','signin','signout','switchRole','tab','showPwd',
 'sendCode','submitCode','submitPwd','openCap','capView','capPass','openWallet','wView','wSign',
 'openEmail','openPwd','emailNext','pwdModalSave','credsNext','reFactor','reGo','ws316','support',
 'leaveSite','leaveGo','entryB','ssoDone','agreeChk','agreeGo','agreeDoc','barToggle','barQueue',
 'barGo','anchor','copyAddr','explorer','openPages','ident','cred','cross','pwdSend','pwdSave',
 'close','langSel','probe'];
function onAct(n,a,v,e){
 if(n.classList.contains('mask')&&e.target!==n) return true;
 if(MINE.indexOf(a)<0) return false;
 e.preventDefault();
 if(a!=='menu'&&S.menu&&a!=='ident'&&a!=='cred'&&a!=='cross') S.menu=null;
 switch(a){
  case 'close': S.modal=null; break;
  case 'go': S.modal=null; CF.go(v); return true;
  case 'st': CF.setState(v); return true;
  case 'ident': setIdent(v); S.menu=null; break;
  case 'cred': S.creds[v]=!S.creds[v]; break;
  case 'cross': S.crossAllow=!S.crossAllow; break;
  case 'cap': capClick(MATRIX.filter(function(r){return r[0]===parseInt(v,10);})[0]); return true;
  case 'signin': S.entry='sign_in'; S.modal=null; CF.go('P-F50'); return true;
  case 'signout':
   /* ST-2 退出登录一律回落游客态，不落到登录页 */
   setIdent('guest'); S.modal=null; S.replay=null; CF.go('P-F51');
   toast('info',L('You are signed out','已退出登录'),
     L('You can keep browsing as a guest.','你可以继续以游客身份浏览。')); return true;
  case 'guest': setIdent('guest'); S.modal=null; S.replay=null; CF.go('P-F51'); return true;
  case 'pickRole':
   S.memory=v; S.modal=null;
   if(v==='asset'){ S.modal={type:'leave',to:'authorize',from:'role'}; }
   else { S.form={}; S.err={}; CF.go('P-F20'); return true; }
   break;
  case 'switchRole':
   /* D-F182 保留回跳句柄、清除身份记忆、不清空入驻草稿；清除已填的凭据字段 */
   S.memory=null; S.form={}; S.err={}; S.walletAddr=''; S.modal=null; CF.go('P-F52'); return true;
  case 'tab': S.tab=v; S.err={}; break;
  case 'showPwd': S.form._showPwd=!S.form._showPwd; break;
  case 'sendCode': case 'pwdSend': S.modal={type:'captcha',view:'idle',next:a}; break;
  case 'openCap': S.modal={type:'captcha',view:'idle',next:'inline',back:S.modal,ctx:v}; break;
  case 'capView': S.modal.view=v; break;
  case 'capPass': {
   var nx=S.modal.next, back=S.modal.back;
   if(S.modal.view!=='ok'){ S.modal.view='ok'; break; }
   S.capOk=true;
   if(nx==='inline'){ S.modal=back; toast('success',L('Code sent','验证码已发送'),''); }
   else if(nx==='pwdSend'){ S.modal=null; CF.setState('sent'); return true; }
   else { S.modal=null; CF.setState('sent'); return true; }
   break; }
  case 'openWallet': S.modal={type:'wallet',view:'pick',ctx:v}; break;
  case 'wView': S.modal.view=v; break;
  case 'wSign': {
   S.modal.view='waiting';
   var ctx=S.modal.ctx;
   setTimeout(function(){
    if(!S.modal||S.modal.type!=='wallet') return;
    S.modal=null; S.walletConnected=true;
    if(ctx==='creds'||ctx==='bind'){ S.creds.wallet=true;
      toast('success',L('Wallet linked','钱包已绑定'),
        L('A security notification was sent to your email.','已向你的邮箱发送安全通知。'));
      if(ctx==='creds'){ var m=credsMissing(); if(m.length) S.modal={type:'creds',step:0}; }
    } else if(ctx==='reauth'){ S.reauthAt=Date.now();
      toast('success',L('Identity confirmed','身份已确认'),''); S.modal=S.pendingModal||null; S.pendingModal=null;
    } else { S.ident='funder'; S.level='L0'; S.creds={email:false,wallet:true}; S.firstLogin=true;
      syncNav(); landing(); return; }
    CF.render(); },900);
   break; }
  case 'submitCode': {
   CF.setState('submitting');
   setTimeout(function(){ S.ident='funder'; S.level='L0'; S.creds={email:true,wallet:false};
     S.firstLogin=S.entry==='apply'; syncNav(); landing(); },700);
   return true; }
  case 'submitPwd': {
   CF.setState('submitting');
   setTimeout(function(){ S.failCount++; CF.setState(S.failCount>=3?'locked':'fail'); },700);
   return true; }
  case 'entryB': S.modal={type:'leave',to:'authorize',from:'entryB'}; break;
  case 'leaveSite': S.modal={type:'leave',to:v||'usercenter',from:'guide'}; break;
  case 'leaveGo': {
   /* D-F185 先生成回跳句柄再跳转，顺序不得颠倒。跨域场景句柄塞进授权请求的 state。 */
   if(!S.handle||S.handle.consumed) S.handle=mintHandle(DEMO.triggerPath,7,'asset_platform');
   else S.handle.domain='asset_platform';
   S.modal=null; CF.go('P-F01'); CF.setState('ok'); return true; }
  case 'ssoDone': {
   var st=S.st;
   if(st==='R2'||st==='R3'){ setIdent('guest'); S.handle=null; CF.go('P-F51');
     toast('danger',st==='R2'?L('Your account is not available right now','账户当前不可用')
                              :L('Sign-in could not be completed','登录未能完成'),
       L('You are browsing as a guest. Nothing was changed.','你正以游客身份浏览，未改变任何数据。'));
     return true; }
   /* R1 非首登 = 一个已经在用的资产方，对端认证已通过（L3）；
      R1 首登 = 新用户，尚未实名（L0）且还没同意本端协议。
      两条分支都要能走到：前者演示「回到原触发点并重新执行」，
      后者演示「登录完成不等于该能力可用」——落地时重判权限，转受限引导（D-F177）。 */
   S.ident='asset';
   if(st==='first'){ S.level='L0'; S.vdetail='unverified'; S.agreed=false; }
   else { S.level='L3'; S.vdetail='verified'; S.agreed=true; }
   syncNav(); landing(); return true; }
  case 'agreeChk': S.form.agree=!S.form.agree; break;
  case 'agreeGo': if(!S.form.agree){ S.err.agree=1; break; }
   S.agreed=true; S.err={}; landing(); return true;
  case 'agreeDoc': S.modal={type:'agreeDoc'}; break;
  case 'openEmail': S.pendingModal={type:'email',step:0}; S.modal=reauthNeeded()?{type:'reauth'}:S.pendingModal; break;
  case 'openPwd': S.pendingModal={type:'pwd'}; S.modal=reauthNeeded()?{type:'reauth'}:S.pendingModal; break;
  case 'reFactor': S.modal.factor=v; break;
  case 'reGo': S.reauthAt=Date.now(); S.modal=S.pendingModal||null; S.pendingModal=null;
   toast('success',L('Identity confirmed','身份已确认'),
     L('You will not be asked again for 10 minutes.','10 分钟内不会再次要求。')); break;
  case 'emailNext': {
   var bind=!S.creds.email, last=bind?0:1;
   if((S.modal.step||0)<last){ S.modal.step=(S.modal.step||0)+1; break; }
   S.creds.email=true; S.modal=null;
   if(bind) toast('success',L('Email linked','邮箱已绑定'),
     L('First-time linking does not sign out your other sessions.','首次绑定不触发会话失效。'));
   else { setIdent('guest'); CF.go('P-F20');
     toast('info',L('All sessions signed out','全部会话已失效'),
       L('Sign in with your new email. We notified both addresses.','请用新邮箱登录。已向新旧邮箱各发一封通知。'));
     return true; }
   break; }
  case 'pwdModalSave': {
   S.hasPassword=true; S.modal=null; setIdent('guest'); CF.go('P-F20');
   toast('info',L('All sessions signed out','全部会话已失效'),
     L('Sign in with your new password. A security notification was sent.','请用新密码登录，已发送安全通知。'));
   return true; }
  case 'pwdSave': { S.hasPassword=true; setIdent('guest'); CF.go('P-F20');
   toast('success',L('Password saved','密码已保存'),
     L('Sign in with your new password.','请用新密码登录。')); return true; }
  case 'credsNext': {
   var mm=credsMissing();
   if(mm.length>1&&(S.modal.step||0)===0){ S.modal.step=1; break; }
   S.creds.email=true; S.creds.wallet=true; S.modal=null;
   /* 7.4.4 回调语义是「重新执行刚才被拦下的那个动作」，不是跳转到某个页面 */
   toast('success',L('Credentials complete','凭据已补齐'),
     L('Resuming what you were doing.','正在继续刚才的操作。'));
   break; }
  case 'ws316': S.modal={type:'ws316',pid:v||'P-F30'}; break;
  case 'support': toast('info',L('Support','客服'),'support@demo-chainfinancing.test'); break;
  case 'barToggle': S.barCollapsed=!S.barCollapsed; S.barQueue=false; break;
  case 'barQueue': S.barQueue=!S.barQueue; break;
  case 'barGo':
   if(v==='creds'){ S.modal={type:'creds',step:0}; }
   else if(v==='verify'){ S.modal={type:'leave',to:'usercenter',from:'bar'}; }
   else if(v==='downgrade'){ S.modal={type:'guide',key:'funderL0',row:null}; }
   else { S.modal={type:'ws316',pid:v==='l2'?'P-F34':'P-F30'}; }
   break;
  case 'anchor': { var el=q('#sec-'+v); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return true; }
  case 'copyAddr': toast('success',L('Address copied','地址已复制'),''); break;

    L('Opens the address on the demo explorer.','在演示区块浏览器中打开该地址。')); break;
  case 'openPages': S.drawer='pages'; break;
  case 'langSel': return false;
  case 'probe': runProbe(v); break;
  default: return false;
 }
 CF.render(); return true;
}
function reauthNeeded(){ return Date.now()-S.reauthAt>10*60*1000; }
function onInput(n,k){
 var v=n.value;
 if(k==='addr'){ S.walletAddr=v.trim(); return true; }
 S.form[k]=v; if(S.err[k]) delete S.err[k];
 return true;
}

/* 公共运行时不代理 input / change，模块自行绑定一次（与仓库既有模块一致）。
   需要实时反馈的字段（密码复杂度、钱包地址格式）才重绘；其余只更新状态，
   避免每敲一个字符就重排整页。焦点与光标位置由 shell 按 data-f 复位。 */
const LIVE={np:1,np2:1,addr:1};
document.addEventListener('input',function(e){
 var n=e.target, k=n.getAttribute&&n.getAttribute('data-k'); if(!k) return;
 onInput(n,k); if(LIVE[k]) CF.render();
});
document.addEventListener('change',function(e){
 var n=e.target;
 if(n.getAttribute&&n.getAttribute('data-act')==='langSel'){ CF.state().lang=n.value; CF.render(); }
});

 ['/assetsx/AR-1',['prefix looks similar but is a different segment','前缀相似但不是同一路径段']],

 ['/account?token=abc123',['carries a credential parameter','携带凭据参数']],

];
function probeCard(){
 var r=S.probeResult;
 return '<div class="card pl-gap-lg"><div class="card-head"><b>'
  +L('Return-to check · DEP-M1','回跳判定 · DEP-M1')+'</b><span>'
  +L('Six rules, evaluated top to bottom; the first failure stops it','六条规则自上而下，任一条不通过即判定失败')+'</span></div>'
  +'<div class="card-b"><div class="tags" style="margin-bottom:14px">'
  +PROBES.map(function(p,i){ return '<button class="tag more" type="button" data-act="probe" data-v="'+i+'">'
     +'<span class="mono">'+E(p[0])+'</span></button>'; }).join('')+'</div>'
  +(r?(r.ok
     ? note('green','<p class="mono">'+E(r.target)+'</p><p>'
        +L('Accepted. A handle is minted; the target never appears in the URL.',
           '判定通过。生成句柄，目标不在 URL 中出现。')+'</p>',L('Pass','通过'))
     : note('red','<p class="mono">'+E(r.target)+'</p><p>'
        +L('Rejected by {r}{p} → fall back to the home page with a toast. The user is never told which rule failed.',
           '被 {r} 拒绝{p} → 落首页 + 一条 Toast。界面不告诉用户是哪一条规则失败。')
          .replace('{r}',r.rule).replace('{p}',r.param?' ('+E(r.param)+')':'')
        +'</p><p class="tiny">'+L('Logged as {e}.','留痕记为 {e}。').replace('{e}',r.ex)+'</p>',L('Reject','拒绝')))
    :'<p class="hint">'+L('Pick a target above to see how it is judged.','选一个目标看它怎么判。')+'</p>')
  +'<p class="hint pl-gap">'+L('Allowed prefixes are matched by whole path segment, never by string containment: /assets matches /assets and /assets/123 but not /assetsx or /assets-admin.',
    '允许清单按完整路径段比较，不做字符串前缀包含判定：/assets 命中 /assets 与 /assets/123，但不命中 /assetsx、/assets-admin。')+'</p>'
  +'</div></div>';
}
function runProbe(i){
 var p=PROBES[parseInt(i,10)], r=checkTarget(p[0]);
 S.probeResult={target:p[0],ok:r.ok,rule:r.rule,ex:r.ex,param:r.param};
}

 'P-F20':[['neutral failure / 中性提示','That email and password combination isn’t correct.','邮箱与密码不匹配。'],
  ['signing purpose / 签名用途','Signing this message proves you own this wallet. It does not send a transaction, does not cost gas, and does not move or approve any assets.',
   '签署这条消息只用于证明你拥有该钱包。它不会发起交易、不消耗 gas，也不会转移或授权任何资产。']],
 'P-F21':[['neutral send / 中性发送','If an account exists for this address, we’ve sent a verification code to it.','若该邮箱已注册，我们已向它发送验证码。']],
 'P-F24':[['RISK-01 ①','Use a long-lived company email. Avoid personal mailboxes or accounts tied to one employee — this address can’t be replaced if you lose access to it.',
   '请使用长期有效的企业邮箱，避免使用个人邮箱或离职风险高的个人账号——该邮箱一旦无法访问将无法更换。'],
  ['RISK-01 ②','This wallet address can’t be changed after linking. Make sure you’ll keep long-term access to it.',
   '该钱包地址绑定后不可更换，请确保长期可访问。']],
 'P-F04':[['leaving notice / 离站告知','You are leaving the financial service platform. You will be redirected to the asset platform to continue.',
   '即将离开金融服务平台。我们将带你前往「资产平台」继续操作。']]
}; }
/* 每一项都是 getter：抽屉打开那一刻才求值，因此语言切换后内容跟着变。
   公共层的 CF.define 复制的是对象引用，getter 因此保留下来。 */
const PRD_PAGES=['P-F51','P-F50','P-F01','P-F03','P-F04','P-F20','P-F21','P-F22','P-F24','P-F52','P-F53','P-F05'];
const PRD_OUT={};
PRD_PAGES.forEach(function(k){
 var o={};
 Object.defineProperty(o,'title',{get:function(){ return CF.pageName(k); },enumerable:true});
 Object.defineProperty(o,'src',{get:function(){ return (PRD_DATA()[k]||{src:[]}).src.join(' · '); },enumerable:true});
 Object.defineProperty(o,'rules',{get:function(){ return (PRD_DATA()[k]||{}).items||[]; },enumerable:true});
 Object.defineProperty(o,'states',{get:function(){ return PRD_STATES_DATA()[k]||[]; },enumerable:true});
 Object.defineProperty(o,'copy',{get:function(){ return PRD_COPY_DATA()[k]||[]; },enumerable:true});
 PRD_OUT[k]=o;
});

/* ============================ 页面状态表 ================================= */
const STATES={
 'P-F51':[['default','Default','默认'],['loading','Loading','加载中'],

 'P-F01':[['ok','R1 · returning user','R1 成功 · 非首登'],['first','R1 · first login','R1 成功 · 首登'],

 'P-F20':P20_STATES,

};

/* ============================ 渲染分发 =================================== */
function renderContent(){
 var f={'P-F51':pageHome,'P-F04':pageAssetAccount,'P-F24':pageFunderAccount}[S.page];
 var html=f?f():'';
 if(S.page==='P-F51'&&['default','empty'].indexOf(S.st)>=0) html+=probeCard();
 return html;
}
function renderFocus(){
 var f={'P-F50':pageRole,'P-F52':pageSwitch,'P-F53':pageFail,'P-F01':pageSso,
        'P-F03':pageAgree,'P-F05':pageSsoFail,'P-F20':pageFunderLogin,
        'P-F21':pagePwdEmail,'P-F22':pagePwdNew}[S.page];
 return f?f():'';
}
function crumbParts(){
 if(S.page==='P-F51') return [];
 return [[L('Home','平台首页'),'P-F51']];
}

/* URL 方案：用产品自己的路径，不用 #/<page-id>。取值与 registry 的 CF.ENTRY 一致，
   别的模块按登记表跳过来时才落得到对应页面。/account 由身份解析到 P-F04 或 P-F24——
   两种身份各有自己的账户页，但对用户是同一条地址。 */
const PATHS={'P-F51':'/','P-F50':'/signin/role','P-F52':'/signin/switch','P-F53':'/signin/error',
 'P-F01':'/signin/sso/callback','P-F03':'/signin/agreement','P-F05':'/signin/sso/failed',
 'P-F20':'/signin/funder','P-F21':'/signin/password/email','P-F22':'/signin/password/new',
 'P-F04':'/account','P-F24':'/account'};
const HASH={
 build:function(){
  var st=CF.state().st, def=CF.defaultState(CF.state().page);
  return '#'+(PATHS[CF.state().page]||'/')+(st&&st!==def?'?st='+st:'');
 },
 read:function(){
  var h=(location.hash||'').replace(/^#/,''); if(!h) return false;
  var parts=h.split('?'), path=parts[0]||'/', qs={};
  (parts[1]||'').split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) qs[kv.slice(0,i)]=kv.slice(i+1); });
  var id=null;
  if(path==='/account') id=S.ident==='asset'?'P-F04':'P-F24';
  else for(var k in PATHS) if(PATHS[k]===path&&k!=='P-F04'&&k!=='P-F24'){ id=k; break; }
  if(!id) return false;
  S.page=id;
  var list=(STATES[id]||[]).map(function(x){ return x[0]; });
  S.st=qs.st&&list.indexOf(qs.st)>=0?qs.st:CF.defaultState(id);
  return true;
 }
};

 dict:DICT, prd:PRD_OUT, states:STATES,

 modals:{role:modalRole,guide:modalGuide,leave:modalLeave,captcha:modalCaptcha,

    '出处：financial-service-platform/prd/v1.0-金融服务端登录/（分支 cly-V1.0.0）。此处仅为摘录，以 PRD 为准。');
 },
 onAct:onAct,
 onGo:function(){ S.replay=null; S.probeResult=null; },
 state:initState,
 onBoot:function(st){ S=st; syncNav(); },
 afterRender:function(){ if(S.modal&&S.modal.type==='captcha') drawCaptcha(); }
};
CF.define(mod);
CF.boot();
})();
