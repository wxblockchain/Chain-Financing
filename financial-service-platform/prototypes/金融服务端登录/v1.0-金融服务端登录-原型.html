<style>/* 只放本模块专有的组合。token 与公共组件一律来自 _shared，此处不重定义、不覆盖。 */
.pl-brand{border:0;padding:0;gap:var(--sp-3)}
.pl-spacer{flex:1}
.pl-title{font-size:var(--fs-24);margin:0 0 var(--sp-2);font-weight:660;letter-spacing:-.02em}
.pl-sub{color:var(--muted);margin:0 0 var(--sp-6);font-size:13px;line-height:1.6}
.pl-center{text-align:center}
.pl-gap{margin-top:var(--sp-4)}
.pl-gap-lg{margin-top:var(--sp-6)}
.pl-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}

/* 类型选择：两张卡片必须视觉权重相同，因此等宽 grid、同一套边框与内边距，
   不给任一张 accent 底或更大尺寸。 */
.pl-roles{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.pl-role{display:flex;flex-direction:column;text-align:left;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-5);
  box-shadow:var(--shadow);transition:border-color var(--dur-fast) var(--ease-out)}
.pl-role:hover{border-color:var(--border-strong)}
.pl-role h3{font-size:var(--fs-16);font-weight:660;margin:0 0 var(--sp-2)}
.pl-role p{margin:0 0 var(--sp-5);font-size:12.5px;line-height:1.6;color:var(--muted);flex:1}
.pl-role p b{color:var(--text);font-weight:620}
.pl-remember{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:var(--sp-5);padding:var(--sp-3) var(--sp-4);background:var(--card-2);
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--muted)}
.pl-guest{margin-top:var(--sp-5);text-align:center}

/* 常驻补全提示条：占位而不悬浮，因此放在内容区之上的正常文档流里。 */
.pl-bar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-sm);
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-5);font-size:12.5px;color:var(--warn)}
.pl-bar-tx{flex:1;min-width:180px;line-height:1.55}
.pl-bar.pl-bar-min{padding:var(--sp-2) var(--sp-3)}
.pl-bar-more{border:0;background:none;color:inherit;text-decoration:underline;font-size:var(--fs-11)}
.pl-bar-queue{list-style:none;margin:var(--sp-3) 0 0;padding:0;width:100%;border-top:1px dashed var(--warn-border)}
.pl-bar-queue li{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-3) 0 0;font-size:12px}
.pl-bar-queue li span{flex:1;min-width:160px}

/* 整卡认证 / 入驻入口。形态继承 asset-platform/prototypes/实名认证与审核 的
   credential-card（个人在上、企业在下的整卡入口，未提交时整卡为虚线空态），
   类名前缀改为本模块自己的 .pl-entry，不复用也不覆盖对方的模块级类名。 */
.pl-entries{display:flex;flex-direction:column;gap:var(--sp-4)}
.pl-entry{position:relative;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:0;overflow:hidden;color:var(--text)}
.pl-entry::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--sp-1);background:var(--track)}
.pl-entry[data-k="green"]::before{background:var(--ok)}
.pl-entry[data-k="amber"]::before{background:var(--warn)}
.pl-entry[data-k="red"]::before{background:var(--danger)}
.pl-entry[data-k="blue"]::before{background:var(--accent)}
.pl-entry:hover{background:var(--card-hover);border-color:var(--border-strong)}
.pl-entry[data-empty="true"]{background:var(--card-2);border-style:dashed;box-shadow:none;color:var(--muted)}
.pl-entry[data-empty="true"]::before{background:var(--track)}
.pl-entry-head{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);
  border-bottom:1px solid var(--border)}
.pl-entry-ico{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--card-2);display:grid;place-items:center;font-weight:700;color:var(--accent);
  flex:none;font-family:var(--mono);font-size:var(--fs-11)}
.pl-entry-head .title{font-size:var(--fs-14);font-weight:660}
.pl-entry-head .status{margin-left:auto}
.pl-entry-core{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:var(--sp-4);padding:var(--sp-5)}
.pl-entry-core span{display:block;font-size:var(--fs-10);color:var(--faint);margin-bottom:var(--sp-1)}
.pl-entry-core b{display:block;font-size:var(--fs-12);font-weight:620;overflow-wrap:anywhere}
.pl-entry-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:var(--sp-5);font-size:var(--fs-12);border-top:1px dashed var(--border-dash)}
.pl-entry[data-empty="true"] .pl-entry-foot{border-top:0}
.pl-entry-foot p{margin:0;flex:1;min-width:0;line-height:1.55}

   不画置灰输入框。 */
.pl-ro{background:var(--card-2);border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);padding:var(--sp-4);margin-bottom:var(--sp-5)}
.pl-ro>p{margin:0 0 var(--sp-4);font-size:12.5px;color:var(--muted);line-height:1.6}

/* 引导弹层的补充信息区（只在审核中 / 已驳回两种情形出现）。 */
.pl-seg4{border-top:1px dashed var(--border-dash);margin-top:var(--sp-4);padding-top:var(--sp-4)}
.pl-seg4-h{font-size:var(--fs-11);font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);margin-bottom:var(--sp-3)}

/* 空壳占位：首页与登录后的落地页归其他 issue，本模块只留版式不铺内容。 */
.pl-blank{border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--card-2);
  padding:var(--sp-8) var(--sp-5);text-align:center;color:var(--faint)}
.pl-blank b{display:block;color:var(--muted);font-size:var(--fs-14);font-weight:640;margin-bottom:var(--sp-2)}
.pl-blank p{margin:0 auto;max-width:440px;font-size:12.5px;line-height:1.6}
.pl-blank-rows{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-6)}
.pl-blank-row{height:var(--sp-7);border-radius:var(--radius-sm);background:var(--bg-elev);
  border:1px solid var(--border-dash)}

.pl-idsw{display:flex;align-items:center;gap:var(--sp-2)}
.pl-idsw>span{font-size:var(--fs-10);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.pl-wallets{display:flex;flex-direction:column;gap:var(--sp-2)}
.pl-wallet{display:flex;align-items:center;gap:var(--sp-3);text-align:left;width:100%;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elev);
  padding:var(--sp-3) var(--sp-4)}
.pl-wallet:hover{background:var(--card-hover)}
.pl-wallet .av{width:30px;height:30px;border-radius:var(--radius-xs);flex:none;display:grid;
  place-items:center;font-family:var(--mono);font-size:var(--fs-11);color:#fff;
  /* 与 base.css 的 .op-avatar 同一写法：渐变底上的文字色沿用公共层的 #fff 惯例，
     公共层没有为此发过 token（base.css 自身在 7 处这样写）。 */
  background:linear-gradient(135deg,var(--violet),var(--accent))}
.pl-wallet b{display:block;font-size:12.5px;font-weight:620}
.pl-wallet span span{font-size:var(--fs-10);color:var(--faint)}
.pl-lock{text-align:center;padding:var(--sp-6) var(--sp-4)}
.pl-lock-ico{color:var(--warn);margin-bottom:var(--sp-4)}
.pl-count{font-family:var(--mono);font-size:var(--fs-28);margin:var(--sp-4) 0}
.pl-skel{height:var(--sp-4);margin:var(--sp-4) 0;background:var(--track);border-radius:var(--radius-xs)}
.pl-skel-s{width:55%}
.pl-chain{list-style:none;margin:var(--sp-4) 0 0;padding:0;font-size:var(--fs-11);

.pl-chain li{display:flex;align-items:center;gap:var(--sp-3);padding:3px 0}

  background:var(--card-2);padding:var(--sp-3);border-radius:var(--radius-sm);color:var(--muted)}

/* 滑块人机校验。以下 .cap-* 规则与 asset-platform 账户与登录原型、
   金融服务平台账户与登录原型里的同名规则逐字相同——它们生长在模块层而不在
   _shared/base.css 里，而 asset-platform/ 对本模块只读，因此无法在此处上收。
   沿用同一形态是刻意的：本组件的同构基线就是资产端那一个，换一种滑块会让
   两端的同一个组件长得不一样。三处的同步需要人工保证，建议后续把这组规则
   移进 _shared/base.css 收敛为一份。 */
.cap-canvas{position:relative;width:328px;margin:0 auto;border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);background:var(--card-2)}
.cap-canvas canvas{display:block;width:328px;height:180px}
.cap-piece{position:absolute;top:0;left:0;will-change:transform}
.cap-track{margin:14px auto 0;width:328px;height:42px;border-radius:var(--radius-pill);background:var(--card-2);
  border:1px solid var(--border-strong);position:relative;display:flex;align-items:center;user-select:none;touch-action:none}
.cap-track.ok{border-color:var(--ok-border);background:var(--ok-bg)}
.cap-track.bad{border-color:var(--danger-border);background:var(--danger-bg)}
.cap-track.cool{opacity:.6}
.cap-track .tip{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-11);color:var(--faint);
  pointer-events:none}
.cap-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--radius-pill);background:var(--accent-soft)}
.cap-knob{position:absolute;left:0;top:0;height:40px;width:48px;border-radius:var(--radius-pill);background:var(--bg-elev);
  border:1px solid var(--border-strong);display:grid;place-items:center;cursor:grab;color:var(--accent);
  font-family:var(--mono);font-size:13px;box-shadow:var(--shadow)}
.cap-knob:active{cursor:grabbing}
.cap-knob.shake{animation:shake var(--dur-slow) var(--ease-in-out)}
.cap-knob[aria-disabled="true"]{cursor:not-allowed;opacity:.6}
.cap-msg{margin-top:10px;min-height:17px;font-size:var(--fs-11);line-height:1.5;text-align:center;color:var(--faint)}
.cap-msg.bad{color:var(--danger)}
.cap-msg.ok{color:var(--ok)}

@media(max-width:900px){.pl-roles{grid-template-columns:1fr}}
/* focus 版式的顶栏与页脚在窄屏折行。这里加的是本模块自己的 .pl-top / .pl-foot，
   不重定义 base.css 的 .focus-top / .focus-foot——桌面宽度下与其余模块逐像素一致。 */
@media(max-width:768px){
 .pl-top{flex-wrap:wrap;row-gap:var(--sp-3);padding-left:var(--sp-4);padding-right:var(--sp-4)}
 .pl-top .pl-spacer{flex-basis:100%;height:0}
 .pl-foot{flex-wrap:wrap;row-gap:var(--sp-2);padding-left:var(--sp-4);padding-right:var(--sp-4)}
}
@media(max-width:420px){.cap-canvas,.cap-canvas canvas,.cap-track{width:100%}}
@media(prefers-reduced-motion:reduce){.cap-knob.shake{animation:none}}

/* 三态由「会话态 × 完备度」两个维度共同判定，不压成一维状态机。
   界面任何地方都不直接读 ident / level，一律经 contract() 取契约四字段。 */
function initState(){
 return {
  ident:'guest',            /* guest | asset | funder */
  level:'L0',               /* 资产方只有 L0 / L3；资金方 L0 / L1 / L2 / L3 */
  vdetail:'unverified',     /* 资产方对端认证状态，只用于文案分流 */
  creds:{email:true,wallet:true},
  hasPassword:true, agreed:true, firstLogin:false,
  entry:'sign_in', tab:'email_code', memory:null, memoryOff:false,
  handle:null,
  barCollapsed:false, barQueue:false,
  reauthAt:0, failCount:0,
  form:{}, err:{}, walletAddr:''
 };
}
/* 对外契约四字段。展示类功能只消费这四项，不读账户原始状态字段。 */
function contract(){
 if(S.ident==='guest') return {session_state:'guest',identity_type:null,completeness_level:'L0',account_id:null};
 return {session_state:'authenticated',
   identity_type:S.ident==='asset'?'asset_party':'funder',
   completeness_level:S.level,
   account_id:S.ident==='asset'?'shadow_8f21c04b':'funder_3ad9e17c'};
}
function col(){
 if(S.ident==='guest') return 0;
 if(S.ident==='asset') return S.level==='L3'?2:1;
 return S.level==='L3'?4:3;   /* 资金方未提交 / 审核中 / 已驳回在权限上合并 */
}
function mx(r){
 if(r[3]&&r[3].l1no&&S.ident==='funder'&&S.level==='L1') return 'no';
 return r[2][col()];
}
function credsMissing(){
 if(S.ident!=='funder') return [];
 var m=[]; if(!S.creds.wallet) m.push('wallet'); if(!S.creds.email) m.push('email');
 return m;   /* 顺序：钱包在前 */
}

/* ------------------------------ 回跳 ------------------------------------- */
/* 判定顺序自上而下，任一条不通过即失败并走失效兜底。规则本身不在界面上展示。 */
function checkTarget(raw){
 var s=String(raw||'');
 if(!/^\//.test(s)||/^\/\//.test(s)||/\\/.test(s)||/^\/\./.test(s)) return null;
 var dec; try{ dec=decodeURIComponent(s); }catch(e){ return null; }
 if(/%/.test(dec)) return null;
 var norm=dec.split('?')[0].replace(/\/+/g,'/');
 if(/(^|\/)\.\.?(\/|$)/.test(norm)) return null;
 for(var i=0;i<SELF_PATHS.length;i++)
   if(norm===SELF_PATHS[i]||norm.indexOf(SELF_PATHS[i]+'/')===0) return null;
 if(!ALLOW.some(function(p){ return p==='/'?norm==='/':(norm===p||norm.indexOf(p+'/')===0); })) return null;
 if(norm.indexOf('@')>=0) return null;
 var bad=false;
 (dec.split('?')[1]||'').split('&').forEach(function(kv){
   var k=kv.split('=')[0].toLowerCase(); if(k&&DENY_Q.indexOf(k)>=0) bad=true; });
 return bad?null:norm;
}
/* 先校验，通过才生成句柄；不通过就不生成。句柄不含目标信息、不进 URL、
   不进本地存储——这里放在会话内的 JS 变量里，等价于服务端会话暂存。 */
function mintHandle(target,capRow,domain,page){
 var norm=checkTarget(target);
 if(!norm) return null;
 return {ref:'h_'+Math.random().toString(36).slice(2,10),target:norm,page:page||null,
   cap:capRow||null,domain:domain||'self',born:Date.now()};
}
/* 落地优先级，自上而下命中即停：
   ① 有效句柄 → 回原触发点并重新执行被拦下的操作
   ② 资金方首登建号 → 机构信息（入驻入口）
   ③ 资产方首登 → 入驻引导页
   ④ 其余 → 默认落地页 */
/* 句柄登记的是路径，页面在**消费时**才按当时的身份解析——/account 对资产方和
   资金方是两个不同的页面，而句柄可能是在游客态生成的，那时还不知道会是谁回来。 */
function pageForPath(path){
 if(path==='/account') return S.ident==='asset'?'P-F04':'P-F24';
 for(var k in PATHS) if(PATHS[k]===path&&k!=='P-F04'&&k!=='P-F24') return k;
 return null;
}
/* 某个页面在当前身份下是否可达。句柄记的是「用户想去哪」，但身份可能已经变了，
   落地前必须按新身份重新判一次，否则会把人送进一个不属于他的页面。 */
function pageAllowed(page){
 if(page==='P-F04'||page==='P-F06') return S.ident==='asset';
 if(page==='P-F24'||page==='P-F27') return S.ident==='funder';
 return true;
}
function landing(){
 var h=S.handle;
 if(h){
  var expired=Date.now()-h.born>30*60*1000;
  var r=h.cap?row(h.cap):null;
  S.handle=null;
  /* 句柄记录的能力在当前身份下根本不存在（例如以资产方身份回来、句柄却记着出资），
     或目标页不属于当前身份——这时句柄已经没有意义，按无句柄处理，往下走落地优先级。
     用户在流程中改变了身份类型时句柄作废，就是这一条。 */
  h.page=pageForPath(h.target)||h.page;
  if(expired||(r&&mx(r)==='na')||!pageAllowed(h.page)){
   if(expired) { fallback(); return; }
   h=null;
  }
 }
 if(h){
  var r2=h.cap?row(h.cap):null;
  if(r2&&mx(r2)!=='ok'){
   /* 登录成功不等于该能力就可用：重新做一次权限判定，不通过就转受限引导，
      不是报错，并保留原触发能力供文案取用。 */
   CF.go(h.page||'P-F51'); openGuide(r2); return;
  }
  CF.go(h.page||'P-F51');
  S.replay=r2?r2[0]:true;
  toast('success',L('Picking up where you left off','已为你继续刚才的操作'),
    r2?L(r2[1][0]+' · resumed',r2[1][1]+' · 已重新执行'):'');
  return;
 }
 if(S.ident==='funder'&&S.firstLogin){ S.firstLogin=false; CF.go('P-F27'); return; }
 if(S.ident==='asset'&&S.firstLogin){ S.firstLogin=false; CF.go('P-F06'); return; }
 CF.go('P-F51');
}
/* 失效兜底：落默认落地页 + 一条 Toast。只说「已为你回到首页」这一层，
   不暴露校验失败的原因——把判定细节讲给用户等于讲给探测者。 */
function fallback(){
 S.handle=null; CF.go('P-F51');
 toast('info',L('We brought you back','已为你回到首页'),
   L('That link is no longer valid.','该链接已失效。'));
}
function guideKey(){
 if(S.ident==='asset') return S.vdetail==='action_required'?'assetRejected':'assetVerify';
 return S.level==='L1'?'funderL1':S.level==='L2'?'funderL2':'funderL0';
}
function openGuide(r){
 if(S.ident==='guest'){ S.modal={type:'role',ctx:r?r[1]:null}; }
 else if(credsMissing().length){ S.modal={type:'creds',step:0}; }
 else S.modal={type:'guide',key:guideKey(),row:r||null};
 CF.render();
}
/* 能力入口被点击：置灰 → 先生成回跳句柄再唤起引导，顺序不得颠倒；
   不可见项在界面上根本不出现，因此点不到。 */
function capClick(n,page){
 var r=row(n);
 if(mx(r)==='gray'){
  S.handle=mintHandle(page==='P-F27'?'/account/institution':DEMO.triggerPath,n,'self',page||S.page);
  openGuide(r); return;
 }
 toast('info',L(r[1][0],r[1][1]),L('This page is delivered by another issue.','该页面由其他 issue 交付。'));
}
function ws316(pid){ S.modal={type:'ws316',pid:pid}; CF.render(); }

/* ------------------------------ 通用片段 --------------------------------- */
function btn(label,act,v,cls,extra){
 return '<button class="btn '+(cls||'')+'" type="button" data-act="'+act+'"'
  +(v?' data-v="'+E(v)+'"':'')+(extra||'')+'>'+label+'</button>';
}
function field(k,label,ph,type,val,err,hint){
 return '<div class="field"><label for="f-'+k+'">'+label+'</label>'
  +'<input class="inp'+(err?' err':'')+'" id="f-'+k+'" data-f="'+k+'" data-k="'+k+'" type="'+(type||'text')+'"'
  +' value="'+E(val==null?'':val)+'" placeholder="'+E(ph||'')+'"'+(err?' aria-invalid="true"':'')+'>'
  +(err?'<p class="err-msg" role="alert"><span>!</span>'+err+'</p>':(hint?'<p class="hint">'+hint+'</p>':''))
  +'</div>';
}
function pill(k,tx){ return '<span class="pill '+k+'">'+tx+'</span>'; }
/* focus 版式：顶栏只放品牌与轻量工具区，不放业务导航；主体单列居中卡片。 */
function focusWrap(body,foot){
 return '<header class="focus-top pl-top"><div class="brand pl-brand"><div class="brand-mark">FS</div><div>'
  +'<div class="brand-name">'+L('Financial Services','金融服务平台')+'</div>'
  +'<div class="brand-sub">'+L('Portal','面客端')+'</div></div></div><div class="pl-spacer"></div>'
  +btn(t('pagesPanel'),'openPages','','sm')+CF.langSwitcher()
  +'</header><main class="focus-body"><div class="focus-col">'+body+'</div></main>'
  +'<footer class="focus-foot pl-foot"><span class="muted">'+t('demo')+'</span>'
  +'<span class="muted">'+(foot||'')+'</span></footer>';
}
/* 常驻补全提示条：占位而不悬浮，可折叠、不可永久关闭，折叠态仍然可见，
   折叠状态只记在会话内。全站同一时刻最多一条，其余以计数与清单表达。 */
function bar(){
 var qs=barQueue(); if(!qs.length) return '';
 var top=qs[0];
 if(S.barCollapsed)
  return '<div class="pl-bar pl-bar-min">'+CF.ICO.warn
   +'<span class="pl-bar-tx">'+L('{n} item(s) to complete','还有 {n} 项待完成').replace('{n}',qs.length)+'</span>'
   +'<button class="pl-bar-more" type="button" data-act="barToggle">'+L('Expand','展开')+'</button></div>';
 return '<div class="pl-bar">'+CF.ICO.warn
  +'<span class="pl-bar-tx">'+top.tx+'</span>'
  +(qs.length>1?'<button class="pl-bar-more" type="button" data-act="barQueue">'
    +L('{n} more','还有 {n} 项').replace('{n}',qs.length-1)+'</button>':'')
  +btn(top.btn,'barGo',top.k,'sm primary')
  +'<button class="pl-bar-more" type="button" data-act="barToggle">'+L('Collapse','折叠')+'</button>'
  +(S.barQueue&&qs.length>1?'<ul class="pl-bar-queue">'+qs.slice(1).map(function(x){
      return '<li><span>'+x.tx+'</span>'+btn(x.btn,'barGo',x.k,'sm')+'</li>'; }).join('')+'</ul>':'')
  +'</div>';
}
/* 优先级：① 凭据未齐 → ② 已驳回 → ③ 未提交机构资料 → ④ 资产方未实名 */
function barQueue(){
 var out=[],m=credsMissing();
 if(S.ident==='funder'&&m.length){
  out.push({k:'creds',btn:L('Complete now','立即补全'),
   tx:m.length===2?L('Add your email and link a wallet to be ready to apply.','补齐邮箱与钱包后即可提交入驻申请。')
     :m[0]==='wallet'?L('Link a wallet to be ready to apply.','绑定钱包后即可提交入驻申请。')
     :L('Add an email to be ready to apply and to receive security notifications.','绑定邮箱后即可提交入驻申请，并接收安全通知。')});
 }
 if(S.ident==='funder'&&S.level==='L2')
  out.push({k:'l2',tx:L('Your institution profile was returned for changes.','机构资料被驳回，需要修改。'),
    btn:L('Edit and resubmit','编辑重提')});
 if(S.ident==='funder'&&S.level==='L0')
  out.push({k:'l0',tx:L('Submit your institution profile to invest.','提交机构资料后即可参与出资。'),
    btn:L('Complete now','立即前往')});
 if(S.ident==='asset'&&S.level!=='L3')
  out.push({k:'verify',btn:L('Complete now','立即前往'),
    tx:L('Complete identity verification on the asset platform to unlock financing.',
      '在资产平台完成实名认证后即可使用融资功能。')});
 return out;
}
/* 整卡入口：形态继承资产端实名认证的整卡入口——未提交时整卡是虚线空态，
   已提交时展示核心信息 + 状态，整卡可点。 */
function entryCard(o){
 var empty=o.status==='none';
 return '<'+(o.act?'button':'div')+' class="pl-entry" data-k="'+(o.k||'blue')+'" data-empty="'+empty+'"'
  +(o.act?' type="button" data-act="'+o.act+'"'+(o.v?' data-v="'+E(o.v)+'"':'')
    +' aria-label="'+E(o.title+' · '+o.action)+'"':'')+'>'
  +'<span class="pl-entry-head"><span class="pl-entry-ico">'+o.ico+'</span>'
  +'<span class="title">'+o.title+'</span><span class="status">'+o.pill+'</span></span>'
  +(empty?'':'<span class="pl-entry-core">'+o.core.map(function(x){
      return '<span><span>'+x[0]+'</span><b'+(x[2]?' class="mono"':'')+'>'+E(x[1])+'</b></span>'; }).join('')+'</span>')
  +'<span class="pl-entry-foot"><p>'+o.foot+'</p>'
  +(o.action?'<span class="btn-link">'+o.action+' →</span>':'')+'</span>'
  +'</'+(o.act?'button':'div')+'>';
}
/* 空壳占位：首页与登录后的落地页归其他 issue，本模块只留版式不铺内容。 */
function blank(title,body){
 return '<div class="pl-blank"><b>'+title+'</b><p>'+body+'</p>'
  +'<div class="pl-blank-rows"><div class="pl-blank-row"></div><div class="pl-blank-row"></div>'
  +'<div class="pl-blank-row"></div></div></div>';
}

/* ============ 首页 / 登录后落地页（空壳，内容归其他 issue）============== */
/* 平台默认态是游客态：未登录访问游客态可达路由一律直接渲染——不跳登录页、
   不弹遮挡性登录层、不用登录墙盖住内容。登录的唯一常驻入口是右上角按钮。
   本轮不做首页内容，只保留版式与占位。 */
function pageHome(){
 var head=pageHead(L('Home','首页'),
   L('Placeholder. This page is delivered by another issue.','占位页面。本页内容由其他 issue 交付。'),'');
 if(S.st==='loading') return head+bar()+'<div class="card"><div class="card-b">'
   +'<div class="pl-skel pl-skel-s"></div><div class="pl-skel"></div><div class="pl-skel"></div></div></div>';
 if(S.st==='loadfail') return head+bar()+'<div class="card"><div class="card-b shell">'+CF.ICO.warn
   +'<p><b>'+L('Could not load','加载失败')+'</b><br>'
   +L('Nothing was changed. You can try again.','未改变任何数据，可以重试。')+'</p>'
   +btn(L('Retry','重试'),'st','default','primary')+'</div></div>';
 return head+bar()+replayBanner()
  +blank(L('No content in this prototype','本原型不铺此页内容'),
    L('The home page and the post-sign-in landing page belong to another issue. This prototype covers sign-in only, so the layout is kept and the content is left blank on purpose.',
      '首页与登录成功后的落地页归其他 issue。本原型只做登录，因此保留版式、内容刻意留白。'));
}
function replayBanner(){
 if(!S.replay) return '';
 var r=S.replay===true?null:row(S.replay);
 return note('green','<p>'+L('Your earlier action was resumed automatically — no middle page, no extra prompt.',
   '刚才被拦下的操作已自动重新执行——无中间页、无额外提示。')+'</p>',
   r?L(r[1][0]+' · resumed',r[1][1]+' · 已重新执行'):L('Resumed','已重新执行'));
}

/* ================== 入驻引导页（资产方，首登后落地）==================== */

   整卡为虚线空态。资产方的认证权威在资产平台、本端只读，因此两张卡的

    act:'leaveSite',v:'usercenter',action:done?L('View','查看'):L('Start','去认证'),
    core:[[L('Company','企业名称'),L(DEMO.assetOrg[0],DEMO.assetOrg[1]),false],

      :L('Not submitted yet. You complete this on the asset platform.','尚未提交。该认证在资产平台完成。')})

const CHAIN=[

function drawCaptcha(){
 var bg=q('#capBg'), pc=q('#capPiece'); if(!bg||!pc) return;
 var W=328,H=180,PS=46,tx=133,ty=58,i,x,y,w,h,seed=7;
 function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
 var off=document.createElement('canvas'); off.width=W; off.height=H;
 var o=off.getContext('2d'), hue=212, g=o.createLinearGradient(0,0,W,H);
 g.addColorStop(0,'hsl('+hue+',58%,74%)'); g.addColorStop(1,'hsl('+((hue+52)%360)+',52%,58%)');
 o.fillStyle=g; o.fillRect(0,0,W,H);
 for(i=0;i<9;i++){
  o.globalAlpha=0.12+rnd()*0.2; o.fillStyle='hsl('+((hue+i*26)%360)+',62%,'+(52+rnd()*32)+'%)';
  x=rnd()*W; y=rnd()*H; w=24+rnd()*140; h=10+rnd()*90;
  o.beginPath(); o.roundRect?o.roundRect(x,y,w,h,10):o.rect(x,y,w,h); o.fill();
 }
 o.globalAlpha=1;
 function path(c,px,py){
  var rr=6,k=PS*0.22;
  c.beginPath(); c.moveTo(px+rr,py); c.lineTo(px+PS*0.42,py);
  c.arc(px+PS*0.5,py,k,Math.PI,0,true);
  c.lineTo(px+PS-rr,py); c.quadraticCurveTo(px+PS,py,px+PS,py+rr);
  c.lineTo(px+PS,py+PS*0.38); c.arc(px+PS,py+PS*0.5,k,-Math.PI/2,Math.PI/2,false);
  c.lineTo(px+PS,py+PS-rr); c.quadraticCurveTo(px+PS,py+PS,px+PS-rr,py+PS);
  c.lineTo(px+rr,py+PS); c.quadraticCurveTo(px,py+PS,px,py+PS-rr);
  c.lineTo(px,py+rr); c.quadraticCurveTo(px,py,px+rr,py); c.closePath();
 }
 var b=bg.getContext('2d'); b.clearRect(0,0,W,H); b.drawImage(off,0,0);
 b.save(); path(b,tx,ty); b.fillStyle='rgba(16,24,40,.55)'; b.fill();
 b.strokeStyle='rgba(255,255,255,.75)'; b.lineWidth=1.5; b.stroke(); b.restore();
 var p=pc.getContext('2d'); p.clearRect(0,0,W,H);
 p.save(); path(p,0,ty); p.clip(); p.drawImage(off,-tx,0); p.restore();
 p.save(); path(p,0,ty); p.strokeStyle='rgba(255,255,255,.9)'; p.lineWidth=1.5; p.stroke(); p.restore();

const MINE=['go','st','cap','pickRole','guest','signin','signinHere','signout','switchRole','tab',
 'showPwd','sendCode','submitCode','submitPwd','openCap','capView','capPass','openWallet','wView',
 'wSign','openEmail','openPwd','emailNext','pwdModalSave','credsNext','reFactor','reGo','ws316',
 'support','leaveSite','leaveGo','entryB','ssoDone','agreeChk','agreeGo','agreeDoc','barToggle',
 'barQueue','barGo','anchor','copyAddr','explorer','openPages','ident','cred','pwdSend','pwdSave','close'];
function onAct(n,a,v,e){
 if(n.classList.contains('mask')&&e.target!==n) return true;
 if(MINE.indexOf(a)<0) return false;
 e.preventDefault();
 if(S.menu&&a!=='ident'&&a!=='cred') S.menu=null;
 switch(a){
  /* 关闭弹层等同于「什么都没发生」：待办的那个动作也一并丢掉，
     否则下一次再认证会把上一次没做完的动作又端出来。 */
  case 'close': S.modal=null; S.pendingModal=null; break;
  case 'go': S.modal=null; CF.go(v); return true;
  case 'st': CF.setState(v); return true;
  case 'ident': setIdent(v); S.menu=null; break;
  case 'cred': S.creds[v]=!S.creds[v]; break;
  case 'cap': capClick(parseInt(v,10),S.page); return true;
  case 'signin': S.entry='sign_in'; S.modal=null; CF.go('P-F50'); return true;
  /* 游客在受限页面点登录：先生成指向本页的回跳句柄，登录完落回这一页 */
  case 'signinHere':
   S.handle=mintHandle(S.page==='P-F27'?'/account/institution'
     :S.page==='P-F06'?'/account/verification':'/account',null,'self',S.page);
   S.entry='sign_in'; S.modal=null; CF.go('P-F50'); return true;
  case 'signout':
   /* 退出登录一律回落游客态，不落到登录页 */
   setIdent('guest'); S.modal=null; S.replay=null; CF.go('P-F51');
   toast('info',L('You are signed out','已退出登录'),
     L('You can keep browsing as a guest.','你可以继续以游客身份浏览。')); return true;
  case 'guest': setIdent('guest'); S.modal=null; S.replay=null; CF.go('P-F51'); return true;
  case 'pickRole':
   S.memory=v; S.modal=null;
   if(v==='asset'){ S.modal={type:'leave',to:'authorize',from:'role'}; }
   else { S.form={}; S.err={}; CF.go('P-F20'); return true; }
   break;
  case 'switchRole':
   /* 保留回跳句柄、清除身份记忆、清除已填的凭据字段 */
   S.memory=null; S.form={}; S.err={}; S.walletAddr=''; S.modal=null; CF.go('P-F52'); return true;
  case 'tab': S.tab=v; S.err={}; break;
  case 'showPwd': S.form._showPwd=!S.form._showPwd; break;
  case 'sendCode': case 'pwdSend': S.modal={type:'captcha',view:'idle',next:a}; break;
  case 'openCap': S.modal={type:'captcha',view:'idle',next:'inline',back:S.modal}; break;
  case 'capView': S.modal.view=v; break;
  case 'capPass': {
   if(S.modal.view!=='ok'){ S.modal.view='ok'; break; }
   var nx=S.modal.next, back=S.modal.back;
   if(nx==='inline'){ S.modal=back; toast('success',L('Code sent','验证码已发送'),''); }
   else { S.modal=null; CF.setState('sent'); return true; }
   break; }
  case 'openWallet': S.modal={type:'wallet',view:'pick',ctx:v}; break;
  case 'wView': S.modal.view=v; break;
  case 'wSign': {
   S.modal.view='waiting';
   var ctx=S.modal.ctx;
   setTimeout(function(){
    if(!S.modal||S.modal.type!=='wallet') return;
    S.modal=null;
    if(ctx==='creds'||ctx==='bind'){ S.creds.wallet=true;
      toast('success',L('Wallet linked','钱包已绑定'),
        L('A security notification was sent to your email.','已向你的邮箱发送安全通知。'));
      if(ctx==='creds'&&credsMissing().length) S.modal={type:'creds',step:0};
    } else if(ctx==='reauth'){ S.reauthAt=Date.now();
      toast('success',L('Identity confirmed','身份已确认'),'');
      S.modal=S.pendingModal||null; S.pendingModal=null;
    } else { S.ident='funder'; S.level='L0'; S.creds={email:false,wallet:true}; S.firstLogin=true;
      syncNav(); landing(); return; }
    CF.render(); },900);
   break; }
  case 'submitCode':
   CF.setState('submitting');
   setTimeout(function(){ S.ident='funder'; S.level='L0'; S.creds={email:true,wallet:false};
     S.firstLogin=true; syncNav(); landing(); },700);
   return true;
  case 'submitPwd':
   CF.setState('submitting');
   setTimeout(function(){ S.failCount++; CF.setState(S.failCount>=3?'locked':'fail'); },700);
   return true;
  case 'entryB': S.modal={type:'leave',to:'authorize',from:'entryB'}; break;
  case 'leaveSite': S.modal={type:'leave',to:v||'usercenter',from:'guide'}; break;
  case 'leaveGo':
   /* 先生成回跳句柄再跳转，顺序不得颠倒 */
   if(!S.handle) S.handle=mintHandle(DEMO.triggerPath,7,'asset_platform','P-F51');
   S.modal=null; CF.go('P-F01'); CF.setState('ok'); return true;
  case 'ssoDone': {
   var st=S.st;
   if(st==='R2'||st==='R3'){ setIdent('guest'); S.handle=null; CF.go('P-F51');
     toast('danger',st==='R2'?L('Your account is not available right now','账户当前不可用')
                              :L('Sign-in could not be completed','登录未能完成'),
       L('You are browsing as a guest. Nothing was changed.','你正以游客身份浏览，未改变任何数据。'));
     return true; }
   /* 已注册用户 = 对端认证已通过；首次登录 = 新用户，尚未认证且未同意本端协议 */
   S.ident='asset';
   if(st==='first'){ S.level='L0'; S.vdetail='unverified'; S.agreed=false; S.firstLogin=true; }
   else { S.level='L3'; S.vdetail='verified'; S.agreed=true; S.firstLogin=false; }
   syncNav();
   if(!S.agreed){ CF.go('P-F03'); return true; }
   landing(); return true; }
  case 'agreeChk': S.form.agree=!S.form.agree; break;
  case 'agreeGo':
   if(!S.form.agree){ S.err.agree=1; break; }
   S.agreed=true; S.err={}; landing(); return true;
  case 'agreeDoc': S.modal={type:'agreeDoc'}; break;
  case 'openEmail': S.pendingModal={type:'email',step:0};
   S.modal=reauthNeeded()?{type:'reauth'}:S.pendingModal; break;
  case 'openPwd': S.pendingModal={type:'pwd'};
   S.modal=reauthNeeded()?{type:'reauth'}:S.pendingModal; break;
  case 'reFactor': S.modal.factor=v; break;
  case 'reGo': S.reauthAt=Date.now(); S.modal=S.pendingModal||null; S.pendingModal=null;
   toast('success',L('Identity confirmed','身份已确认'),
     L('You will not be asked again for 10 minutes.','10 分钟内不会再次要求。')); break;
  case 'emailNext': {
   var bind=!S.creds.email, last=bind?0:1;
   if((S.modal.step||0)<last){ S.modal.step=(S.modal.step||0)+1; break; }
   S.creds.email=true; S.modal=null;
   if(bind) toast('success',L('Email linked','邮箱已绑定'),
     L('First-time linking does not sign out your other sessions.','首次绑定不触发会话失效。'));
   else { setIdent('guest'); CF.go('P-F20');
     toast('info',L('All sessions signed out','全部会话已失效'),
       L('Sign in with your new email. We notified both addresses.','请用新邮箱登录。已向新旧邮箱各发一封通知。'));
     return true; }
   break; }
  case 'pwdModalSave':
   S.hasPassword=true; S.modal=null; setIdent('guest'); CF.go('P-F20');
   toast('info',L('All sessions signed out','全部会话已失效'),
     L('Sign in with your new password. A security notification was sent.','请用新密码登录，已发送安全通知。'));
   return true;
  case 'pwdSave': S.hasPassword=true; setIdent('guest'); CF.go('P-F20');
   toast('success',L('Password saved','密码已保存'),
     L('Sign in with your new password.','请用新密码登录。')); return true;
  case 'credsNext': {
   var mm=credsMissing();
   if(mm.length>1&&(S.modal.step||0)===0){ S.modal.step=1; break; }
   S.creds.email=true; S.creds.wallet=true; S.modal=null;
   /* 补完是「重新执行刚才被拦下的那个动作」，不是跳转到某个页面 */
   toast('success',L('Credentials complete','凭据已补齐'),
     L('Resuming what you were doing.','正在继续刚才的操作。'));
   break; }
  case 'ws316': S.modal={type:'ws316',pid:v||'P-F30'}; break;
  case 'support': toast('info',L('Support','客服'),'support@demo-chainfinancing.test'); break;
  case 'barToggle': S.barCollapsed=!S.barCollapsed; S.barQueue=false; break;
  case 'barQueue': S.barQueue=!S.barQueue; break;
  case 'barGo':
   if(v==='creds'){ S.modal={type:'creds',step:0}; }
   else if(v==='verify'){ S.modal=null; CF.go('P-F06'); return true; }
   else { S.modal=null; CF.go('P-F27'); return true; }
   break;
  case 'anchor': { var el=q('#sec-'+v); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return true; }
  case 'copyAddr': toast('success',L('Address copied','地址已复制'),''); break;
  case 'explorer': toast('info',L('Block explorer','区块浏览器'),
    L('Opens the address on the demo explorer.','在演示区块浏览器中打开该地址。')); break;
  case 'openPages': S.drawer='pages'; break;
  default: return false;
 }
 CF.render(); return true;
}
function reauthNeeded(){ return Date.now()-S.reauthAt>10*60*1000; }

/* 公共运行时不代理 input / change，模块自行绑定一次（与仓库既有模块一致）。
   需要实时反馈的字段才重绘；其余只更新状态，避免每敲一个字符就重排整页。
   焦点与光标位置由公共层按 data-f 复位。 */
const LIVE={np:1,np2:1,addr:1};
document.addEventListener('input',function(e){
 var n=e.target, k=n.getAttribute&&n.getAttribute('data-k'); if(!k) return;
 if(k==='addr') S.walletAddr=n.value.trim(); else { S.form[k]=n.value; if(S.err[k]) delete S.err[k]; }
 if(LIVE[k]) CF.render();
});
document.addEventListener('change',function(e){
 var n=e.target;
 if(n.getAttribute&&n.getAttribute('data-act')==='langSel'){ S.lang=n.value; CF.render(); }
});

/* ============================ 状态与路由 ================================= */
const STATES={
 'P-F51':[['default','Default','默认'],['loading','Loading','加载中'],['loadfail','Load failed','加载失败']],
 'P-F50':[['default','No memory','无记忆'],['mem','Remembered','有身份记忆'],
   ['nomem','Storage unavailable','本地存储不可用']],
 'P-F01':[['ok','Returning user','已注册用户'],['first','First sign-in','首次登录'],
   ['R2','Account unavailable','账户不可用'],['R3','Failed','登录失败'],
   ['E11','Account not created','账号未建立']],
 'P-F20':P20_STATES,
 'P-F21':[['default','Default','默认'],['submitting','Sending','发送中'],['sent','Sent','已发送']]
};
/* URL 用产品自己的路径，不用 #/<page-id>。取值与 registry 的 CF.ENTRY 一致，
   别的模块按登记表跳过来时才落得到对应页面。/account 由身份解析到两个账户页之一。 */
const PATHS={'P-F51':'/','P-F50':'/signin/role','P-F52':'/signin/switch','P-F53':'/signin/error',
 'P-F01':'/signin/sso/callback','P-F03':'/signin/agreement','P-F05':'/signin/sso/failed',
 'P-F20':'/signin/funder','P-F21':'/signin/password/email','P-F22':'/signin/password/new',
 'P-F04':'/account','P-F24':'/account','P-F06':'/account/verification','P-F27':'/account/institution'};
const HASH={
 build:function(){
  var st=S.st, def=CF.defaultState(S.page);
  return '#'+(PATHS[S.page]||'/')+(st&&st!==def?'?st='+st:'');
 },
 read:function(){
  var h=(location.hash||'').replace(/^#/,''); if(!h) return false;
  var parts=h.split('?'), path=parts[0]||'/', qs={};
  (parts[1]||'').split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) qs[kv.slice(0,i)]=kv.slice(i+1); });
  var id=null;
  if(path==='/account') id=S.ident==='asset'?'P-F04':'P-F24';
  else for(var k in PATHS) if(PATHS[k]===path&&k!=='P-F04'&&k!=='P-F24'){ id=k; break; }
  if(!id) return false;
  S.page=id;
  var list=(STATES[id]||[]).map(function(x){ return x[0]; });
  S.st=qs.st&&list.indexOf(qs.st)>=0?qs.st:CF.defaultState(id);
  return true;
 }
};
function renderContent(){
 var f={'P-F51':pageHome,'P-F04':pageAssetAccount,'P-F24':pageFunderAccount,
        'P-F06':pageVerification,'P-F27':pageInstitution}[S.page];
 return f?f():'';
}
function renderFocus(){
 var f={'P-F50':pageRole,'P-F52':pageSwitch,'P-F53':pageFail,'P-F01':pageSso,
        'P-F03':pageAgree,'P-F05':pageSsoFail,'P-F20':pageFunderLogin,
        'P-F21':pagePwdEmail,'P-F22':pagePwdNew}[S.page];
 return f?f():'';
}

/* ============================== 装配 ==================================== */
mod={
 id:'fs-portal-login', end:'asset', home:'P-F51',
 owns:['P-F51','P-F04','P-F24','P-F06','P-F27','P-F50','P-F52','P-F53','P-F01','P-F03','P-F05',
       'P-F20','P-F21','P-F22'],
 dict:DICT, states:STATES,
 content:renderContent, focus:renderFocus,
 topExtra:topExtra, hash:HASH, topbarPrd:false,
 crumbParts:function(){ return S.page==='P-F51'?[]:[[L('Home','首页'),'P-F51']]; },
 modals:{role:modalRole,guide:modalGuide,leave:modalLeave,captcha:modalCaptcha,
   wallet:modalWallet,creds:modalCreds,reauth:modalReauth,email:modalEmail,
   pwd:modalPwd,ws316:modalWs316,agreeDoc:modalAgreeDoc},
 drawers:{pages:drawerPages},
 modalLocked:function(m){ return m.type==='role'; },
 onAct:onAct,
 onGo:function(){ S.replay=null; },
 state:initState,
 onBoot:function(st){ S=st; syncNav(); },
 afterRender:function(){ if(S.modal&&S.modal.type==='captcha') drawCaptcha(); }
};
CF.define(mod);
CF.boot();
})();
</script>
