function validate(config){

  if(ty){for(const k of ['name','description','business_stage'])if(missing(ty[k+'_en'])||missing(ty[k+'_zh']))add('E-10',x,k,'warning');}

   const v=vals[p.key];if(missing(v))continue;
   if(p.value_type==='address'&&!/^0x[0-9a-f]{40}$/i.test(v))add('E-06',x,p.key);

 if(S.scenario!=='copy-failure'&&S.forceCopyFailure!==true){
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(v);ok=true;}}catch(_){}
  if(!ok){const area=document.createElement('textarea');area.value=v;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{ok=document.execCommand('copy');}catch(_){}area.remove();}
 }
 CF.toast(ok?'success':'danger',t(ok?(n.dataset.kind==='hash'?'copiedHash':'copiedAddress'):'copyFailed'));focusAfter=n.dataset.f;CF.render();
}
function openDetail(key){S.key=key;focusAfter='heading';CF.go(DETAIL);}
function back(){S.key='';if(S.scenario==='missing')S.scenario=S.dataMode;focusAfter='heading';CF.go(LIST);}
CF.define({id:'smart-contracts',end:'admin',home:LIST,owns:[LIST,DETAIL],dict:DICT,topbarPrd:false,
 state(){let lang='en',tz='Asia/Shanghai';try{lang=localStorage.getItem('fs-smart-contract-lang')==='zh'?'zh':'en';tz=localStorage.getItem('fs-smart-contract-tz')==='UTC'?'UTC':'Asia/Shanghai';}catch(_){}return {lang,tz,scenario:'empty',dataMode:'empty',key:'',f:emptyFilter(),applied:emptyFilter(),pg:1,size:DEFAULT_SIZE};},
 onBoot(s){S=s;},
 account(){return {avatar:'OP',ident:L('Operations Administrator','运营管理员'),ok:true,okText:L('Prototype','原型'),settings:'P-O05'};},
 topExtra(){return '<div class="tc-tools"><label for="tcScenario">'+t('scenario')+'</label><select id="tcScenario" data-f="tcScenario">'+scenarios.map(x=>'<option value="'+x[0]+'"'+(S.scenario===x[0]?' selected':'')+'>'+L(x[1],x[2])+'</option>').join('')+'</select><label class="sr-only" for="tcTimezone">'+t('timezone')+'</label><select id="tcTimezone" data-f="tcTimezone"><option value="Asia/Shanghai"'+(S.tz!=='UTC'?' selected':'')+'>UTC+8</option><option value="UTC"'+(S.tz==='UTC'?' selected':'')+'>UTC</option></select></div>';},
 crumbParts(){return S.page===DETAIL?[[t('navTokenManagement'),LIST],[t('title'),LIST]]:[[t('navTokenManagement'),LIST]];},
 crumbCur(){if(S.page!==DETAIL)return t('title');if(['denied','session'].includes(S.scenario))return '—';const v=validate(data()),r=v.rows.find(x=>x.contract_key===S.key);return r?name(r,v.map.get(r.contract_type_key)):'—';},
 content(){const v=validate(data());window.TC.logs=v.logs;return S.page===DETAIL?detail(v):list(v);},
 onGo(page){clearTimeout(timer);if(page===LIST){S.key='';if(S.scenario==='missing')S.scenario=S.dataMode;}},
 hash:{build(){return '#/ops/token-contracts'+(S.page===DETAIL?'/'+encodeURIComponent(S.key):'')+query();},read:readHash},
 onAct(n,a,v,event){
  if(a==='tc-view'){event.preventDefault();openDetail(v);return true;}
  if(a==='tc-back'||a==='crumb'){back();return true;}
  if(a==='tc-copy'){copy(n,v);return true;}
  if(a==='tc-search'){applyFilter('tcSearch');return true;}
  if(a==='tc-reset'){S.f=emptyFilter();applyFilter('tcKeyword');return true;}
  if(a==='tc-pg'){const to=parseInt(v,10);if(Number.isFinite(to)&&to>0){S.pg=to;focusAfter=n.dataset.f;CF.render();CF.syncURL();}return true;}
  if(a==='tc-retry'){setScenario('loading');return true;}
  if(a==='signout'){setScenario('session');return true;}
  if(a==='lang'){S.lang=v;S.menu=null;S.toasts=[];try{localStorage.setItem('fs-smart-contract-lang',v);}catch(_){}focusAfter='language';CF.render();return true;}
  return false;
 },
 afterRender(){
  document.documentElement.lang=S.lang==='en'?'en':'zh-CN';document.title=L('Smart Contracts','智能合约')+' · Financial Services';
  document.getElementById('tcContext').textContent=L('Operations','运营端');
  document.getElementById('nav').setAttribute('aria-label',L('Main navigation','主导航'));
  document.getElementById('crumb').setAttribute('aria-label',L('Breadcrumb','面包屑'));
  if(focusAfter){
   const target=focusAfter==='heading'?document.querySelector('h1'):focusAfter==='language'?document.querySelector('[data-act="menu"][data-v="lang"]'):Array.from(document.querySelectorAll('[data-f]')).find(x=>x.dataset.f===focusAfter);
   // 翻到首页 / 末页后按钮会变灰，焦点落到列表标题而不是消失在 body 上。
   (target&&!target.disabled?target:document.querySelector('[data-f="tcListTitle"]'))?.focus();
   focusAfter='';
  }
 }
});
window.TC={checksum,keccakAscii,validate,fixture,setScenario,matches,get logs(){return this._logs||[];},set logs(v){this._logs=v;},get config(){return data();},setTestConfig(config){testOverride=config;S.dataMode='sample';S.scenario='sample';applyNav();CF.render();CF.syncURL();}};
const FILTER_FIELD={tcType:'type',tcStatus:'status',tcChain:'chain'};
document.addEventListener('change',event=>{
 const n=event.target;
 if(n.id==='tcScenario')setScenario(n.value);
 if(n.id==='tcTimezone'){S.tz=n.value;try{localStorage.setItem('fs-smart-contract-tz',n.value);}catch(_){}CF.render();}
 if(FILTER_FIELD[n.id])S.f[FILTER_FIELD[n.id]]=n.value;
 if(n.id==='tcSize'){const size=parseInt(n.value,10);S.size=PAGE_SIZES.includes(size)?size:DEFAULT_SIZE;S.pg=1;focusAfter='tcSize';CF.render();CF.syncURL();}
});
document.addEventListener('input',event=>{if(event.target.id==='tcKeyword')S.f.kw=event.target.value;});
document.addEventListener('keydown',event=>{if(event.target.id==='tcKeyword'&&event.key==='Enter'){event.preventDefault();S.f.kw=event.target.value;applyFilter('tcKeyword');}});
document.addEventListener('click',event=>{if(event.target.closest('a,button,input,select,[tabindex]'))return;const tr=event.target.closest('[data-contract]');if(tr)openDetail(tr.dataset.contract);});
CF.boot();
})(window.CF);
</script>
