<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资产清单与代币签发 · 运营端</title>
<link rel="stylesheet" href="../../../asset-platform/prototypes/_shared/tokens.css">
<link rel="stylesheet" href="../../../asset-platform/prototypes/_shared/base.css">
<style>
/* WS-318 专有样式。token、公共组件与运行时保持唯一来源，此处不重定义色值与字号，
   只声明本模块特有的排布：签发概况条、状态字形、换算链、双凭证卡。 */

/* —— 顶栏原型工具（沿用兄弟模块把演示开关放顶栏的做法，不做浮层控制台）—— */
.ti-tools{display:flex;align-items:center;gap:var(--sp-2);margin-right:var(--sp-3);flex-wrap:wrap}
.ti-tools select{height:var(--ctrl-h-sm);border:1px solid var(--border-strong);border-radius:var(--radius-xs);
  background:var(--card);padding:0 var(--sp-2);font-size:var(--fs-11);max-width:190px;color:var(--text)}
.ti-clock{display:inline-flex;align-items:center;gap:var(--sp-1);border:1px solid var(--border);
  background:var(--card-2);border-radius:var(--radius-pill);padding:0 var(--sp-1) 0 var(--sp-3);height:var(--ctrl-h-sm)}
.ti-clock .tv{font-family:var(--mono);font-size:var(--fs-10);color:var(--muted);white-space:nowrap}
.ti-clock button{height:22px;padding:0 var(--sp-2);border-radius:var(--radius-pill);font-size:var(--fs-10);
  font-weight:620;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-border)}
.ti-clock button:hover{background:var(--bg-elev)}

/* —— C-O-TI-01 签发概况汇总条：只数笔数，任何位置不出现金额 —— */
.ti-sum{display:flex;align-items:stretch;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-3) var(--card-pad)}
.ti-sum-grid{display:grid;grid-template-columns:repeat(6,minmax(94px,1fr));gap:var(--sp-2);flex:1 1 620px;min-width:0}
.ti-cnt{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);text-align:left;
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.ti-cnt:hover{background:var(--bg-elev);border-color:var(--border-strong)}
.ti-cnt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-border)}
.ti-cnt .n{font-family:var(--mono);font-size:var(--fs-19);font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--text)}
.ti-cnt .k{font-size:var(--fs-11);color:var(--muted);line-height:1.4}
.ti-cnt[data-band="watch"] .n{color:var(--warn)}
.ti-sum-side{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--sp-2);justify-content:space-between;
  min-width:206px;border-left:1px solid var(--border);padding-left:var(--sp-4)}
.ti-sum-side .seg{align-self:flex-start}
.ti-need{display:flex;align-items:center;gap:var(--sp-2);width:100%;justify-content:center;height:var(--ctrl-h);
  border-radius:var(--radius-sm);font-size:var(--fs-12);font-weight:640;
  background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn)}
.ti-need:hover:not(:disabled){filter:brightness(.98)}
.ti-need:disabled{background:var(--card-2);border-color:var(--border);color:var(--faint);cursor:not-allowed}
.ti-sum-foot{font-size:10.5px;color:var(--faint);line-height:1.5;padding:0 var(--card-pad) var(--sp-3)}

/* —— 六态状态字形：形 + 色 + 文三重编码，不靠颜色单独区分 —— */
.ti-st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:640;line-height:1.4;
  white-space:nowrap;color:var(--gray-fg)}
.ti-st .gl{width:13px;height:13px;flex:none;display:block}
.ti-st[data-s="S-TI-1"]{color:var(--faint)}
.ti-st[data-s="S-TI-2"]{color:var(--accent)}
.ti-st[data-s="S-TI-3"]{color:var(--ok)}
.ti-st[data-s="S-TI-4"]{color:var(--danger)}
.ti-st[data-s="S-TI-5"]{color:var(--warn)}
.ti-st[data-s="S-TI-6"]{color:var(--gray-fg)}
.ti-cell-st{display:flex;flex-direction:column;gap:4px;min-width:0}
.ti-why{font-size:var(--fs-11);color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.ti-why code{font-family:var(--mono);font-size:10px;color:var(--faint)}
.ti-inline-act{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-top:2px}

/* 行内「去配置汇率」：无 fx_rate.manage 时不隐藏，渲染为不可点并说明原因（L-03） */
.ti-fxlink{font-size:var(--fs-11);font-weight:640;color:var(--accent);border:1px solid var(--accent-border);
  background:var(--accent-soft);border-radius:var(--radius-xs);padding:2px 7px;line-height:1.6}
.ti-fxlink:hover{background:var(--bg-elev)}
.ti-fxlink[disabled]{color:var(--faint);background:var(--card-2);border-color:var(--border);
  border-style:dashed;cursor:not-allowed}
.ti-fxlink-why{font-size:10.5px;color:var(--faint);line-height:1.5}

/* 定位命中行（AC-TI-56）：高亮 + 首屏可见 */
.ti-locate{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);
  padding:var(--sp-3) var(--card-pad);border-radius:var(--radius-sm);
  background:var(--accent-soft);border:1px solid var(--accent-border);font-size:var(--fs-12);color:var(--accent)}
.ti-locate .right{margin-left:auto;display:flex;gap:var(--sp-2)}
tr.ti-hit td{background:var(--accent-soft)!important;box-shadow:inset 3px 0 0 var(--accent)}

/* 选择条：仅 S-TI-4 可勾选，批量只用于兜底重试，界面无批量签发（AC-TI-45） */
.ti-selbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-3);
  padding:var(--sp-2) var(--card-pad);border-radius:var(--radius-sm);background:var(--card-2);
  border:1px solid var(--border-strong);font-size:var(--fs-12)}
.ti-selbar .right{margin-left:auto;display:flex;gap:var(--sp-2);align-items:center}
.ti-selbar .n{font-family:var(--mono);font-weight:700;color:var(--accent)}
.ti-ck{width:15px;height:15px;accent-color:var(--accent);margin:0}
.ti-ck:disabled{cursor:not-allowed;opacity:.4}
td.ti-ckcell,th.ti-ckcell{width:38px;text-align:center}

/* 详情页两列 */
.ti-layout{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,.86fr);gap:var(--sp-4);align-items:start}
.ti-stack{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}

/* —— 两组链上凭证的区分手法（B-01～B-04）：序号 + 左色带 + 一句话职责 —— */
.ti-proof{border-left:3px solid var(--border-strong)}
.ti-proof[data-seq="1"]{border-left-color:var(--violet)}
.ti-proof[data-seq="2"]{border-left-color:var(--accent)}
.ti-proof .card-head{align-items:center;gap:var(--sp-2)}
.ti-seq{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;flex:none;
  font-family:var(--mono);font-size:10px;font-weight:700}
.ti-proof[data-seq="1"] .ti-seq{background:var(--violet-bg);color:var(--violet);border:1px solid var(--violet-border)}
.ti-proof[data-seq="2"] .ti-seq{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-border)}
.ti-proof-who{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.ti-ask{font-size:var(--fs-12);color:var(--muted);line-height:1.6;margin:0 0 var(--sp-3);
  padding-left:var(--sp-3);border-left:2px solid var(--border-dash)}

/* —— 换算链（F-TI-09）：一条能照着念给资产方听的横链 —— */
.ti-conv{display:flex;align-items:stretch;gap:var(--sp-2);flex-wrap:wrap}
.ti-cn{flex:1 1 148px;min-width:138px;padding:var(--sp-3);border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--card-2);display:flex;flex-direction:column;gap:3px;min-width:0}
.ti-cn .lb{font-size:10.5px;color:var(--faint);font-weight:640;letter-spacing:.04em;text-transform:uppercase}
.ti-cn .vv{font-family:var(--mono);font-size:var(--fs-14);font-weight:700;overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums;line-height:1.35}
.ti-cn .sb{font-size:10.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.ti-cn[data-fin="1"]{background:var(--accent-soft);border-color:var(--accent-border)}
.ti-cn[data-fin="1"] .vv{color:var(--accent)}
.ti-arrow{flex:0 0 16px;display:grid;place-items:center;color:var(--border-strong);font-family:var(--mono);
  font-size:var(--fs-13)}
.ti-cut{margin-top:var(--sp-3);display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-3);
  border-radius:var(--radius-sm);font-size:var(--fs-12);line-height:1.6}
.ti-cut[data-cut="1"]{background:var(--warn-bg);border:1px solid var(--warn-border);color:#8A5D10}
.ti-cut[data-cut="0"]{background:var(--card-2);border:1px dashed var(--border-strong);color:var(--muted)}
.ti-cut .mono{font-weight:700}

/* 数币地址：企业统一收币地址的口径固定写在页面上（10.3） */
.ti-addr-note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:var(--sp-2);
  padding:var(--sp-2) var(--sp-3);background:var(--card-2);border-radius:var(--radius-xs);
  border:1px solid var(--border-dash)}
.ti-mismatch{margin-top:var(--sp-2)}

/* 该状态可做的动作（把「现在能做什么」放在固定位置，J-2 动线不用满页找按钮） */
.ti-do{display:flex;flex-direction:column;gap:var(--sp-2)}
.ti-do .why{font-size:var(--fs-11);color:var(--muted);line-height:1.6}

/* 汇率表：无有效汇率整行警示（AC-FX-03） */
tr.ti-warn-row td{background:var(--warn-bg)}
tr.ti-warn-row:hover td{background:#FFF6DF}
.ti-cur{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.ti-cur .code{font-family:var(--mono);font-weight:700;font-size:var(--fs-13)}
.ti-nofx{display:block;font-size:10.5px;color:var(--warn);line-height:1.5;margin-top:3px}
.ti-rate{font-family:var(--mono);font-size:var(--fs-13);font-weight:700;font-variant-numeric:tabular-nums}
.ti-ver-pending{display:flex;flex-direction:column;gap:2px}

/* 表单 */
.ti-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 var(--sp-4)}
.ti-radio-row{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.ti-radio{display:inline-flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-12);color:var(--muted)}
.ti-radio input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.ti-diff{display:grid;grid-template-columns:1fr 16px 1fr;gap:var(--sp-2);align-items:center;
  padding:var(--sp-3);border-radius:var(--radius-sm);background:var(--card-2);border:1px solid var(--border)}
.ti-diff .cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.ti-diff .cell .lb{font-size:10.5px;color:var(--faint);font-weight:640}
.ti-diff .cell .vv{font-family:var(--mono);font-size:var(--fs-13);font-weight:700;overflow-wrap:anywhere}
.ti-diff .to{text-align:center;color:var(--border-strong);font-family:var(--mono)}
.ti-impact{margin-top:var(--sp-3);font-size:var(--fs-12);line-height:1.7}
.ti-impact li{margin-left:16px}

/* 逐条重试结果面板 C-O-TI-03 */
.ti-res{display:flex;flex-direction:column;gap:var(--sp-2)}
.ti-res .it{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--card)}
.ti-res .it .bd{min-width:0;flex:1}
.ti-res .it .no{font-family:var(--mono);font-size:var(--fs-12);font-weight:640}
.ti-res .it .rs{font-size:var(--fs-11);color:var(--muted);line-height:1.6;margin-top:3px;overflow-wrap:anywhere}
.ti-res-sum{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)}

/* —— 代币 logo（D-TI-23）：圆角方形，24×24 / 48×48，不可点击；
   缺配置时走首字母块兜底，不用通用占位图 —— */
.ti-logo{display:inline-grid;place-items:center;flex:none;overflow:hidden;
  border-radius:var(--radius-xs);background:var(--card-2);border:1px solid var(--border)}
.ti-logo svg{width:100%;height:100%;display:block}
.ti-logo-24{width:24px;height:24px}
.ti-logo-48{width:48px;height:48px;border-radius:var(--radius-sm)}
.ti-logo-fb{background:var(--gray-bg);border-color:var(--gray-border);color:var(--gray-fg);
  font-weight:700;font-family:var(--sans);letter-spacing:0}
.ti-logo-fb.ti-logo-24{font-size:11px}
.ti-logo-fb.ti-logo-48{font-size:20px}
.ti-tokname{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.ti-tkno{font-size:var(--fs-11);white-space:nowrap;letter-spacing:.02em}

/* 代币概览头：logo + 名称 + 本笔数量 */
.ti-tokhead{display:flex;align-items:center;gap:var(--sp-3)}
.ti-tokhead-n{font-size:var(--fs-16);font-weight:680;line-height:1.3}
.ti-tokhead-s{font-size:var(--fs-11);color:var(--faint);margin-top:2px}
.ti-tokhead-q{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:2px}
.ti-tokhead-q .lb{font-size:10.5px;color:var(--faint);font-weight:640}
.ti-tokhead-q .vv{font-family:var(--mono);font-size:var(--fs-19);font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.2}

/* 只读页的边界声明（代币清单没有任何写操作入口） */
.ti-ro{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-11);color:var(--muted)}
.ti-demo-flag{font-size:10.5px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border);
  border-radius:var(--radius-xs);padding:1px 6px;font-weight:620;white-space:nowrap}

/* 主值 / 副值分两行：公共层默认行内，本模块的窄列里会黏成一行 */
.ti-tok-table .ti-tokname .cell-main,.ti-tok-table .ti-tokname .cell-sub{display:block}
.ti-inv-table .cell-main,.ti-inv-table .cell-sub,
.ti-fx-table .cell-main,.ti-fx-table .cell-sub,
.ti-tok-table .cell-main,.ti-tok-table .cell-sub{display:block}
.ti-inv-table .cell-sub,.ti-fx-table .cell-sub,.ti-tok-table .cell-sub{margin-top:2px}
.dl dd .cell-sub{display:block;margin-top:3px}
.ti-em{font-weight:700}

/* 1280 下仍要求操作列可达：宽表固定布局 + 粘住操作列（base.css 的 .tbl.wide 已提供） */
table.tbl.ti-inv-table{min-width:1080px}
table.tbl.ti-inv-table .c-amt{width:118px}
table.tbl.ti-inv-table .c-st{width:216px}
/* 11 列的台账：给固定布局明确的列宽，否则均分之后每个单元格都在折行。
   超过可用宽度时由 .tablewrap 内部横向滚动承担，操作列 sticky 保持可达。 */
table.tbl.ti-tok-table{min-width:1450px}
table.tbl.ti-tok-table th:nth-child(1),table.tbl.ti-tok-table td:nth-child(1){width:170px}
table.tbl.ti-tok-table th:nth-child(2),table.tbl.ti-tok-table td:nth-child(2){width:146px}
table.tbl.ti-tok-table th:nth-child(3),table.tbl.ti-tok-table td:nth-child(3){width:118px}
table.tbl.ti-tok-table th:nth-child(4),table.tbl.ti-tok-table td:nth-child(4){width:92px}
table.tbl.ti-tok-table th:nth-child(5),table.tbl.ti-tok-table td:nth-child(5){width:112px}
table.tbl.ti-tok-table th:nth-child(6),table.tbl.ti-tok-table td:nth-child(6){width:170px}
table.tbl.ti-tok-table th:nth-child(7),table.tbl.ti-tok-table td:nth-child(7){width:110px}
table.tbl.ti-tok-table th:nth-child(8),table.tbl.ti-tok-table td:nth-child(8){width:132px}
table.tbl.ti-tok-table th:nth-child(9),table.tbl.ti-tok-table td:nth-child(9){width:150px}
table.tbl.ti-tok-table th:nth-child(10),table.tbl.ti-tok-table td:nth-child(10){width:112px}
table.tbl.ti-tok-table .col-act{width:138px}
table.tbl.ti-tok-table td{vertical-align:top}
.ti-tok-table .hash .val{white-space:nowrap}
.ti-tok-table .ti-tokname .cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tbl.ti-tok-table .c-time{white-space:normal;width:auto}
table.tbl.ti-fx-table{min-width:980px}
table.tbl.ti-his-table{min-width:820px}

@media (max-width:1360px){
  .ti-layout{grid-template-columns:minmax(0,1fr)}
  .ti-sum-side{border-left:none;padding-left:0;border-top:1px solid var(--border);padding-top:var(--sp-3);
    width:100%;flex-direction:row;align-items:center}
  .ti-sum-side .ti-need{width:auto;padding:0 var(--sp-4)}
}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="brand"><div class="brand-mark">FS</div><div><div class="brand-name">Financial Services</div><div class="brand-sub" id="brandSub"></div></div></div>
  <nav class="nav" id="nav" aria-label="主导航"></nav>
 </aside>
 <div class="main">
  <header class="topbar"><span class="tc-context" id="tiContext"></span><div style="flex:1"></div><div class="topbar-right" id="topRight"></div></header>
  <nav class="crumbbar" id="crumb" aria-label="面包屑"></nav>
  <main class="content" id="content"></main>
 </div>
</div><div id="layers"></div>
<script src="../_shared/registry.js"></script>
<script src="../../../asset-platform/prototypes/_shared/shell.js"></script>
<script>
/* ==========================================================================
   WS-318 资产清单与代币签发 · 运营端原型
   PRD 基线：financial-service-platform/prd/v1.0-资产清单与代币签发/ V1.1

   本文件只实现本模块的五个页面、文案、演示数据与状态表。导航、面包屑、弹层、
   抽屉、Toast、双语、时区渲染、路由与深链全部走 _shared/shell.js，不重建。
   页面上出现的一切企业、金额、汇率、地址、哈希均为演示数据。
   ========================================================================== */
(function(CF){
"use strict";
var t=CF.t,L=CF.L,esc=CF.esc,note=CF.note,pageHead=CF.pageHead,gap=CF.gap;
var INV="P-O-DS-01",DET="P-O-DS-02",FX="P-O-FX-01",FXH="P-O-FX-02",TOK="P-O-TI-01",TDET="P-O-TI-02";
var S=null,focusAfter="";

/* ------------------------------- 文案 ------------------------------------ */
var DICT={en:{},zh:{}};
function D(k,en,zh){DICT.en[k]=en;DICT.zh[k]=zh;}

/* 侧栏菜单文案（navAssetInventory / navFxRates / navTokenList / navTokenManagement）
   属于登记表，唯一来源在 _shared/shell.js 的公共 DICT，本模块不复制一份。 */
D("demoData","Demo data","演示数据");
/* ST-02【红线】：页面任何位置不出现无限定词的「状态」。公共层的 stateSwitch 是
   「原型 · 状态」，这里按同名键覆盖机制在本模块内改写，不动公共层。 */
D("stateSwitch","Prototype · page state","原型 · 页面状态");
D("permLabel","Permission view","权限视图");
D("scenarioLabel","Chain receipt scenario","链上回执情景");
D("clockLabel","Prototype clock","演示时钟");
D("adv10","+10 min","＋10 分");
D("adv1d","+1 day","＋1 天");
D("opsEnd","Operations","运营端");

D("pFull","Full permissions","全权限");
D("pRead","View only","只读（无运维/无汇率维护）");
D("pNoFxManage","No fx_rate.manage","无汇率维护权限");

/* 十六进制演示值：格式合法，不对应任何真实链上交易 */
function hx(seed,n){
 var x=(seed*2654435761)>>>0||0x9e3779b9,s="",c="0123456789abcdef";
 for(var i=0;i<n;i++){
  x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;
  s+=c[x&15];
 }
 return "0x"+s;
}

/* ---------------------- 换算：整数运算，不用浮点 -------------------------- */
/* amt 2 位小数 → 分；rate 6 位小数 → 整数。乘积以 1e-8 USD 为单位，
   截断只在最终结果处做一次（13.2：中间计算不得提前截断）。 */
function centsOf(a){return Math.round(Number(a)*100);}
function rateIntOf(r){return Math.round(Number(r)*1e6);}
function convert(amt,rate){
 var P=centsOf(amt)*rateIntOf(rate);          /* 1e-8 USD */
 var keep=Math.floor(P/1e6)*1e6;              /* 向下截断到 2 位小数 */
 return {p:P,usd:keep/1e8,cut:(P-keep)/1e8};
}
function fmtNum(v,dp){
 return Number(v).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function money(v,cur){return fmtNum(v,2)+" "+cur;}
function fmtRate(r){return fmtNum(r,6);}
/* D-TI-19 最多 6 位小数；截断展示同样向下截断，不四舍五入 */
function fmtCut(c){var v=Math.floor(Number(c)*1e6)/1e6;return fmtNum(v,6);}

function snapOf(amt,cur,ver){
 var c=convert(amt,ver.rate);
 return {amt:amt,cur:cur,rate:ver.rate,rateAt:ver.effAt,rateSrc:ver.src,rateVer:ver.id,
         usd:c.usd,tokens:c.usd,cut:c.cut};
}

 });

  if(!m[a.cur]){m[a.cur]={n:0,s:0};ks.push(a.cur);}
  m[a.cur].n++;m[a.cur].s+=Number(a.amt);

 });
 ks.sort();
 var over=list.length>200;

function pushTl(a,k,by,v){a.tl.push(tl(S.clock,k,by,v));}
function toast(kind,msg){CF.toast(kind,msg);}

/* 11.3 签发前置校验，顺序固定；任一步不通过即终止，不继续往下走 */
function precheck(a){
 if(a.st==="S-TI-3")return {stop:true};                              /* 1 已有成功签发记录 */
 if(a.st==="S-TI-2")return {stop:true,busy:true};                    /* 2 存在在途交易 */
 if(!walletOf(a))return {st:"S-TI-6",code:"E-TI-06"};                /* 3 数币地址（防御性复核） */
 if(S.clock.slice(0,10)>a.due)return {st:"S-TI-6",code:"E-TI-01"};   /* 4 到期日当天仍可签发，按 UTC 日期比较 */
 var ver=fxCurrent(a.cur);
 if(!ver)return {st:"S-TI-4",code:"E-TI-03"};                        /* 5 该币种有有效汇率 */
 var snap=snapOf(a.amt,a.cur,ver);
 if(snap.usd<0.01)return {st:"S-TI-6",code:"E-TI-02",snap:snap};     /* 6 换算后金额 */
 return {ok:true,snap:snap};
}
/* 提交：先快照后提交（AC-TI-41），提交后立刻置 S-TI-2，期间拒绝任何新的触发或重试 */
function submitMint(a,byOp){
 var c=precheck(a);
 if(c.stop)return {r:"skip",why:t("resSkipWhy")};
 if(c.st){
  a.st=c.st;a.code=c.code;a.snap=c.snap||a.snap;
  if(c.code==="E-TI-03"){pushTl(a,"tlFail",byOp?"byOp":null,c.code);return {r:"fail",why:t("E-TI-03",{c:a.cur})};}
  pushTl(a,"tlBlock",byOp?"byOp":null,c.code);
  return {r:"fail",why:reasonText(a)};
 }
 a.snap=c.snap;
 pushTl(a,"tlSnap",byOp?"byOp":null,(c.snap.rateVer||"builtin")+" · "+fmtRate(c.snap.rate));
 if(S.scenario==="submitfail"){
  a.st="S-TI-4";a.code="E-TI-04";a.desc="submit rejected by node";
  pushTl(a,"tlFail",byOp?"byOp":null,"E-TI-04");
  return {r:"fail",why:t("toastSubmitFail")};
 }
 a.txHash=hx(Date.parse(S.clock)+(S.txSeq=(S.txSeq||0)+1)*7919,64);
 a.st="S-TI-2";a.code=null;a.desc=null;
 pushTl(a,"tlSubmit",byOp?"byOp":null,a.txHash);
 return {r:"ok",why:t("resOk")};
}
/* 回执结算：由演示时钟推进触发，模拟链上回执，不代表真实调度 */
function settle(a){
 if(a.st!=="S-TI-2")return;
 if(S.scenario==="timeout"){a.st="S-TI-5";a.code=null;pushTl(a,"tlTimeout",null,"30 min");return;}
 if(S.scenario==="fail"){a.st="S-TI-4";a.code="E-TI-04";a.desc="execution reverted: mint paused";pushTl(a,"tlFail",null,"E-TI-04");return;}
 a.st="S-TI-3";a.code=null;a.to=walletOf(a);a.doneAt=S.clock;
 if(!a.tkNo)a.tkNo=mkTkNo(a.doneAt);          /* 铸造成功即生成，重试多次也只生成一个 */
 pushTl(a,"tlDone",null,fmtNum(a.snap.tokens,2)+" "+MINT.symbol);
}
/* 11.2 定时补扫：只处理从未提交过链上交易的资产（S-TI-1 与校验类 S-TI-4），
   链上类 S-TI-4 与 S-TI-5 一律不处理——这是补扫不会制造超发的保证。 */
function sweep(){
 S.assets.forEach(function(a){
  if(a.st==="S-TI-2"){settle(a);return;}
  var never=a.st==="S-TI-1"||(a.st==="S-TI-4"&&a.code==="E-TI-03");
  if(!never)return;
  pushTl(a,"tlSweep");
  submitMint(a,false);
 });
}
function advance(ms){
 S.clock=new Date(Date.parse(S.clock)+ms).toISOString();
 sweep();
 CF.render();CF.syncURL();
}

function retryRun(ids){
 S.busy=true;CF.render();
 setTimeout(function(){
  var items=[];
  ids.forEach(function(id,i){
   var a=byId(id);if(!a)return;
   if(a.st!=="S-TI-4"){items.push({id:id,r:"skip",why:t("resSkipWhy")});return;}
   a.retries++;
   pushTl(a,"tlRetry","byOp");
   var scen=S.scenario;
   if(scen==="partial"&&i%3===2)S.scenario="submitfail";
   var r=submitMint(a,true);
   S.scenario=scen;
   items.push({id:id,r:r.r,why:r.why});
  });
  S.result={items:items};
  S.busy=false;S.modal=null;S.sel={};
  S.drawer="result";
  toast("success",t("toastRetried"));
  CF.render();
 },460);
}

   if(!a.tkNo)a.tkNo=mkTkNo(a.doneAt);

/* ------------------------------ URL 方案 --------------------------------- */
function qs(o){
 var p=[];
 for(var k in o)if(o[k])p.push(k+"="+encodeURIComponent(o[k]));
 if(S.st&&S.st!==CF.defaultState(S.page))p.push("st="+S.st);
 return p.length?"?"+p.join("&"):"";
}
function buildHash(){
 if(S.page===INV)return "#/ops/asset-inventory"+qs({focus:S.focusId,from:S.backTok?"tokens":""});
 if(S.page===DET)return "#/ops/asset-inventory/"+encodeURIComponent(S.detId)+qs({});
 if(S.page===FX)return "#/ops/fx-rates"+qs({cur:S.backInv?S.fxCur:""});
 if(S.page===FXH)return "#/ops/fx-rates/"+encodeURIComponent(S.fxCur||"CNY")+"/history"+qs({});
 if(S.page===TOK)return "#/ops/token-list"+qs({});
 if(S.page===TDET)return "#/ops/token-list/"+encodeURIComponent(S.tokDetId)+qs({});
 return "#/"+S.page.toLowerCase();
}
function readHash(){
 var h=location.hash||"";if(!h)return false;
 var parts=h.replace(/^#\/?/,"").split("?"),seg=parts[0].split("/"),p={};
 (parts[1]||"").split("&").forEach(function(kv){
  if(!kv)return;var i=kv.indexOf("=");p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
 var page=null;
 if(seg[0]==="ops"&&seg[1]==="asset-inventory"){
  if(seg[2]){page=DET;S.detId=decodeURIComponent(seg[2]);}
  else{page=INV;S.focusId=p.focus||"";S.backTok=p.from==="tokens";}
 }else if(seg[0]==="ops"&&seg[1]==="fx-rates"){
  if(seg[3]==="history"){page=FXH;S.fxCur=decodeURIComponent(seg[2]||"CNY");}
  else{page=FX;if(p.cur){S.fxCur=p.cur;S.backInv=true;}}
 }else if(seg[0]==="ops"&&seg[1]==="token-list"){
  if(seg[2]){page=TDET;S.tokDetId=decodeURIComponent(seg[2]);}else page=TOK;
 }
 else{
  var id=(seg[0]||"").toUpperCase();
  if(CF.PAGES[id])page=id;
 }
 if(!page)return false;
 S.page=page;

  if(a==="ti-clear"){clearFilters();CF.render();CF.syncURL();return true;}
  if(a==="ti-reload"){CF.setState("default");return true;}
  if(a==="ti-pgInv"){var p1=parseInt(v,10);if(p1>0){S.pgInv=p1;S.focusId="";CF.render();}return true;}
  if(a==="ti-pgTok"){var p2=parseInt(v,10);if(p2>0){S.pgTok=p2;CF.render();}return true;}

  /* —— 行内与跳转 —— */
  if(a==="ti-open"){S.detId=v;S.modal=null;CF.go(DET);return true;}
  if(a==="ti-sel"){if(S.sel[v])delete S.sel[v];else S.sel[v]=true;CF.render();return true;}
  if(a==="ti-selnone"){S.sel={};CF.render();return true;}
  if(a==="ti-selall"){
   var fails=invRows().filter(function(r){return r.st==="S-TI-4";});
   var on=fails.length&&fails.every(function(r){return S.sel[r.srcId];});
   S.sel={};
   if(!on)fails.forEach(function(r){S.sel[r.srcId]=true;});
   CF.render();return true;}
  if(a==="ti-unfocus"){S.focusId="";CF.render();CF.syncURL();return true;}
  if(a==="ti-backtok"){
   var toDet=S.backTokDet;S.focusId="";S.backTok=false;S.backTokDet=false;
   CF.go(toDet?TDET:TOK);return true;}
  if(a==="ti-backinv"){S.backInv=false;CF.go(INV);return true;}
  /* T-02 / AC-TI-56：按来源资产 ID 深链并精确定位到该行，不是跳到列表首页 */
  if(a==="ti-goasset"){S.focusId=v;S.backTok=true;S.backTokDet=false;S.invF=emptyInvF();S.pgInv=1;CF.go(INV);return true;}
  if(a==="ti-tokdet"){S.tokDetId=v;CF.go(TDET);return true;}
  if(a==="ti-backtokdet"){CF.go(TOK);return true;}
  /* 从代币详情跳资产侧：返回时逐层退回（资产清单 → 代币详情 → 代币清单），
     每一层都保留状态，代币清单的筛选与分页必须保住（AC-TI-67 / T-03 / T-06）。 */
  if(a==="ti-tokgoasset"){S.focusId=v;S.backTok=true;S.backTokDet=true;S.invF=emptyInvF();S.pgInv=1;CF.go(INV);return true;}
  /* L-02 / AC-FX-13：带币种深链进汇率管理，币种预填不可改，保存后可返回并保留筛选与分页 */
  if(a==="ti-gofx"){S.fxCur=v;S.backInv=true;CF.go(FX);fxFormOpen(v,"",true);CF.render();return true;}
  if(a==="ti-fxblocked"){
   S.invF=emptyInvF();S.invF.st=["S-TI-4"];S.pgInv=1;CF.go(INV);return true;}
  if(a==="ti-fxver"){S.fxCur=v;CF.go(FXH);return true;}

  /* —— 重试 / 查询 —— */
  if(a==="ti-retry1"){S.modal={type:"retry1",id:v};CF.render();return true;}
  if(a==="ti-retry1-go"){retryRun([S.modal.id]);return true;}
  if(a==="ti-retryN"){S.modal={type:"retryN",ids:selIds()};CF.render();return true;}
  if(a==="ti-retryN-go"){retryRun(S.modal.ids);return true;}
  if(a==="ti-query"){queryChain(v);return true;}

  /* —— 汇率 —— */
  if(a==="ti-fxnew"){fxFormOpen(v,"",false);CF.render();return true;}
  if(a==="ti-fxedit"){fxFormOpen("",v,false);CF.render();return true;}
  if(a==="ti-fxdel"){S.modal={type:"fxDel",id:v};CF.render();return true;}
  if(a==="ti-fxdel-go"){
   var id=S.modal.id;
   S.fx.forEach(function(x){
    if(x.id!==id)return;
    x.st="deleted";
    S.fxOps.push({cur:x.cur,op:"opDel",by:"demo.ops@demo.test",at:S.clock,
     before:fmtRate(x.rate)+" · "+t("vsPending"),after:t("vsDeleted")});
   });
   S.modal=null;toast("success",t("toastFxDel"));CF.render();return true;}
  if(a==="ti-fxtoggle"){S.modal={type:"fxToggle",cur:v};CF.render();return true;}
  if(a==="ti-fxtoggle-go"){
   var c=S.modal.cur,was=fxEnabled(c);
   S.fxOn[c]=!was;
   S.fxOps.push({cur:c,op:was?"opOff":"opOn",by:"demo.ops@demo.test",at:S.clock,
    before:t(was?"fxOn":"fxOff"),after:t(was?"fxOff":"fxOn")+" · "+t("fxOffImpact",{n:pendingOf(c),m:issuedOf(c)})});
   S.modal=null;toast("success",t(was?"toastFxOff":"toastFxOn"));CF.render();return true;}
  if(a==="ti-fxeffmode"){S.fxForm.mode=v;CF.render();return true;}
  if(a==="ti-fxnext"){fxNext();return true;}
  if(a==="ti-fxback"){S.fxForm.step="form";CF.render();return true;}
  if(a==="ti-fxsave"){fxSave();return true;}
  if(a==="ti-fxhis"){S.fxCur=v;CF.go(FXH);return true;}
  if(a==="ti-fxlocked"){S.modal={type:"fxLocked",cur:v};CF.render();return true;}

  /* —— 其他 —— */
  if(a==="ti-stop")return true;          /* 弹层内层：吃掉冒泡，避免点内容把弹层关了 */
  if(a==="ti-copy"){copyText(v);return true;}
  if(a==="ti-adv"){advance(parseInt(v,10)*60000);return true;}
  return false;
 },
 afterRender:function(){
  document.documentElement.lang=S.lang==="en"?"en":"zh-CN";
  document.title=(S.page===FX||S.page===FXH?t("fxTitle"):S.page===TDET?t("tokDetTitle"):S.page===TOK?t("tokTitle"):t("invTitle"))+" · "+L("Financial Services","金融服务平台");
  var ctx=document.getElementById("tiContext");
  if(ctx)ctx.textContent=L("Operations","运营端")+" · "+L("Asset inventory & token issuance","资产清单与代币签发");
  /* 精确定位：命中行滚进首屏（AC-TI-56 / 16 章「深链定位须在目标页首屏内完成」） */
  if(S.page===INV&&S.focusId){
   setTimeout(function(){
    var row=document.getElementById("row-"+S.focusId);
    if(row&&row.scrollIntoView)row.scrollIntoView({block:"center",behavior:"auto"});
   },0);
  }
  if(focusAfter){
   var el=document.querySelector('[data-f="'+focusAfter+'"]');
   if(el&&el.focus)el.focus();
   focusAfter="";
  }
 }
});

/* 表单与筛选输入：走原生 change / input，值直接写回 S 对应路径 */
function setPath(path,val){
 var seg=path.split("."),o=S;
 for(var i=0;i<seg.length-1;i++)o=o[seg[i]];
 o[seg[seg.length-1]]=val;
}
document.addEventListener("change",function(e){
 var n=e.target,f=n.getAttribute&&n.getAttribute("data-f");
 if(!f)return;
 if(f==="tiPerm"){S.perm=n.value;S.sel={};CF.render();return;}
 if(f==="tiScen"){S.scenario=n.value;CF.render();return;}
 if(f.indexOf(".")<0)return;
 setPath(f,n.value);
 /* 只有 <select> 重绘：文本框的 change 在 blur 时触发，正落在下一次点击的
    mousedown 与 mouseup 之间，重绘会把目标按钮换掉，那一次点击就丢了。
    文本与日期的值已经写回 S，下一次重绘自然带出来。 */
 if(n.tagName==="SELECT"){focusAfter=f;CF.render();CF.syncURL();}
});
document.addEventListener("input",function(e){
 var n=e.target,f=n.getAttribute&&n.getAttribute("data-f");
 if(!f||f.indexOf(".")<0)return;
 if(n.type==="date"||n.type==="datetime-local")return;
 setPath(f,n.value);
});
document.addEventListener("keydown",function(e){
 var n=e.target,f=n.getAttribute&&n.getAttribute("data-f");
 if(f&&e.key==="Enter"&&(f==="invF.kw"||f==="tokF.kw")){
  e.preventDefault();focusAfter=f;CF.render();CF.syncURL();
 }
});
/* 已生效行的汇率值被点击时给引导（AC-FX-08），而不是只把按钮禁掉 */
document.addEventListener("click",function(e){
 var n=e.target.closest?e.target.closest(".ti-rate"):null;
 if(!n||S.page!==FX)return;
 var tr=n.closest("tr");if(!tr)return;
 var code=tr.querySelector(".ti-cur .code");
 if(!code)return;
 var c=code.textContent.trim();
 if(c==="USD"||!P().fxManage)return;
 if(n.closest(".ti-ver-pending"))return;
 S.modal={type:"fxLocked",cur:c};CF.render();
});

CF.boot();
})(window.CF);
</script>
