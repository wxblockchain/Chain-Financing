<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融服务端 · 借贷广场 — 融资需求与代币质押（原型）</title>
<!--
  WS-324 借贷广场 · 融资需求与代币质押 — 一体化原型 v1.1
  PRD 基线：v1.0-借贷广场-融资需求与代币质押-PRD.md V5.0 + 01-对外契约与数据字典.md V5.0
  形态：console（金融服务端 · 面客）。单文件，双击即开，无网络依赖。
  本文件由 src/ 下的分层源码内联生成（见 build.sh），不要直接手改本文件。
  后续模块 WS-325～WS-329 在 80-router.js 的 ROUTES「模块注册区」追加页面即可。
-->
<style>
/* ============================================================
   1. tokens —— 所有颜色与字体只走命名 token，页面内不写裸色值
   字阶是本版的主要修订点：把跨度从 2.4× 拉到 4.0×，
   让"该突出的"靠尺寸而不是靠颜色去突出。
   ============================================================ */
:root{
  /* 纸面与墨色 */
  --paper:#F4F6FA;
  --card:#FFFFFF;
  --sunken:#F8FAFC;
  --sunken-2:#EFF3F9;
  --line:#E5E9F0;
  --line-soft:#EEF1F6;
  --line-strong:#CBD5E3;
  --ink:#0C1420;
  --ink-2:#4A5567;
  --ink-3:#7A8698;
  --ink-4:#9BA5B4;
  --ink-inv:#FFFFFF;

  /* 主色：整页只用在一处主操作与一个关键读数上 */
  --accent:#1F53C4;
  --accent-hover:#1A46A8;
  --accent-wash:#EEF3FD;
  --accent-line:#C2D4F5;

  /* 状态色：保留色，永不充当数据系列 */
  --st-good:#0C7A43;    --st-good-wash:#EDF7F1;   --st-good-line:#C6E4D4;
  --st-warn:#8A5200;    --st-warn-wash:#FDF5E8;   --st-warn-line:#EBD9B2;
  --st-crit:#AC2E29;    --st-crit-wash:#FCEFEE;   --st-crit-line:#EFCAC7;
  --st-mute:#5A6578;    --st-mute-wash:#EFF2F6;   --st-mute-line:#DBE1EA;

  /* 数据系列色：经 dataviz validator 校验（light / surface #FFFFFF / --pairs all 全通过） */
  --s1:#2a78d6;  --s1-fill:rgba(42,120,214,.15);   /* 有效质押价值 · 融资上限 */
  --s2:#eb6834;  --s2-fill:rgba(235,104,52,.18);   /* 项目融资余额 */
  --s3:#1baf7a;  --s3-fill:rgba(27,175,122,.18);   /* 项目在途金额 */
  --s-void:#8D99A9; --s-void-fill:rgba(141,153,169,.16); /* 失效代币：中性灰＋斜纹，非系列色 */
  --s-free:#A9C2E8;

  /* 图表底盘 */
  --grid:#EDF0F5;
  --axis:#CBD5E3;
  --axis-ink:#8A94A5;

  /* 字体 */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* 字阶：8 级，11 → 44，跨度 4.0× */
  --fs-xs:11px; --fs-sm:12px; --fs-b:13.5px; --fs-md:15px;
  --fs-lg:20px; --fs-stat:26px; --fs-h1:34px; --fs-hero:44px;

  /* 形制 */
  --r-s:6px; --r:10px; --r-l:12px;
  --shadow:0 1px 2px rgba(12,20,32,.04);
  --shadow-pop:0 18px 44px rgba(12,20,32,.18),0 2px 8px rgba(12,20,32,.08);
  --maxw:1440px;
  --ease:cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:var(--fs-b);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:52px;
}
.num,.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.012em}
button,input,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }

/* ============================================================
   2. 壳层
   ============================================================ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

.appbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:30px;height:62px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .mk{
  width:29px;height:29px;border-radius:8px;background:var(--accent);color:var(--ink-inv);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;
}
.brand .nm{font-weight:680;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand .nm i{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:8px;font-size:var(--fs-sm)}

.mainnav{display:flex;gap:3px;flex:1;min-width:0}
.mainnav button{
  background:none;border:0;padding:7px 14px;border-radius:var(--r-s);cursor:pointer;
  color:var(--ink-2);font-size:var(--fs-b);white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease);
}
.mainnav button:hover{background:var(--sunken-2);color:var(--ink)}
.mainnav button[aria-current="page"]{background:var(--sunken-2);color:var(--ink);font-weight:650}

.who{display:flex;align-items:center;gap:10px;flex:none}
.who .id{text-align:right;line-height:1.25}
.who .id b{display:block;font-size:var(--fs-sm);font-weight:650}
.who .id span{display:block;font-size:var(--fs-xs);color:var(--ink-3)}
.who .av{
  width:31px;height:31px;border-radius:50%;background:var(--sunken-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--ink-2);font-weight:650;flex:none;
}

main{padding:30px 0 56px}

/* 页头：字阶的顶点之一。标题 34px，副题 13.5px —— 跨度靠这里建立 */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:22px}
.page-head h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.028em;line-height:1.18}
.page-head .sub{color:var(--ink-2);font-size:var(--fs-b);margin-top:8px;max-width:820px}
.page-head .sum{color:var(--ink-3);font-size:var(--fs-sm);margin-top:9px}
.page-head .sum b{color:var(--ink-2);font-weight:600;font-family:var(--num)}
.page-head .sum .demo{
  display:inline-flex;align-items:center;font-size:10px;color:var(--st-warn);background:var(--st-warn-wash);
  border:1px solid var(--st-warn-line);border-radius:4px;padding:1px 6px;font-weight:600;vertical-align:1px;
}

.crumb{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:14px}
.crumb button{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:var(--fs-sm)}
.crumb button:hover{color:var(--accent);text-decoration:underline}
.crumb i{font-style:normal;color:var(--line-strong)}

/* ============================================================
   3. 基础件
   卡片外壳变轻：标题行不再是填色条 + 分隔线，只是一行标签。
   分区靠留白和白底本身，不靠额外的框线。
   ============================================================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.card + .card{margin-top:20px}
.card > .ch{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:20px 24px 2px}
.card > .ch h2{font-size:var(--fs-md);font-weight:680;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.card > .ch .note-r,.card > .ch p{font-size:var(--fs-sm);color:var(--ink-3);font-weight:400}
.card > .ch .lvl{
  font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;letter-spacing:.04em;
}
.card.tbl > .ch{padding-bottom:16px;border-bottom:1px solid var(--line)}
.cb{padding:18px 24px 24px}
.cb.tight{padding:0}
.cb.t0{padding-top:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);cursor:pointer;font-size:var(--fs-b);font-weight:500;
  transition:background .15s var(--ease),border-color .15s var(--ease);white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--sunken-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink-inv);font-weight:650}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:29px;padding:0 11px;font-size:var(--fs-sm)}
.btn.lg{height:44px;padding:0 24px;font-size:var(--fs-md);font-weight:650}
.btn.ghost{border-color:transparent;background:var(--sunken)}
.btn.ghost:hover:not(:disabled){background:var(--sunken-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.danger{color:var(--st-crit);border-color:var(--line-strong);background:var(--card)}
.btn.danger:hover:not(:disabled){background:var(--st-crit-wash);border-color:var(--st-crit-line)}
.btn.link{border:0;background:none;height:auto;padding:0;color:var(--accent);font-size:inherit;font-weight:inherit}
.btn.link:hover{text-decoration:underline;background:none}

.btn.blocked{
  color:var(--ink-3);background:var(--sunken);border-color:var(--line);
  border-style:dashed;cursor:not-allowed;font-weight:500;
}
.btn.blocked:hover{background:var(--sunken)}
.btn.blocked .sig{color:var(--ink-4);font-size:13px;line-height:1}
.why{display:flex;gap:7px;margin-top:7px;font-size:var(--fs-sm);color:var(--ink-3);line-height:1.5}
.why .sig{color:var(--ink-4);flex:none;line-height:1.45}

.tag{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:var(--fs-sm);font-weight:600;border:1px solid transparent;white-space:nowrap;
}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.tag.good{color:var(--st-good);background:var(--st-good-wash);border-color:var(--st-good-line)}
.tag.warn{color:var(--st-warn);background:var(--st-warn-wash);border-color:var(--st-warn-line)}
.tag.crit{color:var(--st-crit);background:var(--st-crit-wash);border-color:var(--st-crit-line)}
.tag.mute{color:var(--st-mute);background:var(--st-mute-wash);border-color:var(--st-mute-line)}
.tag.info{color:var(--accent);background:var(--accent-wash);border-color:var(--accent-line)}
.tag.plain{color:var(--ink-3);background:var(--card);border-color:var(--line)}

/* 键值：去掉网格线，改为留白分栏——同样的信息，少一层框 */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 28px}
.kv.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv .k{font-size:var(--fs-sm);color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv .v{font-size:var(--fs-md);font-weight:650;margin-top:5px;font-family:var(--num);font-variant-numeric:tabular-nums}
.kv .v.txt{font-family:var(--sans);font-weight:600}
.kv .x{font-size:var(--fs-xs);color:var(--ink-4);margin-top:4px;font-family:var(--sans);line-height:1.5}

table.dt{font-size:var(--fs-b)}
table.dt th{
  text-align:left;font-weight:500;color:var(--ink-3);font-size:var(--fs-sm);
  padding:0 14px;height:38px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.dt td{padding:0 14px;height:48px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--sunken)}
table.dt td.n,table.dt th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt th.n{font-family:var(--sans)}
table.dt .sel{width:40px}
table.dt tr.picked td{background:var(--accent-wash)}
table.dt tr.picked:hover td{background:var(--accent-wash)}
table.dt td.wrap2{white-space:normal;line-height:1.45}
.tscroll{overflow-x:auto}

input[type=text],input[type=number],select{
  height:38px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);
  background:var(--card);width:100%;transition:border-color .15s var(--ease);
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input.bad{border-color:var(--st-crit)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
label.fl{display:block;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:7px}
label.fl b{color:var(--st-crit);font-weight:400}
.hint{font-size:var(--fs-sm);color:var(--ink-3);margin-top:7px}
.err{font-size:var(--fs-sm);color:var(--st-crit);margin-top:8px;display:flex;gap:7px;align-items:flex-start;line-height:1.6}

/* 提示条：只有担保不足用填色，其余降为左侧色规 + 白底，整页的色块数量因此减少 */
.note{
  display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card);font-size:var(--fs-b);line-height:1.62;
}
.note .ic{flex:none;font-family:var(--num);font-size:var(--fs-sm);font-weight:700;margin-top:2px;color:var(--ink-4)}
.note b{font-weight:680}
.note .bd{min-width:0}
.note .bd p{margin-top:5px;color:var(--ink-2)}
.note .act{margin-left:auto;flex:none;align-self:center}
.note.good{border-left:3px solid var(--st-good)} .note.good .ic{color:var(--st-good)}
.note.warn{border-left:3px solid var(--st-warn)} .note.warn .ic{color:var(--st-warn)}
.note.info{border-left:3px solid var(--accent)}  .note.info .ic{color:var(--accent)}
.note.crit{background:var(--st-crit-wash);border-color:var(--st-crit-line);border-left:3px solid var(--st-crit)}
.note.crit .ic{color:var(--st-crit)} .note.crit .bd p{color:var(--st-crit);opacity:.92}
.note.quiet{background:var(--sunken);border-color:var(--line)}
.note.quiet,.note.quiet .bd p{color:var(--ink-2);font-size:var(--fs-sm)}

/* ============================================================
   4. 招牌件 A：三数等式（AC-LS-53）
   本版改为裸露在页面底色上的读数带，不再包一层卡片——
   它是详情页的视觉顶点，靠 44px 字号和留白拿权重，不靠填色。
   ============================================================ */
.strip{padding:4px 2px 0}
.strip + .strip{margin-top:26px}
.trio{display:grid;grid-template-columns:auto 34px auto 34px auto;align-items:end;gap:0;margin-bottom:18px}
.trio .cell{min-width:0;padding-right:26px}
.trio .op{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:var(--fs-lg);color:var(--ink-4);font-weight:400;padding-bottom:14px;
}
.trio .idx{font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.08em}
.trio .lb{font-size:var(--fs-sm);color:var(--ink-2);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trio .amt{
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-stat);
  font-weight:650;letter-spacing:-.035em;margin-top:7px;line-height:1.1;
}
.trio .cell.out .amt{font-size:var(--fs-hero);color:var(--accent);font-weight:700}
/* 质押率：纯文本，无控件、无焦点态（AC-LS-56 / D-MC-110 / D-MC-111） */
.trio .rate{
  font-family:var(--num);font-size:var(--fs-stat);font-weight:650;margin-top:7px;
  letter-spacing:-.035em;line-height:1.1;color:var(--ink-2);
}
.trio .fixed{font-size:var(--fs-xs);color:var(--ink-4);margin-top:6px;font-family:var(--sans)}
.trio-sub{font-size:var(--fs-sm);color:var(--ink-3);margin-top:-6px;margin-bottom:20px}
.trio-sub .n{color:var(--ink-2);font-weight:600}

/* ============================================================
   5. 招牌件 B：额度尺
   ============================================================ */
.meter .mwrap{position:relative;padding-top:18px}
.meter .track{
  position:relative;height:22px;border-radius:5px;background:var(--sunken-2);
  border:1px solid var(--line);display:flex;overflow:hidden;
}
.meter .seg{height:100%;position:relative}
.meter .seg + .seg{border-left:2px solid var(--card)}
.meter .seg.bal{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.meter .seg.fly{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.meter .seg.free{background:rgba(42,120,214,.08);box-shadow:inset 0 0 0 1px var(--s-free)}
.meter .seg.gap{background:var(--st-crit-wash);background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--st-crit-line) 5px 7px);box-shadow:inset 0 0 0 1px var(--st-crit)}
.meter .mwrap > .capline{position:absolute;top:13px;bottom:-5px;width:2px;background:var(--s1);border-radius:2px;z-index:2}
.meter .mwrap > .caplb{position:absolute;top:0;white-space:nowrap;font-size:var(--fs-xs);color:var(--s1);font-weight:650;line-height:1.3}
.meter .legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:var(--fs-sm);color:var(--ink-3)}
.meter .legend span{display:inline-flex;align-items:center;gap:7px}
.meter .legend i{width:10px;height:10px;border-radius:3px;flex:none;font-style:normal}
.meter .legend i.bal{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.meter .legend i.fly{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.meter .legend i.free{background:rgba(42,120,214,.08);box-shadow:inset 0 0 0 1px var(--s-free)}
.meter .legend i.gap{background:var(--st-crit-wash);box-shadow:inset 0 0 0 1px var(--st-crit)}
.meter .legend i.cap{width:2px;height:12px;border-radius:1px;background:var(--s1)}
.meter .legend b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
/* 列表行内的迷你尺：只保留"已占用 vs 可融"与上限刻度，两色以内 */
.meter.mini .mwrap{padding-top:0}
.meter.mini .mwrap > .capline{top:-3px;bottom:-3px}
.meter.mini .track{height:8px;border-radius:4px}
.meter.mini .legend{display:none}

/* ============================================================
   6. 融资进度（环节名取自 PRD 状态机 S-FP-*；后段标注为后续环节）
   ============================================================ */
.flow{display:flex;align-items:stretch;gap:0;margin:0}
.flow .fs{flex:1;min-width:0;padding:0 0 0 15px;position:relative}
.flow .fs::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--line);
}
.flow .fs.done::before{background:var(--st-good)}
.flow .fs.now::before{background:var(--accent)}
.flow .fs.next::before{background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px)}
.flow .fs.later::before{background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px)}
.flow .fs.now.later::before{background:repeating-linear-gradient(180deg,var(--accent) 0 4px,transparent 4px 8px)}
.flow .fs.later .st{color:var(--ink-3)}
.flow .fs.now.later .st{color:var(--accent)}
.flow .fs .sid{font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.04em}
.flow .fs .st{font-size:var(--fs-b);font-weight:650;color:var(--ink-3);margin-top:3px}
.flow .fs.done .st{color:var(--ink-2)}
.flow .fs.now .st{color:var(--accent)}
.flow .fs .sx{font-size:var(--fs-xs);color:var(--ink-4);margin-top:3px;line-height:1.5}
.flow .fsep{
  flex:none;width:1px;background:var(--line-strong);margin:0 18px;position:relative;
}
.flow .fsep span{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;color:var(--ink-4);background:var(--card);padding:0 6px;letter-spacing:.04em;
}
.flow-foot{font-size:var(--fs-sm);color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}

/* ============================================================
   7. 折叠层（第二层：验算与核对用，默认收起）
   ============================================================ */
.fold{border-top:1px solid var(--line-soft)}
.fold > summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:13px 0 13px;font-size:var(--fs-b);color:var(--ink-2);font-weight:600;
}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary:hover{color:var(--accent)}
.fold > summary .caret{
  font-family:var(--num);font-size:10px;color:var(--ink-4);transition:transform .15s var(--ease);display:inline-block;
}
.fold[open] > summary .caret{transform:rotate(90deg)}
.fold > summary .cnt{margin-left:auto;font-size:var(--fs-sm);color:var(--ink-4);font-weight:400}
.fold .fb{padding:2px 0 20px}

/* ============================================================
   8. 次级视图 tab（第三层：项目档案，不是本次决策的输入）
   ============================================================ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 24px}
.tabs button{
  background:none;border:0;padding:14px 14px 12px;cursor:pointer;font-size:var(--fs-b);
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--num);font-size:var(--fs-xs);color:var(--ink-4);margin-left:6px}

/* ============================================================
   9. P-LS-01 列表：表格形态，行高 56px
   ============================================================ */
.filters{
  display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;
  padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow);margin-bottom:16px;
}
.filters .f{min-width:124px}
.filters .f > span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:5px}
.filters .f select{height:33px;font-size:var(--fs-sm)}
.filters .spacer{flex:1}
.filters .rs{display:flex;align-items:center;gap:10px;padding-bottom:6px}

table.list{font-size:var(--fs-b)}
table.list th{
  text-align:left;font-weight:500;color:var(--ink-3);font-size:var(--fs-sm);
  padding:0 16px;height:42px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.list th.n{text-align:right}
table.list td{padding:0 16px;height:56px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.list tbody tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer;transition:background .12s var(--ease)}
table.list tbody tr:hover{background:var(--sunken)}
table.list td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .nm{font-size:var(--fs-b);font-weight:650;letter-spacing:-.01em;line-height:1.3}
.prow .sub{font-size:var(--fs-xs);color:var(--ink-3);margin-top:3px;display:flex;gap:8px;align-items:center}
.prow .sub .id{font-family:var(--num)}
.prow .dm{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-md);font-weight:680;letter-spacing:-.02em}
.prow .dm.none{color:var(--ink-4);font-weight:500;font-size:var(--fs-b)}
.prow .mt{width:136px}
.prow .mt .cover{font-size:var(--fs-xs);color:var(--ink-3);margin-top:5px;font-family:var(--num);white-space:nowrap}
.prow .mt .cover + .cover{margin-top:1px}
.prow .qa{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prow .qa .rz{font-size:var(--fs-xs);color:var(--ink-4);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:var(--fs-sm);color:var(--ink-3)}
.pager .pg{display:flex;gap:8px}

.sk{background:linear-gradient(90deg,var(--sunken-2) 25%,var(--sunken) 37%,var(--sunken-2) 63%);background-size:400% 100%;animation:shim 1.3s linear infinite;border-radius:5px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.blank{text-align:center;padding:72px 24px}
.blank .ic{font-size:24px;color:var(--ink-4);font-family:var(--num);margin-bottom:14px}
.blank h3{font-size:var(--fs-lg);font-weight:680;margin-bottom:8px;letter-spacing:-.02em}
.blank p{color:var(--ink-2);font-size:var(--fs-b);max-width:460px;margin:0 auto 18px}

/* ============================================================
   10. P-LS-02 详情
   ============================================================ */
.dhead{margin-bottom:26px}
.dhead .top{display:flex;align-items:flex-start;justify-content:space-between;gap:36px;flex-wrap:wrap}
.dhead .kick{font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:8px}
.dhead .kick .n{color:var(--ink-2)}
.dhead h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.03em;line-height:1.16}
.dhead h1 em{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:12px;font-size:var(--fs-lg)}
.dhead .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.dhead .dm{text-align:right;flex:none}
.dhead .dm .lb{font-size:var(--fs-sm);color:var(--ink-3)}
.dhead .dm .big{
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-hero);
  font-weight:700;letter-spacing:-.04em;line-height:1.06;margin-top:4px;
}
.dhead .dm .ccy{font-size:var(--fs-md);color:var(--ink-3);font-weight:500;margin-left:7px}

.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:24px;align-items:start}
.rail{position:sticky;top:80px;display:flex;flex-direction:column;gap:20px}
.rail .card{margin-top:0}

/* 操作区：主操作唯一且最重，次操作平级并列，减少担保的操作单独降级到底部 */
.acts .lead{margin-bottom:4px}
.acts .second{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.acts .risky{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.acts .risky .rl{font-size:var(--fs-xs);color:var(--ink-4);margin-bottom:9px}

/* 两张图：合并进一张卡片、共用一套标题层级，单图高度下调，权重让位给读数与操作 */
.chart-pair .cbody{padding-bottom:6px}
.chart-pair .cbody + .cbody{border-top:1px solid var(--line)}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:18px 24px 0}
.chart-head h3{font-size:var(--fs-b);font-weight:680}
.chart-head p{font-size:var(--fs-sm);color:var(--ink-3);margin-top:4px;max-width:660px;line-height:1.5}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 20px;padding:0 24px;margin:11px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend i{width:11px;height:11px;border-radius:3px;flex:none;font-style:normal}
.chart-legend i.l{height:3px;border-radius:2px;width:16px}
.chart-legend i.dash{height:0;width:16px;border-radius:0;border-top:2px dashed var(--s-void);background:none}
.chart-legend i.s1{background:var(--s1-fill);box-shadow:inset 0 0 0 1px var(--s1)}
.chart-legend i.s1l{background:var(--s1)}
.chart-legend i.s2{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.chart-legend i.s3{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.chart-legend i.void{background:var(--s-void-fill);box-shadow:inset 0 0 0 1px var(--s-void)}
.chart-legend i.gap{background:var(--st-crit-wash);box-shadow:inset 0 0 0 1px var(--st-crit)}
.chart-svg{display:block;width:100%}
.chart-rd{font-size:var(--fs-sm);color:var(--ink-3);padding:0 24px 4px;line-height:1.55}
.chart-rd b{color:var(--ink-2)}
.chart-wrap{position:relative;padding:0 4px}
.chart-tip{
  position:absolute;pointer-events:none;z-index:30;background:var(--card);border:1px solid var(--line-strong);
  border-radius:var(--r-s);box-shadow:var(--shadow-pop);padding:10px 12px;font-size:var(--fs-sm);min-width:208px;
  opacity:0;transition:opacity .1s var(--ease);
}
.chart-tip.on{opacity:1}
.chart-tip .dt{font-family:var(--num);font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px}
.chart-tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between;line-height:1.75}
.chart-tip .r .lf{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chart-tip .r i{width:9px;height:9px;border-radius:2px;flex:none;font-style:normal}
.chart-tip .r b{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.chart-tip .ev{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);color:var(--ink-2);font-size:var(--fs-xs);line-height:1.55}

/* ============================================================
   11. P-LS-03
   ============================================================ */
.steps{
  display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;
}
.steps .st{
  flex:1;display:flex;align-items:center;gap:13px;padding:17px 22px;background:var(--card);
  border:0;text-align:left;cursor:default;color:var(--ink-3);position:relative;
}
.steps .st.clickable{cursor:pointer}
.steps .st.clickable:hover{background:var(--sunken)}
.steps .st + .st{border-left:1px solid var(--line)}
.steps .st .no{
  width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:var(--fs-sm);font-weight:700;border:1.5px solid var(--line-strong);background:var(--card);
}
.steps .st .tx b{display:block;font-size:var(--fs-b);font-weight:650;color:var(--ink-3)}
.steps .st .tx span{display:block;font-size:var(--fs-sm);margin-top:2px}
.steps .st.done .no{background:var(--st-good);border-color:var(--st-good);color:var(--ink-inv)}
.steps .st.done .tx b{color:var(--ink-2)}
.steps .st.now{background:var(--sunken-2)}
.steps .st.now .no{background:var(--accent);border-color:var(--accent);color:var(--ink-inv)}
.steps .st.now .tx b{color:var(--ink)}
.steps .st .sv{margin-left:auto;flex:none;font-size:var(--fs-sm);text-align:right;line-height:1.45;font-family:var(--num)}

.two{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:24px;align-items:start}
.pick-sum{
  display:flex;align-items:center;gap:20px;padding:13px 16px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r);font-size:var(--fs-b);flex-wrap:wrap;
}
.pick-sum .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:680;font-size:var(--fs-md)}
.pick-sum .sp{width:1px;height:20px;background:var(--line-strong)}
.pick-sum.bad{background:var(--st-crit-wash);border-color:var(--st-crit-line)}

.sub-h{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;
  font-size:var(--fs-b);font-weight:650;flex-wrap:wrap;
}
.sub-h .x{font-weight:400;color:var(--ink-3);font-size:var(--fs-sm)}
.sub-b{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);overflow:hidden}

.cost{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cost .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 15px;font-size:var(--fs-b);border-bottom:1px solid var(--line-soft)}
.cost .row:last-of-type{border-bottom:0}
.cost .row .k{color:var(--ink-2)}
.cost .row .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:650}
.cost .row .v.txt{font-family:var(--sans);font-weight:600}
.cost .foot{padding:12px 15px;background:var(--sunken);border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-2);line-height:1.62}

/* ============================================================
   12. 弹层 · SDK · Toast
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(12,20,32,.46);z-index:60;display:none;align-items:center;justify-content:center;padding:28px}
.scrim.on{display:flex}
.modal{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow-pop);width:100%;max-width:540px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:var(--fs-lg);font-weight:680;letter-spacing:-.02em}
.modal .mh p{font-size:var(--fs-sm);color:var(--ink-3);margin-top:5px}
.modal .mb{padding:20px 24px;overflow-y:auto}
.modal .mf{padding:15px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--sunken);flex-wrap:wrap}

.sdk{background:var(--ink);color:var(--ink-inv);border-radius:var(--r-l);box-shadow:var(--shadow-pop);width:100%;max-width:404px;overflow:hidden}
.sdk .sh{padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px}
.sdk .sh .mk{width:24px;height:24px;border-radius:6px;background:var(--ink-inv);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-xs);flex:none}
.sdk .sh b{font-size:var(--fs-b);font-weight:650}
.sdk .sh span{font-size:var(--fs-xs);color:var(--s-free);margin-left:auto}
.sdk .sb{padding:18px}
.sdk .sb .kk{display:flex;justify-content:space-between;gap:14px;font-size:var(--fs-sm);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.sdk .sb .kk:last-child{border-bottom:0}
.sdk .sb .kk span{color:var(--s-free)}
.sdk .sb .kk b{font-family:var(--num);font-weight:600}
.sdk .sf{padding:15px 18px;border-top:1px solid rgba(255,255,255,.14);display:flex;gap:10px}
.sdk .sf .btn{flex:1;background:transparent;border-color:rgba(255,255,255,.3);color:var(--ink-inv)}
.sdk .sf .btn:hover{background:rgba(255,255,255,.1)}
.sdk .sf .btn.primary{background:var(--ink-inv);color:var(--ink);border-color:var(--ink-inv)}
.sdk .sf .btn.primary:hover{background:var(--s-free)}
.sdk .sim{padding:12px 18px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1);font-size:var(--fs-xs);color:var(--s-free)}
.sdk .sim select{height:30px;font-size:var(--fs-sm);margin-top:8px;background:transparent;color:var(--ink-inv);border-color:rgba(255,255,255,.3)}
.sdk .sim select option{color:var(--ink)}

.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast .t{background:var(--ink);color:var(--ink-inv);padding:11px 17px;border-radius:var(--r-s);font-size:var(--fs-b);box-shadow:var(--shadow-pop);max-width:560px;line-height:1.55}

/* ============================================================
   13. 原型演示条（角色 / 数据状态切换，非产品导航）
   ============================================================ */
.protobar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:44px;
  background:var(--ink);color:var(--ink-inv);display:flex;align-items:center;gap:14px;
  padding:0 20px;font-size:var(--fs-sm);
}
.protobar b.badge{font-family:var(--num);font-size:10px;letter-spacing:.1em;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:2px 7px;flex:none}
.protobar .grp{display:flex;align-items:center;gap:8px}
.protobar .grp > span{color:var(--s-free)}
.protobar .sw{display:flex;background:rgba(255,255,255,.1);border-radius:var(--r-s);padding:2px}
.protobar .sw button{background:none;border:0;color:var(--s-free);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:var(--fs-sm)}
.protobar .sw button:hover{color:var(--ink-inv)}
.protobar .sw button.on{background:var(--ink-inv);color:var(--ink);font-weight:650}
.protobar .sp{width:1px;height:20px;background:rgba(255,255,255,.2)}
.protobar .tail{margin-left:auto;color:var(--s-free);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   14. 宽度：1280 / 1440 / 1920
   ============================================================ */
@media (max-width:1439px){
  .sec-grid{grid-template-columns:minmax(0,1fr) 312px}
  .two{grid-template-columns:minmax(0,1fr) 328px}
}
@media (max-width:1319px){
  .wrap{padding:0 20px}
  :root{--fs-h1:30px;--fs-hero:38px}
  .sec-grid,.two{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .trio{grid-template-columns:auto 28px auto 28px auto}
  .flow{flex-wrap:wrap;gap:14px 0}
  .flow .fs{flex:1 1 160px}
  .flow .fsep{display:none}
}
</style>
