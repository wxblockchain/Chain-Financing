      '<input type="checkbox" ' + (selList.length === WALLET.length ? 'checked' : '') + ' onchange="wizAll(this.checked)">批量勾选全部（把 N 笔合成 1 笔是最有效的降费手段）</label></span>' : '') +
    '</div><div class="sub-b"><div class="tscroll"><table class="dt"><thead><tr>' +
    (editable ? '<th class="sel"></th>' : '') +
    '<th>代币编号</th><th class="n">美元金额</th><th>底层账期</th><th>买方企业名</th><th>合同号 / 发票号</th><th>代币类型</th></tr></thead><tbody>' +
    WALLET.map(function(t){
      return '<tr class="' + (sel[t.id] ? 'picked' : '') + '">' +
        (editable ? '<td class="sel"><input type="checkbox" ' + (sel[t.id] ? 'checked' : '') +
          ' onchange="wizTok(\'' + t.id + '\')" aria-label="勾选 ' + t.id + '"></td>' : '') +
        '<td class="n">' + t.id + '</td><td class="n">' + amt(t.amt) + '</td><td class="n">' + t.due + '</td>' +
        '<td>' + esc(t.buyer) + '</td><td class="n">' + t.contract + ' / ' + t.invoice + '</td><td>' + esc('应收账款类') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';

  var preview = '<div class="pick-sum" style="margin-top:14px">' +
    '<span>已勾选 <span class="n">' + selList.length + '</span> 张</span><span class="sp"></span>' +
    '<span>合计 <span class="n">' + amt(selSum) + '</span> ' + CCY + '</span><span class="sp"></span>' +
    '<span>提交成功后融资上限将增加 <span class="n">' + amt(round2(selSum * PLEDGE_RATE)) + '</span> ' + CCY + '</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--ink-3)">前端即时预览；提交时由服务端权威重算并校验，不一致以服务端为准</span></div>';

  var gas = gasEstimate(Math.max(1, selList.length));
  var rail = '<div class="card"><div class="ch"><h2>费用与签名</h2><p>链上转入质押合约</p></div><div class="cb">' +
    '<div class="cost">' +
      '<div class="row"><span class="k">本次链上操作笔数</span><span class="v">' + Math.max(0, selList.length) + ' 笔（合并为一次提交）</span></div>' +
      '<div class="row"><span class="k">预估 gas</span><span class="v">' + gas + ' ETH</span></div>' +
      '<div class="row"><span class="k">承担方</span><span class="v txt">' + esc(ACTORS.asset.full) + '（本企业）</span></div>' +
      '<div class="foot">gas 由区块链收取，<b>平台不代付、不垫付，也不对质押 / 撤回 / 提取收取任何服务费</b>。' +
      '链上失败也可能已经产生费用。签名与付费由本页<b>唤起外部 SDK 服务</b>完成，平台不自建钱包连接组件。</div>' +
    '</div>' +
    '<button class="btn primary block lg" style="margin-top:14px" ' + (canSubmit ? '' : 'disabled') + ' onclick="submitCreate()">' +
      (state.wiz.busy ? '提交中…' : '创建项目并发起质押') + '</button>' +
    (editable && !canSubmit && !state.wiz.busy
      ? '<div class="hint">' + (!nameOk ? '请先填写项目名称（1～60 字符）。' : '未勾选任何一张代币时不可提交——创建项目时必须至少质押一笔。') + '</div>' : '') +
    '</div></div>' +

      '<p>· 创建校验的对象是<b>质押申请已提交</b>（链上「处理中」或「成功」均算通过），不要求等待链上确认完成。</p>' +
      '<p>· 提交后项目落<b>草稿（已建池 · 未发布）</b>，对外完全不可见：不进广场、不可搜索、他人深链直达返回"内容不存在或无权访问"。</p>' +
      '<p>· 第一段成功后项目即已持久化，可随时离开、随后从"我的融资项目"续做第二段，<b>不会要求重新质押或重新付一次 gas</b>。</p>' +
      '<p>· 发布校验的对象才是链上事实：有效质押价值 &gt; 0 且融资需求金额 ≤ 可融金额。</p>' +
    '</div></div>';

  return '<div class="two"><div>' +
    (state.wiz.result ? resultPanel() : '') +
    '<div class="card"><div class="ch"><h2>基本信息</h2></div><div class="cb">' +
      '<label class="fl" for="pname">项目名称 <b>*</b></label>' +
      '<input id="pname" type="text" maxlength="60" placeholder="例如：华东电子元件应收账款池" ' +
        (editable ? '' : 'disabled ') + 'value="' + esc(p ? p.name : state.wiz.name) + '" oninput="wizName(this.value)" class="' +
        (state.wiz.name && !nameOk ? 'bad' : '') + '">' +
      '<div class="hint">1～60 字符；同一企业内不要求唯一。项目名称在发布后仍可修改。</div>' +
    '</div></div>' +
    '<div class="card"><div class="ch"><h2>代币质押</h2><p>创建项目时必须至少质押一笔代币，"空池草稿"不能由创建动作产生</p></div>' +
      '<div class="cb">' + filterNote + tbl + preview + '</div></div>' +
  '</div><aside class="rail">' + rail + '</aside></div>';
}

/* ---- 链上结果面板：五类失败 / 等待各有独立页面态 ---- */
function resultPanel(){
  var r = state.wiz.result, o = CHAIN_OUTCOMES[r.k];
  if(r.k === 'ok')
    return '<div class="note good" style="margin-bottom:16px"><span class="ic">✓</span><div class="bd">' +
      '<b>链上转入成功</b>（CT-2）：' + r.n + ' 张代币已入池并计入有效质押价值。' +
      '<p>实际 gas ' + r.gas + ' ETH，同一次操作只记一次。可继续第二段：填写融资需求金额并发布。</p></div></div>';
  if(r.k === 'partial')
    return '<div class="note warn" style="margin-bottom:16px"><span class="ic">!</span><div class="bd">' +
      '<b>部分成功 · 按张独立结算</b>：' + r.ok + ' 张入池成功（CT-2），' + r.bad + ' 张链上执行失败（CT-3）已退回可质押。' +
      '<p>失败原因：质押合约执行被回退。失败那 ' + r.bad + ' 张的 gas 已产生、不可退回；重试将发起新交易并再次产生 gas。' +
      '发布校验以实际成功入池后的服务端重算结果为准。</p>' +
      '<p style="margin-top:8px"><button class="btn sm" onclick="go(\'publish\',{id:\'' + state.wiz.pid + '\',step:1})">重新质押失败的 ' + r.bad + ' 张（将产生新的 gas）</button></p></div></div>';
  if(r.k === 'timeout')
    return '<div class="note warn" style="margin-bottom:16px"><span class="ic">⧗</span><div class="bd">' +
      '<b>' + esc(o.head) + '</b><p>' + esc(o.body) + '</p>' +
      '<p>费用：' + esc(o.fee) + ' 该 ' + r.n + ' 张代币保持「处理中」，期间不接受新动作。' +
      '超过阈值后转为失败并生成运营待办。</p>' +
      '<p style="margin-top:8px"><button class="btn sm" onclick="queryChain()">查询链上状态</button>' +
      '<span style="margin-left:10px;font-size:12px;color:var(--ink-3)">本状态下不提供重试按钮——查得未上链后，重试入口才会出现。</span></p></div></div>';
  return '<div class="note ' + (o.tone === 'mute' ? '' : o.tone) + '" style="margin-bottom:16px"><span class="ic">' +
    (o.k === 'cancel' ? '○' : '!') + '</span><div class="bd"><b>' + esc(o.head) + '</b>' +
    '<p>' + esc(o.body) + '</p><p>费用：' + esc(o.fee) + '</p>' +
    '<p style="margin-top:8px"><button class="btn sm" onclick="retryChain()">' + esc(o.retry) + '</button></p></div></div>';
}
function retryChain(){ state.wiz.result = null; render(); }

/* ---- 第二段：填写金额并发布 + 质押管理 ---- */
function stepTwo(p){
  var d = derive(p), published = !p.draft;
  var amtVal = state.wiz.amount, err = state.wiz.amtErr;

  var empty = p.emptyPool
    ? '<div class="note crit" style="margin-bottom:16px"><span class="ic">!</span><div class="bd">' +
      '<b>本项目暂无有效质押，请重新质押后再发布。</b>' +
      '<p>创建时那笔质押最终链上执行失败，项目与项目名称等准备工作已为您保留；空池只能由这条路径产生，不能由用户直接建出。</p>' +
      '<p style="margin-top:8px"><button class="btn sm primary" onclick="openPledge(\'' + p.id + '\')">重新质押</button>' +
      '<button class="btn sm" style="margin-left:8px" onclick="closeProject(\'' + p.id + '\')">关闭项目</button></p></div></div>' : '';

  /* --- 需求金额 --- */
  var pubAct = actionOf(availableActions(p, 'asset'), 'publish') || { enabled:false, reason:'' };
  var amountCard = '<div class="card"><div class="ch"><h2>' + (published ? '融资需求' : '填写融资需求金额') + '</h2>' +
    '<p>' + (published ? '已发布；在「募集中」且该需求尚未被报价时可修改金额或撤下需求' : '发布成功后按需求金额产生在途占用，这是项目在途金额的唯一来源') + '</p></div><div class="cb">' +
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start">' +
      '<div><label class="fl" for="damt">融资需求金额（' + CCY + '） <b>*</b></label>' +
      '<input id="damt" type="text" inputmode="decimal" placeholder="0.00" value="' + esc(amtVal) + '" ' +
        (p.emptyPool ? 'disabled ' : '') + 'oninput="wizAmount(this.value)" class="' + (err ? 'bad' : '') + '">' +
      '<div class="hint">必填，大于 0 且不超过可融金额 ' + usd(d.free) + '。金额精度为 ' + CCY + ' 2 位小数。</div>' +
      (err ? '<div class="err"><span>!</span><div><b>' + esc(err.head) + '</b><br>' + err.body + '</div></div>' : '') +
      '</div>' +
      '<div><label class="fl">有效期至</label>' +
      /* 只读：不提供输入框、日期选择器或"修改有效期"入口（AC-LS-02 / D-FIN-37） */

        'border-radius:var(--r-s);background:var(--sunken);font-family:var(--num);color:var(--ink-2)">' +
        (p.expiresAt || addYears(TODAY, TERM_YEARS)) + '</div>' +
      '<div class="hint">系统按首次发布日 + ' + TERM_YEARS + ' 年生成，只读、不可编辑、不可延期；再次发布不重置。</div></div>' +
    '</div>' +
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">' +
      (pubAct.enabled
        ? '<button class="btn primary lg" onclick="submitPublish(\'' + p.id + '\')">' + (published ? '再次发布剩余额度' : '发布融资需求') + '</button>'
        : '<button class="btn blocked lg" aria-disabled="true" onclick="toast(' + JSON.stringify(pubAct.reason).replace(/"/g,'&quot;') + ')"><span class="sig" aria-hidden="true">⊘</span>发布融资需求</button>') +
      (published && p.demand && p.quotes === 0
        ? '<button class="btn lg" onclick="toast(\'撤下需求将释放对应的在途占用 ' + amt(p.demand) + ' USD，项目回到「已建池未发布」的草稿语义。演示原型不改动演示数据。\')">撤下需求</button>' : '') +
    '</div>' +
    (pubAct.enabled ? '' : '<div class="why"><span class="sig" aria-hidden="true">⊘</span><span>' + esc(pubAct.reason) + '</span></div>') +
  '</div></div>';

  /* --- 已质押清单 + 撤回（分两区） --- */
  var dead = p.tokens.filter(function(t){ return t.dead; });

  var wsel = state.wiz.wsel;
  var wLive = live.filter(function(t){ return wsel[t.id]; }).reduce(function(a,t){ return a + t.amt; }, 0);
  var wDead = dead.filter(function(t){ return wsel[t.id]; }).reduce(function(a,t){ return a + t.amt; }, 0);
  var over = wLive > d.wLimit;

  function wRow(t, limited){

      '<td class="n">' + t.id + '</td><td class="n">' + amt(t.amt) + '</td><td class="n">' + t.due + '</td>' +
      '<td>' + esc(t.buyer) + '</td>' +
      '<td>' + tag(CT_STATUS[t.ct].tone, t.ct + ' ' + CT_STATUS[t.ct].t, true) + '</td>' +
      '<td>' + (limited ? tag('good','计入担保', true) : tag('warn','不计入担保 · ' + (t.deadAt||'') + ' 失效')) + '</td></tr>';

    (dead.length ?

        '<span class="x">这些代币本来就不顶担保，移出它们不会削弱担保，因此不做额度判定、直接放行</span></div>' +
      '<div class="sub-b"><div class="tscroll"><table class="dt">' + head5 + '<tbody>' +
      dead.map(function(t){ return wRow(t, false); }).join('') + '</tbody></table></div></div><div style="height:18px"></div>' : '') +
    '<div class="sub-h"><span>有效抵押物 · 受额度限制 · ' + live.length + ' 张</span>' +
      '<span class="x">当前最多可撤回 <b class="n">' + usd(d.wLimit) + '</b>（＝可融金额 ÷ ' + (PLEDGE_RATE*100) + '%）</span></div>' +
    '<div class="sub-b"><div class="tscroll"><table class="dt">' + head5 + '<tbody>' +
      (live.length ? live.map(function(t){ return wRow(t, true); }).join('')
                   : '<tr><td colspan="7" style="text-align:center;color:var(--ink-3);padding:24px">池内暂无有效抵押物</td></tr>') +
    '</tbody></table></div></div>' +
    '<div class="pick-sum" style="margin-top:14px;' + (over ? 'background:var(--st-crit-wash);border-color:var(--st-crit-line)' : '') + '">' +

      '<span>可撤回上限 <span class="n">' + amt(d.wLimit) + '</span></span><span class="sp"></span>' +
      '<span>差额 <span class="n">' + amt(Math.abs(d.wLimit - wLive)) + '</span>' + (over ? '（超出）' : '（尚余）') + '</span>' +
      (wDead ? '<span class="sp"></span><span>另含失效代币 <span class="n">' + amt(wDead) + '</span>（不受限制）</span>' : '') +

/* ================================================================
   70-actions.js —— 动作层
   链上调用只发生在三个动作上：入池（质押 / 追加）、撤回、提取。
   额度动作（发布需求、撤下、占用与释放、预警触发与解除）一律不触达链上。
   ================================================================ */

function resetWiz(){ state.wiz = { pid:null, name:'', sel:{}, amount:'', amtErr:null, result:null, wsel:{}, busy:false }; }

function wizName(v){ state.wiz.name = v; renderSoft(); }
function wizTok(id){ state.wiz.sel[id] = !state.wiz.sel[id]; render(); }
function wizAll(on){ WALLET.forEach(function(t){ state.wiz.sel[t.id] = on; }); render(); }
function wTok(id){ state.wiz.wsel[id] = !state.wiz.wsel[id]; render(); }
function wizAmount(v){ state.wiz.amount = v; state.wiz.amtErr = null; renderSoft(); }

function removeFromWallet(ids){
  for(var i = WALLET.length - 1; i >= 0; i--){ if(ids.indexOf(WALLET[i].id) >= 0) WALLET.splice(i, 1); }
}
function newProjectId(){
  var n = PROJECTS.length + 55;
  return 'FP-' + TODAY.replace(/-/g,'') + '-' + String(n).padStart(4,'0');
}

/* ---- 建池：一次提交完成"建池 + 首笔质押" ---- */
function submitCreate(){
  var sel = WALLET.filter(function(t){ return state.wiz.sel[t.id]; });
  if(!sel.length || !state.wiz.name.trim()) return;
  confirmChain({
    title:'创建融资项目并发起首笔质押',
    rows:[ ['操作内容', '将 ' + sel.length + ' 张代币转入质押合约', true],
           ['项目名称', state.wiz.name.trim(), true],
           ['质押价值合计', usd(sel.reduce(function(a,t){ return a + t.amt; }, 0))] ],
    n:sel.length, gas:gasEstimate(sel.length),
    extra:'<div class="note" style="margin-top:14px"><span class="ic">i</span><div class="bd">' +
      '创建校验的对象是<b>质押申请已提交</b>：链上「处理中」或「成功」均算通过，不要求等待链上确认完成。' +
      '所以您不需要在页面上干等——提交后随时可以离开，回来继续第二段。</div></div>',
    onDone:function(k){ finishCreate(k, sel); }
  });
}
function finishCreate(k, sel){
  /* 取消签名 / gas 不足：交易未发出，不产生任何记录变更（D-FIN-71 / E-10） */
  if(k === 'cancel' || k === 'nogas'){ state.wiz.result = { k:k }; render(); return; }

  var id = newProjectId(), gas = gasEstimate(sel.length);
  var okTok = [], badN = 0, ct = 'CT-2';
  if(k === 'ok')      { okTok = sel.slice(); }
  else if(k === 'partial'){ var c = Math.max(1, Math.ceil(sel.length/2)); okTok = sel.slice(0, c); badN = sel.length - c; }
  else if(k === 'timeout'){ okTok = sel.slice(); ct = 'CT-1'; }
  else                { okTok = []; badN = sel.length; }   /* offchain / onchain：空池草稿 E-12 */

  okTok.forEach(function(t){ t.ct = ct; t.ps = 'PS-2'; });
  var total = okTok.reduce(function(a,t){ return a + t.amt; }, 0);
  var p = {
    id:id, name:state.wiz.name.trim(), owner:ACTORS.asset.full, entity:ACTORS.asset.entity,
    status:'S-FP-1', expired:false, draft:true, emptyPool:(okTok.length === 0 || ct === 'CT-1' ? okTok.length === 0 : false),
    publishedAt:null, expiresAt:null, demand:null, quotes:0, assetType:'应收账款类',
    tokens:okTok,
    /* 处理中（CT-1）不预先计入质押价值——估值保守原则 */
    events:[{ d:TODAY, k:(okTok.length ? 'pledge' : 'fail'),
              t:'创建资产池 · 质押 ' + sel.length + ' 张' + (badN ? '（' + badN + ' 张链上失败）' : ''),
              dTotal:(ct === 'CT-2' ? total : 0),
              note:(ct === 'CT-1' ? '链上结果未返回，处理中不预先计入有效质押价值（D-FIN-54 ①）'
                                  : okTok.length ? '链上转入成功（CT-2），计入有效质押价值'
                                                 : '首笔质押链上失败，项目保留为空池草稿（E-12 / D-FIN-62）') }]
  };
  if(ct === 'CT-1') p.emptyPool = true;   /* 尚无 CT-2 ⇒ 有效质押价值为 0，发布入口 ⊘ */
  PROJECTS.push(p);
  removeFromWallet(okTok.map(function(t){ return t.id; }));

  state.wiz.result = { k:k, n:okTok.length, ok:okTok.length, bad:badN, gas:gas };
  state.wiz.pid = id; state.wiz.sel = {};
  state.id = id; state.page = 'publish'; state.step = 2;
  syncHash(); render(); window.scrollTo(0, 0);
}

/* ---- 追加质押（D-FIN-48：任何项目状态下都允许，只增不减） ---- */
function openPledge(pid){ go('publish', { id:pid, action:'pledge', step:2 }); }
function submitPledge(pid){
  var p = findProject(pid), sel = WALLET.filter(function(t){ return state.wiz.sel[t.id]; });
  if(!sel.length) return;
  var sum = sel.reduce(function(a,t){ return a + t.amt; }, 0);
  confirmChain({
    title:'追加质押',
    rows:[ ['操作内容', '将 ' + sel.length + ' 张代币转入质押合约', true],
           ['目标资产池', p.name + ' · ' + p.id, true],
           ['追加价值合计', usd(sum)],
           ['融资上限将增加', usd(round2(sum * PLEDGE_RATE))] ],
    n:sel.length, gas:gasEstimate(sel.length),
    onDone:function(k){
      if(k === 'cancel' || k === 'nogas'){ state.wiz.result = { k:k }; render(); return; }
      if(k === 'ok' || k === 'partial'){
        var take = (k === 'ok') ? sel : sel.slice(0, Math.max(1, Math.ceil(sel.length/2)));
        take.forEach(function(t){ t.ct = 'CT-2'; t.ps = 'PS-2'; });
        p.tokens = p.tokens.concat(take);
        p.emptyPool = false;
        var s = take.reduce(function(a,t){ return a + t.amt; }, 0);
        p.events.push({ d:TODAY, k:'topup', t:'追加质押 ' + take.length + ' 张 · ' + usd(s), dTotal:s,
                        note:'池内资产只增不减地增强担保（D-FIN-48）' });
        removeFromWallet(take.map(function(t){ return t.id; }));
        state.wiz.result = { k:k, n:take.length, ok:take.length, bad:sel.length - take.length, gas:gasEstimate(sel.length) };
      } else {
        state.wiz.result = { k:k, n:sel.length, gas:gasEstimate(sel.length) };
      }
      state.wiz.sel = {}; state.panel = null; render(); window.scrollTo(0, 0);
    }
  });
}

/* ---- 发布：额度动作，不触达链上（D-FIN-67） ---- */
function submitPublish(pid){
  var p = findProject(pid), d = derive(p);
  var v = parseFloat(String(state.wiz.amount).replace(/,/g, ''));
  if(!(v > 0)){
    state.wiz.amtErr = { head:'请填写有效的融资需求金额。', body:'金额必须大于 ' + usd(0) + '，精度为 ' + CCY + ' 2 位小数。' };
    render(); return;
  }
  v = round2(v);
  if(v > d.free){
    var diff = round2(v - d.free);
    state.wiz.amtErr = {
      head:'融资需求金额超出可融金额，发布校验不通过。',
      body:'本次填写 <span class="n">' + usd(v) + '</span>；当前可融金额 <span class="n">' + usd(d.free) +
           '</span>；差额 <span class="n">' + usd(diff) + '</span>。<br>' +
           '两条出路：① 把需求金额下调到 ' + usd(d.free) + ' 以内；② 追加质押抬高融资上限——需追加资产价值 <span class="n">' +
           usd(round2(diff / PLEDGE_RATE)) + '</span>（＝差额 ÷ ' + (PLEDGE_RATE*100) + '%）。<br>' +
           '已完成的质押不会因为本次发布校验失败而回滚，代币照常在池、照常计入价值。'
    };
    render(); return;
  }
  var first = !p.publishedAt;
  p.demand = v; p.status = 'S-FP-2'; p.draft = false;
  if(first){ p.publishedAt = TODAY; p.expiresAt = addYears(TODAY, TERM_YEARS); }
  p.events.push({ d:TODAY, k:'publish', t:(first ? '发布' : '再次发布') + '融资需求 ' + usd(v), dFly:v,
                  note:'发布即产生在途占用，这是项目在途金额的唯一来源；报价环节不再新增占用（AC-FIN-23）' });
  state.wiz.amount = ''; state.wiz.amtErr = null;
  toast('发布成功：项目转「募集中」，需求金额 ' + usd(v) + ' 已计入项目在途金额' +
        (first ? '，有效期至 ' + p.expiresAt + '（首次发布日 + 1 年，只读）' : '（有效期不重置）') + '。');
  go('project', { id:pid });
}

/* ---- 撤回：按额度判定；失效代币无限制（AC-FIN-13 / D-FIN-59） ---- */
function submitWithdraw(pid){
  var p = findProject(pid), d = derive(p);
  var sel = p.tokens.filter(function(t){ return state.wiz.wsel[t.id]; });
  if(!sel.length) return;
  var live = sel.filter(function(t){ return !t.dead; }), liveSum = live.reduce(function(a,t){ return a + t.amt; }, 0);
  if(liveSum > d.wLimit){ render(); return; }   /* 页面上已给出三个数与两条出路 */
  var deadSel = sel.filter(function(t){ return t.dead; });
  confirmChain({
    title:'撤回质押',
    rows:[ ['操作内容', '将 ' + sel.length + ' 张代币从质押合约转回原持有地址', true],
           ['其中有效抵押物', live.length + ' 张 · ' + usd(liveSum), true],
           ['其中已失效代币', deadSel.length + ' 张 · ' + usd(deadSel.reduce(function(a,t){ return a + t.amt; }, 0)) + '（不做额度判定）', true],
           ['目的地址', '质押前的原持有地址（不接受人工指定）', true] ],
    n:sel.length, gas:gasEstimate(sel.length),
    onDone:function(k){
      if(k === 'cancel' || k === 'nogas'){ state.wiz.result = { k:k }; render(); return; }
      if(k === 'ok'){
        var ids = sel.map(function(t){ return t.id; });
        p.tokens = p.tokens.filter(function(t){ return ids.indexOf(t.id) < 0; });
        var dTot = sel.reduce(function(a,t){ return a + t.amt; }, 0);
        var dVoid = deadSel.reduce(function(a,t){ return a + t.amt; }, 0);
        p.events.push({ d:TODAY, k:'withdraw',
          t:'撤回质押 ' + sel.length + ' 张 · ' + usd(dTot), dTotal:-dTot, dVoid:-dVoid,
          note:(deadSel.length ? '其中 ' + deadSel.length + ' 张为已失效代币，不做额度判定直接放行（D-FIN-59）；' : '') +
               '链上转出成功后代币移出池、派生量重算、回到可质押' });
        /* 失效代币不再满足可质押条件，不回到钱包 */
        live.forEach(function(t){ t.ct = 'CT-0'; t.ps = 'PS-1'; WALLET.push(t); });
        state.wiz.result = { k:'ok', n:sel.length, gas:gasEstimate(sel.length) };
      } else {
        /* E-3：代币保持在池，预扣撤销，禁止先置已释放再回滚 */
        state.wiz.result = { k:k, n:sel.length, gas:gasEstimate(sel.length) };
      }
      state.wiz.wsel = {}; render(); window.scrollTo(0, 0);
    }
  });
}

/* ---- 自助提取（D-FIN-57 第二段） ---- */
function openRedeem(){
  if(!REDEEMABLE.length){ toast('当前没有可提取的代币。'); return; }
  var sum = REDEEMABLE.reduce(function(a,t){ return a + t.amt; }, 0);
  confirmChain({
    title:'批量提取已释放代币',
    rows:[ ['操作内容', '将 ' + REDEEMABLE.length + ' 张代币从质押合约转回原持有地址', true],
           ['合计价值', usd(sum)],
           ['来源', '项目结清释放（业务释放已于结清同刻完成，无费用）', true] ],
    n:REDEEMABLE.length, gas:gasEstimate(REDEEMABLE.length),
    onDone:function(k){
      if(k === 'ok'){
        REDEEMABLE.forEach(function(t){ t.ct = 'CT-0'; t.ps = 'PS-1'; t.pending = false; WALLET.push(t); });
        REDEEMABLE.length = 0;
        toast('提取成功：代币已转回原持有地址，重新成为可质押代币。');
      } else if(k === 'cancel' || k === 'nogas'){
        state.wiz.result = { k:k };
      } else {
        /* E-4：提取失败不影响任何项目的额度与状态，业务已在第一段释放完毕，可随时重试 */
        state.wiz.result = { k:k, n:REDEEMABLE.length };
      }
      render(); window.scrollTo(0, 0);
    }
  });
}
/* ================================================================
   80-router.js —— 壳层与路由
   路由即深链锚点（H-02）：project/new · project/{id} · project/{id}?action=…
   新增模块（WS-325～WS-329）只需在 ROUTES 里补一条，并在 PAGES 里注册渲染函数，
   壳层、导航、角色切换、状态切换都不用动。
   ================================================================ */

var state = {
  role:'guest', page:'plaza', id:null, action:null, step:null, from:null, panel:null,
  feed:'ok', sort:'pub', pageNo:1, tab:'collateral',
  filters:JSON.parse(JSON.stringify(F_DEFAULT)),
  wiz:{ pid:null, name:'', sel:{}, amount:'', amtErr:null, result:null, wsel:{}, busy:false }
};

/* ---- 路由表：模块 · 页面编号 · 深链锚点 · 可见角色 ---- */
var ROUTES = [
  { key:'plaza',   mod:'M-1', page:'P-LS-01', nav:'融资需求广场', hash:'plaza',       roles:['guest','asset','fund'], render:pagePlaza },
  { key:'mine',    mod:'M-1', page:'—',       nav:'我的融资项目', hash:'mine',        roles:['asset'],                render:pageMine },
  { key:'project', mod:'M-1', page:'P-LS-02', nav:null,           hash:'project/:id', roles:['guest','asset','fund'], render:pageProject },
  { key:'publish', mod:'M-1', page:'P-LS-03', nav:'创建融资项目', hash:'project/new', roles:['asset'],                render:pagePublish }
  /* ---- 模块注册区：WS-325～WS-329 在此追加，例如
  { key:'quote',  mod:'M-2', page:'P-QT-01', nav:'我的报价', hash:'quote', roles:['fund'], render:pageQuote }
  ---- */
];
function routeOf(k){ for(var i=0;i<ROUTES.length;i++){ if(ROUTES[i].key===k) return ROUTES[i]; } return ROUTES[0]; }

function go(page, params){
  params = params || {};
  state.page  = page;
  state.id    = ('id' in params) ? params.id : null;
  state.action= params.action || null;
  state.step  = params.step || null;
  state.from  = params.from || null;
  state.panel = (params.action === 'pledge') ? 'pledge' : null;
  if(!('tab' in params)) state.tab = 'collateral';
  if(page === 'publish' && !state.id) resetWiz();
  if(page !== 'publish'){ state.wiz.result = null; state.wiz.amtErr = null; }
  syncHash(); render(); window.scrollTo(0, 0);
  if(state.action){
    setTimeout(function(){
      var el = document.getElementById('panel-' + state.action);
      if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 40);
  }
}

/* ---- 深链（H-02）：服务端重新判权；状态已变时落详情页 + Toast，不报 404、不白屏、不静默跳首页 ---- */
function syncHash(){
  var h = '#/';
  if(state.page === 'project') h += 'project/' + state.id;
  else if(state.page === 'publish') h += state.id ? ('project/' + state.id + '?action=publish') : 'project/new';
  else h += routeOf(state.page).hash;
  if(state.action && state.page === 'publish' && state.id) h = '#/project/' + state.id + '?action=' + state.action;
  if(state.from) h += (h.indexOf('?') >= 0 ? '&' : '?') + 'from=' + state.from;
  if(location.hash !== h){ suppressHash = true; location.hash = h; }
}
var suppressHash = false;
function readHash(){
  var h = location.hash.replace(/^#\/?/, ''); if(!h) return false;
  var qi = h.indexOf('?'), path = qi >= 0 ? h.slice(0, qi) : h, qs = qi >= 0 ? h.slice(qi+1) : '';
  var q = {}; qs.split('&').forEach(function(kv){ var p = kv.split('='); if(p[0]) q[p[0]] = p[1]; });
  var seg = path.split('/');
  state.step = null; state.panel = null; state.tab = 'collateral'; state.wiz.result = null; state.wiz.amtErr = null;
  if(seg[0] === 'project'){
    if(seg[1] === 'new'){ state.page = 'publish'; state.id = null; resetWiz(); }
    else {
      var p = findProject(seg[1]);
      if(!p){ state.page = 'project'; state.id = seg[1]; }
      else if(q.action && q.action !== 'quote'){ state.page = 'publish'; state.id = seg[1]; state.step = 2; state.panel = (q.action === 'pledge') ? 'pledge' : null; }
      else { state.page = 'project'; state.id = seg[1]; }
    }
    state.action = q.action || null; state.from = q.from || null;
    return true;
  }
  if(seg[0] === 'mine'){ state.page = 'mine'; return true; }
  if(seg[0] === 'plaza'){ state.page = 'plaza'; return true; }
  return false;
}
window.addEventListener('hashchange', function(){
  if(suppressHash){ suppressHash = false; return; }
  if(readHash()) render();
});

/* ---- 壳层渲染 ---- */
function renderNav(){
  var items = ROUTES.filter(function(r){ return r.nav && r.roles.indexOf(state.role) >= 0; });
  document.getElementById('mainnav').innerHTML = items.map(function(r){
    var on = (r.key === state.page) || (r.key === 'publish' && state.page === 'publish');
    return '<button ' + (on ? 'aria-current="page"' : '') + ' onclick="go(\'' + r.key + '\',{id:null})">' + r.nav + '</button>';
  }).join('');

  var a = ACTORS[state.role];
  document.getElementById('who').innerHTML = state.role === 'guest'
    ? '<div class="id"><b>未登录</b><span>L1～L5 全量可见 · 操作入口 ⊘</span></div>' +
      '<button class="btn sm primary" onclick="signIn()">登录 / 注册</button>'
    : '<div class="id"><b>' + esc(a.full) + '</b><span>' + a.t + ' · 企业主体 ' + a.entity + '</span></div>' +
      '<div class="av">' + a.short + '</div>';
}
function renderSwitches(){
  document.getElementById('swRole').innerHTML = ['guest','asset','fund'].map(function(k){
    return '<button class="' + (state.role === k ? 'on' : '') + '" onclick="setRole(\'' + k + '\')">' + ACTORS[k].t + '</button>';
  }).join('');
  document.getElementById('swFeed').innerHTML = [['ok','默认'],['loading','加载中'],['empty','空数据'],
    ['noresult','筛选无结果'],['fail','加载失败']].map(function(o){
    return '<button class="' + (state.feed === o[0] ? 'on' : '') + '" onclick="setFeed(\'' + o[0] + '\')">' + o[1] + '</button>';
  }).join('');
}
function setRole(k){
  state.role = k;
  var r = routeOf(state.page);
  if(r.roles.indexOf(k) < 0) { go('plaza'); return; }
  render();
}
function setFeed(k){ state.feed = k; render(); }

/* renderSoft：只重算依赖输入的按钮态，不重建 DOM，避免输入框失焦 */
function renderSoft(){
  var el = document.getElementById('pname'), el2 = document.getElementById('damt');
  var focus = document.activeElement ? document.activeElement.id : null;
  render();
  if(focus){
    var back = document.getElementById(focus);
    if(back){ back.focus(); if(back.setSelectionRange){ var v = back.value.length; back.setSelectionRange(v, v); } }
  }
}

function render(){
  renderNav(); renderSwitches();
  mountedCharts = [];
  var r = routeOf(state.page);
  document.getElementById('view').innerHTML = r.render();
  drawCharts();
  document.title = (r.nav || (state.page === 'project' ? '融资需求详情' : '借贷广场')) + ' · 借贷广场 · 金融服务端';
}

/* ---- 启动：直接落在模块第一个功能页，不做登录页 / 端选择页 ---- */
if(!readHash()) { state.page = 'plaza'; }
render();
if(!location.hash) syncHash();
</script>
