<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融服务端 · 借贷广场 — 融资需求与代币质押（原型）</title>
<!--
  WS-324 借贷广场 · 融资需求与代币质押 — 一体化原型 v1.1
  PRD 基线：v1.0-借贷广场-融资需求与代币质押-PRD.md V5.0 + 01-对外契约与数据字典.md V5.0
  形态：console（金融服务端 · 面客）。单文件，双击即开，无网络依赖。
  本文件由 src/ 下的分层源码内联生成（见 build.sh），不要直接手改本文件。
  后续模块 WS-325～WS-329 在 80-router.js 的 ROUTES「模块注册区」追加页面即可。
-->
<style>
/* ============================================================
   1. tokens —— 所有颜色与字体只走命名 token，页面内不写裸色值
   字阶是本版的主要修订点：把跨度从 2.4× 拉到 4.0×，
   让"该突出的"靠尺寸而不是靠颜色去突出。
   ============================================================ */
:root{
  /* 纸面与墨色 */
  --paper:#F4F6FA;
  --card:#FFFFFF;
  --sunken:#F8FAFC;
  --sunken-2:#EFF3F9;
  --line:#E5E9F0;
  --line-soft:#EEF1F6;
  --line-strong:#CBD5E3;
  --ink:#0C1420;
  --ink-2:#4A5567;
  --ink-3:#7A8698;
  --ink-4:#9BA5B4;
  --ink-inv:#FFFFFF;

  /* 主色：整页只用在一处主操作与一个关键读数上 */
  --accent:#1F53C4;
  --accent-hover:#1A46A8;
  --accent-wash:#EEF3FD;
  --accent-line:#C2D4F5;

  /* 状态色：保留色，永不充当数据系列 */
  --st-good:#0C7A43;    --st-good-wash:#EDF7F1;   --st-good-line:#C6E4D4;
  --st-warn:#8A5200;    --st-warn-wash:#FDF5E8;   --st-warn-line:#EBD9B2;
  --st-crit:#AC2E29;    --st-crit-wash:#FCEFEE;   --st-crit-line:#EFCAC7;
  --st-mute:#5A6578;    --st-mute-wash:#EFF2F6;   --st-mute-line:#DBE1EA;

  /* 数据系列色：经 dataviz validator 校验（light / surface #FFFFFF / --pairs all 全通过） */
  --s1:#2a78d6;  --s1-fill:rgba(42,120,214,.15);   /* 有效质押价值 · 融资上限 */
  --s2:#eb6834;  --s2-fill:rgba(235,104,52,.18);   /* 项目融资余额 */
  --s3:#1baf7a;  --s3-fill:rgba(27,175,122,.18);   /* 项目在途金额 */
  --s-void:#8D99A9; --s-void-fill:rgba(141,153,169,.16); /* 失效代币：中性灰＋斜纹，非系列色 */
  --s-free:#A9C2E8;

  /* 图表底盘 */
  --grid:#EDF0F5;
  --axis:#CBD5E3;
  --axis-ink:#8A94A5;

  /* 字体 */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* 字阶：8 级，11 → 44，跨度 4.0× */
  --fs-xs:11px; --fs-sm:12px; --fs-b:13.5px; --fs-md:15px;
  --fs-lg:20px; --fs-stat:26px; --fs-h1:34px; --fs-hero:44px;

  /* 形制 */
  --r-s:6px; --r:10px; --r-l:12px;
  --shadow:0 1px 2px rgba(12,20,32,.04);
  --shadow-pop:0 18px 44px rgba(12,20,32,.18),0 2px 8px rgba(12,20,32,.08);
  --maxw:1440px;
  --ease:cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:var(--fs-b);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:52px;
}
.num,.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.012em}
button,input,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }

/* ============================================================
   2. 壳层
   ============================================================ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

.appbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:30px;height:62px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand .mk{
  width:29px;height:29px;border-radius:8px;background:var(--accent);color:var(--ink-inv);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;
}
.brand .nm{font-weight:680;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand .nm i{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:8px;font-size:var(--fs-sm)}

.mainnav{display:flex;gap:3px;flex:1;min-width:0}
.mainnav button{
  background:none;border:0;padding:7px 14px;border-radius:var(--r-s);cursor:pointer;
  color:var(--ink-2);font-size:var(--fs-b);white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease);
}
.mainnav button:hover{background:var(--sunken-2);color:var(--ink)}
.mainnav button[aria-current="page"]{background:var(--sunken-2);color:var(--ink);font-weight:650}

.who{display:flex;align-items:center;gap:10px;flex:none}
.who .id{text-align:right;line-height:1.25}
.who .id b{display:block;font-size:var(--fs-sm);font-weight:650}
.who .id span{display:block;font-size:var(--fs-xs);color:var(--ink-3)}
.who .av{
  width:31px;height:31px;border-radius:50%;background:var(--sunken-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--ink-2);font-weight:650;flex:none;
}

main{padding:30px 0 56px}

/* 页头：字阶的顶点之一。标题 34px，副题 13.5px —— 跨度靠这里建立 */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:22px}
.page-head h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.028em;line-height:1.18}
.page-head .sub{color:var(--ink-2);font-size:var(--fs-b);margin-top:8px;max-width:820px}
.page-head .sum{color:var(--ink-3);font-size:var(--fs-sm);margin-top:9px}
.page-head .sum b{color:var(--ink-2);font-weight:600;font-family:var(--num)}
.page-head .sum .demo{
  display:inline-flex;align-items:center;font-size:10px;color:var(--st-warn);background:var(--st-warn-wash);
  border:1px solid var(--st-warn-line);border-radius:4px;padding:1px 6px;font-weight:600;vertical-align:1px;
}

.crumb{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:14px}
.crumb button{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:var(--fs-sm)}
.crumb button:hover{color:var(--accent);text-decoration:underline}
.crumb i{font-style:normal;color:var(--line-strong)}

/* ============================================================
   3. 基础件
   卡片外壳变轻：标题行不再是填色条 + 分隔线，只是一行标签。
   分区靠留白和白底本身，不靠额外的框线。
   ============================================================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.card + .card{margin-top:20px}
.card > .ch{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:20px 24px 2px}
.card > .ch h2{font-size:var(--fs-md);font-weight:680;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.card > .ch .note-r,.card > .ch p{font-size:var(--fs-sm);color:var(--ink-3);font-weight:400}
.card > .ch .lvl{
  font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;letter-spacing:.04em;
}
.card.tbl > .ch{padding-bottom:16px;border-bottom:1px solid var(--line)}
.cb{padding:18px 24px 24px}
.cb.tight{padding:0}
.cb.t0{padding-top:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);cursor:pointer;font-size:var(--fs-b);font-weight:500;
  transition:background .15s var(--ease),border-color .15s var(--ease);white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--sunken-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink-inv);font-weight:650}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:29px;padding:0 11px;font-size:var(--fs-sm)}
.btn.lg{height:44px;padding:0 24px;font-size:var(--fs-md);font-weight:650}
.btn.ghost{border-color:transparent;background:var(--sunken)}
.btn.ghost:hover:not(:disabled){background:var(--sunken-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.danger{color:var(--st-crit);border-color:var(--line-strong);background:var(--card)}
.btn.danger:hover:not(:disabled){background:var(--st-crit-wash);border-color:var(--st-crit-line)}
.btn.link{border:0;background:none;height:auto;padding:0;color:var(--accent);font-size:inherit;font-weight:inherit}
.btn.link:hover{text-decoration:underline;background:none}

.btn.blocked{
  color:var(--ink-3);background:var(--sunken);border-color:var(--line);
  border-style:dashed;cursor:not-allowed;font-weight:500;
}
.btn.blocked:hover{background:var(--sunken)}
.btn.blocked .sig{color:var(--ink-4);font-size:13px;line-height:1}
.why{display:flex;gap:7px;margin-top:7px;font-size:var(--fs-sm);color:var(--ink-3);line-height:1.5}
.why .sig{color:var(--ink-4);flex:none;line-height:1.45}

.tag{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:5px;
  font-size:var(--fs-sm);font-weight:600;border:1px solid transparent;white-space:nowrap;
}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.tag.good{color:var(--st-good);background:var(--st-good-wash);border-color:var(--st-good-line)}
.tag.warn{color:var(--st-warn);background:var(--st-warn-wash);border-color:var(--st-warn-line)}
.tag.crit{color:var(--st-crit);background:var(--st-crit-wash);border-color:var(--st-crit-line)}
.tag.mute{color:var(--st-mute);background:var(--st-mute-wash);border-color:var(--st-mute-line)}
.tag.info{color:var(--accent);background:var(--accent-wash);border-color:var(--accent-line)}
.tag.plain{color:var(--ink-3);background:var(--card);border-color:var(--line)}

/* 键值：去掉网格线，改为留白分栏——同样的信息，少一层框 */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 28px}
.kv.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv .k{font-size:var(--fs-sm);color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv .v{font-size:var(--fs-md);font-weight:650;margin-top:5px;font-family:var(--num);font-variant-numeric:tabular-nums}
.kv .v.txt{font-family:var(--sans);font-weight:600}
.kv .x{font-size:var(--fs-xs);color:var(--ink-4);margin-top:4px;font-family:var(--sans);line-height:1.5}

table.dt{font-size:var(--fs-b)}
table.dt th{
  text-align:left;font-weight:500;color:var(--ink-3);font-size:var(--fs-sm);
  padding:0 14px;height:38px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.dt td{padding:0 14px;height:48px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--sunken)}
table.dt td.n,table.dt th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt th.n{font-family:var(--sans)}
table.dt .sel{width:40px}
table.dt tr.picked td{background:var(--accent-wash)}
table.dt tr.picked:hover td{background:var(--accent-wash)}
table.dt td.wrap2{white-space:normal;line-height:1.45}
.tscroll{overflow-x:auto}

input[type=text],input[type=number],select{
  height:38px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);
  background:var(--card);width:100%;transition:border-color .15s var(--ease);
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input.bad{border-color:var(--st-crit)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
label.fl{display:block;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:7px}
label.fl b{color:var(--st-crit);font-weight:400}
.hint{font-size:var(--fs-sm);color:var(--ink-3);margin-top:7px}
.err{font-size:var(--fs-sm);color:var(--st-crit);margin-top:8px;display:flex;gap:7px;align-items:flex-start;line-height:1.6}

/* 提示条：只有担保不足用填色，其余降为左侧色规 + 白底，整页的色块数量因此减少 */
.note{
  display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card);font-size:var(--fs-b);line-height:1.62;
}
.note .ic{flex:none;font-family:var(--num);font-size:var(--fs-sm);font-weight:700;margin-top:2px;color:var(--ink-4)}
.note b{font-weight:680}
.note .bd{min-width:0}
.note .bd p{margin-top:5px;color:var(--ink-2)}
.note .act{margin-left:auto;flex:none;align-self:center}
.note.good{border-left:3px solid var(--st-good)} .note.good .ic{color:var(--st-good)}
.note.warn{border-left:3px solid var(--st-warn)} .note.warn .ic{color:var(--st-warn)}
.note.info{border-left:3px solid var(--accent)}  .note.info .ic{color:var(--accent)}
.note.crit{background:var(--st-crit-wash);border-color:var(--st-crit-line);border-left:3px solid var(--st-crit)}
.note.crit .ic{color:var(--st-crit)} .note.crit .bd p{color:var(--st-crit);opacity:.92}
.note.quiet{background:var(--sunken);border-color:var(--line)}
.note.quiet,.note.quiet .bd p{color:var(--ink-2);font-size:var(--fs-sm)}

/* ============================================================
   4. 招牌件 A：三数等式（AC-LS-53）
   本版改为裸露在页面底色上的读数带，不再包一层卡片——
   它是详情页的视觉顶点，靠 44px 字号和留白拿权重，不靠填色。
   ============================================================ */
.strip{padding:4px 2px 0}
.strip + .strip{margin-top:26px}
.trio{display:grid;grid-template-columns:auto 34px auto 34px auto;align-items:end;gap:0;margin-bottom:18px}
.trio .cell{min-width:0;padding-right:26px}
.trio .op{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:var(--fs-lg);color:var(--ink-4);font-weight:400;padding-bottom:14px;
}
.trio .idx{font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.08em}
.trio .lb{font-size:var(--fs-sm);color:var(--ink-2);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trio .amt{
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-stat);
  font-weight:650;letter-spacing:-.035em;margin-top:7px;line-height:1.1;
}
.trio .cell.out .amt{font-size:var(--fs-hero);color:var(--accent);font-weight:700}
/* 质押率：纯文本，无控件、无焦点态（AC-LS-56 / D-MC-110 / D-MC-111） */
.trio .rate{
  font-family:var(--num);font-size:var(--fs-stat);font-weight:650;margin-top:7px;
  letter-spacing:-.035em;line-height:1.1;color:var(--ink-2);
}
.trio .fixed{font-size:var(--fs-xs);color:var(--ink-4);margin-top:6px;font-family:var(--sans)}
.trio-sub{font-size:var(--fs-sm);color:var(--ink-3);margin-top:-6px;margin-bottom:20px}
.trio-sub .n{color:var(--ink-2);font-weight:600}

/* ============================================================
   5. 招牌件 B：额度尺
   ============================================================ */
.meter .mwrap{position:relative;padding-top:18px}
.meter .track{
  position:relative;height:22px;border-radius:5px;background:var(--sunken-2);
  border:1px solid var(--line);display:flex;overflow:hidden;
}
.meter .seg{height:100%;position:relative}
.meter .seg + .seg{border-left:2px solid var(--card)}
.meter .seg.bal{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.meter .seg.fly{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.meter .seg.free{background:rgba(42,120,214,.08);box-shadow:inset 0 0 0 1px var(--s-free)}
.meter .seg.gap{background:var(--st-crit-wash);background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--st-crit-line) 5px 7px);box-shadow:inset 0 0 0 1px var(--st-crit)}
.meter .mwrap > .capline{position:absolute;top:13px;bottom:-5px;width:2px;background:var(--s1);border-radius:2px;z-index:2}
.meter .mwrap > .caplb{position:absolute;top:0;white-space:nowrap;font-size:var(--fs-xs);color:var(--s1);font-weight:650;line-height:1.3}
.meter .legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:var(--fs-sm);color:var(--ink-3)}
.meter .legend span{display:inline-flex;align-items:center;gap:7px}
.meter .legend i{width:10px;height:10px;border-radius:3px;flex:none;font-style:normal}
.meter .legend i.bal{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.meter .legend i.fly{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.meter .legend i.free{background:rgba(42,120,214,.08);box-shadow:inset 0 0 0 1px var(--s-free)}
.meter .legend i.gap{background:var(--st-crit-wash);box-shadow:inset 0 0 0 1px var(--st-crit)}
.meter .legend i.cap{width:2px;height:12px;border-radius:1px;background:var(--s1)}
.meter .legend b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
/* 列表行内的迷你尺：只保留"已占用 vs 可融"与上限刻度，两色以内 */
.meter.mini .mwrap{padding-top:0}
.meter.mini .mwrap > .capline{top:-3px;bottom:-3px}
.meter.mini .track{height:8px;border-radius:4px}
.meter.mini .legend{display:none}

/* ============================================================
   6. 融资进度（环节名取自 PRD 状态机 S-FP-*；后段标注为后续环节）
   ============================================================ */
.flow{display:flex;align-items:stretch;gap:0;margin:0}
.flow .fs{flex:1;min-width:0;padding:0 0 0 15px;position:relative}
.flow .fs::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--line);
}
.flow .fs.done::before{background:var(--st-good)}
.flow .fs.now::before{background:var(--accent)}
.flow .fs.next::before{background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px)}
.flow .fs.later::before{background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px)}
.flow .fs.now.later::before{background:repeating-linear-gradient(180deg,var(--accent) 0 4px,transparent 4px 8px)}
.flow .fs.later .st{color:var(--ink-3)}
.flow .fs.now.later .st{color:var(--accent)}
.flow .fs .sid{font-family:var(--num);font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.04em}
.flow .fs .st{font-size:var(--fs-b);font-weight:650;color:var(--ink-3);margin-top:3px}
.flow .fs.done .st{color:var(--ink-2)}
.flow .fs.now .st{color:var(--accent)}
.flow .fs .sx{font-size:var(--fs-xs);color:var(--ink-4);margin-top:3px;line-height:1.5}
.flow .fsep{
  flex:none;width:1px;background:var(--line-strong);margin:0 18px;position:relative;
}
.flow .fsep span{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;color:var(--ink-4);background:var(--card);padding:0 6px;letter-spacing:.04em;
}
.flow-foot{font-size:var(--fs-sm);color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}

/* ============================================================
   7. 折叠层（第二层：验算与核对用，默认收起）
   ============================================================ */
.fold{border-top:1px solid var(--line-soft)}
.fold > summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:13px 0 13px;font-size:var(--fs-b);color:var(--ink-2);font-weight:600;
}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary:hover{color:var(--accent)}
.fold > summary .caret{
  font-family:var(--num);font-size:10px;color:var(--ink-4);transition:transform .15s var(--ease);display:inline-block;
}
.fold[open] > summary .caret{transform:rotate(90deg)}
.fold > summary .cnt{margin-left:auto;font-size:var(--fs-sm);color:var(--ink-4);font-weight:400}
.fold .fb{padding:2px 0 20px}

/* ============================================================
   8. 次级视图 tab（第三层：项目档案，不是本次决策的输入）
   ============================================================ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 24px}
.tabs button{
  background:none;border:0;padding:14px 14px 12px;cursor:pointer;font-size:var(--fs-b);
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--num);font-size:var(--fs-xs);color:var(--ink-4);margin-left:6px}

/* ============================================================
   9. P-LS-01 列表：表格形态，行高 56px
   ============================================================ */
.filters{
  display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;
  padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow);margin-bottom:16px;
}
.filters .f{min-width:124px}
.filters .f > span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:5px}
.filters .f select{height:33px;font-size:var(--fs-sm)}
.filters .spacer{flex:1}
.filters .rs{display:flex;align-items:center;gap:10px;padding-bottom:6px}

table.list{font-size:var(--fs-b)}
table.list th{
  text-align:left;font-weight:500;color:var(--ink-3);font-size:var(--fs-sm);
  padding:0 16px;height:42px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.list th.n{text-align:right}
table.list td{padding:0 16px;height:56px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.list tbody tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer;transition:background .12s var(--ease)}
table.list tbody tr:hover{background:var(--sunken)}
table.list td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .nm{font-size:var(--fs-b);font-weight:650;letter-spacing:-.01em;line-height:1.3}
.prow .sub{font-size:var(--fs-xs);color:var(--ink-3);margin-top:3px;display:flex;gap:8px;align-items:center}
.prow .sub .id{font-family:var(--num)}
.prow .dm{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-md);font-weight:680;letter-spacing:-.02em}
.prow .dm.none{color:var(--ink-4);font-weight:500;font-size:var(--fs-b)}
.prow .mt{width:136px}
.prow .mt .cover{font-size:var(--fs-xs);color:var(--ink-3);margin-top:5px;font-family:var(--num);white-space:nowrap}
.prow .mt .cover + .cover{margin-top:1px}
.prow .qa{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prow .qa .rz{font-size:var(--fs-xs);color:var(--ink-4);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:var(--fs-sm);color:var(--ink-3)}
.pager .pg{display:flex;gap:8px}

.sk{background:linear-gradient(90deg,var(--sunken-2) 25%,var(--sunken) 37%,var(--sunken-2) 63%);background-size:400% 100%;animation:shim 1.3s linear infinite;border-radius:5px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.blank{text-align:center;padding:72px 24px}
.blank .ic{font-size:24px;color:var(--ink-4);font-family:var(--num);margin-bottom:14px}
.blank h3{font-size:var(--fs-lg);font-weight:680;margin-bottom:8px;letter-spacing:-.02em}
.blank p{color:var(--ink-2);font-size:var(--fs-b);max-width:460px;margin:0 auto 18px}

/* ============================================================
   10. P-LS-02 详情
   ============================================================ */
.dhead{margin-bottom:26px}
.dhead .top{display:flex;align-items:flex-start;justify-content:space-between;gap:36px;flex-wrap:wrap}
.dhead .kick{font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:8px}
.dhead .kick .n{color:var(--ink-2)}
.dhead h1{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.03em;line-height:1.16}
.dhead h1 em{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:12px;font-size:var(--fs-lg)}
.dhead .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.dhead .dm{text-align:right;flex:none}
.dhead .dm .lb{font-size:var(--fs-sm);color:var(--ink-3)}
.dhead .dm .big{
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs-hero);
  font-weight:700;letter-spacing:-.04em;line-height:1.06;margin-top:4px;
}
.dhead .dm .ccy{font-size:var(--fs-md);color:var(--ink-3);font-weight:500;margin-left:7px}

.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:24px;align-items:start}
.rail{position:sticky;top:80px;display:flex;flex-direction:column;gap:20px}
.rail .card{margin-top:0}

/* 操作区：主操作唯一且最重，次操作平级并列，减少担保的操作单独降级到底部 */
.acts .lead{margin-bottom:4px}
.acts .second{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.acts .risky{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.acts .risky .rl{font-size:var(--fs-xs);color:var(--ink-4);margin-bottom:9px}

/* 两张图：合并进一张卡片、共用一套标题层级，单图高度下调，权重让位给读数与操作 */
.chart-pair .cbody{padding-bottom:6px}
.chart-pair .cbody + .cbody{border-top:1px solid var(--line)}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:18px 24px 0}
.chart-head h3{font-size:var(--fs-b);font-weight:680}
.chart-head p{font-size:var(--fs-sm);color:var(--ink-3);margin-top:4px;max-width:660px;line-height:1.5}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 20px;padding:0 24px;margin:11px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend i{width:11px;height:11px;border-radius:3px;flex:none;font-style:normal}
.chart-legend i.l{height:3px;border-radius:2px;width:16px}
.chart-legend i.dash{height:0;width:16px;border-radius:0;border-top:2px dashed var(--s-void);background:none}
.chart-legend i.s1{background:var(--s1-fill);box-shadow:inset 0 0 0 1px var(--s1)}
.chart-legend i.s1l{background:var(--s1)}
.chart-legend i.s2{background:var(--s2-fill);box-shadow:inset 0 0 0 1px var(--s2)}
.chart-legend i.s3{background:var(--s3-fill);box-shadow:inset 0 0 0 1px var(--s3)}
.chart-legend i.void{background:var(--s-void-fill);box-shadow:inset 0 0 0 1px var(--s-void)}
.chart-legend i.gap{background:var(--st-crit-wash);box-shadow:inset 0 0 0 1px var(--st-crit)}
.chart-svg{display:block;width:100%}
.chart-rd{font-size:var(--fs-sm);color:var(--ink-3);padding:0 24px 4px;line-height:1.55}
.chart-rd b{color:var(--ink-2)}
.chart-wrap{position:relative;padding:0 4px}
.chart-tip{
  position:absolute;pointer-events:none;z-index:30;background:var(--card);border:1px solid var(--line-strong);
  border-radius:var(--r-s);box-shadow:var(--shadow-pop);padding:10px 12px;font-size:var(--fs-sm);min-width:208px;
  opacity:0;transition:opacity .1s var(--ease);
}
.chart-tip.on{opacity:1}
.chart-tip .dt{font-family:var(--num);font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px}
.chart-tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between;line-height:1.75}
.chart-tip .r .lf{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chart-tip .r i{width:9px;height:9px;border-radius:2px;flex:none;font-style:normal}
.chart-tip .r b{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.chart-tip .ev{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);color:var(--ink-2);font-size:var(--fs-xs);line-height:1.55}

/* ============================================================
   11. P-LS-03
   ============================================================ */
.steps{
  display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;
}
.steps .st{
  flex:1;display:flex;align-items:center;gap:13px;padding:17px 22px;background:var(--card);
  border:0;text-align:left;cursor:default;color:var(--ink-3);position:relative;
}
.steps .st.clickable{cursor:pointer}
.steps .st.clickable:hover{background:var(--sunken)}
.steps .st + .st{border-left:1px solid var(--line)}
.steps .st .no{
  width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:var(--fs-sm);font-weight:700;border:1.5px solid var(--line-strong);background:var(--card);
}
.steps .st .tx b{display:block;font-size:var(--fs-b);font-weight:650;color:var(--ink-3)}
.steps .st .tx span{display:block;font-size:var(--fs-sm);margin-top:2px}
.steps .st.done .no{background:var(--st-good);border-color:var(--st-good);color:var(--ink-inv)}
.steps .st.done .tx b{color:var(--ink-2)}
.steps .st.now{background:var(--sunken-2)}
.steps .st.now .no{background:var(--accent);border-color:var(--accent);color:var(--ink-inv)}
.steps .st.now .tx b{color:var(--ink)}
.steps .st .sv{margin-left:auto;flex:none;font-size:var(--fs-sm);text-align:right;line-height:1.45;font-family:var(--num)}

.two{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:24px;align-items:start}
.pick-sum{
  display:flex;align-items:center;gap:20px;padding:13px 16px;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r);font-size:var(--fs-b);flex-wrap:wrap;
}
.pick-sum .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:680;font-size:var(--fs-md)}
.pick-sum .sp{width:1px;height:20px;background:var(--line-strong)}
.pick-sum.bad{background:var(--st-crit-wash);border-color:var(--st-crit-line)}

.sub-h{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;
  font-size:var(--fs-b);font-weight:650;flex-wrap:wrap;
}
.sub-h .x{font-weight:400;color:var(--ink-3);font-size:var(--fs-sm)}
.sub-b{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);overflow:hidden}

.cost{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cost .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 15px;font-size:var(--fs-b);border-bottom:1px solid var(--line-soft)}
.cost .row:last-of-type{border-bottom:0}
.cost .row .k{color:var(--ink-2)}
.cost .row .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:650}
.cost .row .v.txt{font-family:var(--sans);font-weight:600}
.cost .foot{padding:12px 15px;background:var(--sunken);border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-2);line-height:1.62}

/* ============================================================
   12. 弹层 · SDK · Toast
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(12,20,32,.46);z-index:60;display:none;align-items:center;justify-content:center;padding:28px}
.scrim.on{display:flex}
.modal{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow-pop);width:100%;max-width:540px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:var(--fs-lg);font-weight:680;letter-spacing:-.02em}
.modal .mh p{font-size:var(--fs-sm);color:var(--ink-3);margin-top:5px}
.modal .mb{padding:20px 24px;overflow-y:auto}
.modal .mf{padding:15px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--sunken);flex-wrap:wrap}

.sdk{background:var(--ink);color:var(--ink-inv);border-radius:var(--r-l);box-shadow:var(--shadow-pop);width:100%;max-width:404px;overflow:hidden}
.sdk .sh{padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px}
.sdk .sh .mk{width:24px;height:24px;border-radius:6px;background:var(--ink-inv);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-xs);flex:none}
.sdk .sh b{font-size:var(--fs-b);font-weight:650}
.sdk .sh span{font-size:var(--fs-xs);color:var(--s-free);margin-left:auto}
.sdk .sb{padding:18px}
.sdk .sb .kk{display:flex;justify-content:space-between;gap:14px;font-size:var(--fs-sm);padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.sdk .sb .kk:last-child{border-bottom:0}
.sdk .sb .kk span{color:var(--s-free)}
.sdk .sb .kk b{font-family:var(--num);font-weight:600}
.sdk .sf{padding:15px 18px;border-top:1px solid rgba(255,255,255,.14);display:flex;gap:10px}
.sdk .sf .btn{flex:1;background:transparent;border-color:rgba(255,255,255,.3);color:var(--ink-inv)}
.sdk .sf .btn:hover{background:rgba(255,255,255,.1)}
.sdk .sf .btn.primary{background:var(--ink-inv);color:var(--ink);border-color:var(--ink-inv)}
.sdk .sf .btn.primary:hover{background:var(--s-free)}
.sdk .sim{padding:12px 18px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1);font-size:var(--fs-xs);color:var(--s-free)}
.sdk .sim select{height:30px;font-size:var(--fs-sm);margin-top:8px;background:transparent;color:var(--ink-inv);border-color:rgba(255,255,255,.3)}
.sdk .sim select option{color:var(--ink)}

.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast .t{background:var(--ink);color:var(--ink-inv);padding:11px 17px;border-radius:var(--r-s);font-size:var(--fs-b);box-shadow:var(--shadow-pop);max-width:560px;line-height:1.55}

/* ============================================================
   13. 原型演示条（角色 / 数据状态切换，非产品导航）
   ============================================================ */
.protobar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:44px;
  background:var(--ink);color:var(--ink-inv);display:flex;align-items:center;gap:14px;
  padding:0 20px;font-size:var(--fs-sm);
}
.protobar b.badge{font-family:var(--num);font-size:10px;letter-spacing:.1em;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:2px 7px;flex:none}
.protobar .grp{display:flex;align-items:center;gap:8px}
.protobar .grp > span{color:var(--s-free)}
.protobar .sw{display:flex;background:rgba(255,255,255,.1);border-radius:var(--r-s);padding:2px}
.protobar .sw button{background:none;border:0;color:var(--s-free);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:var(--fs-sm)}
.protobar .sw button:hover{color:var(--ink-inv)}
.protobar .sw button.on{background:var(--ink-inv);color:var(--ink);font-weight:650}
.protobar .sp{width:1px;height:20px;background:rgba(255,255,255,.2)}
.protobar .tail{margin-left:auto;color:var(--s-free);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   14. 宽度：1280 / 1440 / 1920
   ============================================================ */
@media (max-width:1439px){
  .sec-grid{grid-template-columns:minmax(0,1fr) 312px}
  .two{grid-template-columns:minmax(0,1fr) 328px}
}
@media (max-width:1319px){
  .wrap{padding:0 20px}
  :root{--fs-h1:30px;--fs-hero:38px}
  .sec-grid,.two{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .trio{grid-template-columns:auto 28px auto 28px auto}
  .flow{flex-wrap:wrap;gap:14px 0}
  .flow .fs{flex:1 1 160px}
  .flow .fsep{display:none}
}
</style>

</div>

<script>
/* ================================================================
   20-data.js —— 常量与演示数据
   全部业务数据为演示数据（虚构企业、编号、金额、哈希），
   仅用于走通界面与交互，不代表任何真实主体或交易。
   ================================================================ */

/* ---- 口径常量（分册 7.3 枚举与常量） ---- */
var PLEDGE_RATE   = 0.8;   /* 质押率：硬编码常量 80%，非配置项、非数据对象（D-MC-110 / D-MC-111 / AC-LS-56） */
var TERM_YEARS    = 1;     /* 融资项目有效期：常量 1 年（D-FIN-37） */
var CCY           = 'USD'; /* 记账本位币（D-FIN-13） */
var CHAIN_TIMEOUT = 30;    /* 链上超时阈值：30 分钟（假设值，待开发按真实链况确认，D-FIN-70） */
var PAGE_SIZE     = 20;    /* P-LS-01 单页 20 条 */
var EXPIRY_NEAR   = [30, 7]; /* 到期提醒标记：到期前 30 天 / 7 天（AC-LS-03） */
var TODAY         = '2026-09-11';
var TZ_LABEL      = 'UTC+8'; /* 平台统一时区标注，口径引用 WS-308『01-国际化基线』 */

/* ---- 状态枚举：一处定义，多处引用（AC-MC-14 / D-FIN-28） ---- */
var FP_STATUS = {
  'S-FP-1': { t:'草稿', x:'已建池 · 未发布', tone:'mute' },
  'S-FP-2': { t:'募集中', x:'公开接受报价',   tone:'info' },
  'S-FP-3': { t:'已锁定', x:'已有在途报价',   tone:'info' },
  'S-FP-4': { t:'融资中', x:'存在未结清融资业务', tone:'info' },
  'S-FP-5': { t:'已关闭', x:'质押已全部释放', tone:'mute' },
  'S-FP-6': { t:'已结清', x:'质押已全部释放', tone:'mute' }
};
var CT_STATUS = {
  'CT-0': { t:'未发起', tone:'mute' },

/* 把总额确定性地切成 n 张，金额落在 4 万～20 万之间，便于阅读 */
function splitAmount(total, n, seed){
  var w=[], i, s=0;
  for(i=0;i<n;i++){ var x = 60 + ((seed*37 + i*53) % 90); w.push(x); s += x; }
  var out=[], acc=0;
  for(i=0;i<n-1;i++){ var v = Math.round(total*w[i]/s/1000)*1000; out.push(v); acc+=v; }
  out.push(total-acc);
  return out;
}

/* ---- 格式化：USD 保留 2 位小数，界面标注币种（AC-FIN-14 / AC-FIN-18） ---- */
function amt(n){
  if(n===null||n===undefined) return '—';
  var neg = n<0; n = Math.abs(n);
  var s = n.toFixed(2), p = s.split('.');
  return (neg?'−':'') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}
function usd(n){ return n===null||n===undefined ? '—' : amt(n) + ' ' + CCY; }
/* 坐标轴刻度：压缩取整，仅为可读性；精确值见悬浮提示、数据表与键值区 */
function axisAmt(n){
  if(n>=1000000) return '$' + (n/1000000).toFixed(n%1000000===0?0:1) + 'M';
  if(n>=1000)    return '$' + Math.round(n/1000) + 'K';
  return '$' + Math.round(n);
}
function intn(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortHash(h){ return h.slice(0,10) + '…' + h.slice(-6); }

/* ---- 日期 ---- */
function dnum(s){ var p=s.split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000; }
function dstr(n){ var d=new Date(n*86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0'); }
function addYears(s, y){ var p=s.split('-'); return (+p[0]+y) + '-' + p[1] + '-' + p[2]; }
function daysTo(s){ return dnum(s) - dnum(TODAY); }
function mdLabel(s){ var p=s.split('-'); return p[1] + '/' + p[2]; }

/* ---- 到期提醒标记（AC-LS-03；触达依赖消息中心，本期只做页面标记） ---- */
function expiryFlag(p){
  if(!p.expiresAt) return null;
  var d = daysTo(p.expiresAt);
  if(d < 0)  return { tone:'mute', t:'已到期', x:'到期日 ' + p.expiresAt };
  if(d <= EXPIRY_NEAR[1]) return { tone:'warn', t:'有效期剩余 ' + d + ' 天', x:'到期前 7 天标记' };
  if(d <= EXPIRY_NEAR[0]) return { tone:'warn', t:'有效期剩余 ' + d + ' 天', x:'到期前 30 天标记' };
  return null;
}

/* ================================================================
   事件流 → 时点序列。两张图、时间线、当前派生量同源。
   ================================================================ */
function seriesOf(p){
  var total=0, dead=0, bal=0, fly=0, pts=[], i;
  for(i=0;i<p.events.length;i++){
    var e = p.events[i];
    total += e.dTotal || 0;
    dead  += e.dVoid  || 0;
    bal   += e.dBal   || 0;
    fly   += e.dFly   || 0;
    pts.push(snap(e.d, total, dead, bal, fly, e));
  }
  /* 末点补到今天，让"当前处于哪一档"在图上有横向宽度可读 */
  var last = pts[pts.length-1];
  if(last && last.d !== TODAY) pts.push(snap(TODAY, total, dead, bal, fly, null));
  return pts;
}
function snap(d, total, dead, bal, fly, ev){
  var valid = total - dead;
  var cap   = round2(valid * PLEDGE_RATE);
  return {
    d:d, x:dnum(d), ev:ev,
    total:total,            /* 池内资产总额 FP-10（含失效，不参与校验） */
    dead:dead,              /* 失效代币价值 FP-19 */
    valid:valid,            /* 有效质押价值 FP-11 —— 一切校验只认这个数 */
    cap:cap,                /* 融资上限 FP-12 = FP-11 × 80% */
    bal:bal,                /* 项目融资余额 FP-13 */
    fly:fly,                /* 项目在途金额 FP-14（唯一来源为发布占用） */
    free:Math.max(0, round2(cap - bal - fly)),   /* 可融金额 FP-15 */
    short:cap < bal          /* 担保不足：融资上限 < 项目融资余额（档③） */
  };
}
function round2(n){ return Math.round(n*100)/100; }

/* ---- 当前派生量 ---- */
function derive(p){
  var pts = seriesOf(p), cur = pts[pts.length-1];
  var g = cur.short ? 'short' : (cur.free === 0 ? 'used-up' : 'normal');
  return {
    pts:pts,
    total:cur.total, dead:cur.dead, valid:cur.valid,
    cap:cur.cap, bal:cur.bal, fly:cur.fly, free:cur.free,
    grade:g,
    gap:      cur.short ? round2(cur.bal - cur.cap) : 0,             /* 担保缺口 FP-21 */
    need:     cur.short ? round2((cur.bal - cur.cap) / PLEDGE_RATE) : 0, /* 需追加资产价值 = 缺口 ÷ 80% */
    shortFrom:shortFrom(pts),
    /* 可撤回上限 FP-16 = 可融金额 ÷ 质押率（AC-FIN-22，AC-FIN-13 的代数变形） */
    wLimit:round2(cur.free / PLEDGE_RATE),
    deadCount:p.tokens.filter(function(t){ return t.dead; }).length,
    liveCount:p.tokens.filter(function(t){ return !t.dead; }).length
  };
}
/* 担保不足起始日：最后一段连续 short 区间的起点 */
function shortFrom(pts){
  var i, from=null;
  for(i=0;i<pts.length;i++){
    if(pts[i].short){ if(from===null) from = pts[i].d; }
    else from = null;
  }
  return from;
}
function gradeOf(p){ return derive(p).grade; }
function gradeMeta(k){ for(var i=0;i<GRADES.length;i++){ if(GRADES[i].k===k) return GRADES[i]; } return GRADES[0]; }

/* ---- 演示用 gas 预估（虚构值，仅用于走通费用区与二次确认） ---- */
function gasEstimate(n){ return (0.00042 * n + 0.00018).toFixed(5); }

/* ================================================================
   available_actions（H-03）
   服务端在每次读取时返回当前可执行动作清单，前端按其渲染、
   不自行依据状态推断；须区分「不可见」与「可见不可点 ⊘」，后者附原因。
   原型内由本函数就地模拟同一份契约。
   ================================================================ */
function availableActions(p, role){
  var d = derive(p), own = (role === 'asset' && p.entity === ACTORS.asset.entity), out = [];
  var guest = (role === 'guest');
  var st = p.status;
  var live = (st==='S-FP-1'||st==='S-FP-2'||st==='S-FP-3'||st==='S-FP-4');

  /* --- 报价：资金方动作，广场唯一对外入口 --- */
  var q = { key:'quote', label:'立即报价', anchor:'quote', primary:true, enabled:false, reason:'' };
  if(guest){
    q.reason = '未登录。登录并以资金方企业主体进入后可发起报价；页面信息 L1～L5 不因未登录而隐藏。';
    q.brief = '需登录';
  } else if(role === 'asset'){
    q.reason = own ? '不能为自己的项目报价。' : '当前企业主体未开通资金方资质，无法发起报价。';
    q.brief = own ? '本方项目' : '无资金方资质';
  } else if(p.draft){
    q.reason = '草稿项目不进广场。'; q.brief = '草稿';
  } else if(d.grade === 'short'){
    q.reason = '该项目处于担保不足预警，已暂停接受新报价（AC-LS-39）。当前担保缺口 ' + usd(d.gap) + '。';
    q.brief = '担保不足';
  } else if(p.expired){
    q.reason = '该项目有效期已到期，停止接受新报价；存量融资业务照常履约（D-FIN-43 分支②）。';
    q.brief = '已到期';
  } else if(st === 'S-FP-3'){
    q.reason = '该项目已有在途报价，同一时刻至多承载一笔在途融资业务（D-FIN-33）。';
    q.brief = '已有报价';
  } else if(!p.demand){
    q.reason = '该项目当前无在途融资需求。'; q.brief = '无在途需求';
  } else if(d.free === 0){
    q.reason = '该项目可融金额为 ' + usd(0) + '，不能再新增占用（AC-FIN-12）。';
    q.brief = '额度用尽';
  } else if(st !== 'S-FP-2'){
    q.reason = '当前项目状态为「' + FP_STATUS[st].t + '」，只有「募集中」接受新报价。';
    q.brief = FP_STATUS[st].t;
  } else {
    q.enabled = true;
  }
  out.push(q);

  /* --- 以下为资产方对自有项目的动作；非本方登录用户不可见（服务端归属过滤 AC-LS-06） --- */
  var mine = own || guest;   /* 游客：可见不可点 + 引导登录（D-LS-04 L6） */
  if(mine && live){
    var pub = { key:'publish', anchor:'publish', enabled:false, reason:'',
                label: st==='S-FP-1' ? '填写金额并发布' : '再次发布 / 管理需求' };
    if(guest)                 pub.reason = '未登录。项目动作仅对该项目所属企业主体开放。';
    else if(p.emptyPool)      pub.reason = '本项目暂无有效质押，请重新质押后再发布（D-FIN-62）。';
    else if(d.valid <= 0)     pub.reason = '有效质押价值为 ' + usd(0) + '，不满足发布校验（D-FIN-61）。';
    else if(p.expired)        pub.reason = '项目已到期，不允许再次发布（D-FIN-43 分支②）。';
    else if(d.free <= 0)      pub.reason = '可融金额为 ' + usd(0) + '，无可发布额度（AC-FIN-12）。';
    else pub.enabled = true;
    out.push(pub);

    out.push({ key:'pledge', anchor:'pledge', label:'追加质押', enabled:!guest, primary:(d.grade==='short'),
               reason: guest ? '未登录。项目动作仅对该项目所属企业主体开放。' : '' });

    var w = { key:'withdraw', anchor:'withdraw', label:'撤回质押', enabled:false, reason:'' };
    if(guest) w.reason = '未登录。项目动作仅对该项目所属企业主体开放。';
    else if(d.wLimit <= 0 && d.deadCount === 0)
      w.reason = '当前可撤回上限为 ' + usd(0) + '（可融金额 ÷ 80%），池内也没有已失效代币，暂无可撤回的代币。'
               + '入口保留可见，不隐藏（H-03）。';
    else w.enabled = true;
    out.push(w);

    var c = { key:'close', anchor:'close', label:'关闭项目', enabled:false, reason:'' };
    if(guest) c.reason = '未登录。项目动作仅对该项目所属企业主体开放。';
    else if(st==='S-FP-3'||st==='S-FP-4') c.reason = '存在在途或未结清融资业务，项目不可关闭（6.1）。';
    else if(d.fly > 0) c.reason = '存在在途占用 ' + usd(d.fly) + '，请先撤下需求再关闭。';
    else if(d.bal > 0) c.reason = '存在未结清融资业务（项目融资余额 ' + usd(d.bal) + '），项目不可关闭（6.1）。';
    else c.enabled = true;
    out.push(c);
  }

  /* --- 提取：无可提取代币时不返回该动作，页面不得自行判断（AC-LS-71） --- */
  if(own && REDEEMABLE.length > 0){
    out.push({ key:'redeem', anchor:'redeem', label:'提取已释放代币（' + REDEEMABLE.length + ' 张）', enabled:true, reason:'' });
  }
  return out;
}

/* ================================================================
   40-ui.js —— 共用组件层
   两个招牌件：三数等式（AC-LS-53）与额度尺（INV-FIN-01 的可视化读数）。
   本版的原则：层级靠字号与留白建立，颜色只用在"必须一眼看到"的地方。
   后续模块新增页面时复用本层，不要各自造一套。

/* ---- 徽标 ---- */
function tag(tone, t, dot){
  return '<span class="tag ' + tone + '">' + (dot ? '<i class="dot"></i>' : '') + esc(t) + '</span>';
}
/* 主视图只挂"改变判断"的标记；解释性文字下沉到折叠层 */
function statusTags(p, compact){
  var d = derive(p), s = FP_STATUS[p.status], g = gradeMeta(d.grade), out = [];
  out.push(tag(s.tone, s.t, true));
  if(d.grade !== 'normal') out.push(tag(g.tone, g.t, true));
  if(p.expired) out.push(tag('plain', '已到期 · 存量融资业务照常履约中'));
  var ef = expiryFlag(p);
  if(ef && !p.expired) out.push(tag(ef.tone, ef.t));
  if(p.emptyPool) out.push(tag('warn', '空池草稿 · 暂无有效质押'));
  if(!compact && p.quotes) out.push(tag('plain', '已收到报价 ' + p.quotes + ' 笔'));
  return out.join('');
}

/* ---- 三数等式：① 有效质押价值 × ② 质押率 = ③ 融资上限 ----
   ③ 是资金方与资产方都要先读到的那个数，给它 44px 与唯一的一处主色。 */

/* ---- 额度尺 ----
   完整版（详情 / 发布页）：余额 · 在途 · 可融 · 缺口 四段 + 上限刻度。
   迷你版（列表行）：合并为「已占用 / 可融」两段 + 缺口 —— 列表要回答的是
   "还有没有空间"，余额与在途的切分是详情页的问题，塞进 8px 高的条里只会变噪声。 */
function meterBlock(d, mini){
  var used = d.bal + d.fly;
  var scale = Math.max(d.cap, used) * 1.03 || 1;
  var pct = function(v){ return (v / scale * 100); };
  var balOver = Math.max(0, d.bal - d.cap);
  var capPct = pct(d.cap);
  var segs = '';
  if(mini){
    var usedIn = Math.min(used, d.cap);
    if(usedIn > 0)  segs += '<div class="seg bal"  style="width:' + pct(usedIn).toFixed(3) + '%"></div>';
    if(used > d.cap)segs += '<div class="seg gap"  style="width:' + pct(used - d.cap).toFixed(3) + '%"></div>';
    if(d.free > 0)  segs += '<div class="seg free" style="width:' + pct(d.free).toFixed(3) + '%"></div>';
  } else {
    var balIn = Math.min(d.bal, d.cap);
    if(balIn > 0)   segs += '<div class="seg bal"  style="width:' + pct(balIn).toFixed(3) + '%"></div>';
    if(balOver > 0) segs += '<div class="seg gap"  style="width:' + pct(balOver).toFixed(3) + '%"></div>';
    if(d.fly > 0)   segs += '<div class="seg fly"  style="width:' + pct(d.fly).toFixed(3) + '%"></div>';
    if(d.free > 0)  segs += '<div class="seg free" style="width:' + pct(d.free).toFixed(3) + '%"></div>';
  }
  var lbShift = capPct > 78 ? 'transform:translateX(-100%);padding-right:4px' : 'transform:translateX(-50%)';
  var legend =
    '<span><i class="cap"></i>融资上限 <b>' + amt(d.cap) + '</b></span>' +
    '<span><i class="bal"></i>项目融资余额 <b>' + amt(d.bal) + '</b></span>' +
    '<span><i class="fly"></i>项目在途金额 <b>' + amt(d.fly) + '</b></span>' +
    '<span><i class="free"></i>可融金额 <b>' + amt(d.free) + '</b></span>' +
    (d.gap > 0 ? '<span><i class="gap"></i>担保缺口 <b>' + amt(d.gap) + '</b></span>' : '');

  return '<div class="meter' + (mini?' mini':'') + '"><div class="mwrap">' +
    '<div class="track" role="img" aria-label="额度尺：融资上限 ' + amt(d.cap) + ' USD，项目融资余额 ' + amt(d.bal) +
      ' USD，项目在途金额 ' + amt(d.fly) + ' USD，可融金额 ' + amt(d.free) + ' USD">' + segs + '</div>' +
    '<div class="capline" style="left:' + capPct.toFixed(3) + '%"></div>' +
    (mini ? '' : '<div class="caplb" style="left:' + capPct.toFixed(3) + '%;' + lbShift + '">融资上限 ' + amt(d.cap) + '</div>') +
    '</div>' + (mini ? '' : '<div class="legend">' + legend + '</div>') +
  '</div>';
}

/* ---- 担保三档：下沉到折叠层，改为紧凑三行，不再是三个色块 ---- */

var FLOW = [
  { id:'S-FP-1', t:'草稿',   x:'已建池 · 未发布',          mine:true },

function flowRail(p){
  var order = ['S-FP-1','S-FP-2','S-FP-3','S-FP-4','S-FP-6'];
  var cur = p.status === 'S-FP-5' ? 'S-FP-1' : p.status;

      '<div class="sid">' + f.id + (f.mine ? '' : ' · 后续环节') + '</div>' +

      '<div class="sx">' + esc(f.x) + (f.who ? '<br>由 ' + f.who + ' 实现' : '') + '</div>' +

  var foot = '本模块（WS-324）只承载到 <b>S-FP-3 已锁定</b>：建池、质押、发布需求，以及"已被报价"这个状态落点。' +
    '虚线段为后续环节，<b>此刻不可操作</b>——报价与接受在 WS-325，放款与融资确认在 WS-326，还款结清在 WS-327。' +
    (p.status === 'S-FP-5' ? '<br>本项目已关闭（S-FP-5），未进入后段。' : '') +
    (p.expired ? '<br>本项目有效期已到期，并行标记为「已到期 · 存量处理中」，停止接受新报价、不允许再次发布；存量融资业务照常履约。' : '');
  return '<div class="flow">' + cells + '</div><div class="flow-foot">' + foot + '</div>';
}

/* ================================================================
   50-charts.js —— P-LS-02 详情页两张图
   图 1 池内资产变动：有效质押价值 + 失效代币价值 = 池内资产总额（堆叠阶梯面积）
   图 2 融资变动：融资上限（线）vs 项目融资余额 + 项目在途金额（堆叠阶梯面积）
   四个量口径互不混用；担保不足（融资上限 < 项目融资余额）在图 2 上有独立区间。
   两图共用 30-calc.js 的同一份 seriesOf()，与页面数字同源。
   数值为阶梯：一次事件改变一次取值，事件之间保持不变——这就是业务的真实形状。
   ================================================================ */

var CHART_H = 206, CH_M = { l:72, r:114, t:16, b:38 };

function niceTicks(max, n){
  var raw = max / n, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), norm = raw / mag;
  var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 4 ? 4 : norm <= 5 ? 5 : 10) * mag;
  var out = [], v = 0;
  while(v <= max + 1e-6){ out.push(v); v = round2(v + step); }
  return out;
}
function monthTicks(x0, x1){
  var out = [], d = new Date(x0 * 86400000);
  d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
  while(d.getTime()/86400000 <= x1){
    var v = d.getTime()/86400000;
    if(v >= x0) out.push(v);
    d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1));
  }
  if(out.length > 8) out = out.filter(function(_,i){ return i % 2 === 0; });
  return out;
}

function stepFwd(pts, get, X, Y){
  var d = '', i;
  for(i=0;i<pts.length;i++){
    var y = Y(get(pts[i])).toFixed(1), x = X(pts[i].x).toFixed(1);
    d += (i===0 ? 'M' : 'L') + x + ',' + y;
    if(i < pts.length-1) d += 'L' + X(pts[i+1].x).toFixed(1) + ',' + y;
  }
  return d;
}
function stepBack(pts, get, X, Y){
  var d = '', i, n = pts.length;
  d += 'L' + X(pts[n-1].x).toFixed(1) + ',' + Y(get(pts[n-1])).toFixed(1);
  for(i=n-2;i>=0;i--){
    d += 'L' + X(pts[i+1].x).toFixed(1) + ',' + Y(get(pts[i])).toFixed(1);
    d += 'L' + X(pts[i].x).toFixed(1)   + ',' + Y(get(pts[i])).toFixed(1);
  }
  return d;
}
var zero = function(){ return 0; };

/* 端点直标：色块携带身份，文字一律用墨色 token；同栏标签自动避让，不叠字 */
function endLabels(x, items){
  var minY = CH_M.t + 10, maxY = CHART_H - CH_M.b - 6, gap = 30, i;
  items = items.slice().sort(function(a,b){ return a.y - b.y; });
  for(i=0;i<items.length;i++){
    items[i].ly = Math.max(minY, items[i].y);
    if(i > 0 && items[i].ly - items[i-1].ly < gap) items[i].ly = items[i-1].ly + gap;
  }
  for(i=items.length-1;i>=0;i--){
    if(items[i].ly > maxY) items[i].ly = maxY;
    if(i < items.length-1 && items[i+1].ly - items[i].ly < gap) items[i].ly = items[i+1].ly - gap;
  }
  return items.map(function(it){
    var lead = (Math.abs(it.ly - it.y) > 3)
      ? '<path d="M' + (x+1).toFixed(1) + ',' + it.y.toFixed(1) + 'L' + (x+6).toFixed(1) + ',' + it.ly.toFixed(1) +
        '" stroke="var(--line-strong)" stroke-width="1" fill="none"></path>' : '';
    return lead + '<g transform="translate(' + (x+9).toFixed(1) + ',' + it.ly.toFixed(1) + ')">' +
      '<rect x="0" y="-8" width="9" height="9" rx="2" fill="' + it.sw + '"></rect>' +
      '<text x="13" y="0" font-size="11" fill="var(--ink)" font-weight="600" font-family="var(--num)">' + axisAmt(it.val) + '</text>' +
      '<text x="0"  y="13" font-size="10.5" fill="var(--ink-3)">' + esc(it.name) + '</text></g>';
  }).join('');
}

function chartFrame(uid, W, yTicks, yMax, xTicks, X, Y){
  var g = '', i;
  for(i=0;i<yTicks.length;i++){
    var y = Y(yTicks[i]).toFixed(1);
    g += '<line x1="' + CH_M.l + '" y1="' + y + '" x2="' + (W - CH_M.r) + '" y2="' + y +
         '" stroke="var(--grid)" stroke-width="1"></line>' +
         '<text x="' + (CH_M.l - 9) + '" y="' + y + '" dy="3.5" text-anchor="end" font-size="10.5" ' +
         'fill="var(--axis-ink)" font-family="var(--num)">' + axisAmt(yTicks[i]) + '</text>';
  }
  for(i=0;i<xTicks.length;i++){
    var x = X(xTicks[i]).toFixed(1);
    g += '<text x="' + x + '" y="' + (CHART_H - CH_M.b + 18) + '" text-anchor="middle" font-size="10.5" ' +
         'fill="var(--axis-ink)" font-family="var(--num)">' + mdLabel(dstr(xTicks[i])) + '</text>';
  }
  g += '<line x1="' + CH_M.l + '" y1="' + Y(0) + '" x2="' + (W - CH_M.r) + '" y2="' + Y(0) +
       '" stroke="var(--axis)" stroke-width="1"></line>';
  return g;
}

/* ---- 图 1：池内资产变动 ---- */
function chartPool(uid, pts, W){
  var x0 = pts[0].x, x1 = pts[pts.length-1].x;
  if(x1 <= x0) x1 = x0 + 30;
  var PW = W - CH_M.l - CH_M.r, PH = CHART_H - CH_M.t - CH_M.b;
  var yMax = Math.max.apply(null, pts.map(function(p){ return p.total; })) * 1.14 || 1;
  var X = function(v){ return CH_M.l + (v - x0) / (x1 - x0) * PW; };
  var Y = function(v){ return CH_M.t + PH - v / yMax * PH; };
  var cur = pts[pts.length-1];
  var s = '';

  s += '<defs><pattern id="hatchVoid' + uid + '" width="7" height="7" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">' +
       '<rect width="7" height="7" fill="var(--s-void-fill)"></rect>' +
       '<line x1="0" y1="0" x2="0" y2="7" stroke="var(--s-void)" stroke-width="1.4" opacity=".55"></line></pattern></defs>';
  s += chartFrame(uid, W, niceTicks(yMax, 4), yMax, monthTicks(x0, x1), X, Y);

  /* 事件竖线 */
  pts.forEach(function(p){
    if(!p.ev) return;
    s += '<line x1="' + X(p.x).toFixed(1) + '" y1="' + CH_M.t + '" x2="' + X(p.x).toFixed(1) + '" y2="' + Y(0) +
         '" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"></line>';
  });

  /* 有效质押价值（底层，计入担保） */
  s += '<path d="' + stepFwd(pts, function(p){ return p.valid; }, X, Y) + stepBack(pts, zero, X, Y) +
       'Z" fill="var(--s1-fill)"></path>';
  /* 失效代币价值（上层，不计入担保）—— 中性灰 + 斜纹，双通道编码 */
  s += '<path d="' + stepFwd(pts, function(p){ return p.total; }, X, Y) +
       stepBack(pts, function(p){ return p.valid; }, X, Y) + 'Z" fill="url(#hatchVoid' + uid + ')"></path>';
  /* 池内资产总额：堆叠顶缘，虚线。先画它，失效为 0 的区段由下面的实线盖住，避免蓝线看起来是虚的 */
  s += '<path d="' + stepFwd(pts, function(p){ return p.total; }, X, Y) +
       '" fill="none" stroke="var(--s-void)" stroke-width="1.5" stroke-dasharray="5 3"></path>';
  /* 堆叠分界：先铺 3px 底色留缝，再描 1.9px 系列线 */
  s += '<path d="' + stepFwd(pts, function(p){ return p.valid; }, X, Y) + '" fill="none" stroke="var(--card)" stroke-width="3.4"></path>';
  s += '<path d="' + stepFwd(pts, function(p){ return p.valid; }, X, Y) + '" fill="none" stroke="var(--s1)" stroke-width="1.9" stroke-linejoin="round"></path>';

  /* 事件点 */
  pts.forEach(function(p){
    if(!p.ev) return;
    s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.total).toFixed(1) +
         '" r="3.6" fill="var(--card)" stroke="var(--s-void)" stroke-width="1.8"></circle>';
  });

  /* 失效起点标注 */
  var firstDead = null;
  pts.forEach(function(p){ if(firstDead === null && p.dead > 0) firstDead = p; });
  if(firstDead){
    s += '<line x1="' + X(firstDead.x).toFixed(1) + '" y1="' + (CH_M.t - 2) + '" x2="' + X(firstDead.x).toFixed(1) +
         '" y2="' + Y(0) + '" stroke="var(--s-void)" stroke-width="1.2" stroke-dasharray="3 3"></line>' +
         '<text x="' + (X(firstDead.x) + 6).toFixed(1) + '" y="' + (CH_M.t + 10) + '" font-size="10.5" fill="var(--ink-2)">' +
         '底层资产失效 ' + firstDead.d + '</text>';
  }

  var labels = [{ y:Y(cur.valid), sw:'var(--s1)', name:'有效质押价值', val:cur.valid }];
  if(cur.dead > 0) labels.push({ y:Y(cur.total), sw:'var(--s-void)', name:'池内资产总额', val:cur.total });
  s += endLabels(X(x1), labels);

  return { svg:s, W:W, X:X, Y:Y, x0:x0, x1:x1 };
}

/* ---- 图 2：融资变动 ---- */
function chartFin(uid, pts, W){
  var x0 = pts[0].x, x1 = pts[pts.length-1].x;
  if(x1 <= x0) x1 = x0 + 30;
  var PW = W - CH_M.l - CH_M.r, PH = CHART_H - CH_M.t - CH_M.b;
  var yMax = Math.max.apply(null, pts.map(function(p){ return Math.max(p.cap, p.bal + p.fly); })) * 1.18 || 1;
  var X = function(v){ return CH_M.l + (v - x0) / (x1 - x0) * PW; };
  var Y = function(v){ return CH_M.t + PH - v / yMax * PH; };
  var cur = pts[pts.length-1];
  var s = '';

  s += '<defs><pattern id="hatchGap' + uid + '" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
       '<rect width="7" height="7" fill="var(--st-crit-wash)"></rect>' +
       '<line x1="0" y1="0" x2="0" y2="7" stroke="var(--st-crit)" stroke-width="1.4" opacity=".45"></line></pattern></defs>';
  s += chartFrame(uid, W, niceTicks(yMax, 4), yMax, monthTicks(x0, x1), X, Y);

  /* 担保不足区间：融资上限 < 项目融资余额 的连续区段 —— 先铺底，图形压在上面 */
  var bands = [], i, open = null;
  for(i=0;i<pts.length;i++){
    if(pts[i].short && open === null) open = pts[i];
    if(!pts[i].short && open !== null){ bands.push([open, pts[i]]); open = null; }
  }
  if(open !== null) bands.push([open, pts[pts.length-1]]);
  bands.forEach(function(b){
    var bx = X(b[0].x), bw = Math.max(2, X(b[1].x) - bx);
    s += '<rect x="' + bx.toFixed(1) + '" y="' + CH_M.t + '" width="' + bw.toFixed(1) + '" height="' + PH +
         '" fill="url(#hatchGap' + uid + ')"></rect>' +
         '<line x1="' + bx.toFixed(1) + '" y1="' + CH_M.t + '" x2="' + bx.toFixed(1) + '" y2="' + Y(0) +
         '" stroke="var(--st-crit)" stroke-width="1.4"></line>';
  });

  pts.forEach(function(p){
    if(!p.ev) return;
    s += '<line x1="' + X(p.x).toFixed(1) + '" y1="' + CH_M.t + '" x2="' + X(p.x).toFixed(1) + '" y2="' + Y(0) +
         '" stroke="var(--grid)" stroke-width="1" stroke-dasharray="2 3"></line>';
  });

  /* 项目融资余额（底层） */
  s += '<path d="' + stepFwd(pts, function(p){ return p.bal; }, X, Y) + stepBack(pts, zero, X, Y) +
       'Z" fill="var(--s2-fill)"></path>';
  /* 项目在途金额（堆在余额之上，两条线因此可分辨） */
  s += '<path d="' + stepFwd(pts, function(p){ return p.bal + p.fly; }, X, Y) +
       stepBack(pts, function(p){ return p.bal; }, X, Y) + 'Z" fill="var(--s3-fill)"></path>';
  s += '<path d="' + stepFwd(pts, function(p){ return p.bal; }, X, Y) + '" fill="none" stroke="var(--card)" stroke-width="3.4"></path>';
  s += '<path d="' + stepFwd(pts, function(p){ return p.bal; }, X, Y) + '" fill="none" stroke="var(--s2)" stroke-width="1.9" stroke-linejoin="round"></path>';
  s += '<path d="' + stepFwd(pts, function(p){ return p.bal + p.fly; }, X, Y) + '" fill="none" stroke="var(--s3)" stroke-width="1.9" stroke-linejoin="round"></path>';
  /* 融资上限：主线，比两条面积更重 */
  s += '<path d="' + stepFwd(pts, function(p){ return p.cap; }, X, Y) +
       '" fill="none" stroke="var(--card)" stroke-width="4"></path>';
  s += '<path d="' + stepFwd(pts, function(p){ return p.cap; }, X, Y) +
       '" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linejoin="round"></path>';

  /* 跨线点：担保不足起点 */
  bands.forEach(function(b){
    var bx = X(b[0].x);
    s += '<circle cx="' + bx.toFixed(1) + '" cy="' + Y(b[0].cap).toFixed(1) +
         '" r="5" fill="var(--card)" stroke="var(--st-crit)" stroke-width="2.4"></circle>' +
         '<text x="' + (bx + 9).toFixed(1) + '" y="' + (CH_M.t + 11) + '" font-size="10.5" fill="var(--st-crit)" font-weight="700">' +
         '担保不足区间 · 自 ' + b[0].d + ' 起</text>' +
         '<text x="' + (bx + 9).toFixed(1) + '" y="' + (CH_M.t + 24) + '" font-size="10.5" fill="var(--ink-2)">' +
         '融资上限跌破项目融资余额</text>';
  });

  /* 可融金额：末端的上限线与占用顶之间的竖向标注 */
  if(cur.free > 0){
    var fx = X(x1) - 14, yTop = Y(cur.cap), yBot = Y(cur.bal + cur.fly);
    s += '<line x1="' + fx.toFixed(1) + '" y1="' + yTop.toFixed(1) + '" x2="' + fx.toFixed(1) + '" y2="' + yBot.toFixed(1) +
         '" stroke="var(--ink-3)" stroke-width="1"></line>' +
         '<line x1="' + (fx-4).toFixed(1) + '" y1="' + yTop.toFixed(1) + '" x2="' + (fx+4).toFixed(1) + '" y2="' + yTop.toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1"></line>' +
         '<line x1="' + (fx-4).toFixed(1) + '" y1="' + yBot.toFixed(1) + '" x2="' + (fx+4).toFixed(1) + '" y2="' + yBot.toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1"></line>' +
         '<text x="' + (fx-7).toFixed(1) + '" y="' + ((yTop+yBot)/2).toFixed(1) + '" dy="3.5" text-anchor="end" font-size="10.5" fill="var(--ink-2)">可融</text>';
  }

  var labels = [{ y:Y(cur.cap), sw:'var(--s1)', name:'融资上限', val:cur.cap },
                { y:Y(cur.bal), sw:'var(--s2)', name:'项目融资余额', val:cur.bal }];
  if(cur.fly > 0) labels.push({ y:Y(cur.bal + cur.fly), sw:'var(--s3)', name:'项目在途金额', val:cur.fly });
  s += endLabels(X(x1), labels);

  return { svg:s, W:W, X:X, Y:Y, x0:x0, x1:x1 };
}

/* ---- 悬浮层：十字线 + 全序列读数（线/面积图默认带交互） ---- */
function attachHover(wrapId, pts, built, kind){
  var wrap = document.getElementById(wrapId);
  if(!wrap) return;
  var svg = wrap.querySelector('svg'), tip = wrap.querySelector('.chart-tip');
  var cross = svg.querySelector('.cross');
  function idxAt(px){
    var i, last = 0;
    for(i=0;i<pts.length;i++){ if(built.X(pts[i].x) <= px + 0.5) last = i; }
    return last;
  }
  function move(e){
    var r = svg.getBoundingClientRect(), px = e.clientX - r.left;
    if(px < CH_M.l || px > built.W - CH_M.r){ leave(); return; }
    var i = idxAt(px), p = pts[i], cx = built.X(p.x);
    cross.setAttribute('transform', 'translate(' + cx.toFixed(1) + ',0)');
    cross.style.display = '';
    var rows;
    if(kind === 'pool'){
      rows = [['var(--s1)','有效质押价值', p.valid], ['var(--s-void)','失效代币价值（不计入担保）', p.dead], [null,'池内资产总额', p.total]];
    } else {
      rows = [['var(--s1)','融资上限', p.cap], ['var(--s2)','项目融资余额', p.bal], ['var(--s3)','项目在途金额', p.fly], [null,'可融金额', p.free]];
    }
    tip.innerHTML = '<div class="dt">' + p.d + ' · ' + TZ_LABEL + '</div>' +
      rows.map(function(r){
        return '<div class="r"><span class="lf">' + (r[0] ? '<i style="background:' + r[0] + '"></i>' : '<i style="background:transparent"></i>') +
          esc(r[1]) + '</span><b>' + amt(r[2]) + '</b></div>';
      }).join('') +
      (kind === 'fin' && p.short ? '<div class="ev" style="color:var(--st-crit)">担保不足：融资上限 < 项目融资余额，缺口 ' + amt(p.bal - p.cap) + ' ' + CCY + '</div>' : '') +
      (p.ev ? '<div class="ev"><b>' + esc(p.ev.t) + '</b>' + (p.ev.note ? '<br>' + esc(p.ev.note) : '') + '</div>' : '');
    var tw = tip.offsetWidth || 240;
    var left = cx + 14; if(left + tw > built.W - 6) left = cx - tw - 14;
    tip.style.left = Math.max(6, left) + 'px';
    tip.style.top  = (CH_M.t + 6) + 'px';
    tip.classList.add('on');
  }
  function leave(){ tip.classList.remove('on'); if(cross) cross.style.display = 'none'; }
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', leave);
}

/* ---- 两张图合成一张卡片 ----
   上一版两张图各占一张大卡（合计 ~900px），在详情页里压过了三数与操作区。
   本版合成一张卡、单图高度 252 → 206、去掉每图的边框与底部大段读法块，
   数据表下沉到折叠层：图仍然完整可读，但不再是页面上最重的东西。 */
function chartBody(p, kind){
  var d = derive(p), pts = d.pts, uid = kind + '-' + p.id.replace(/[^A-Za-z0-9]/g,'');
  var isPool = (kind === 'pool');
  var legend = isPool
    ? '<span><i class="s1"></i>有效质押价值（计入担保）</span>' +
      '<span><i class="void"></i>失效代币价值（不计入担保）</span>' +
      '<span><i class="dash"></i>池内资产总额</span>'
    : '<span><i class="l s1l"></i>融资上限（＝有效质押价值 × ' + (PLEDGE_RATE*100) + '%）</span>' +
      '<span><i class="s2"></i>项目融资余额</span>' +
      '<span><i class="s3"></i>项目在途金额</span>' +
      '<span><i class="gap"></i>担保不足区间</span>';
  var read = isPool
    ? '蓝色是<b>参与计算</b>的部分，灰斜纹是<b>因底层应收账款失效而不计入担保</b>的部分，两者之和才是账面的池内资产总额。'
    : '面积顶到蓝线之间的空隙就是<b>可融金额</b>；<b>橙色面积高过蓝线的那一段就是担保不足</b>——判据只比项目融资余额，不含在途。';
  var tbl = '<div class="tscroll"><table class="dt"><thead><tr><th>日期</th>' +
    (isPool ? '<th class="n">有效质押价值</th><th class="n">失效代币价值</th><th class="n">池内资产总额</th>'
            : '<th class="n">融资上限</th><th class="n">项目融资余额</th><th class="n">项目在途金额</th><th class="n">可融金额</th>') +
    '<th>事件</th></tr></thead><tbody>' +
    pts.map(function(q){
      return '<tr><td class="n">' + q.d + '</td>' +
        (isPool ? '<td class="n">' + amt(q.valid) + '</td><td class="n">' + amt(q.dead) + '</td><td class="n">' + amt(q.total) + '</td>'
                : '<td class="n">' + amt(q.cap) + '</td><td class="n">' + amt(q.bal) + '</td><td class="n">' + amt(q.fly) + '</td><td class="n">' + amt(q.free) + '</td>') +
        '<td>' + (q.ev ? esc(q.ev.t) : '当前（' + TODAY + '）') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  return '<div class="cbody">' +
    '<div class="chart-head"><div><h3>' + (isPool ? '池内资产变动' : '融资变动') + '</h3>' +
      '<p>' + (isPool ? '池子里有多少钱、其中多少还顶用' : '额度被什么消耗、还剩多少、什么时候跨过担保线') +
      '。单位 ' + CCY + '，刻度为压缩取整，精确值见悬浮读数与数据表。</p></div></div>' +
    '<div class="chart-legend">' + legend + '</div>' +
    '<div class="chart-wrap" id="wrap-' + uid + '"><div class="chart-tip"></div></div>' +
    '<div class="chart-rd">读法：' + read + '</div>' +
    '<div style="padding:0 24px 6px">' + fold('数据表 · ' + (isPool ? '池内资产' : '融资') + '逐时点数值', pts.length + ' 行', tbl) + '</div>' +
  '</div>';
}
function chartPairCard(p){
  return '<div class="card chart-pair">' + chartBody(p, 'pool') + chartBody(p, 'fin') + '</div>';
}

/* ---- 挂载 / 重绘（宽度变化时重算像素，不做缩放变形） ---- */
var mountedCharts = [];
function drawCharts(){
  mountedCharts.forEach(function(m){
    var wrap = document.getElementById('wrap-' + m.uid);
    if(!wrap) return;
    var W = Math.max(560, wrap.clientWidth);
    var built = (m.kind === 'pool') ? chartPool(m.uid, m.pts, W) : chartFin(m.uid, m.pts, W);
    var tip = wrap.querySelector('.chart-tip');
    wrap.innerHTML = '<svg class="chart-svg" width="' + W + '" height="' + CHART_H + '" role="img" aria-label="' +
      (m.kind === 'pool' ? '池内资产变动阶梯面积图' : '融资变动图') + '，精确数值见同卡片的数据表">' + built.svg +
      '<g class="cross" style="display:none"><line x1="0" y1="' + CH_M.t + '" x2="0" y2="' + (CHART_H - CH_M.b) +
      '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"></line></g></svg>';
    wrap.appendChild(tip);
    attachHover('wrap-' + m.uid, m.pts, built, m.kind);
  });
}
function registerChart(p, kind){
  mountedCharts.push({ uid:kind + '-' + p.id.replace(/[^A-Za-z0-9]/g,''), pts:derive(p).pts, kind:kind });
}
var rsz = null;
window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(drawCharts, 120); });
/* ================================================================
   60-pages-plaza.js —— P-LS-01 融资需求列表（广场首页）
   本版由卡片流改为台账式列表：行高 56px，一屏可扫的项目数提升 4～5 倍。
   留在主行的字段，判准是资金方扫列表时要做的那个决定——值不值得点进去：
     ① 要融多少（融资需求金额）② 能不能报（担保状态 / 可报价）
     ③ 抵押物值多少（有效质押价值 + 张数）④ 额度还剩多少（迷你额度尺）
     ⑤ 什么时候截止（有效期至）
   其余字段（融资上限 / 项目融资余额 / 项目在途金额 / 可融金额 / 逐张明细 /
   合同号 / 链上哈希）一个都没删，全部在详情页 L3、折叠层与次级视图里可达。
   ================================================================ */

var F_DEFAULT = { type:'', pool:'', demand:'', status:'', quotable:'', expiry:'', grade:'' };

function matchFilter(p){
  var d = derive(p), f = state.filters;
  if(f.type   && p.assetType !== f.type) return false;
  if(f.pool){
    var r = f.pool.split('-');
    if(d.valid < +r[0] || (r[1] !== 'x' && d.valid > +r[1])) return false;
  }
  if(f.demand){
    var q = f.demand.split('-');
    if(!p.demand) return false;
    if(p.demand < +q[0] || (q[1] !== 'x' && p.demand > +q[1])) return false;
  }
  if(f.status && p.status !== f.status) return false;
  if(f.grade  && d.grade !== f.grade) return false;
  if(f.quotable === 'y' && !actionOf(availableActions(p, 'fund'), 'quote').enabled) return false;
  if(f.quotable === 'n' &&  actionOf(availableActions(p, 'fund'), 'quote').enabled) return false;
  if(f.expiry){
    var dd = p.expiresAt ? daysTo(p.expiresAt) : 99999;
    if(f.expiry === 'x'  && dd >= 0) return false;
    if(f.expiry === '7'  && (dd < 0 || dd > 7)) return false;
    if(f.expiry === '30' && (dd < 0 || dd > 30)) return false;
  }
  return true;
}
function sortList(list){
  var s = state.sort;
  return list.slice().sort(function(a,b){
    if(s === 'demand') return (b.demand||0) - (a.demand||0);
    if(s === 'pool')   return derive(b).valid - derive(a).valid;
    return dnum(b.publishedAt || TODAY) - dnum(a.publishedAt || TODAY);
  });
}

function filterBar(){
  function sel(key, label, opts){
    return '<div class="f"><span>' + label + '</span><select onchange="setFilter(\'' + key + '\',this.value)">' +
      opts.map(function(o){
        return '<option value="' + o[0] + '"' + (state.filters[key] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>';
  }
  return '<div class="filters">' +
    sel('type','资产类型',    [['','全部'],['应收账款类','应收账款类']]) +
    sel('pool','池内资产价值', [['','不限'],['0-500000','50 万以下'],['500000-1000000','50–100 万'],['1000000-x','100 万以上']]) +
    sel('demand','需求金额', [['','不限'],['0-300000','30 万以下'],['300000-600000','30–60 万'],['600000-x','60 万以上']]) +
    sel('status','项目状态',  [['','全部']].concat(['S-FP-2','S-FP-3','S-FP-4','S-FP-5','S-FP-6'].map(function(k){ return [k, FP_STATUS[k].t]; }))) +
    sel('quotable','是否可报价', [['','不限'],['y','可报价'],['n','暂不可报价']]) +
    sel('expiry','有效期临近',[['','不限'],['7','7 天内到期'],['30','30 天内到期'],['x','已到期']]) +
    sel('grade','担保状态',   [['','全部']].concat(GRADES.map(function(g){ return [g.k, g.t]; }))) +
    '<div class="spacer"></div>' +
    '<div class="f"><span>排序</span><select onchange="setSort(this.value)">' +
      [['pub','发布时间倒序'],['demand','按需求金额'],['pool','按池内资产价值']].map(function(o){
        return '<option value="' + o[0] + '"' + (state.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>' +
    (JSON.stringify(state.filters) !== JSON.stringify(F_DEFAULT)
      ? '<div class="rs"><button class="btn sm ghost" onclick="resetFilters()">清空筛选</button></div>' : '') +
  '</div>';
}

function projectRow(p){
  var d = derive(p), q = actionOf(availableActions(p, state.role), 'quote');
  var g = gradeMeta(d.grade);
  var cover = d.cap > 0 ? Math.round((d.bal + d.fly) / d.cap * 100) : 0;
  var ef = expiryFlag(p);
  var open = 'go(\'project\',{id:\'' + p.id + '\'})';
  return '<tr class="prow" onclick="' + open + '">' +
    '<td><div class="nm">' + esc(p.name) + '</div>' +
      '<div class="sub"><span>' + esc(p.owner) + '</span><span class="id">' + p.id + '</span></div></td>' +
    '<td class="n"><div class="dm' + (p.demand ? '' : ' none') + '">' + (p.demand ? amt(p.demand) : '—') + '</div>' +
      '<div class="sub" style="justify-content:flex-end">' + (p.demand ? CCY : '无在途需求') + '</div></td>' +
    '<td>' + tag(FP_STATUS[p.status].tone, FP_STATUS[p.status].t, true) +
      (p.expired ? '<div class="sub">已到期 · 存量履约中</div>' : '') + '</td>' +
    '<td>' + tag(g.tone, g.t, true) +
      (d.gap ? '<div class="sub">缺口 <span class="n">' + amt(d.gap) + '</span></div>' : '') + '</td>' +
    '<td class="n"><span style="font-weight:600">' + amt(d.valid) + '</span>' +
      '<div class="sub" style="justify-content:flex-end">' + p.tokens.length + ' 张' +
      (d.deadCount ? ' · 含失效 ' + d.deadCount + ' 张' : '') + '</div></td>' +
    '<td><div class="mt">' + meterBlock(d, true) +
      '<div class="cover">已占用 ' + cover + '%</div>' +
      '<div class="cover">可融 ' + amt(d.free) + '</div></div></td>' +
    '<td class="n">' + (p.expiresAt || '—') +
      (ef && !p.expired ? '<div class="sub" style="justify-content:flex-end;color:var(--st-warn)">' + esc(ef.t) + '</div>' : '') + '</td>' +
    '<td onclick="event.stopPropagation()"><div class="qa">' +
      (q.enabled
        ? '<button class="btn sm primary" onclick="doQuote(\'' + p.id + '\')">立即报价</button>'
        : '<button class="btn blocked sm" aria-disabled="true" title="' + esc(q.reason) + '" onclick="toast(' +
          JSON.stringify(q.reason).replace(/"/g,'&quot;') + ')"><span class="sig" aria-hidden="true">⊘</span>报价</button>' +
          '<span class="rz">' + esc(q.brief || '') + '</span>') +
    '</div></td>' +
  '</tr>';
}

function pagePlaza(){
  var all = plazaProjects();
  var sumValid = all.reduce(function(a,p){ return a + derive(p).valid; }, 0);
  var sumDemand = all.reduce(function(a,p){ return a + (p.demand || 0); }, 0);
  var head = '<div class="page-head"><div><h1>融资需求广场</h1>' +
    '<div class="sub">平台上全部入驻资产方创建的融资项目，一个项目就是一个资产池。' +
    '信息 L1～L5 对所有人全量可见，不登录也能看完；只有操作入口按登录态与权限收敛。</div>' +
    '<div class="sum">当前在架 <b>' + all.length + '</b> 个项目 · 有效质押价值合计 <b>' + usd(sumValid) +
    '</b> · 在途融资需求合计 <b>' + usd(sumDemand) + '</b>　<span class="demo">演示数据</span></div></div>' +
    (state.role === 'asset' ? '<button class="btn primary" onclick="go(\'publish\',{id:null})">创建融资项目</button>' : '') +
    '</div>';

  if(state.feed === 'loading') return head + filterBar() + skeletonRows(9);
  if(state.feed === 'fail')
    return head + filterBar() + blankState('⚠', '融资需求加载失败',
      '服务端未返回列表数据。这不影响已发布项目的链上与额度状态，可重试。',
      '<button class="btn primary" onclick="setFeed(\'ok\')">重新加载</button>');
  if(state.feed === 'empty')
    return head + filterBar() + blankState('○', '暂无融资需求',
      '目前平台上还没有已发布的融资项目。资产方在资产平台完成应收账款确权、由运营端签发代币后，' +
      '即可在此创建资产池并发布融资需求。',
      '<button class="btn" onclick="signIn()">注册为资产方</button>');

  var list = sortList(all.filter(matchFilter));
  if(state.feed === 'noresult' || list.length === 0)
    return head + filterBar() + blankState('⌕', '没有符合筛选条件的融资需求',
      '当前筛选组合下没有匹配的资产池。可放宽池内资产价值区间或项目状态，也可以清空筛选查看全部 ' + all.length + ' 条。',
      '<button class="btn primary" onclick="resetFilters()">清空筛选</button>');

  var total = list.length, start = (state.pageNo-1)*PAGE_SIZE;
  var shown = list.slice(start, start + PAGE_SIZE);
  return head + filterBar() +
    '<div class="card tbl"><div class="cb tight"><div class="tscroll"><table class="list"><thead><tr>' +
      '<th>融资项目 / 资产方</th><th class="n">融资需求金额</th><th>项目状态</th><th>担保状态</th>' +
      '<th class="n">有效质押价值</th><th>额度占用</th><th class="n">有效期至</th><th style="text-align:right">操作</th>' +
    '</tr></thead><tbody>' + shown.map(projectRow).join('') + '</tbody></table></div></div></div>' +
    '<div class="pager"><span>共 ' + total + ' 条 · 单页 ' + PAGE_SIZE + ' 条 · 第 ' + state.pageNo + ' / ' +
      Math.max(1, Math.ceil(total/PAGE_SIZE)) + ' 页 · 点击任意一行进入详情</span>' +
      '<div class="pg"><button class="btn sm ghost" ' + (state.pageNo<=1?'disabled':'') + ' onclick="setPage(' + (state.pageNo-1) + ')">上一页</button>' +
      '<button class="btn sm ghost" ' + (start+PAGE_SIZE>=total?'disabled':'') + ' onclick="setPage(' + (state.pageNo+1) + ')">下一页</button></div></div>';
}

function setFilter(k, v){ state.filters[k] = v; state.pageNo = 1; render(); }
function setSort(v){ state.sort = v; render(); }
function resetFilters(){ state.filters = JSON.parse(JSON.stringify(F_DEFAULT)); state.pageNo = 1; if(state.feed==='noresult') state.feed='ok'; render(); }
function setPage(n){ state.pageNo = n; render(); window.scrollTo(0,0); }

/* 报价流程属 WS-325（M-2），本模块只交付广场侧入口与 ⊘ 口径 */
function doQuote(id){
  var p = findProject(id);
  openScrim('<div class="modal"><div class="mh"><h2>立即报价</h2><p>' + esc(p.name) + ' · ' + p.id + '</p></div>' +
    '<div class="mb"><div class="note info"><span class="ic">i</span><div class="bd">' +
    '<b>报价及之后的环节不在本模块范围内</b>（X-LS-01）。授信核定、报价、接受 / 拒绝报价、放款与融资确认在 WS-325（M-2）及之后实现。' +

function pageProject(){
  var p = findProject(state.id);

    '<div class="tags">' + statusTags(p) + '</div>' +
    '</div><div class="dm"><div class="lb">融资需求金额</div>' +

  /* ---- 第一层 · 三数等式 + 额度尺（裸露在底色上，全页视觉顶点） ---- */

  /* 同一条原因重复 4 遍只是噪声：全部被同一理由挡住时，只写一次（入口仍逐个可见可聚焦） */
  var sameWhy = second.length > 1 && second.every(function(a){ return !a.enabled && a.reason === second[0].reason; });
  var rail = '<div class="card"><div class="ch"><h2>操作区</h2>' +

  /* ---- 第三层 · 次级视图 ---- */
  var tab = state.tab || 'collateral';

    [['collateral','抵押物明细', p.tokens.length + ' 张'],
     ['history','历史融资记录', (p.events.length + p.deals.length) + ' 条'],
     ['terms','商务条款与公开范围', '']].map(function(t){

    }).join('') + '</div>';

  var tabBody = tab === 'history' ? tabHistory(p) : tab === 'terms' ? tabTerms(p) : tabCollateral(p, d);

  return crumb + head +
    shortAlert(p, d, own) + usedUpNote(d) + (own ? redeemBanner() : '') +
    strip +
    '<div style="height:26px"></div>' +
    '<div class="sec-grid"><div>' + flow + chartPairCard(p) + '</div>' +
    '<aside class="rail">' + rail + '</aside></div>' +
    '<div style="height:20px"></div>' +
    '<div class="card">' + tabsBar + tabBody + '</div>';
}

function actionHandler(p, a){
  switch(a.key){
    case 'quote':    return 'doQuote(\'' + p.id + '\')';
    case 'publish':  return 'go(\'publish\',{id:\'' + p.id + '\',action:\'publish\'})';
    case 'pledge':   return 'openPledge(\'' + p.id + '\')';
    case 'withdraw': return 'go(\'publish\',{id:\'' + p.id + '\',action:\'withdraw\'})';
    case 'redeem':   return 'openRedeem()';
    case 'close':    return 'closeProject(\'' + p.id + '\')';
  }
  return 'void 0';
}

  var d = p ? derive(p) : null;
  var s1done = !!p, s2done = !!(p && !p.draft);
  function cell(no, title, sub, cls, sv, click){
    return '<' + (click ? 'button' : 'div') + ' class="st ' + cls + (click ? ' clickable' : '') + '"' +
      (click ? ' onclick="' + click + '"' : '') + '>' +
      '<span class="no">' + (cls.indexOf('done') >= 0 ? '✓' : no) + '</span>' +
      '<span class="tx"><b>' + title + '</b><span>' + sub + '</span></span>' +
      (sv ? '<span class="sv">' + sv + '</span>' : '') +
      '</' + (click ? 'button' : 'div') + '>';
  }
  return '<div class="steps">' +
    cell(1, '建池与质押', s1done ? '已完成 · 项目已持久化' : '填项目名 + 勾选至少一张可质押代币',
         s1done ? (step === 1 ? 'now' : 'done') : (step === 1 ? 'now' : ''),
         p ? (p.tokens.length + ' 张 · ' + amt(derive(p).total) + ' ' + CCY) : '',
         (s1done && step !== 1) ? 'go(\'publish\',{id:\'' + p.id + '\',step:1})' : null) +
    cell(2, '填写金额并发布', s2done ? '已发布 · 当前为质押与需求管理' : '填融资需求金额，发布即占用额度',
         step === 2 ? 'now' : (s2done ? 'done' : ''),
         d ? ('可融金额 ' + amt(d.free) + ' ' + CCY) : '',
         (s1done && step !== 2) ? 'go(\'publish\',{id:\'' + p.id + '\',step:2})' : null) +
  '</div>';
}

/* ---- 第一段：建池与质押 ---- */
/* 第一段回看：项目已建，只读呈现当时的建池结果 + 进入第二段 */

function stepOne(p){
  if(p) return stepOneReview(p);
  var editable = true;                           /* 新建模式才可勾选钱包代币 */
  var sel = state.wiz.sel, selList = WALLET.filter(function(t){ return sel[t.id]; });

    '（含"已释放待提取"的代币，须先提取才能再质押）；④ 底层应收账款未失效；⑤ 代币类型为应收账款类（本期能力边界）；' +
