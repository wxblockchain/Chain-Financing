<!doctype html>
<html lang="en" data-end="asset">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Service Platform · Repayment schedule and repayment confirmation</title>
<link rel="stylesheet" href="../../../asset-platform/prototypes/_shared/tokens.css">
<link rel="stylesheet" href="../../../asset-platform/prototypes/_shared/base.css">
<style>/* Hallmark · pre-emit critique: P5 H5 E4 S5 R4 V4
   只放本模块专有的组合。token 与公共组件一律来自 _shared，此处不重定义、不覆盖。
   继承端别：面客端 asset　继承 shell：portal（顶栏导航 + subnav，无侧栏）
   继承母版：4.3 顶栏母版（金融服务端登录）＋ 4.2 公开层内容节奏
   继承模块：WS-324 v1.3（详情页三段式操作区、术语表、EN 默认）
             WS-325 v1.3.1 / WS-326 v2.0（承载单元 .drawer.u 760px、提示走居中弹窗 560px、
             同一时刻只有一层）—— 承载与英文基线直接继承，本轮不重新推导。

   v2.0 相对 v1.0 的五处（对应 PRD V3.2，见 README §1.2）：
     ① 三个做事类承载单元由**整页**改为详情页操作区第③段内的**右侧抽屉 760px**，不跳离详情页；
        两处二次确认走**居中弹窗 560px**；⊘ 原因与状态提示内联 / Toast、不开层；
        同一时刻只有一层（D-RP-71 / D-RP-72 / D-RP-76）
     ② 打款目标改锚 WS-326 放款时登记的 LN-15（法币，含中转行）/ LN-16（数币，绑定钱包）
     ③ 链降为常量 ETH，只展示不录入、界面不给任何选择控件（RM-09）
     ④ 还款类型引用 WS-325 QT-15，并补最终还款日 QT-16
     ⑤ 界面文案默认英文、中文可切换；旧词根改为「质押覆盖」（D-LS-17）

   v2.1 相对 v2.0（对应 PRD V3.4，需求方 09-15 09:35 四条）：
     ⑥ 第③段独立成块、未进 S-FD-6 时整段不渲染；一个编号选择器（FP-28 主标识 +
        FD-01/LN-01 副行 + 按任一编号检索），不是两级筛选（D-RP-77 / D-RP-78）
     ⑦ 「立即还款」抽屉精简为四类，移走的逐项给了去处（D-RP-79）
     ⑧ 「查看还款计划」只留定稿版、精简为 6 列 + 行内展开，按选定笔收敛（D-RP-80 / D-RP-81）
     ⑨ 第③段与抽屉的标签不再带 RP- / LN- 内部字段编号（AC-RP-28 ④）

   招牌件现状：
     .rp-vs     两版计划对照 —— **V3.4 退役**，两版同屏对照取消、初始版收敛回报价环节
     .rp-freeze 两条轴 —— 「时间的停止」停在提交时刻，「状态的终结」停在确认时刻（D-FIN-11）。
                **V3.4 起移出抽屉**，落在详情页的「原型说明件」区：它是规则的论证，不是生产界面
     .rp-sel    期次选择器 —— 已逾期 / 待还款 / 未开窗 三组，排序键写在行上（D-RP-21 ~ D-RP-26）
     .rp-stop   五个拦截点牌 —— 同 .rp-freeze，移到「原型说明件」区；界面上保留的是它们的效果
     .rp-rule   计息规则常驻条 —— 固定在计划抽屉顶部、不随表体滚走（D-RP-72 ②）
   ========================================================================== */

/* ============================================================
   第一段：面客档位版式（与 WS-324 / WS-325 / WS-326 共用的模块作用域类，类名一字不改）
   base.css 的 .page-title 19px / body 13.5px 是管理端档位；面客页要抬到参考件档位。
   上收 base.css 的事已第五次记录在 README §6，仍建议单独一轮做。
   ============================================================ */
.portal-wrap{font-size:14.5px;line-height:1.55}
.portal-wrap table.tbl{font-size:13px}
.portal-wrap .card-head span{font-size:12.5px}
.ls-phead{display:flex;align-items:flex-start;gap:var(--sp-5);margin-bottom:var(--sp-5)}
.ls-phead .tile{width:52px;height:52px;border-radius:15px;flex:none;background:var(--accent-soft);
  border:1px solid var(--accent-border);display:grid;place-items:center;font-size:21px;margin-top:5px}
.ls-phead .body{flex:1;min-width:0}
.ls-phead .kick{font-size:12.5px;color:var(--faint);margin:0 0 4px}
.ls-phead h1{margin:0;font-size:clamp(24px,2.5vw,38px);font-weight:740;letter-spacing:-.03em;line-height:1.12}
.ls-phead h1 em{font-style:normal;color:var(--faint);font-weight:600;margin-left:10px;font-size:.58em}
.ls-phead .amt{text-align:right;flex:none;padding-top:8px}
.ls-phead .amt .k{font-size:12.5px;color:var(--faint)}
.ls-phead .amt .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(24px,2.2vw,34px);
  font-weight:700;letter-spacing:-.035em;line-height:1.06;margin-top:3px}
.ls-phead .amt .cy{font-size:13px;color:var(--faint);font-weight:500;margin-left:5px}
.ls-phead .amt .x{font-size:12px;color:var(--faint);margin-top:5px}
.ls-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--sp-4)}
.ls-tags .pill{height:27px;padding:0 11px;font-size:12.5px;border-radius:var(--radius-pill)}
.ls-kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:var(--sp-4) var(--sp-5)}
.ls-kgrid .k{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.ls-kgrid .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:640;margin-top:4px}
.ls-kgrid .v.txt{font-family:var(--sans)}
.ls-kgrid .x{font-size:var(--fs-10);color:var(--faint);margin-top:3px;line-height:1.5}
.card-head b{font-size:15px}
.note .ls-b{font-weight:700;display:inline}
.note{font-size:12.5px;line-height:1.6}
.btn.blocked{background:var(--card-2);border-style:dashed;color:var(--faint);cursor:not-allowed}
.btn.blocked:hover{background:var(--card-2)}
.ls-why{display:flex;gap:6px;margin-top:6px;font-size:11px;color:var(--faint);line-height:1.5}
.ls-why .sg{flex:none}
.ls-ro{min-height:var(--ctrl-h);display:flex;align-items:center;padding:0 12px;border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);background:var(--card-2);font-family:var(--mono);color:var(--muted);font-size:12.5px}
.ls-tbl tbody td{padding:13px 11px}
.ls-tbl thead th{padding:10px 11px}
.ls-tbl .cell-sub{font-size:10.5px;margin-top:3px;color:var(--faint);line-height:1.45}

/* ---- 详情页操作区（承接 WS-324 v1.3 6.5.5 三段式 / WS-326 v2.0 的第②段样式）---- */
.ls-flow4{display:flex;flex-direction:column;gap:2px}
.ls-flow4 .fs{padding:11px 0;border-bottom:1px dashed var(--border)}
.ls-flow4 .fs:last-child{border-bottom:0}
.ls-flow4 .fs .t{font-size:12.5px;font-weight:640;color:var(--muted);display:flex;align-items:center;gap:8px}
.ls-flow4 .fs .t .no{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);flex:none;
  display:grid;place-items:center;font-size:var(--fs-10);font-weight:660;color:var(--faint);background:var(--bg-elev)}
.ls-flow4 .fs.done .t .no{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.ls-flow4 .fs.now .t{color:var(--text)}
.ls-flow4 .fs.now .t .no{background:var(--accent);border-color:var(--accent);color:#fff}
.ls-flow4 .fs .x{font-size:11.5px;color:var(--faint);line-height:1.55;padding-left:28px;margin-top:4px}
.ls-flow4 .fs .fa{margin:10px 0 0 28px}
.ls-flow4 .fs .fa .btn+.btn{margin-left:8px}

/* ---- 第③段「还款流程」：按 FP-28 需求编号切换 + 最近一笔还款核心信息（D-RP-66 / D-RP-74）----
   ⚠️ 这个切换与抽屉内按 D-RP-22 的期次排序**不是同一个**：这里选"哪一轮需求"，
   进抽屉后选"这一轮里哪一期"。两者并存、互不替代。 */
.rp-seg3{padding:11px 0 0}
.rp-seg3 .dm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.rp-seg3 .dm .lb{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.rp-seg3 .core{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);padding:11px 12px}
.rp-seg3 .core .r{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.rp-seg3 .core .r:last-child{border-bottom:0}
.rp-seg3 .core .r s{text-decoration:none;color:var(--muted);flex:none}
.rp-seg3 .core .r b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:640;text-align:right}
.rp-seg3 .core .r b.txt{font-family:var(--sans);min-width:0}
/* 英文状态名比中文长得多（"Awaiting repayment confirmation" 30 字符），
   而第③段在 300px 的右栏里。公共 .pill 是 nowrap，放任它会把整页撑出横向滚动条——
   这里只在本段内允许它折行，不动公共组件。 */
.rp-seg3 .core .r b .pill{white-space:normal;text-align:right;height:auto;min-height:20px;
  padding:2px 9px;line-height:1.4;border-radius:var(--radius-xs)}
.rp-seg3 .core .r s{min-width:0;overflow-wrap:anywhere}

/* ============================================================
   第二段：承载单元 —— 右侧抽屉 760px（D-RP-71 / D-RP-72 / D-RP-76）
   公共 .drawer 是 440px（PRD 面板用），这里用模块修饰类放到 760，
   与 WS-325 / WS-326 的承载单元同一个数、不分档（D-LN-57）。
   ============================================================ */
.drawer.u{width:min(760px,92vw);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.u .drawer-h{padding:12px 18px;gap:12px;align-items:flex-start}
.drawer.u .drawer-h b{flex:1;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:15px}
.drawer.u .drawer-h .sb{font-size:11.5px;font-weight:500;color:var(--faint);font-family:var(--mono)}
.drawer.u .drawer-b{padding:0;font-size:13.5px;line-height:1.55}
/* 抽屉底部动作条：公共层没有 drawer footer，沿用 WS-326 新起的这个类，不动公共组件 */
.u-foot{display:flex;align-items:center;gap:var(--sp-2);padding:11px 18px;border-top:1px solid var(--border);
  background:var(--bg-elev);flex-wrap:wrap}
.u-foot .sp{flex:1;min-width:8px}
.u-foot .note{font-size:10.5px;color:var(--faint);flex-basis:100%;line-height:1.45;margin:1px 0 0}
.u-sec{padding:15px 18px;border-bottom:1px solid var(--border)}
.u-sec:last-child{border-bottom:0}
.u-sec.tint{background:var(--card-2)}
.u-sec>.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.u-sec>.sh b{font-size:13px;font-weight:680}
.u-sec>.sh .c{font-size:11px;color:var(--faint);margin-left:auto;text-align:right;line-height:1.45}
.btn.link{background:transparent;border-color:transparent;color:var(--muted);padding:0 9px}
.btn.link:hover{background:var(--card-hover);color:var(--text)}
/* 抽屉内固定顶栏：计息规则条与版本标识不随表体滚走（D-RP-72 ②） */
.u-fixed{position:sticky;top:0;z-index:3;background:var(--bg-elev);border-bottom:1px solid var(--border);
  padding:12px 18px}
.u-scroll{overflow:auto}
.seg-mini{display:flex;gap:2px;background:var(--card-2);border:1px solid var(--border);
  border-radius:var(--radius-pill);padding:2px;flex:none}
.seg-mini button{appearance:none;border:0;background:transparent;font:inherit;font-size:10.5px;
  padding:3px 9px;border-radius:var(--radius-pill);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg-mini button[aria-pressed="true"]{background:var(--bg-elev);color:var(--text);font-weight:640;box-shadow:var(--shadow)}
.seg-mini button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* —— 二次确认弹窗必须叠在抽屉之上（D-RP-76）——
   公共层 .mask 是 z-index 200，而 .drawer-scrim 是 205、.drawer 是 210，且 shell 把抽屉渲染在
   弹窗**之后**：抽屉开着时弹窗会被抽屉与它的遮罩盖住、整个点不到。
   这里用**模块作用域的修饰类**把本模块的弹窗抬到 220（高于 .drawer 的 210），
   **不改公共组件的默认值**。已作为公共层缺陷回报（README §6 第 4 条）。 */
.mask.rp-top{z-index:220}

/* ============================================================
   第三段：沿用 WS-326 招牌件的四个类（形状复用、文案按本模块重写）
   ============================================================ */

/* —— 还款确认时限条（RM-15 ~ RM-17 / D-RP-52 ~ D-RP-54）——
   与放款确认时限条同形同口径：到点只提醒，状态、额度、权限、逾期天数一个不动，
   因此超期态走中性灰而不是告警色。 */
.ln-cd{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);padding:13px}
.ln-cd.soon{border-color:var(--warn-border);background:var(--warn-bg)}
.ln-cd.over{border-color:var(--border-strong);background:var(--gray-bg)}
.ln-cd .by{font-size:12px;line-height:1.6;color:var(--muted)}
.ln-cd .by b{color:var(--text);font-weight:660}
.ln-cd .big{display:flex;align-items:baseline;gap:4px 8px;margin-top:8px;flex-wrap:wrap}
.ln-cd .big .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;
  letter-spacing:-.03em;line-height:1.05;color:var(--text);white-space:nowrap}
.ln-cd.soon .big .v{color:var(--warn)}
.ln-cd.over .big .v{color:var(--gray-fg)}
.ln-cd .big .u{font-size:11.5px;color:var(--faint)}
.ln-cd .bar{display:flex;height:8px;margin-top:10px;border-radius:5px;overflow:hidden;
  background:var(--track);border:1px solid var(--border)}
.ln-cd .bar .el{background:rgba(139,148,166,.28)}
.ln-cd .bar .rm{background:var(--accent)}
.ln-cd.soon .bar .rm{background:var(--warn)}
.ln-cd.over .bar .rm{background:var(--border-strong)}
.ln-cd .scale{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-10);color:var(--faint);margin-top:5px}
.ln-cd .scale b{font-family:var(--mono);color:var(--muted);font-weight:620}
.ln-cd .ways{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:11px;line-height:1.6}
.ln-cd .ways .w{display:flex;gap:7px;color:var(--muted)}
.ln-cd .ways .w+.w{margin-top:5px}
.ln-cd .ways .w i{flex:none;font-style:normal;font-family:var(--mono);color:var(--faint)}
.ln-cd .ways .w b{color:var(--text);font-weight:660}

/* —— 中性标记条（RP-11 / RM-17 / FD-44 / D-FIN-47 / D-RP-24）——
   已逾期 N 天 · 已超过还款确认时限 N 天 · 已到期存量处理中 · 还款计划生成中：
   一律中性灰。逾期在本期**没有任何金额后果**，做成红色警示就是给一个平台兑现不了的威慑；
   PRD D-RP-24 / 6.6.2 也直接写明逾期用中性标记。.day 是这里唯一的加重。 */
.ln-mark{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--gray-bg);padding:11px 13px}
.ln-mark+.ln-mark{margin-top:var(--sp-3)}
.ln-mark .tg{flex:none;font-size:var(--fs-10);font-weight:700;letter-spacing:.04em;color:var(--gray-fg);
  border:1px solid var(--border-strong);background:var(--bg-elev);border-radius:var(--radius-xs);padding:3px 8px;
  margin-top:1px}
.ln-mark .bd{flex:1;min-width:0;font-size:12px;line-height:1.6;color:var(--muted)}
.ln-mark .bd b{color:var(--text);font-weight:660}
.ln-mark .bd .mt{font-size:10.5px;color:var(--faint);margin-top:4px}
.ln-mark .bd .day{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}

/* —— 客服邮箱卡（D-RP-55）：本期还款异议的唯一入口，三处必须出现 —— */
.ln-mail{border:1px solid var(--accent-border);background:var(--accent-soft);border-radius:var(--radius-sm);padding:13px 14px}
.ln-mail .mh{font-size:13px;font-weight:680}
.ln-mail .ad{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-top:10px;
  border:1px dashed var(--accent-border);background:var(--bg-elev);border-radius:var(--radius-xs);padding:8px 11px}
.ln-mail .ad .em{font-family:var(--mono);font-size:12.5px;font-weight:640;overflow-wrap:anywhere}
.ln-mail .ad .btn{margin-left:auto}
.ln-mail p{margin:10px 0 0;font-size:11px;color:var(--muted);line-height:1.6}
.ln-mail p b{color:var(--text);font-weight:640}

/* —— 还款时间 / 提交时间并列（RM-05 vs RM-06，D-FIN-21）—— */
.ln-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:var(--sp-3)}
.ln-pair .t{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);padding:11px 12px}
.ln-pair .t.auth{border-color:var(--accent-border);background:var(--accent-soft)}
.ln-pair .t .k{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.ln-pair .t .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-14);font-weight:660;margin-top:5px}
.ln-pair .t .src{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.ln-pair .t .src b{color:var(--text);font-weight:640}

/* —— 交易哈希 + 链 + 区块浏览器（RM-08 / RM-09 / RM-13 / D-RP-43 / AC-RP-10）——
   链是常量 ETH：只展示、不录入、不给任何选择控件。链接常驻「平台未核验」。 —— */
.ln-hash{border:1px solid var(--hash-border);background:var(--hash-bg);border-radius:var(--radius-sm);padding:12px 13px}
.ln-hash .hv{font-family:var(--mono);font-size:12px;color:var(--hash-text);overflow-wrap:anywhere;line-height:1.6}
.ln-hash .meta{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
.ln-hash .meta b{color:var(--text);font-weight:640}
.ln-hash .lk{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--hash-border)}
.ln-hash .lk .nv{font-size:11px;color:var(--warn);font-weight:620}

/* —— 两个维度的递减牌（AC-FIN-36 / D-RP-36 / D-RP-37）——
   WS-326 四量转移牌的反向：还款侧**只有含本金的期次结清才递减**，
   利息期结清时四格全是「不变」。类名沿用，不新造一个同形的。 —— */
.ln-xfer{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-elev);overflow:hidden}
.ln-xfer .xh{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--border);
  font-size:12px;font-weight:660;background:var(--card-2)}
.ln-xfer .xh .at{margin-left:auto;font-family:var(--mono);font-size:var(--fs-10);color:var(--faint);font-weight:600}
.ln-xfer .dim{padding:11px 13px}
.ln-xfer .dim+.dim{border-top:1px solid var(--border)}
.ln-xfer .dim>.dn{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.ln-xfer .qr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--sp-3);margin-top:8px}
.ln-xfer .q{border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card-2);padding:9px 10px}
.ln-xfer .q.in{border-color:var(--accent-border);background:var(--accent-soft)}
.ln-xfer .q .nm{font-size:11.5px;font-weight:660}
.ln-xfer .q .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-14);
  font-weight:660;margin-top:5px;letter-spacing:-.02em}
.ln-xfer .q .v s{text-decoration:line-through;color:var(--faint);font-weight:500;margin-right:6px}
.ln-xfer .q .x{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.ln-xfer .ar{font-family:var(--mono);color:var(--accent);font-size:var(--fs-16);text-align:center}
.ln-xfer .xf{padding:10px 13px;border-top:1px solid var(--border);background:var(--card-2);
  font-size:11px;color:var(--muted);line-height:1.6}
.ln-xfer .xf b{color:var(--text);font-weight:660}
.ln-xfer.still .q{background:var(--card-2);border-color:var(--border)}
.ln-xfer.still .ar{color:var(--faint)}
@media (max-width:620px){
  .ln-xfer .qr{grid-template-columns:1fr}
  .ln-xfer .ar{transform:rotate(90deg)}
}

/* —— 原型注解：反向清单与口径说明不是产品界面的一部分。标出来让读者一眼分清
       "页面本身"与"对页面的说明"，禁用字样的全文检索也能据此排除。 —— */
.ln-annot{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);background:var(--card-2);
  padding:11px 13px;font-size:11px;color:var(--muted);line-height:1.6}
.ln-annot b{color:var(--muted);font-weight:680}

/* ============================================================
   第四段：本模块的五个招牌件（形状与设计意图沿用 v1.0，适配 760 抽屉）
   ============================================================ */

/* —— 招牌件 A（**V3.4 退役**）：两版计划对照 .rp-vs / .rp-ver / .rp-why ——
   需求方 09-15 09:35 定「查看还款计划只查看定稿版即可」，两版同屏对照取消（D-RP-80），
   初始版收敛回报价环节（见 WS-325 原型的 initialPlanCard）。样式一并删除，不留死代码。
   ⚠️ 业务规则一条没改：报价期仍要拟定初始计划、放款确认后仍按实际放款日重算定稿并锁死；
   定稿通知里的新旧对比也仍然保留——取消对照表 ≠ 取消告知。 */

/* —— 招牌件 B：两条轴（D-FIN-11 / D-RP-29 / D-RP-30 / AC-RP-09）——
   上轴「时间的停止」停在提交时刻，下轴「状态的终结」停在确认时刻。
   两轴终点在横向位置上刻意不对齐——它们本来就不是同一个时刻。 */
.rp-freeze{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-elev);overflow:hidden}
.rp-freeze .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 13px;
  border-bottom:1px solid var(--border);background:var(--card-2);font-size:12px;font-weight:660}
.rp-freeze .fh .at{margin-left:auto;font-family:var(--mono);font-size:var(--fs-10);color:var(--faint);font-weight:600}
.rp-ax{padding:11px 13px}
.rp-ax+.rp-ax{border-top:1px solid var(--border)}
.rp-ax .an{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rp-ax .an .t{font-size:12px;font-weight:680}
.rp-ax .an .s{font-size:10.5px;color:var(--faint)}
.rp-ax .track{display:flex;align-items:stretch;margin-top:9px;border:1px solid var(--border);
  border-radius:var(--radius-xs);overflow:hidden;background:var(--card-2)}
.rp-ax .seg2{flex:1;min-width:0;padding:8px 9px;border-right:1px solid var(--border)}
.rp-ax .seg2:last-child{border-right:0}
.rp-ax .seg2.on{background:var(--accent-soft)}
.rp-ax .seg2.stop{background:var(--gray-bg)}
.rp-ax .seg2 .sk{font-size:var(--fs-10);color:var(--faint);letter-spacing:.04em;text-transform:uppercase;
  overflow-wrap:anywhere}
.rp-ax .seg2 .sv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:660;
  margin-top:4px;overflow-wrap:anywhere}
.rp-ax .seg2 .sx{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.rp-ax .mark2{display:flex;gap:5px;margin-top:8px;font-size:11px;color:var(--muted);line-height:1.55}
.rp-ax .mark2 i{flex:none;font-style:normal;font-family:var(--mono);color:var(--accent)}
.rp-ax .mark2 b{color:var(--text);font-weight:660}
.rp-freeze .ff{padding:11px 13px;border-top:1px solid var(--border-strong);background:var(--card-2);
  font-size:11.5px;color:var(--muted);line-height:1.65}
.rp-freeze .ff b{color:var(--text);font-weight:680}
@media (max-width:620px){
  .rp-ax .track{flex-direction:column}
  .rp-ax .seg2{border-right:0;border-bottom:1px solid var(--border)}
  .rp-ax .seg2:last-child{border-bottom:0}
}

/* —— 招牌件 C：期次选择器（D-RP-21 ~ D-RP-26 / 6.6.2）——
   三组：已逾期 / 待还款·已开窗 / 待还款·未开窗（可见不可选）。
   排序键写在每一行上，因为 D-RP-22 的排序结果必须可核对。
   ⚠️ 换选期次是可逆的、零后果：就地切换，**不为此再开一层**（D-RP-76）。 */
.rp-sel{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-elev);overflow:hidden}
.rp-grp{border-bottom:1px solid var(--border)}
.rp-grp:last-child{border-bottom:0}
.rp-grp>.gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;background:var(--card-2);
  font-size:var(--fs-10);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-fg);
  border-bottom:1px solid var(--border)}
.rp-grp>.gh .n{margin-left:auto;font-family:var(--mono);letter-spacing:0;font-weight:600;color:var(--faint)}
.rp-opt{display:flex;align-items:flex-start;gap:var(--sp-3);width:100%;text-align:left;appearance:none;
  font:inherit;background:var(--bg-elev);border:0;border-bottom:1px solid var(--border);padding:10px 12px;
  cursor:pointer;color:var(--text);transition:background var(--dur-fast) var(--ease-out)}
.rp-opt:last-child{border-bottom:0}
.rp-opt:hover{background:var(--card-hover)}
.rp-opt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rp-opt[aria-pressed="true"]{background:var(--accent-soft)}
.rp-opt[aria-disabled="true"]{cursor:not-allowed;background:var(--card-2);color:var(--faint)}
.rp-opt[aria-disabled="true"]:hover{background:var(--card-2)}
.rp-opt .ix{flex:none;width:20px;font-family:var(--mono);font-size:10.5px;color:var(--faint);padding-top:2px}
.rp-opt[aria-pressed="true"] .ix{color:var(--accent);font-weight:700}
.rp-opt .ob{flex:1;min-width:0}
.rp-opt .o1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:12px}
.rp-opt .o1 .dt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.rp-opt .o1 .dl{color:var(--muted)}
.rp-opt .o2{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.rp-opt .o2 .key{font-family:var(--mono);color:var(--muted)}
.rp-opt .oa{flex:none;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;font-weight:660;padding-top:1px}
.rp-opt .oa .oc{display:block;font-size:10px;color:var(--faint);font-weight:500;margin-top:2px}
.rp-opt .blk{flex:none;font-family:var(--mono);color:var(--faint);padding-top:2px}
@media (max-width:560px){
  .rp-opt{flex-wrap:wrap}
  .rp-opt .oa{text-align:left;padding-top:6px}
}

/* —— 招牌件 D：五个拦截点（6.2.2 / D-RP-25 / AC-RP-07）——
   「不允许提前还款」如果只写一句话而入口常开，等于没拦。 */
.rp-stop{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--sp-3)}
.rp-stop .s{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);padding:10px 11px}
.rp-stop .s .sn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:660}
.rp-stop .s .sn i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--accent);
  border:1px solid var(--accent-border);background:var(--accent-soft);border-radius:var(--radius-pill);
  width:18px;height:18px;display:grid;place-items:center;flex:none}
.rp-stop .s .sx{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:6px}
.rp-stop .s .sx b{color:var(--text);font-weight:640}

/* —— 招牌件 E：计息规则常驻条（RP-18 / D-RP-16 ~ D-RP-20 / AC-RP-04）——
   ACT/360 让「年化利率 × 整年」实际略高于名义利率，因此规则全文常驻、不折叠、
   不只给一个百分数；在计划抽屉里它固定在顶部，不随表体滚走（D-RP-72 ②）。 */
.rp-rule{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--card-2);padding:10px 12px}
.rp-rule .rt{font-family:var(--mono);font-size:11.5px;font-weight:640;line-height:1.65;overflow-wrap:anywhere}
.rp-rule .rt b{color:var(--accent);font-weight:700}
.rp-rule .rx{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3);margin-top:9px;
  padding-top:9px;border-top:1px dashed var(--border)}
.rp-rule .rx .i .k{font-size:var(--fs-10);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.rp-rule .rx .i .v{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.rp-rule .rx .i .v b{color:var(--text);font-weight:640}
.rp-rule .td{font-size:var(--fs-10);color:var(--faint);margin-top:8px;line-height:1.5}

/* ---- 第③段：编号选择器（一个，不是两级筛选，D-RP-78）与最近一笔应还卡片 ---- */
.rp-block{border-color:var(--accent-border)}
.rp-block>.card-head{background:var(--accent-soft);border-bottom-color:var(--accent-border)}
.rp-pick{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elev);
  overflow:hidden;margin-bottom:11px}
.rp-pick .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;
  background:var(--card-2);border-bottom:1px solid var(--border)}
.rp-pick .ph .lb{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase;flex:none}
.rp-pick .ph .inp.sm{height:var(--ctrl-h-sm);font-size:11.5px;flex:1;min-width:120px}
.rp-po{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;appearance:none;font:inherit;
  background:var(--bg-elev);border:0;border-bottom:1px solid var(--border);padding:9px 10px;cursor:pointer;
  color:var(--text);transition:background var(--dur-fast) var(--ease-out)}
.rp-po:last-of-type{border-bottom:0}
.rp-po:hover{background:var(--card-hover)}
.rp-po:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rp-po[aria-pressed="true"]{background:var(--accent-soft)}
.rp-pick .pb{flex:1;min-width:0}
.rp-pick .p1{display:block;font-family:var(--mono);font-size:12px;font-weight:700;overflow-wrap:anywhere}
.rp-pick .p2{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px;
  overflow-wrap:anywhere}
.rp-pick .p3{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.rp-pick .pa{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
  font-weight:660;padding-top:1px}
.rp-pick .pe{padding:12px 10px;font-size:11.5px;color:var(--faint)}
.rp-pick .px{margin:0;padding:8px 10px;border-top:1px solid var(--border);background:var(--card-2);
  font-size:10.5px;color:var(--muted);line-height:1.55}
.rp-pick .px b{color:var(--text);font-weight:640}
/* 只有一笔时：仍展示编号，但不给选择控件——没得选就别给控件 */
.rp-pick.one{padding:9px 10px;background:var(--card-2)}
.rp-seg3 .core .r b .sc{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);
  font-weight:500;margin-top:2px}

/* ---- 计划抽屉的标题区（按选定笔收敛，D-RP-81 ①）---- */
.rp-title .t1{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.rp-title .t2{font-size:12.5px;font-weight:660;color:var(--accent);margin-top:2px}
.rp-title .t3{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;overflow-wrap:anywhere}
.rp-only{margin:8px 0 10px;font-size:10.5px;color:var(--muted);line-height:1.55}
.rp-only b{color:var(--text);font-weight:640}

/* ---- 计划表的行内展开（本息拆分与计息区间；收起 ≠ 移除，AC-RP-04）---- */
.rp-plan .col-x{width:34px;text-align:center}
.rp-plan tbody tr.xr td{background:var(--card-2);padding:10px 11px}
.rp-plan .xg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3)}
.rp-plan .xg .k{display:block;font-size:var(--fs-10);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.rp-plan .xg .v{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
  font-weight:640;margin-top:3px}
.rp-plan .xn{margin:8px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
/* 当前应还期次：精简之后最该突出的一行（D-RP-72 ③） */
.rp-plan tbody tr.cur td{background:var(--accent-soft);font-weight:640}
.rp-plan tbody tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent);background:#EDF1FE}

/* ---- 原型说明件卡：两条轴与五个拦截点从抽屉移出后的落点，**不属于生产界面** ---- */
.ln-annot-card{border-style:dashed;border-color:var(--border-strong);background:var(--card-2)}
.ln-annot-card>.card-head b{color:var(--muted)}

/* —— 计划表的行修饰：末期、逾期、当前选中。只做底色与左缘，不换字号 ——
   表头与期次序号列固定（D-RP-72 ①）。 */
.rp-plan{position:relative}
/* D-RP-72 ①：高度受限时整体纵向滚动，**表头与期次序号列固定**。
   期次序号列是横向滚动时唯一还能认出"这是第几期"的锚，跟表头一样不能滚走。 */
.rp-plan thead th{position:sticky;top:0;z-index:2;background:var(--card-2)}
.rp-plan thead th:first-child{left:0;z-index:4}
.rp-plan tbody td:first-child,.rp-plan tfoot td:first-child{position:sticky;left:0;z-index:1;
  background:var(--card)}
.rp-plan tbody tr.last td:first-child{background:#EDF1FE}
.rp-plan tbody tr.cur td:first-child{background:var(--card-hover)}
.rp-plan tfoot td:first-child{background:var(--card-2)}
.rp-plan tbody tr.last td{background:var(--accent-soft)}
.rp-plan tbody tr.last td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rp-plan tbody tr.odue td:first-child{box-shadow:inset 3px 0 0 var(--border-strong)}
.rp-plan tbody tr.cur td{background:var(--card-hover)}
.rp-plan tfoot td{padding:10px 11px;border-top:1px solid var(--border-strong);font-weight:660;
  font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--card-2)}
.rp-plan tfoot td.lb{font-family:var(--sans);font-weight:640}
.rp-plan .sub{font-size:10px;color:var(--faint);margin-top:2px;line-height:1.4;font-family:var(--sans);
  font-weight:400;letter-spacing:0}
.rp-wrap{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}

/* —— 只读带出的机构还款收款账户（RP-14 / RM-10 / D-FIN-24）——
   来源是 WS-326 放款时登记的 LN-15（法币，含中转行）/ LN-16（数币，绑定钱包）。
   这里**没有输入框**，不是置灰的输入框：可改就等于给了钓鱼的口子。 —— */
.rp-acct{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);background:var(--card-2);padding:11px 12px}
.rp-acct .ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--sp-3) var(--sp-4)}
.rp-acct .ag .k{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.rp-acct .ag .v{font-family:var(--mono);font-size:11.5px;font-weight:640;margin-top:3px;overflow-wrap:anywhere}
.rp-acct .lock{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);
  font-size:10.5px;color:var(--muted);line-height:1.6}
.rp-acct .lock i{flex:none;font-style:normal;font-family:var(--mono);color:var(--faint)}
.rp-acct .lock b{color:var(--text);font-weight:660}

/* —— 还款记录只读栏（RM-01 ~ RM-18 的读值形态）—— */
.ln-rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--sp-3) var(--sp-4)}
.ln-rec .k{font-size:var(--fs-10);color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.ln-rec .v{font-size:12.5px;font-weight:640;margin-top:3px;overflow-wrap:anywhere}
.ln-rec .v.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ln-rec .x{font-size:var(--fs-10);color:var(--faint);margin-top:3px;line-height:1.5}

@media (max-width:980px){
  .portal-cols{grid-template-columns:minmax(0,1fr)}
  .portal-rail{position:static}
}
/* 公共 .btn / .inp / .check 已带全套状态，本模块不覆盖。
   本模块唯一的自有动效是期次选项与 seg-mini 的底色过渡。 */
@media (prefers-reduced-motion:reduce){ .rp-opt{transition:none} }
</style>
</head>
<body>
<!-- 面客顶栏版式（继承 4.3）。公共运行时要求的挂载点一个不少。
     语言默认 EN（WS-324 D-LS-15），中文由顶栏语言开关切换。
     承载：做事走 #layers 里的右侧抽屉 760px，提示走居中弹窗 560px，同一时刻只有一层。 -->
<div class="portal" id="app" hidden>
 <header class="portal-head">
  <div class="brand"><div class="brand-mark">FS</div><div>
   <div class="brand-name" data-brand>Financial Services</div>
   <div class="brand-sub" id="brandSub"></div></div></div>
  <nav class="portal-nav" id="nav" aria-label="Main navigation"></nav>
  <div class="portal-tools" id="topRight"></div>
 </header>
 <div class="portal-sub"><div class="portal-sub-in" id="crumb"></div></div>
 <main class="portal-main"><div class="portal-wrap" id="content"></div></main>
</div>
<div class="focus" id="focus"></div>
<div id="layers"></div>
<script src="../_shared/registry.js"></script>
<script src="../../../asset-platform/prototypes/_shared/shell.js"></script>
<script src="./rp-module.js"></script>
</body>
</html>
