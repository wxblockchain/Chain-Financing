/* ---- 协议管理专有：定时生效失败的行内提示（E-10）---- */
/* 与 .cell-note 是两个类：一个是「将要生效」的预告，一个是「没能生效」的故障。 */
.cell-fail{font-size:10.5px;color:var(--danger);font-weight:620;line-height:1.5;margin-top:3px;white-space:normal}

/* ---- 协议管理专有：当前生效版本的行状态 ---- */
table.tbl tbody tr.is-active-ver td{background:var(--accent-soft)}
table.tbl tbody tr.is-active-ver:hover td{background:var(--accent-soft)}
table.tbl.wide tbody tr.is-active-ver td.col-act,
table.tbl.wide tbody tr.is-active-ver:hover td.col-act{background:var(--accent-soft)}
</style>
<style>
/* Module additions only; canonical tokens/base are inlined by build.py. */
.review-controls{margin-bottom:var(--sp-4);color:var(--muted);font-size:var(--fs-11)}
.review-controls>summary{cursor:pointer;padding:var(--sp-2) 0;width:fit-content}
.review-controls .statebar{margin-top:var(--sp-2)}
.review-controls .seg{flex-wrap:wrap}
.statebar{flex-wrap:wrap}
.statebar .seg{flex-wrap:wrap}
.ag-sample{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:var(--fs-12);line-height:1.8;padding:var(--sp-4);margin:0;background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.ag-pdf{width:100%;height:360px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.ag-toolrow{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin:var(--sp-3) 0}
.ag-clock{font-family:var(--mono);font-size:var(--fs-11);color:var(--muted)}
.ag-clock select{max-width:150px}
.ag-readonly{display:inline-flex;align-items:center;gap:var(--sp-2)}
.ag-events{margin-top:var(--sp-4)}
.ag-events pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:var(--fs-11)}
.ag-navtoggle{display:none}
.ag-upload-note{margin-top:var(--sp-2)}
.rowacts{align-items:flex-start}
html[data-ag-review] table.tbl.wide thead th.col-act{white-space:nowrap}
html[data-ag-review] .pill.dash,html[data-ag-review] .tab:not([aria-selected=true]),html[data-ag-review] .c-time .t2{color:var(--muted)}
.actlink{white-space:normal}
.drawer [role=dialog]{max-width:100%}
html[data-ag-review] .faint,html[data-ag-review] .tiny,html[data-ag-review] .hint,html[data-ag-review] .cell-sub,html[data-ag-review] .tbl thead th{color:var(--muted)}
html[data-ag-review] .dl dd,html[data-ag-review] .vsum .v{overflow-wrap:anywhere}
html[data-ag-review] .btn,html[data-ag-review] .inp,html[data-ag-review] .ta{transition:none}
html[data-ag-review] [data-act=st][aria-pressed=true]{font-weight:700}
@media(max-width:1279px){
 html[data-ag-review] .app{grid-template-columns:minmax(0,1fr)}
 html[data-ag-review] .sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:238px;z-index:90;box-shadow:var(--shadow-lg)}
 html[data-ag-review].nav-open .sidebar{display:flex}
 .ag-navtoggle{display:inline-flex}
 html[data-ag-review] .tbl.wide{min-width:0;display:block}
 html[data-ag-review] .tbl.wide thead{display:none}
 html[data-ag-review] .tbl.wide tbody,html[data-ag-review] .tbl.wide tr{display:block}
 html[data-ag-review] .tbl.wide tr{padding:var(--sp-3);border-bottom:1px solid var(--border)}
 html[data-ag-review] .tbl.wide td{display:grid;grid-template-columns:140px minmax(0,1fr);gap:var(--sp-2);border:0;text-align:left;padding:var(--sp-2);width:auto;position:static;box-shadow:none}
 html[data-ag-review] .tbl.wide td::before{content:attr(data-label);color:var(--muted);font-family:var(--sans);font-size:var(--fs-11)}
 html[data-ag-review] .tbl.wide td>div+div{grid-column:2}
 html[data-ag-review] .tablewrap{overflow:visible}
 html[data-ag-review] .fgrid,html[data-ag-review] .vsum{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
 html[data-ag-review] .content{padding:var(--sp-4)}
 html[data-ag-review] .topbar,html[data-ag-review] .crumbbar{padding:var(--sp-3) var(--sp-4)}
 html[data-ag-review] .topbar-right{gap:var(--sp-2)}
 html[data-ag-review] .acc .nm{max-width:100px;overflow:hidden;text-overflow:ellipsis}
 html[data-ag-review] .page-head,html[data-ag-review] .demobar{flex-direction:column;align-items:flex-start}
 html[data-ag-review] .dl{grid-template-columns:minmax(0,1fr)}
 html[data-ag-review] .card-head,html[data-ag-review] .pager,html[data-ag-review] .pager .right,html[data-ag-review] .sec-head,html[data-ag-review] .filecard,html[data-ag-review] .radios{flex-wrap:wrap}
 html[data-ag-review] .fl-date{flex-wrap:wrap}
 html[data-ag-review] .tbl.wide td{grid-template-columns:100px minmax(0,1fr)}
 html[data-ag-review] .btn,html[data-ag-review] .actlink,html[data-ag-review] .ico{min-height:44px}
 html[data-ag-review] .modal-f{flex-wrap:wrap}
}

    if(f.scen.length) p.push("scen="+f.scen.join(","));

/* 新建 / 继续编辑草稿：已有草稿则不生成第二个（7.3.2 / AC-AG-29） */
function newVersion(){
  var a=cur(), d=verOf(a,"draft");
  if(d){ openEditor(a,d); return; }
  var act=verOf(a,"active"), no=nextNo(a);
  var v={no:no, st:"draft", vid:"ver_new"+no, mode:"immediate", effAt:null, arcAt:null,
         file:act?{name:act.file.name.replace(/v\d+/,no),size:act.file.size,ext:act.file.ext}:null,
         hash:null, note:{en:"",zh:""}, src:null, rec:false, by:"a", at:new Date(nowMs()).toISOString()};
  a.versions.push(v);
  addLog(a,"create",no,
    act?("Created draft "+no+" from the active version "+act.no+".") :("Created draft "+no+" from scratch."),
    act?("以当前生效版本 "+act.no+" 为基础创建草稿 "+no+"。"):("空白新建草稿 "+no+"。"));
  openEditor(a,v);
}
/* F-47 版本回溯：复制历史版本文件生成版本号更大的新草稿 */
function rollback(no){
  var a=cur(), src=verNo(a,no), d=verOf(a,"draft");
  if(d){ toast("danger",t("bContinueDraft"),
      L("This agreement already has draft "+d.no+". Discard it first.","该协议已有草稿 "+d.no+"，请先处理它。")); return; }
  var nn=nextNo(a);
  var v={no:nn, st:"draft", vid:"ver_new"+nn, mode:"immediate", effAt:null, arcAt:null,
         file:{name:src.file.name.replace(/v\d+/,nn),size:src.file.size,ext:src.file.ext},
         hash:null, note:{en:"Content restored from "+no, zh:"回溯至 "+no+" 的内容"}, src:no, rec:false,
         by:"a", at:new Date(nowMs()).toISOString()};
  a.versions.push(v);
  addLog(a,"rollback",nn,"Created draft "+nn+" from the historical version "+no+".",
         "以历史版本 "+no+" 为基础创建草稿 "+nn+"。");
  openEditor(a,v);
}
function writeBack(){
  var a=cur(), e=ed(), v=verNo(a,e.no);
  var renamed = e.file && e.origFile && e.file.name!==e.origFile;
  v.file=e.file?{name:e.file.name,size:e.file.size,ext:e.file.ext}:null;
  v.mode=e.mode; v.effAt=e.effAt; v.rec=e.rec; v.src=e.src;
  v.note={en:e.note,zh:e.note};
  v.at=new Date(nowMs()).toISOString();
  return {v:v, renamed:renamed};
}
function saveDraft(){
  var a=cur(), e=ed(), r=writeBack();
  if(r.renamed) addLog(a,"replace",e.no,"Replaced file: "+e.origFile+" → "+e.file.name,
                       "替换文件："+e.origFile+" → "+e.file.name);
  addLog(a,"save",e.no,"Saved draft "+e.no+".","保存草稿 "+e.no+"。");
  e.origFile=e.file?e.file.name:null; e.dirty=false;
  render(); toast("success",t("okDraftSaved"));
}
function validatePublish(){
  var a=cur(), e=ed(); e.err={};
  if(!e.file){ e.err.file=t("eNoFile"); }
  if(!e.note.trim()){ e.err.note=t("eNoNote"); }
  else if(e.note.length>500){ e.err.note=t("eNoteTooLong"); }
  if(e.mode==="scheduled"){
    if(!e.effAt) e.err.eff=t("eTooSoon");
    else if(Date.parse(e.effAt)<nowMs()+5*60000) e.err.eff=t("eTooSoon");
  }
  var bad=Object.keys(e.err).length>0;
  if(bad){
    render();
    toast("danger",e.err.file||e.err.note||e.err.eff);
    var id=e.err.file?null:(e.err.note?"f_note":"f_eff");
    if(id){ var n=document.getElementById(id); if(n) n.focus(); }
  }
  return !bad;
}
function doPublish(){
  var a=cur(), e=ed(), sch=verOf(a,"scheduled");
  S.modal=null; S.st="submitting"; render();
  setTimeout(function(){
    var r=writeBack(), v=r.v;
    if(r.renamed) addLog(a,"replace",v.no,"Replaced file: "+e.origFile+" → "+e.file.name,
                         "替换文件："+e.origFile+" → "+e.file.name);
    /* E-06：先把原待生效版本退回草稿并保留文件，再发布新版本，两条动作各记一条记录 */
    if(sch){
      sch.st="draft"; sch.effAt=null; sch.hash=null; sch.mode="immediate";
      addLog(a,"revert",sch.no,"Scheduled version "+sch.no+" was cancelled and returned to draft when "+v.no+" was published.",
             "发布 "+v.no+" 时撤销待生效版本 "+sch.no+"，已退回草稿并保留其文件。");
    }
    v.hash=fakeHash(v.no+v.file.name);
    v.by="a"; v.at=new Date(nowMs()).toISOString();
    if(v.mode==="immediate"){
      var old=verOf(a,"active");
      v.st="active"; v.effAt=new Date(nowMs()).toISOString();
      addLog(a,"publish",v.no,"Published "+v.no+", activate immediately.","发布 "+v.no+"，立即生效。");
      /* 归档由系统在切换时执行，操作人记为「系统 / System」（7.4.4 / AC-AG-53） */
      if(old){ old.st="archived"; old.arcAt=v.effAt;
        addLog(a,"archive",old.no,"Archived "+old.no+" automatically when "+v.no+" took effect.",
               v.no+" 生效时自动归档 "+old.no+"。","sys",v.effAt); }
    } else {
      v.st="scheduled";
      addLog(a,"publish",v.no,"Published "+v.no+", scheduled for "+fmtTime(v.effAt)+".",
             "发布 "+v.no+"，定时生效于 "+fmtTime(v.effAt)+"。");
    }
    S.editor=null; S.st="default"; S.page="P-O-AG-02"; S.tab="versions";
    render(); syncURL(); toast("success",t("okPublished"));
  },520);
}
function fakeHash(seed){
  var h=0, out="";
  for(var i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  for(var j=0;j<64;j++){ h=(h*1103515245+12345)>>>0; out+="0123456789abcdef"[h>>>28]; }
  return out;
}
/* 模拟到点生效：系统自动切换，操作人记为「系统 / System」（AC-AG-53） */
function simulateActivation(){
  var a=cur(), sch=verOf(a,"scheduled"); if(!sch) return;
  var old=verOf(a,"active");
  sch.st="active";
  if(old){ old.st="archived"; old.arcAt=sch.effAt;
    addLog(a,"archive",old.no,"Archived "+old.no+" automatically when "+sch.no+" took effect.",
           sch.no+" 生效时自动归档 "+old.no+"。","sys",sch.effAt); }
  addLog(a,"activate",sch.no,sch.no+" took effect at the scheduled time.",
         sch.no+" 到达生效时间后自动生效。","sys",sch.effAt);
  S.st="default"; render();
  toast("success",L("Scheduled activation completed.","定时生效已完成。"),
        L("The previous active version was archived automatically.","原生效版本已自动归档。"));
}
function discardDraft(){
  var a=cur(), d=verOf(a,"draft"); if(!d) return;
  a.versions=a.versions.filter(function(v){return v!==d;});
  addLog(a,"discard",d.no,"Discarded draft "+d.no+".","丢弃草稿 "+d.no+"。");
  S.modal=null; S.editor=null; S.page="P-O-AG-02"; S.tab="versions"; render(); syncURL();
  toast("success",L("Draft discarded.","草稿已丢弃。"));
}
function cancelScheduled(force){
  var a=cur(), sch=verOf(a,"scheduled"), d=verOf(a,"draft");
  if(!sch) return;
  if(d&&!force){ S.modal={type:"overwrite"}; render(); return; }
  if(d){ a.versions=a.versions.filter(function(v){return v!==d;});
    addLog(a,"discard",d.no,"Draft "+d.no+" was replaced by the cancelled scheduled version "+sch.no+".",
           "草稿 "+d.no+" 被退回的待生效版本 "+sch.no+" 覆盖。"); }
  sch.st="draft"; sch.effAt=null; sch.hash=null; sch.mode="immediate";
  addLog(a,"cancel",sch.no,"Cancelled the scheduled version "+sch.no+". It returned to draft and kept its file.",
         "撤销待生效版本 "+sch.no+"，已退回草稿并保留其文件。");
  S.modal=null; render();
  toast("success",L("Scheduled version cancelled.","待生效版本已撤销。"));
}

/* ================================ 交互 =================================== */
/* 模块自己的动作；返回 true 表示已处理，shell 不再接管。
   公共动作（menu / lang / openPrd / closeDrawer / toastClose / Esc）都在 shell 里。 */
function onAct(n,a,v,e){
  if(n.classList.contains("mask")&&e.target!==n) return true;
  if(a==="msel") return true;                             /* 复选框走 change */
  /* E-10 由状态切换器写进协议数据，好让列表与详情看到同一件事；shell 继续处理 st */
  if(a==="st"&&S.page==="P-O-AG-02"&&cur()) cur().actFail=(v==="actfail");
  if(MINE.indexOf(a)<0) return false;
  e.preventDefault();
  if(S.menu) S.menu=null;
  switch(a){
    case "go": go(v); break;
    case "crumb": go(v,{key:n.getAttribute("data-k")||S.agKey}); break;
    case "st": setState(v); break;
    case "tab": S.tab=v; render(); syncURL(); break;
    case "open": go("P-O-AG-02",{key:v,tab:"overview"}); break;
    case "more": S.more=v||null; render(); break;
    case "moreNote": S.more=(S.more==="note:"+v?null:"note:"+v); render(); break;
    case "sort":
      S.sort = S.sort.col===v ? {col:v,dir:S.sort.dir==="asc"?"desc":"asc"} : {col:v,dir:"desc"};
      render(); syncURL(); break;
    case "search":
      S.applied={kw:S.f.kw,type:S.f.type.slice(),scen:S.f.scen.slice(),status:S.f.status.slice(),
                 from:S.f.from,to:S.f.to};
      S.pg=1; S.st="default"; render(); syncURL(); break;
    case "resetF":
      S.f={kw:"",type:[],scen:[],status:[],from:"",to:""};
      S.applied={kw:"",type:[],scen:[],status:[],from:"",to:""};
      S.pg=1; S.st="default"; render(); syncURL(); break;
    case "mselClear": S.f[n.getAttribute("data-k")]=[]; render(); break;
    case "pg": S.pg=Math.max(1,parseInt(v,10)); render(); syncURL(); break;

    case "newVer": newVersion(); break;
    case "editDraft": openEditor(cur(),verOf(cur(),"draft")); break;
    case "rollback": rollback(v); break;
    case "saveDraft": saveDraft(); break;
    case "askPublish": if(validatePublish()){ S.modal={type:"publish"}; render(); } break;
    case "doPublish": doPublish(); break;
    case "askDiscard": S.modal={type:"discard"}; render(); break;
    case "doDiscard": discardDraft(); break;
    case "askCancelSch": S.modal={type:"cancelSch"}; render(); break;
    case "doCancelSch": cancelScheduled(v==="force"); break;
    case "simAct": simulateActivation(); break;
    case "doLeave":
      var to=S.modal.to, opt=S.modal.opt; S.editor=null; S.modal=null; go(to,opt); break;

    case "upload":
      /* 原型不读取真实文件：点击后按“已选择一个合规文件”呈现 */
      var ag2=cur(), ed2=ed();
      ed2.file={name:ag2.key.replace(/_/g,"-")+"-"+ed2.no+"."+ag2.types[0].toLowerCase(),
                size:"1.9 MB", ext:ag2.types[0]};
      ed2.err.file=""; ed2.dirty=true; S.st="default"; render();
      toast("success",L("File selected.","已选择文件。"),
            L("Prototype: no real file is read or uploaded.","原型不会真的读取或上传文件。"));
      break;
    case "download":
      toast("info",L("Demonstration prototype","演示原型"),
            L("No file is actually downloaded.","不会真的下载文件。")); break;
    case "copy":
      try{ if(navigator.clipboard) navigator.clipboard.writeText(v); }catch(err){}
      toast("success",t("okCopied")); break;
    case "resetDemo": S.data=seedData(); S.editor=null; S.st="default"; render();
      toast("success",L("Demo data reset.","演示数据已重置。")); break;
    case "signout":
      toast("info",L("Sign-out is owned by the account module.","退出登录归账户与登录模块。"),
            L("This module does not re-implement the sign-in flow.","本模块不重复实现登录流程。")); break;

    case "ver": S.ver=v; S.drawer="ver"; render(); break;
    case "close": S.modal=null; render(); break;
  }
  return true;
}
/* 行整体可点：键盘也能进入详情 */
/* Esc 由 shell 统一处理；这里只补行整体可点时的键盘进入 */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){
    var r=e.target.closest&&e.target.closest("tr.rowlink");
    if(r&&e.target===r){ e.preventDefault(); go("P-O-AG-02",{key:r.getAttribute("data-v"),tab:"overview"}); }
  }
});
document.addEventListener("input",function(e){
  var n=e.target.closest("[data-f]"); if(!n) return;
  var k=n.getAttribute("data-f");
  if(k==="kw"||k==="from"||k==="to"){ S.f[k]=n.value; return; }
  var E=ed(); if(!E) return;
  if(k==="note"){ E.note=n.value; E.err.note=""; E.dirty=true; render(); }
  if(k==="eff"){ E.effAt=localInputToIso(n.value); E.err.eff=""; E.dirty=true; }
});
document.addEventListener("change",function(e){

 +(v.file?'<div class="btnbar"><button class="btn" data-act="download">'+t('bDownload')+'</button></div>':'')+'</div></aside>';
};

verActions=function(a,v){return oldVerActions(a,v).replace('data-act="download"','data-act="download" data-v="'+v.no+'"').replace('</div>',v.st==='draft'&&a.enabled?'<button class="actlink" data-act="rowPublish" data-v="'+v.no+'">'+t('bPublish')+'</button></div>':'</div>');};
var oldOverview=tabOverview;
tabOverview=function(a){return oldOverview(a).replace(L('A draft exists but no version has been published yet.','已有草稿，但还没有任何版本发布。'),verOf(a,'scheduled')?L('The first version is scheduled; no version is active yet.','首个版本等待定时生效，当前尚无生效版本。'):L('A draft exists but no version has been published yet.','已有草稿，但还没有任何版本发布。'));};

go=function(page,opt){if(realBusy){toast('info',L('Please wait for the current request.','请等待当前请求完成。'));return;}if(page==='P-O-AG-01')opt=Object.assign({},opt,{key:null});initialGo(page,opt);document.documentElement.classList.remove('nav-open');};
readURL=function(){
 if(S.editor&&S.editor.dirty){if(!window.confirm(L('Leave and discard unsaved changes?','离开并放弃未保存的修改？'))){syncURL();return false;}S.editor=null;}
 var raw=location.hash.replace(/^#\//,'').split('?')[0].split('/')[1];
 if(raw&&!ag(raw)){var found=null;S.data.forEach(function(a){if(a.versions.some(function(v){return v.vid===raw;}))found=a;});if(found){S.agKey=found.key;S.page='P-O-AG-02';S.tab='versions';S.st='default';return true;}}
 var ok=initialReadURL();if(!location.hash.includes('sort='))S.sort={col:'',dir:'desc'};return ok;
};
function adaptedAct(n,action,value,event){
 if(n.classList.contains('mask')&&event.target!==n)return true;
 if(!lastLayer&&['ver','askPublish','doPublish','askDiscard','askCancelSch','openPrd','rowPublish','go','crumb'].includes(action))returnFocus={act:action,value:value};
 var writes=['newVer','editDraft','rollback','saveDraft','askPublish','doPublish','publishConfirmed','askDiscard','doDiscard','askCancelSch','doCancelSch','upload','sampleFile','rowPublish'];
 if(writes.includes(action)&&!canWrite())return true;
 if(realBusy&&!['copy','lang','menu','toastClose'].includes(action))return true;
 if(action==='toggleNav'){document.documentElement.classList.toggle('nav-open');return true;}
 if(action==='go'&&!CF.PAGES[value])return true;
 if(action==='signout'){S.sessionValid=false;S.st='noperm';S.menu=null;render();return true;}
 if(action==='restoreSession'){S.sessionValid=true;S.st='default';render();return true;}
 if(action==='resume'){if(S.st==='econflict'&&ed())openEditor(cur(),verNo(cur(),ed().no));else{S.st='default';render();}return true;}
 if(action==='failNext'){S.failNext=true;toast('info',L('The next save or publish will fail without changing the version.','下一次保存或发布将失败，版本数据保持不变。'));return true;}
 if(action==='sampleFile'){sampleUpload();return true;}
 if(action==='upload'){document.getElementById('localFile').accept=cur().types.map(function(x){return '.'+x.toLowerCase();}).join(',');document.getElementById('localFile').click();return true;}
 if(action==='download'){var v=value?verNo(cur(),value):S.drawer==='ver'?verNo(cur(),S.ver):null;downloadFile(v?v.file:ed()?ed().file:(verOf(cur(),'active')||{}).file);return true;}
 if(action==='copy'){
  var input=document.createElement('textarea');input.value=value;input.setAttribute('readonly','');document.body.appendChild(input);input.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}input.remove();toast(ok?'success':'info',ok?t('okCopied'):L('Select and copy the full value below.','请选中下方完整值复制。'),ok?'':value);return true;
 }
 if(action==='previewState'){S.previewState=value;render();return true;}
 if(action==='ver')S.previewState='default';
 if(action==='rowPublish'){openEditor(cur(),verNo(cur(),value));if(validatePublish()){S.modal={type:'publish'};render();}return true;}
 if(action==='doPublish'&&verOf(cur(),'scheduled')){S.modal={type:'publishReplace'};render();return true;}
 if(action==='publishConfirmed'){doPublish();return true;}
 if(action==='eventTarget'){var x=S.events[0],a=S.data.find(function(a){return a.versions.some(function(v){return v.vid===x.biz_ref.resource_id;});});if(a){var target=a.versions.find(function(v){return v.vid===x.biz_ref.resource_id;}),expected=x.biz_type.endsWith('activated')?'active':x.biz_type.endsWith('activation_failed')?'scheduled':'draft';if(target.st!==expected||(x.biz_type.endsWith('activation_failed')&&!a.actFail)){toast('info',L('The version status has changed. Review the latest version history.','版本状态已变化，请查看最新版本历史。'));return true;}go('P-O-AG-02',{key:a.key,tab:'versions'});toast('info',L('Opened version history for the event.','已打开告警对应的版本历史。'));}return true;}
 if(action==='st'){
  if(S.page==='P-O-AG-02'&&cur()){
   if(value==='actfail'){var v=verOf(cur(),'scheduled');if(!v){toast('info',L('Choose an agreement with a scheduled version, such as Demo agreement 01.','请选择有待生效版本的协议，例如演示协议 01。'));return true;}cur().actFail=true;addLog(cur(),'actfail',v.no,'Scheduled activation failed.','定时生效失败。','sys');emitEvent('activation_failed',cur(),v);}
   else if(value==='default')cur().actFail=false;
  }
  if(value==='empty'&&ed()){ed().file=null;ed().note='';ed().mode='immediate';ed().dirty=true;ed().err={};}
  S.st=value;S.menu=null;render();return true;
 }
 if(action==='resetDemo'){S.data=seedData();S.events=[];S.failNext=false;S.agKey=null;revisionClock=Date.parse(NOW);S.editor=null;S.st='default';hydrateHashes();render();return true;}
 return initialAct(n,action,value,event);
}
function afterRender(){
 // Apply this module's modal focus contract through the shell extension hook.
 var prdLayer=document.querySelector('.drawer.prd');
 if(prdLayer){prdLayer.setAttribute('role','dialog');prdLayer.setAttribute('aria-modal','true');}

 document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-act="go"][data-v="null"],[data-act="go"][data-v="undefined"]').forEach(function(n){n.remove();});
 document.querySelectorAll('table').forEach(function(table){var heads=Array.from(table.querySelectorAll('th')).map(function(th){return th.innerText;});table.querySelectorAll('tbody tr').forEach(function(row){Array.from(row.children).forEach(function(td,i){td.dataset.label=heads[i]||'';});});});
 document.querySelectorAll('.hash .ico').forEach(function(btn){btn.parentElement.title=btn.dataset.v;});
 var zone=document.getElementById('demoTimezone');if(zone)zone.onchange=function(){S.tz=zone.value;render();};
 if(S.st==='econflict'){var alert=document.querySelector('#content .note.red');if(alert&&!alert.querySelector('button'))alert.insertAdjacentHTML('beforeend','<button class="btn sm" data-act="resume">'+L('Refresh draft','刷新草稿')+'</button>');}
 if(S.st==='esubmit'){var alert=document.querySelector('#content .note.red');if(alert)alert.setAttribute('role','alert');}
 var input=document.getElementById('f_note');if(input&&ed().err.note){document.getElementById('noteHint').textContent=ed().err.note;input.setAttribute('aria-invalid','true');}
 var eff=document.getElementById('f_eff');if(eff){eff.setAttribute('aria-invalid',!!ed().err.eff);var h=eff.closest('.field').querySelector('.hint');h.id='effHint';eff.setAttribute('aria-describedby','effHint');if(ed().err.eff)h.textContent=ed().err.eff;}
 document.querySelectorAll('.modal[role=dialog]').forEach(function(layer){layer.setAttribute('aria-label',layer.querySelector('.modal-h b').textContent);});
 var layer=document.querySelector('.modal[role=dialog],.drawer[role=dialog]'),key=S.modal?'m:'+S.modal.type:S.drawer?'d:'+S.drawer:'';
 document.getElementById('app').inert=!!layer;
 if(layer){layer.tabIndex=-1;queueMicrotask(function(){var current=document.querySelector('.modal[role=dialog],.drawer[role=dialog]');if(current&&!current.contains(document.activeElement))(current.querySelector('button:not([disabled])')||current).focus();});}
 else if(lastLayer&&returnFocus){var all=Array.from(document.querySelectorAll('[data-act]')),target=all.find(function(n){return n.dataset.act===returnFocus.act&&n.dataset.v===returnFocus.value;});if(target)queueMicrotask(function(){target.focus();});}
 lastLayer=key;
}

     + '编号体系 F-O-AG-01～11 / P-O-AG-01～04 / C-O-AG-01～02 / E-01～14 / AC-O-AG-01～88。'
     + '面板固定中文，是给前端开发看的规格说明，不属于产品界面。';

});
